// สีตัวอย่างในปุ่มเลือกสีโลง
const COLOR_SWATCH = {
  'ขาว':    'background:#fff;border:2px solid #94a3b8;',
  'แดง':    'background:#7f1d1d;',
  'ดำ':     'background:#111827;',
  'น้ำตาล': 'background:#92400e;',
};
// สัญลักษณ์ท้ายชื่อสีเส้น
const TRIM_ICON = {
  'ทอง':'🟡', 'เงิน':'⚪', 'ซีด':'🥉', 'ขาว':'⬜',
  'คริสต์':'✝️', 'ผ้าจีบ':'🪷', 'ผ้าดอก':'🌸',
};

function ocStep(n, label, required, inner, done) {
  return `<div class="oc-step${done?' done':''}">
    <div class="oc-step-hd">
      <span class="oc-step-no${done?' ok':''}">${done?'<i class="fa-solid fa-check"></i>':n}</span>
      <span class="oc-step-lb">${label}${required?' <span class="oc-req">*</span>':''}</span>
    </div>
    <div class="oc-step-bd">${inner}</div>
  </div>`;
}

function renderOcSteps() {
  const cur  = window._ordCur || {};
  const prods = window._orderProds || [];
  const prod = prods.find(p => p.id === cur.productId);
  const hasCust = !!window._orderCustId;
  let n = 1, html = '';

  // ── ขั้น 1 ลูกค้า ── (ช่องเลือกอยู่ในขั้นนี้เลย เหมือนหน้าช่างแต่ง)
  const custName = document.getElementById('of_cust')?.selectedOptions?.[0]?.text || '';
  html += ocStep(n++, 'เลือกลูกค้า', true,
    hasCust
      ? `<div class="oc-picked"><span><i class="fa-solid fa-user me-1"></i>${U.esc(custName)}</span>
           <span class="oc-change" onclick="ocPickCust('')">เปลี่ยน</span></div>`
      : `<select class="oc-sel" onchange="ocPickCust(this.value)">
           <option value="">— เลือกลูกค้า —</option>
           ${(window._orderCusts||[]).map(c =>
             `<option value="${U.esc(String(c.id))}">${U.esc(c.name)}</option>`).join('')}
         </select>`,
    hasCust);
  if (!hasCust) return html;

  // ── ขั้น 2 สินค้า ──
  html += ocStep(n++, 'เลือกสินค้า', true,
    prod
      ? `<div class="oc-picked"><span><i class="fa-solid fa-box me-1"></i>${U.esc(prod.name)}</span>
           <span class="oc-change" onclick="ocProdChange('')">เปลี่ยน</span></div>`
      : `<select class="oc-sel" id="oc_prod" onchange="ocProdChange(this.value)">
           <option value="">— เลือกสินค้า —</option>${ocProdOptions(prods, cur.productId)}
         </select>`, !!prod);
  if (!prod) return html;

  const isAcc  = isAccessory(prod.name);
  const spec   = COFFIN_SPEC[prod.name] || {colors:['ขาว','แดง'], lines:['ทอง','เงิน','ซีด','ขาว']};
  const colors = isAcc ? [] : getProductColorsFor(prod.name, prods);
  const lines  = isAcc ? [] : getProductLines(prod.name, prods);

  // ── ขั้น 3 สีโลง (ข้ามถ้าเป็นอุปกรณ์เสริม หรือสินค้าไม่มีสี) ──
  let colorDone = true;
  if (colors.length) {
    colorDone = !!cur.color;
    html += ocStep(n++, 'เลือกสีโลง', true,
      `<div class="oc-colors">${colors.map(c =>
        `<button type="button" class="oc-color ${cur.color===c?'on':''}" onclick="ocColor('${U.esc(c)}')">
           <span class="tick"><i class="fa-solid fa-circle-check"></i></span>
           <span class="sw" style="${COLOR_SWATCH[c]||'background:#e5e7eb;'}"></span>
           <span class="nm">${U.esc(c)}</span>
         </button>`
      ).join('')}</div>`, colorDone);
    if (!colorDone) return html;
  }

  // ── ขั้น 4 สีเส้น (มีสัญลักษณ์ท้ายชื่อ) ──
  let trimDone = true;
  if (lines.length) {
    trimDone = !!cur.trimColor;
    html += ocStep(n++, 'เลือกสีเส้น', true,
      `<select class="form-select form-select-sm" onchange="ocTrim(this.value)">
         <option value="">-- เลือกสีเส้น --</option>
         ${lines.map(l => `<option value="${U.esc(l)}" ${cur.trimColor===l?'selected':''}>${U.esc(l)} ${TRIM_ICON[l]||'▫'}</option>`).join('')}
       </select>
       ${cur.trimColor ? `<div class="oc-picked" style="margin-top:7px;background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a;">
         เส้น${U.esc(cur.trimColor)}<span class="oc-trim-tag" style="font-size:17px;">${TRIM_ICON[cur.trimColor]||'▫'}</span></div>` : ''}`,
      trimDone);
    if (!trimDone) return html;
  }

  // ── ขั้น 5 ขนาด (เฉพาะสินค้าที่มี ไม่บังคับ) ──
  if (!isAcc && spec.extra?.length) {
    html += ocStep(n++, 'เลือกขนาด', false,
      `<select class="form-select form-select-sm" onchange="window._ordCur.extra=this.value">
         <option value="">-- ไม่ระบุ --</option>
         ${spec.extra.map(e => `<option value="${U.esc(e)}" ${cur.extra===e?'selected':''}>${U.esc(e)}</option>`).join('')}
       </select>`, !!cur.extra);
  }

  // ── ขั้นสุดท้าย จำนวน + ราคา + ปุ่มเพิ่ม ──
  // อุปกรณ์เสริมมักสั่งทีละร้อย → เพิ่มปุ่ม ±10 ให้กดเร็ว
  const bulk = isAcc
    ? `<button type="button" class="oc-stp bulk" onclick="ocQty(-10)">−10</button>`
    : '';
  const bulkPlus = isAcc
    ? `<button type="button" class="oc-stp bulk plus" onclick="ocQty(10)">+10</button>`
    : '';
  html += ocStep(n, 'จำนวนและราคา', false, `
    <div style="margin-bottom:10px;">
      <div class="oc-lbl">จำนวน${isAcc?` <span style="color:#0891b2;font-weight:600;">(${U.esc(prod.unit||'ชิ้น')})</span>`:''}</div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        ${bulk}
        <button type="button" class="oc-stp" onclick="ocQty(-1)">−</button>
        <span class="oc-qn" id="oc_qty">${cur.qty || 1}</span>
        <button type="button" class="oc-stp plus" onclick="ocQty(1)">+</button>
        ${bulkPlus}
      </div>
    </div>
    <div style="margin-bottom:10px;">
      <div class="oc-lbl">ราคา/ชิ้น</div>
      <input type="number" class="form-control form-control-sm" id="oc_price" min="0" value="${cur.price || 0}"
        style="text-align:right;font-weight:700;font-size:15px;">
    </div>
    <button type="button" class="btn btn-primary w-100" onclick="ocAdd()" style="font-weight:800;padding:10px;">
      <i class="fa-solid fa-cart-plus me-1"></i>เพิ่มเข้ารายการ
    </button>`, false);

  return html;
}

function paintOcSteps(opt) {
  const el = document.getElementById('oc_steps');
  if (!el) return;

  // เพิ่งกดเพิ่มรายการ → ถามตรง ๆ ว่าจะเพิ่มอีกไหม แทนที่จะรีเซ็ตฟอร์มเงียบ ๆ
  // (คนที่ไม่รู้ว่าใส่หลายรายการในใบเดียวได้ จะได้เห็นทุกครั้งจนจำได้)
  if (window._ordJustAdded) {
    const j = window._ordJustAdded;
    // ปุ่มบันทึกอยู่ที่แถบล่างของหน้าต่างปุ่มเดียว ไม่ใส่ซ้ำตรงนี้
    // (ของเดิมมีปุ่มบันทึก 2 ที่ ทำให้ไม่รู้ว่าต้องกดอันไหน)
    el.innerHTML = `
      <div class="oc-added">
        <div class="oc-added-t"><i class="fa-solid fa-circle-check me-1"></i>เพิ่ม <b>${U.esc(j.label)}</b> แล้ว</div>
      </div>
      <button type="button" class="oc-big blue" onclick="ocAddMore()">
        <i class="fa-solid fa-plus me-1"></i>เพิ่มสินค้าอีก</button>`;
    ocScrollTo(el.firstElementChild);
    paintCustBar();
    return;
  }

  el.innerHTML = renderOcSteps();
  paintCustBar();
  // ขั้นแรกที่ยังไม่เสร็จ = ขั้นที่กำลังทำ ทำให้เด่นแล้วเลื่อนไปหา
  const active = el.querySelector('.oc-step:not(.done)');
  if (!active) return;
  active.classList.add('active');
  if (!opt?.noScroll) ocScrollTo(active);
}

// เลื่อนไปหาขั้นถัดไป — แต่เฉพาะตอนที่มันอยู่นอกจอจริง ๆ
// จอที่ขยับทั้งที่ไม่จำเป็นคือสิ่งที่ทำให้ผู้สูงอายุงงที่สุด
function ocScrollTo(elm) {
  if (!elm) return;
  const r = elm.getBoundingClientRect();
  const seen = r.top >= 56 && r.bottom <= window.innerHeight - 16;
  if (seen) return;
  let smooth = true;
  try { smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e) {}
  try { elm.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'center' }); }
  catch(e) { elm.scrollIntoView(); }   // เบราว์เซอร์เก่าที่ไม่รับ options
}

// แถบชื่อลูกค้าติดบนสุด — เห็นตลอดว่ากำลังทำออเดอร์ให้ใคร
// (ของเดิมพอเพิ่มรายการแล้วชื่อลูกค้าหายไปเลย)
function paintCustBar() {
  const bar = document.getElementById('ocCustBar');
  if (!bar) return;
  const sel  = document.getElementById('of_cust');
  const name = sel?.selectedOptions?.[0]?.text || '';
  if (!window._orderCustId || !name) { bar.innerHTML = ''; return; }
  bar.innerHTML = `
    <div class="oc-custbar">
      <span class="oc-cav">${U.initial(name)}</span>
      <div style="flex:1;min-width:0;">
        <div class="oc-cav-l">ลูกค้า</div>
        <div class="oc-cav-n">${U.esc(name)}</div>
      </div>
      <span class="oc-change" onclick="ocPickCust('')">เปลี่ยน</span>
    </div>`;
}

// ปุ่มบันทึกที่แถบล่าง — เปลี่ยนข้อความตามจำนวนรายการจริง
function syncSaveBtn() {
  const btn = document.getElementById('ocSaveBtn');
  if (!btn) return;
  const n = (window._ordCart || []).length;
  btn.innerHTML = n
    ? `<i class="fa-solid fa-check me-1"></i>บันทึกออเดอร์ ${n} รายการ`
    : `<i class="fa-solid fa-check me-1"></i>บันทึกออเดอร์`;
}

// เลือก/เปลี่ยนลูกค้าจากในขั้นที่ 1
// เขียนค่าลงช่อง of_cust ที่ซ่อนไว้ เพราะส่วนอื่นของระบบอ่านค่าจากช่องนั้น
function ocPickCust(id) {
  const sel = document.getElementById('of_cust');
  if (!sel) return;
  sel.value = id || '';
  onOrderCustChange(sel);
}

// กด "เพิ่มสินค้าอีก" — กลับไปที่ขั้นเลือกสินค้า
function ocAddMore() {
  window._ordJustAdded = null;
  paintOcSteps();
}


async function ocProdChange(id) {
  const cur = window._ordCur;
  cur.productId = id; cur.color=''; cur.trimColor=''; cur.extra='';
  // อุปกรณ์เสริมไม่มีสี/เส้น → ข้ามไปขั้นจำนวนได้เลย
  const prod = (window._orderProds||[]).find(p => p.id === id);
  if (prod && isAccessory(prod.name)) { cur.color=''; cur.trimColor=''; }
  await ocRefreshPrice();
  paintOcSteps();
}
async function ocColor(c) {
  window._ordCur.color = c;
  await ocRefreshPrice();
  paintOcSteps();
}
async function ocTrim(t) {
  window._ordCur.trimColor = t;
  await ocRefreshPrice();
  paintOcSteps();
}
function ocQty(d) {
  const cur = window._ordCur;
  // กด −10 ตอนมีน้อยกว่า 10 → ลงมาที่ 1 แทนที่จะไม่ทำอะไร
  const v = Math.min(9999, Math.max(1, (cur.qty || 1) + d));
  if (v === cur.qty) return;
  cur.qty = v;
  const el = document.getElementById('oc_qty'); if (el) el.textContent = v;
  const pr = document.getElementById('oc_price'); if (pr) cur.price = parseFloat(pr.value)||0;
}
// เติมราคาให้อัตโนมัติจากราคาลูกค้า/ราคาตามสีเส้น (แก้ทับได้)
async function ocRefreshPrice() {
  const cur = window._ordCur;
  const prod = (window._orderProds||[]).find(p => p.id === cur.productId);
  if (!prod) return;
  let price = prod.price || 0;
  if (prod.priceMap && Object.keys(prod.priceMap).length) {
    price = (cur.trimColor && prod.priceMap[cur.trimColor] != null)
      ? prod.priceMap[cur.trimColor]
      : (prod.priceMap[Object.keys(prod.priceMap)[0]] || 0);
  }
  if (window._orderCustId) {
    try { price = await DB.getEffectivePrice(window._orderCustId, prod.id, price, cur.trimColor||''); } catch(e){}
  }
  cur.price = price;
  const el = document.getElementById('oc_price'); if (el) el.value = price;
}

// ── เพิ่มเข้าตะกร้า ──
function ocAdd() {
  const cur = window._ordCur;
  if (!cur.productId) { U.toast('กรุณาเลือกสินค้า','error'); return; }
  const prod = (window._orderProds||[]).find(p => p.id === cur.productId);
  if (!prod) return;
  const price = parseFloat(document.getElementById('oc_price')?.value || 0) || 0;
  const key = x => `${x.productId}|${x.color}|${x.trimColor}|${x.extra}|${x.price}`;
  const nw = {productId:prod.id, productName:prod.name, color:cur.color||'', trimColor:cur.trimColor||'',
              extra:cur.extra||'', qty:cur.qty, price, specialNote:''};
  const cart = window._ordCart;
  const ex = cart.findIndex(x => key(x) === key(nw));
  let hl;
  if (ex >= 0) { cart[ex].qty += nw.qty; hl = ex; }
  else { cart.push(nw); hl = cart.length - 1; }
  // รีเซ็ตกลับไปขั้น "เลือกสินค้า" พร้อมกรอกรายการต่อไป
  window._ordCur = {productId:'', color:'', trimColor:'', extra:'', qty:1, price:0};
  // จำไว้ว่าเพิ่งเพิ่มอะไร เพื่อเอาไปถามว่าจะเพิ่มอีกไหม
  window._ordJustAdded = { label: ocRowLabel(nw).replace(/<[^>]*>/g, ' ').replace(/\s+/g,' ').trim(),
                           count: cart.length };
  renderOrdCart(hl);
  paintOcSteps();
}

function ocDel(i) {
  window._ordCart.splice(i, 1);
  if (window._ordEditIdx === i) window._ordEditIdx = -1;
  renderOrdCart();
}
function ocEdit(i) {
  window._ordEditIdx = (window._ordEditIdx === i) ? -1 : i;
  renderOrdCart();
}
function ocBump(i, d) {
  const it = window._ordCart[i]; if (!it) return;
  const v = it.qty + d; if (v < 1) return;
  it.qty = v; renderOrdCart();
}
function ocSetPrice(i, v) {
  const it = window._ordCart[i]; if (!it) return;
  it.price = parseFloat(v) || 0; renderOrdCart();
}
function ocSetNote(i, v) {
  const it = window._ordCart[i]; if (it) it.specialNote = v;
}

// ── วาดตะกร้า ──
function ocRowLabel(x) {
  const cs = x.color === 'แดง' ? 'background:#7f0000;color:#fff;'
    : x.color === 'ดำ' ? 'background:#111;color:#fff;'
    : 'background:#fff;color:#111;border:1.5px solid #333;';
  const isChrist = x.trimColor === 'คริสต์';
  // กรองค่า '-' ออกเหมือนที่ทำกับสี ไม่งั้นจะขึ้นป้ายว่า "เส้น-" ซึ่งอ่านไม่รู้เรื่อง
  const hasTrim = x.trimColor && x.trimColor !== '-';
  return `<span>${U.esc(x.productName)}</span>`
    + (x.color && x.color !== '-' ? `<span class="oc-chip" style="${cs}">${U.esc(x.color)}</span>` : '')
    + (hasTrim ? `<span class="oc-chip" style="background:${isChrist?'#dbeafe':'#f3f4f6'};color:${isChrist?'#1e40af':'#374151'};border:1px solid #e5e7eb;">${isChrist?'✝คริสต์':'เส้น'+U.esc(x.trimColor)}</span>` : '')
    + (x.extra ? `<span class="oc-chip" style="background:#fef3c7;color:#92400e;">${U.esc(x.extra)}</span>` : '');
}

function renderOrdCart(hl) {
  const cart = window._ordCart || [];
  const el = document.getElementById('ocCart'); if (!el) return;
  el.innerHTML = cart.length ? cart.map((x, i) => {
    const editing = window._ordEditIdx === i;
    const note = `<input type="text" class="oc-note" placeholder="📝 หมายเหตุพิเศษ..."
        value="${U.esc(x.specialNote||'')}" oninput="ocSetNote(${i},this.value)">`;
    if (editing) {
      return `<div class="oc-row editing">
        <div class="oc-top">
          <div class="oc-name">${ocRowLabel(x)}</div>
          <span class="oc-ico del" onclick="ocDel(${i})"><i class="fa-solid fa-trash"></i></span>
        </div>
        <div class="oc-editrow">
          <button type="button" class="oc-stp" onclick="ocBump(${i},-1)">−</button>
          <span class="oc-qn">${x.qty}</span>
          <button type="button" class="oc-stp plus" onclick="ocBump(${i},1)">+</button>
          <span style="font-size:12.5px;color:#92400e;font-weight:700;">ราคา</span>
          <input type="number" class="oc-pr" value="${x.price}" onchange="ocSetPrice(${i},this.value)">
        </div>
        ${note}
        <div style="text-align:right;margin-top:7px;">
          <button type="button" class="btn btn-sm btn-warning" style="font-weight:700;" onclick="ocEdit(${i})">เสร็จ</button>
        </div>
      </div>`;
    }
    // ช่องหมายเหตุ: ซ่อนไว้จนกว่าจะกดแก้ไข หรือมีข้อความอยู่แล้ว
    // เดิมเปิดค้างทุกแถว ทำให้ดูเหมือนต้องกรอก ทั้งที่ไม่ต้อง และรกตา
    const noteShown = (x.specialNote||'').trim()
      ? `<div class="oc-note-view"><i class="fa-solid fa-note-sticky me-1"></i>${U.esc(x.specialNote)}</div>` : '';
    return `<div class="oc-row${hl===i?' hl':''}">
      <span class="oc-nu">${i+1}</span>
      <div class="oc-mid">
        <div class="oc-name">${ocRowLabel(x)}</div>
        <div class="oc-calc-l">${x.qty} × ${U.money(x.price)}</div>
        ${noteShown}
      </div>
      <div class="oc-right">
        <div class="oc-sum">${U.money(x.qty * x.price)}</div>
        <div class="oc-acts">
          <span class="oc-ico" onclick="ocEdit(${i})" title="แก้ไข"><i class="fa-solid fa-pen"></i></span>
          <span class="oc-ico del" onclick="ocDel(${i})" title="ลบ"><i class="fa-solid fa-trash"></i></span>
        </div>
      </div>
    </div>`;
  }).join('') : `<div class="oc-empty">ยังไม่มีรายการ</div>`;

  const hdr = document.getElementById('ocHdr');
  if (hdr) hdr.innerHTML = cart.length
    ? `<span>รายการในออเดอร์นี้</span><span class="oc-hdr-n">${cart.length} รายการ · ${cart.reduce((a,b)=>a+b.qty,0)} ชิ้น</span>`
    : `<span>รายการในออเดอร์นี้</span><span class="oc-hdr-n">ยังไม่มี</span>`;
  syncSaveBtn();
  calcOrderTotal();
  if (hl != null) setTimeout(() => document.querySelector('.oc-row.hl')?.classList.remove('hl'), 900);
}


// ── filter pending by date ──
async function filterPendingByDate(dateStr) {
  const d = window._dashTodayData;
  if (!d) return;
  const allOrders = window._allOrdersCache || [];
  const selDate = new Date(dateStr); selDate.setHours(0,0,0,0);
  const selTs = selDate.getTime();
  const isToday = dateStr === todayLocal();

  const filtered = allOrders.filter(o => {
    if (isToday) return !isOrderFullyDelivered(o);
    // เปรียบเทียบวันที่ด้วย Bangkok timezone (ป้องกัน timezone drift)
    const createdBkk = new Date(o.createdAt).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'});
    return createdBkk === dateStr;
  }).sort((a,b)=>a.createdAt-b.createdAt);

  d.pendingOrders = filtered;
  const listEl = document.getElementById('pendingList');
  const countEl = document.getElementById('pendingCount');
  if (countEl) countEl.textContent = filtered.length + ' รายการ';
  if (!listEl) return;

  if (!filtered.length) {
    const label = isToday ? 'ส่งของครบแล้ว ไม่มีรายการค้างส่ง' : 'ไม่มีออเดอร์ในวันที่นี้';
    listEl.innerHTML = '<div style="opacity:.6;font-size:13px;text-align:center;padding:20px 0;"><i class="fa-solid fa-circle-check me-2"></i>' + label + '</div>';
    return;
  }
  listEl.innerHTML = buildPendingHtml(filtered);
}

// ── พิมพ์รายการออเดอร์วันนี้ ──
// ── helper: group pending orders by customer → HTML ──
function buildPendingHtml(orders) {
  if (!orders.length) return '<div style="opacity:.6;font-size:13px;text-align:center;padding:20px 0;"><i class="fa-solid fa-circle-check me-2"></i>ส่งของครบแล้ว ไม่มีรายการค้างส่ง</div>';
  // group by customerId (fallback customerName)
  const map = new Map();
  for (const o of orders) {
    const key = o.customerId || o.customerName;
    if (!map.has(key)) map.set(key, {customerName:o.customerName, custId:o.customerId, orders:[]});
    map.get(key).orders.push(o);
  }
  // เก็บ state การเลือกไว้ที่ window เพื่อให้ re-render แล้วไม่หาย
  if (!window._pendSel) window._pendSel = {};
  window._pendGroups = {};
  // ล้าง selection ของลูกค้าที่ไม่อยู่ในรายการแล้ว (ส่งครบ/ถูกลบ)
  for (const k of Object.keys(window._pendSel)) { if (!map.has(k)) delete window._pendSel[k]; }

  return [...map.entries()].map(([gkey, g]) => {
    // ผูก selection กับ customerId ไม่ใช่ลำดับ — กันที่ติ๊กไว้เด้งไปผิดลูกค้าเวลา real-time อัปเดต
    const gid = String(gkey);
    const allDone   = g.orders.every(o => isOrderFullyDelivered(o));
    const latestTs  = Math.max(...g.orders.map(o => o.createdAt));

    // merge items across all orders — เก็บ sources ไว้กระจายกลับตอนบันทึก
    const merged = [];
    for (const o of g.orders) {
      const cs = o.craftStatus || {};
      const ds = o.deliveryStatus || {};
      const bs = o.billedStatus || {};
      for (const i of (o.items||[])) {
        const isChrist = i.trimColor==='คริสต์'||i.style==='คริสต์';
        const label = i.productName
          + (i.color&&i.color!=='-'?' ('+i.color+')':'')
          + (isChrist?' ✝คริสต์':(i.trimColor?' เส้น'+i.trimColor:''))
          + (i.extra?' '+i.extra:'');
        const dKey  = deliverKey(i);
        // อุปกรณ์เสริมไม่ต้องแต่ง → ถือว่าพร้อมส่งเต็มจำนวน
        const craftedRaw   = readyQtyFor(i, getCraftedFor(cs, i));
        const deliveredRaw = getDeliveredQty(ds[dKey], i.qty, o.isDelivered);
        const billedRaw    = getBilledQty(bs[dKey], i.qty);
        // คงเหลือ = สั่ง − ส่งแล้ว ; แต่งเสร็จคงเหลือ = แต่งแล้ว − ส่งแล้ว
        const remainQty    = i.qty - deliveredRaw;
        const remainCraft  = Math.max(0, craftedRaw - deliveredRaw);
        const billedOpen   = Math.max(0, billedRaw - deliveredRaw); // ออกบิลแล้วแต่ยังไม่ได้ส่ง
        if (remainQty <= 0) continue; // ส่งครบแล้ว ไม่ต้องแสดง
        const src = {orderId:o.id, dKey, orderQty:i.qty, delivered:deliveredRaw, remainQty, remainCraft,
                     billed:billedRaw, billedOpen,
                     productName:i.productName, price:i.price, color:i.color||'', trimColor:i.trimColor||'',
                     extra:i.extra||'', specialNote:i.specialNote||'', label};
        const ex = merged.find(m => m.key===label);
        if (ex) { ex.qty += remainQty; ex.craftedQty += remainCraft; ex.delivered += deliveredRaw; ex.billedOpen += billedOpen; ex.sources.push(src); }
        else merged.push({key:label, qty:remainQty, craftedQty:remainCraft, delivered:deliveredRaw, billedOpen, sources:[src]});
      }
    }

    window._pendGroups[gid] = {customerName:g.customerName, custId:g.custId, merged};
    if (!window._pendSel[gid]) window._pendSel[gid] = {};
    const sel = window._pendSel[gid];
    // ล้าง selection ที่เกินจำนวนคงเหลือ (เช่นมีคนอื่นส่งไปแล้ว)
    for (const k of Object.keys(sel)) {
      const mi = merged[k];
      if (!mi || sel[k] > mi.qty) delete sel[k];
    }

    const ordNos = g.orders.length > 1 ? ` <span style="font-size:12px;opacity:.55;">(${g.orders.length} ออเดอร์)</span>` : '';
    const doneTag = allDone ? '<span style="font-size:12.5px;background:rgba(134,239,172,.25);border-radius:10px;padding:1px 8px;margin-left:5px;">✅ ส่งแล้ว</span>' : '';
    const allCrafted = merged.length > 0 && merged.every(({qty,craftedQty}) => (craftedQty||0) >= qty);
    const readyTag = (!allDone && allCrafted)
      ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;background:rgba(250,204,21,.3);color:#fef08a;border:1.5px solid rgba(250,204,21,.5);border-radius:10px;padding:2px 10px;margin-left:6px;animation:livepulse 2s ease-in-out infinite;">🎨 พร้อมส่งแล้ว!</span>`
      : '';

    const craftedTotal = merged.reduce((a,m)=>a+(m.craftedQty||0),0);
    const totalRemain = merged.reduce((a,m)=>a+m.qty,0);
    const pickBtn = (!allDone && craftedTotal > 0)
      ? `<button class="btn-card-solid" style="font-size:12.5px;padding:3px 10px;background:rgba(250,204,21,.22);border:1.5px solid rgba(250,204,21,.45);color:#fef9c3;" onclick="pendPickCrafted(this)"><i class="fa-solid fa-check-double me-1"></i>เลือกที่แต่งเสร็จ (${craftedTotal})</button>`
      : '';
    // เลือกทั้งหมด — สำหรับออกบิลล่วงหน้า (แสดงเมื่อมีของที่ยังไม่แต่ง)
    const pickAllBtn = (!allDone && totalRemain > craftedTotal)
      ? `<button class="btn-card-outline" style="font-size:12.5px;padding:3px 10px;" onclick="pendPickAll(this)"><i class="fa-solid fa-list-check me-1"></i>เลือกทั้งหมด (${totalRemain})</button>`
      : '';

    const itemsHtml = merged.map((m, idx) => {
      const {key, qty, craftedQty, delivered, billedOpen} = m;
      const cq = craftedQty||0;
      const isDone    = cq >= qty;
      const isPartial = cq > 0 && cq < qty;
      const isAcc = isAccessory(m.sources?.[0]?.productName);
      const badge = isAcc
        ? ` <span style="font-size:12px;background:rgba(148,163,184,.25);color:#e2e8f0;border-radius:10px;padding:1px 7px;font-weight:600;">อุปกรณ์เสริม</span>`
        : isDone
          ? ` <span style="font-size:12px;background:rgba(134,239,172,.3);color:#bbf7d0;border-radius:10px;padding:1px 7px;font-weight:600;">✅ แต่งเสร็จแล้ว</span>`
          : isPartial
            ? ` <span style="font-size:12px;background:rgba(251,191,36,.25);color:#fde68a;border-radius:10px;padding:1px 7px;font-weight:600;">🔨 ${cq}/${qty}</span>`
            : ` <span style="font-size:12px;background:rgba(255,255,255,.12);color:#cbd5e1;border-radius:10px;padding:1px 7px;font-weight:600;">ยังไม่แต่ง</span>`;
      const delTag = delivered > 0
        ? ` <span style="font-size:12px;background:rgba(59,130,246,.25);color:#bfdbfe;border-radius:10px;padding:1px 7px;font-weight:600;">🚚 ส่งแล้ว ${delivered}</span>`
        : '';
      const billTag = (billedOpen||0) > 0
        ? ` <span style="font-size:12px;background:rgba(168,85,247,.25);color:#e9d5ff;border-radius:10px;padding:1px 7px;font-weight:600;">🧾 ออกบิลแล้ว ${billedOpen}</span>`
        : '';
      const picked  = sel[idx] || 0;
      // ติ๊กได้ทุกรายการ (ออกบิลล่วงหน้าได้) — การจัดส่งจะไปเช็คเรื่องแต่งเสร็จตอนกดปุ่มแทน
      const canPick = !allDone;
      const stepper = (picked > 0 && qty > 1)
        ? `<span style="display:inline-flex;align-items:center;gap:5px;margin-left:7px;background:rgba(0,0,0,.28);border-radius:7px;padding:1px 4px;vertical-align:middle;">
             <button onclick="pendBump(this,${idx},-1)" style="width:20px;height:20px;padding:0;border-radius:5px;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:700;cursor:pointer;line-height:1;">−</button>
             <span style="font-size:12px;font-weight:700;min-width:28px;text-align:center;">${picked}/${qty}</span>
             <button onclick="pendBump(this,${idx},1)" style="width:20px;height:20px;padding:0;border-radius:5px;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:700;cursor:pointer;line-height:1;">+</button>
           </span>`
        : '';
      return `<div class="pend-row" style="display:flex;gap:8px;align-items:center;${canPick?'':'opacity:.45;'}">
        <input type="checkbox" ${picked>0?'checked':''} ${canPick?'':'disabled'} onchange="pendToggle(this,${idx})" style="width:17px;height:17px;flex-shrink:0;accent-color:#22c55e;cursor:${canPick?'pointer':'not-allowed'};">
        <span style="flex:1;min-width:0;">${U.esc(key)}${badge}${delTag}${billTag}${stepper}</span>
        <span style="font-weight:700;flex-shrink:0;">${qty}</span>
      </div>`;
    }).join('');

    const selRows = Object.values(sel).filter(v=>v>0).length;
    const selPcs  = Object.values(sel).reduce((a,b)=>a+b,0);
    const hasSel  = selRows > 0;
    const actionBar = allDone ? '' : `
      <div style="background:rgba(0,0,0,.22);border-radius:9px;padding:8px 11px;margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <span style="font-size:12px;font-weight:600;opacity:${hasSel?'1':'.6'};">${hasSel?`เลือก ${selRows} รายการ · รวม ${selPcs} ชิ้น`:'ยังไม่ได้เลือกรายการ'}</span>
        <div style="display:flex;gap:5px;">
          <button class="btn-card-solid" style="font-size:12.5px;padding:3px 10px;background:rgba(34,197,94,.28);border:1.5px solid rgba(134,239,172,.55);${hasSel?'':'opacity:.4;pointer-events:none;'}" onclick="pendDeliver(this)"><i class="fa-solid fa-truck me-1"></i>จัดส่งที่เลือก</button>
          <button class="btn-card-outline" style="font-size:12.5px;padding:3px 10px;${hasSel?'':'opacity:.4;pointer-events:none;'}" onclick="pendBill(this)"><i class="fa-solid fa-file-invoice me-1"></i>ออกบิลที่เลือก</button>
        </div>
      </div>`;

    return `<div data-gid="${U.esc(gid)}" style="border-bottom:1px solid rgba(255,255,255,.12);padding:10px 0;${allDone?'opacity:.5;':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px;">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px;">
          <span style="font-size:15px;font-weight:700;">${U.esc(g.customerName||'-')}</span>${ordNos}
          <span style="font-size:12.5px;opacity:.65;margin-left:3px;">${U.date(latestTs)}</span>
          ${doneTag}${readyTag}
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;">${pickBtn}${pickAllBtn}</div>
      </div>${itemsHtml}${actionBar}</div>`;
  }).join('');
}

// ── ควบคุมการเลือกในรายการรอส่ง ──
function _pendRerender() {
  // เคารพตัวกรองวันที่เหมือน updatePendingList — ไม่งั้นกดติ๊กแล้วหน้าเด้งกลับเป็นโหมดค้างส่งทั้งหมด
  const dateStr = document.getElementById('pendingDatePicker')?.value || todayLocal();
  const isToday = dateStr === todayLocal();
  const orders = (window._allOrdersCache||[]).filter(o => {
    if (isToday) return !isOrderFullyDelivered(o);
    return new Date(o.createdAt).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'}) === dateStr;
  }).sort((a,b)=>a.createdAt-b.createdAt);
  const el = document.getElementById('pendingList');
  if (el) el.innerHTML = buildPendingHtml(orders);
}
// อ่าน gid จาก element ที่กด (ไม่ฝังค่าลง onclick — กันชื่อลูกค้าที่มีเครื่องหมายพิเศษทำ HTML พัง)
function _gidOf(el) { return el?.closest?.('[data-gid]')?.dataset.gid || null; }

function pendToggle(el, idx) {
  const gid = _gidOf(el); if (!gid) return;
  const m = window._pendGroups?.[gid]?.merged?.[idx]; if (!m) return;
  const sel = window._pendSel[gid] || (window._pendSel[gid] = {});
  if (sel[idx] > 0) delete sel[idx];
  // ค่าเริ่มต้น: ถ้ามีของแต่งเสร็จให้เลือกเท่าที่แต่งเสร็จ (เคสจัดส่ง)
  // ถ้ายังไม่แต่งเลยให้เลือกทั้งหมด (เคสออกบิลล่วงหน้า)
  else sel[idx] = (m.craftedQty > 0) ? Math.min(m.craftedQty, m.qty) : m.qty;
  if (!sel[idx]) delete sel[idx];
  _pendRerender();
}
function pendBump(el, idx, d) {
  const gid = _gidOf(el); if (!gid) return;
  const m = window._pendGroups?.[gid]?.merged?.[idx]; if (!m) return;
  const sel = window._pendSel[gid] || (window._pendSel[gid] = {});
  const v = (sel[idx]||0) + d;
  if (v < 1 || v > m.qty) return; // เพดาน = จำนวนคงเหลือ ไม่ใช่จำนวนที่แต่งเสร็จ
  sel[idx] = v;
  _pendRerender();
}
function pendPickCrafted(el) {
  const gid = _gidOf(el); if (!gid) return;
  const grp = window._pendGroups?.[gid]; if (!grp) return;
  const sel = {};
  grp.merged.forEach((m, i) => { const v = Math.min(m.craftedQty||0, m.qty); if (v > 0) sel[i] = v; });
  window._pendSel[gid] = sel;
  _pendRerender();
}
// เลือกทุกรายการเต็มจำนวนคงเหลือ — ใช้ตอนออกบิลล่วงหน้า
function pendPickAll(el) {
  const gid = _gidOf(el); if (!gid) return;
  const grp = window._pendGroups?.[gid]; if (!grp) return;
  const sel = {};
  grp.merged.forEach((m, i) => { if (m.qty > 0) sel[i] = m.qty; });
  window._pendSel[gid] = sel;
  _pendRerender();
}

// ── build blue card content: chips + items ──
function buildDashCustContent(pendingOrders) {
  // Build customer map
  const custMap = new Map();
  const _pc = window._allProductsCache || {};
  const _isAcc = name => { const p=_pc[name]; return p ? (p.unit||'โลง').trim()!=='โลง' : ['เทพ','มุม','เส้น'].some(k=>(name||'').includes(k)); };

  // helper: จำนวนคงเหลือของ item (หักที่จัดส่งแล้ว)
  const _remainOf = (o, i) => i.qty - getDeliveredQty((o.deliveryStatus||{})[deliverKey(i)], i.qty, o.isDelivered);

  for (const o of pendingOrders) {
    const k = o.customerId || o.customerName;
    if (!custMap.has(k)) custMap.set(k, {name: o.customerName, key: k, qty: 0});
    // นับเฉพาะโลง ไม่นับ accessory + หักที่ส่งแล้ว
    (o.items||[]).forEach(i => { if (!_isAcc(i.productName)) custMap.get(k).qty += Math.max(0, _remainOf(o, i)); });
  }
  const custList = [...custMap.values()];

  // Multi-select set — remove keys for customers that no longer have pending orders
  if (!window._dashCustSet) window._dashCustSet = new Set();
  for (const k of [...window._dashCustSet]) { if (!custMap.has(k)) window._dashCustSet.delete(k); }
  const sel = window._dashCustSet;
  const showAll = sel.size === 0;
  // นับรวมเฉพาะโลง
  const totalQty = pendingOrders.reduce((a,o) => (o.items||[]).filter(i=>!_isAcc(i.productName)).reduce((b,i)=>b+Math.max(0,_remainOf(o,i)),0)+a, 0);

  // Chips HTML — "ทั้งหมด" active when nothing selected
  const chipsHtml = `<button class="cust-chip${showAll?' active':''}" onclick="filterDashCust('')">ทั้งหมด <span style="opacity:.65;font-size:12.5px;">${totalQty}</span></button>`
    + custList.map(c => `<button class="cust-chip${sel.has(c.key)?' active':''}" data-ckey="${U.esc(c.key)}" onclick="filterDashCust(this.dataset.ckey)">${U.esc(c.name)} <span style="opacity:.65;font-size:12.5px;">${c.qty}</span></button>`).join('');

  // Filter orders by selected set (empty set = show all)
  const filtered = showAll ? pendingOrders : pendingOrders.filter(o => sel.has(o.customerId||o.customerName));

  // helper: ตรวจว่าเป็น accessory (ไม่ใช่โลง)
  const prodCache = window._allProductsCache || {};
  function isAccessory(productName) {
    const p = prodCache[productName];
    if (p) return (p.unit||'โลง').trim() !== 'โลง';
    return ['เทพ','มุม','เส้น'].some(k => (productName||'').includes(k));
  }

  // Aggregate items — แยก coffin vs accessory
  const coffinMap = {}, accMap = {};
  for (const o of filtered) {
    const ds = o.deliveryStatus || {};
    for (const i of (o.items||[])) {
      // หักจำนวนที่จัดส่งไปแล้วออก
      const remain = i.qty - getDeliveredQty(ds[deliverKey(i)], i.qty, o.isDelivered);
      if (remain <= 0) continue;
      const isChrist = i.trimColor==='คริสต์'||i.style==='คริสต์';
      const label = i.productName
        + (i.color&&i.color!=='-'?' ('+i.color+')':'')
        + (isChrist?' ✝คริสต์':(i.trimColor?' เส้น'+i.trimColor:''))
        + (i.extra?' '+i.extra:'');
      if (isAccessory(i.productName)) {
        accMap[label] = (accMap[label]||0) + remain;
      } else {
        coffinMap[label] = (coffinMap[label]||0) + remain;
      }
    }
  }

  const coffinEntries = Object.entries(coffinMap);
  const accEntries    = Object.entries(accMap);
  const totalCoffins  = coffinEntries.reduce((a,[,v]) => a+v, 0);
  const hasAny = coffinEntries.length || accEntries.length;

  const itemsHtml = hasAny
    ? coffinEntries.map(([name,qty]) => `<div class="today-item"><span>${U.esc(name)}</span><strong>${qty} ชิ้น</strong></div>`).join('')
      + (coffinEntries.length ? `<div style="border-top:1px solid rgba(255,255,255,.2);margin-top:10px;padding-top:10px;"><span style="font-size:13px;opacity:.75;">รวมโลง</span><span style="font-size:32px;font-weight:700;margin:0 6px;">${totalCoffins}</span><span style="font-size:13px;opacity:.75;">ชิ้น</span></div>` : '')
      + (accEntries.length ? `<div style="border-top:1px solid rgba(255,255,255,.15);margin-top:10px;padding-top:8px;margin-bottom:4px;font-size:12.5px;opacity:.6;letter-spacing:.5px;">อุปกรณ์เสริม</div>`
        + accEntries.map(([name,qty]) => `<div class="today-item" style="opacity:.75;"><span>${U.esc(name)}</span><strong>${qty}</strong></div>`).join('') : '')
    : `<div style="opacity:.6;font-size:13px;text-align:center;padding:20px 0;"><i class="fa-solid fa-circle-check me-2"></i>ไม่มีออเดอร์ค้างส่ง</div>`;

  return {chipsHtml, itemsHtml};
}

function filterDashCust(custKey) {
  if (!window._dashCustSet) window._dashCustSet = new Set();
  if (custKey === '') {
    // "ทั้งหมด" → clear all
    window._dashCustSet.clear();
  } else {
    // toggle: กดซ้ำ = deselect
    if (window._dashCustSet.has(custKey)) window._dashCustSet.delete(custKey);
    else window._dashCustSet.add(custKey);
  }
  const pending = (window._allOrdersCache||[]).filter(o => !isOrderFullyDelivered(o)).sort((a,b) => a.createdAt-b.createdAt);
  const {chipsHtml, itemsHtml} = buildDashCustContent(pending);
  const chipsEl = document.getElementById('dashCustFilter');
  const cItemsEl = document.getElementById('dashCustItems');
  if (chipsEl) chipsEl.innerHTML = chipsHtml;
  if (cItemsEl) cItemsEl.innerHTML = itemsHtml;
}

// ── จัดส่งเฉพาะรายการที่เลือก ──
function pendDeliver(el) {
  const gid = _gidOf(el); if (!gid) return;
  const grp = window._pendGroups?.[gid]; if (!grp) return;
  const sel = window._pendSel?.[gid] || {};
  const picks = Object.entries(sel).filter(([,v]) => v > 0);
  if (!picks.length) { U.toast('กรุณาเลือกรายการก่อน','error'); return; }
  const rows = picks.length;
  const pcs  = picks.reduce((a,[,v]) => a+v, 0);

  // ── ตรวจก่อนว่าเลือกเกินของที่แต่งเสร็จไหม (ส่งได้เฉพาะของที่แต่งแล้ว) ──
  const bad = [];
  for (const [idxStr, want] of picks) {
    const m = grp.merged[Number(idxStr)]; if (!m) continue;
    const ready = Math.min(m.craftedQty || 0, m.qty);
    if (want > ready) bad.push({name: m.key, want, ready});
  }
  if (bad.length) {
    const b = bad[0];
    const more = bad.length > 1 ? ` (และอีก ${bad.length-1} รายการ)` : '';
    U.toast(`ส่งไม่ได้: ${b.name} เลือก ${b.want} แต่แต่งเสร็จแค่ ${b.ready}${more}`, 'error');
    return;
  }

  U_confirm(`ยืนยันจัดส่ง ${rows} รายการ รวม ${pcs} ชิ้น ให้ ${grp.customerName} ใช่ไหม?`, async () => {
    // กระจายจำนวนที่เลือกกลับไปยังออเดอร์ต้นทาง
    const updates = {}; // orderId → { dKey: newDeliveredQty }
    for (const [idxStr, want] of picks) {
      const m = grp.merged[Number(idxStr)]; if (!m) continue;
      let left = want;
      // ส่งได้เฉพาะของที่แต่งเสร็จแล้ว → cap ด้วย remainCraft ไม่ใช่ remainQty
      for (const s of m.sources) {
        if (left <= 0) break;
        const take = Math.min(left, s.remainCraft, s.remainQty);
        if (take <= 0) continue;
        if (!updates[s.orderId]) updates[s.orderId] = {};
        updates[s.orderId][s.dKey] = (updates[s.orderId][s.dKey] ?? s.delivered) + take;
        left -= take;
      }
      if (left > 0) { U.toast(`ส่งไม่ได้: ${m.key} มีของแต่งเสร็จไม่พอ`, 'error'); return; }
    }
    try {
      const deliveredAt = Date.now();
      await Promise.all(Object.entries(updates).map(async ([orderId, keyMap]) => {
        const o = await DB.getOrder(orderId); if (!o) return;
        const ds = {...(o.deliveryStatus||{})};
        for (const [k, qty] of Object.entries(keyMap)) ds[k] = {deliveredQty: qty, deliveredAt};
        const next = {...o, deliveryStatus: ds};
        // ตั้ง isDelivered เมื่อส่งครบทุก item ในออเดอร์
        const full = (o.items||[]).every(i => (ds[deliverKey(i)]?.deliveredQty ?? 0) >= i.qty);
        if (full) { next.isDelivered = true; next.deliveredAt = deliveredAt; }
        await DB.putOrder(next);
      }));
      delete window._pendSel[gid];
      U.toast(`บันทึกจัดส่ง ${pcs} ชิ้นแล้ว ✓`);
      navigate('dashboard');
    } catch (e) {
      U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
    }
  }, {title:'ยืนยันการจัดส่ง', yesLabel:'ส่งแล้ว', yesCls:'btn-success', icon:'fa-truck', iconColor:'#16a34a'});
}

// ── ออกบิลเฉพาะรายการที่เลือก ──
async function pendBill(el) {
  const gid = _gidOf(el); if (!gid) return;
  const grp = window._pendGroups?.[gid]; if (!grp) return;
  const sel = window._pendSel?.[gid] || {};
  const picks = Object.entries(sel).filter(([,v]) => v > 0);
  if (!picks.length) { U.toast('กรุณาเลือกรายการก่อน','error'); return; }

  // ── กันออกบิลซ้ำ: หักจำนวนที่ออกบิลไปแล้วออกจากโควต้า ──
  const over = [];
  for (const [idxStr, want] of picks) {
    const m = grp.merged[Number(idxStr)]; if (!m) continue;
    const billable = m.qty - (m.billedOpen || 0);
    if (want > billable) over.push(`${m.key} (ออกได้อีก ${Math.max(0, billable)})`);
  }
  if (over.length) {
    U.toast('ออกบิลซ้ำไม่ได้: ' + over[0] + (over.length > 1 ? ` และอีก ${over.length-1} รายการ` : ''), 'error');
    return;
  }

  const items = [];
  const plan  = []; // {orderId, dKey, qty} สำหรับเขียน billedStatus กลับหลังบันทึกบิล
  for (const [idxStr, want] of picks) {
    const m = grp.merged[Number(idxStr)]; if (!m) continue;
    const s0 = m.sources[0];
    items.push({name: m.key, qty: want, price: s0?.price || 0});
    // กระจายจำนวนกลับไปยังออเดอร์ต้นทาง (ข้ามส่วนที่ออกบิลไปแล้ว)
    let left = want;
    for (const s of m.sources) {
      if (left <= 0) break;
      const room = s.remainQty - (s.billedOpen || 0);
      const take = Math.min(left, room);
      if (take <= 0) continue;
      plan.push({orderId: s.orderId, dKey: s.dKey, qty: (s.billed || 0) + take});
      left -= take;
    }
  }
  window._pendBillItems = items;
  window._pendBillPlan  = plan;
  window._pendBillGid   = gid;
  await showCreateReceiptModal(null, encodeURIComponent(grp.customerName||''));
}

function markDeliveredGroup(ids) {
  U_confirm(`ยืนยันการจัดส่ง ${ids.length} ออเดอร์ใช่ไหม?`, async()=>{
    const deliveredAt = Date.now();
    await Promise.all(ids.map(async id => {
      const o = await DB.getOrder(id);
      if (o) await DB.putOrder({...o, isDelivered:true, deliveredAt});
    }));
    U.toast('บันทึกจัดส่งแล้ว ✓');
    navigate('dashboard');
  }, {title:'ยืนยันการจัดส่ง', yesLabel:'ส่งแล้ว', yesCls:'btn-success', icon:'fa-truck', iconColor:'#16a34a'});
}

function markDelivered(orderId) {
  U_confirm('ยืนยันว่าจัดส่งออเดอร์นี้แล้วใช่ไหม?', async()=>{
    const order = await DB.getOrder(orderId);
    if (!order) return;
    await DB.putOrder({...order, isDelivered:true, deliveredAt:Date.now()});
    U.toast('บันทึกจัดส่งแล้ว ✓');
    navigate('dashboard');
  }, {title:'ยืนยันการจัดส่ง', yesLabel:'ส่งแล้ว', yesCls:'btn-success', icon:'fa-truck', iconColor:'#16a34a'});
}

function showPrintSelectModal() {
  const d = window._dashTodayData;
  if (!d || !d.pendingOrders || !d.pendingOrders.length) {
    U.toast('ไม่มีรายการรอส่ง','error'); return;
  }
  // แสดงเฉพาะจำนวนคงเหลือ (หักที่จัดส่งไปแล้ว) และตัดออเดอร์ที่ส่งครบออก
  const orders = d.pendingOrders.filter(o => !isOrderFullyDelivered(o));
  if (!orders.length) { U.toast('ไม่มีรายการค้างส่ง','error'); return; }
  window._pslOrders = orders;
  const rows = orders.map((o,idx)=>{
    const ds = o.deliveryStatus || {};
    let totalQty = 0, lineCt = 0, sentQty = 0;
    (o.items||[]).forEach(i=>{
      const sent = getDeliveredQty(ds[deliverKey(i)], i.qty, o.isDelivered);
      const remain = i.qty - sent;
      sentQty += sent;
      if (remain > 0) { totalQty += remain; lineCt++; }
    });
    const sentTag = sentQty > 0
      ? `<span style="font-size:12.5px;color:#2563eb;">🚚 ส่งไปแล้ว ${sentQty}</span>` : '';
    return `<label style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;border:2px solid #e5e7eb;margin-bottom:6px;background:#fff;" id="psl_label_${idx}">
      <input type="checkbox" class="psl-cb" data-idx="${idx}" id="psl_cb_${idx}" checked style="width:18px;height:18px;cursor:pointer;accent-color:#2563eb;">
      <div style="flex:1;">
        <div style="font-weight:700;font-size:14px;">${U.esc(o.customerName||'-')} ${sentTag}</div>
        <div style="font-size:12.5px;color:#6b7280;">${U.date(o.createdAt)} · เหลือ ${totalQty} ชิ้น · ${lineCt} รายการ</div>
      </div>
      <span style="background:#dbeafe;color:#1e40af;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;">${totalQty} ชิ้น</span>
    </label>`;
  }).join('');
  // โหมดพิมพ์ — จำค่าล่าสุดไว้
  const pm = window._printMode || 'craft';
  const modeBtn = (val, icon, title, desc) => `
    <label style="flex:1;min-width:190px;display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:10px;cursor:pointer;
      border:2px solid ${pm===val?'#2563eb':'#e5e7eb'};background:${pm===val?'#eff6ff':'#fff'};">
      <input type="radio" name="pslMode" value="${val}" ${pm===val?'checked':''} onchange="window._printMode=this.value"
        style="width:17px;height:17px;margin-top:2px;flex-shrink:0;accent-color:#2563eb;cursor:pointer;">
      <span style="min-width:0;">
        <span style="display:block;font-size:13.5px;font-weight:700;color:#1a2332;"><i class="fa-solid ${icon} me-1"></i>${title}</span>
        <span style="display:block;font-size:12.5px;color:#6b7280;margin-top:2px;line-height:1.45;">${desc}</span>
      </span>
    </label>`;

  const body = `<div>
    <div style="margin-bottom:12px;padding-bottom:12px;border-bottom:2px solid #e5e7eb;">
      <div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:7px;">รูปแบบใบพิมพ์</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${modeBtn('craft','fa-hammer','แยกตามสถานะแต่ง','ของที่ยังไม่ได้แต่งขึ้นสีจาง ไม่มีช่องติ๊ก — ใช้ตอนจะไปส่งจริง')}
        ${modeBtn('all','fa-list-check','แสดงเต็มทุกรายการ','ทุกรายการขึ้นสีปกติ มีช่องติ๊กครบ — ใช้พิมพ์ล่วงหน้า')}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid #e5e7eb;">
      <button type="button" onclick="togglePslAll(true)" class="btn btn-sm btn-outline-primary">เลือกทั้งหมด</button>
      <button type="button" onclick="togglePslAll(false)" class="btn btn-sm btn-outline-secondary">ยกเลิกทั้งหมด</button>
      <span id="psl_count" style="font-size:12px;color:#6b7280;margin-left:4px;"></span>
    </div>
    <div id="psl_list">${rows}</div>
  </div>`;
  showModal('pslModal','🖨️ เลือกลูกค้าที่จะพิมพ์',body,
    `<button class="btn btn-primary" onclick="confirmPrintSelect()"><i class="fa-solid fa-print me-1"></i>พิมพ์รายการที่เลือก</button>
     <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>`,
    'modal-md');
  updatePslCount();
  // ไฮไลต์การ์ดโหมดที่เลือก
  setTimeout(()=>{
    const paint = () => document.querySelectorAll('input[name="pslMode"]').forEach(r=>{
      const l = r.closest('label'); if(!l) return;
      l.style.borderColor = r.checked ? '#2563eb' : '#e5e7eb';
      l.style.background  = r.checked ? '#eff6ff' : '#fff';
    });
    document.querySelectorAll('input[name="pslMode"]').forEach(r=>r.addEventListener('change', paint));
    paint();
  },100);
  // ผูก event บน checkbox เพื่ออัปเดต label style
  setTimeout(()=>{
    document.querySelectorAll('.psl-cb').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const lbl=document.getElementById('psl_label_'+cb.dataset.idx);
        if(lbl) lbl.style.borderColor=cb.checked?'#3b82f6':'#e5e7eb';
        updatePslCount();
      });
      // init style
      const lbl=document.getElementById('psl_label_'+cb.dataset.idx);
      if(lbl) lbl.style.borderColor=cb.checked?'#3b82f6':'#e5e7eb';
    });
  },100);
}
function togglePslAll(val) {
  document.querySelectorAll('.psl-cb').forEach(cb=>{
    cb.checked=val;
    const lbl=document.getElementById('psl_label_'+cb.dataset.idx);
    if(lbl) lbl.style.borderColor=val?'#3b82f6':'#e5e7eb';
  });
  updatePslCount();
}
function updatePslCount() {
  const total=document.querySelectorAll('.psl-cb').length;
  const checked=document.querySelectorAll('.psl-cb:checked').length;
  const el=document.getElementById('psl_count');
  if(el) el.textContent=`เลือก ${checked}/${total} ลูกค้า`;
}
function confirmPrintSelect() {
  const src = window._pslOrders || window._dashTodayData?.pendingOrders || [];
  const selectedIdxs=[...document.querySelectorAll('.psl-cb:checked')].map(cb=>parseInt(cb.dataset.idx));
  if(!selectedIdxs.length){U.toast('กรุณาเลือกอย่างน้อย 1 ลูกค้า','error');return;}
  const selectedOrders=selectedIdxs.map(i=>src[i]).filter(Boolean);
  closeModal('pslModal');
  printPendingOrders(selectedOrders);
}
function printPendingOrders(ordersInput) {
  const d = window._dashTodayData;
  const ordersToUse = ordersInput || (d ? d.pendingOrders : null);
  if (!ordersToUse || !ordersToUse.length) {
    U.toast('ไม่มีรายการรอส่ง','error'); return;
  }
  // โหมดพิมพ์: 'craft' = แยกตามสถานะแต่ง (ค่าเริ่มต้น), 'all' = แสดงเต็มทุกรายการ
  const printAll = (window._printMode || 'craft') === 'all';
  // สร้าง list จาก pendingOrders — แยก โลง vs อุปกรณ์เสริม
  const prodCache = window._allProductsCache || {};
  function isCoffin(productName) {
    const p = prodCache[productName];
    if (p) return (p.unit||'โลง').trim() === 'โลง';
    return !!COFFIN_SPEC[productName]; // fallback ใช้ COFFIN_SPEC
  }
  // ── group by customer name, merge items (store full data for styled display) ──
  const custMap = new Map();
  ordersToUse.forEach(o => {
    const key = o.customerId || o.customerName;
    if (!custMap.has(key)) custMap.set(key, {name:o.customerName, dates:[], items:new Map(), extras:{}});
    const g = custMap.get(key);
    g.dates.push(U.date(o.createdAt));
    const ds = o.deliveryStatus || {};
    const cs = o.craftStatus || {};
    (o.items||[]).forEach(i=>{
      // พิมพ์เฉพาะจำนวนคงเหลือ — หักที่จัดส่งไปแล้ว
      const deliveredRaw = getDeliveredQty(ds[deliverKey(i)], i.qty, o.isDelivered);
      const remain = i.qty - deliveredRaw;
      if (remain <= 0) return;
      // แยกจำนวนที่แต่งเสร็จแล้ว (พร้อมส่ง) ออกจากที่ยังไม่ได้แต่ง
      // โหมด 'all' = พิมพ์ล่วงหน้า → นับทุกใบเป็นพร้อมส่ง ขึ้นสีปกติ มีช่องติ๊กครบ
      const craftedRemain = printAll ? remain
        : Math.max(0, readyQtyFor(i, getCraftedFor(cs, i)) - deliveredRaw);
      const rdy = Math.min(craftedRemain, remain);   // พร้อมส่ง
      const nry = remain - rdy;                      // ยังไม่ได้แต่ง
      const isChrist=i.trimColor==='คริสต์'||i.style==='คริสต์';
      const lbl=i.productName+(i.color&&i.color!=='-'?' ('+i.color+')':'')+(isChrist?' ✝คริสต์':(i.trimColor?' เส้น'+i.trimColor:''))+(i.extra?' '+i.extra:'');
      if(isCoffin(i.productName)){
        if(g.items.has(lbl)) { const e=g.items.get(lbl); e.qty+=remain; e.ready+=rdy; e.notReady+=nry; }
        else g.items.set(lbl,{qty:remain,ready:rdy,notReady:nry,productName:i.productName,color:i.color||'',trimColor:i.trimColor||'',isChrist,extra:i.extra||''});
      } else g.extras[lbl]=(g.extras[lbl]||0)+remain;
    });
  });
  // ตัดลูกค้าที่ไม่เหลืออะไรให้พิมพ์ออก
  const list = [...custMap.values()].filter(c => c.items.size > 0 || Object.keys(c.extras).length > 0);
  if (!list.length) { U.toast('ไม่มีรายการค้างส่งให้พิมพ์','error'); return; }
  const totalPieces = list.reduce((a,c)=>a+[...c.items.values()].reduce((x,v)=>x+v.qty,0),0);
  const totalCusts  = list.length;

  // สร้าง HTML badge สำหรับสีโลง
  function colorBadge(color) {
    if (!color || color==='-') return '';
    const s = {
      'ขาว':    'background:#fff;color:#000;border:1.5px solid #333;',
      'แดง':    'background:#7f0000;color:#fff;border:1px solid #7f0000;',
      'ดำ':     'background:#111;color:#fff;',
      'น้ำตาล': 'background:#92400e;color:#fff;',
    }[color] || 'background:#e5e7eb;color:#374151;';
    return `<span style="display:inline-block;${s}border-radius:3px;padding:1px 7px;font-size:12px;margin-left:3px;">${color}</span>`;
  }
  // สร้าง HTML badge สำหรับสีเส้น
  function trimBadge(trim, isChrist) {
    if (isChrist) return '<span style="display:inline-block;background:#dbeafe;color:#1e40af;border-radius:3px;padding:1px 7px;font-size:12px;margin-left:3px;">✝คริสต์</span>';
    if (!trim) return '';
    const s = {
      'เงิน': 'background:#d1d5db;color:#111;border:1.5px solid #6b7280;',
      'ทอง':  'background:#b45309;color:#fff;border:1px solid #92400e;',
      'ขาว':  'background:#fff;color:#111;border:1.5px solid #374151;',
      'ซีด':  'background:#d9f99d;color:#365314;border:1px solid #a3e635;',
    }[trim] || 'background:#f3f4f6;color:#374151;';
    return `<span style="display:inline-block;${s}border-radius:3px;padding:1px 7px;font-size:12px;margin-left:3px;">เส้น${trim}</span>`;
  }

  const rows = list.map(c=>{
    const custPieces = [...c.items.values()].reduce((a,v)=>a+v.qty,0);
    const custReady  = [...c.items.values()].reduce((a,v)=>a+(v.ready ?? v.qty),0);
    const custUnready= custPieces - custReady;
    const itemRows = [...c.items.values()].map(it=>{
      const extraHtml = it.extra ? ` <em style="color:#6b7280;font-size:12px;">${it.extra}</em>` : '';
      const nameHtml  = `<strong>${it.productName}</strong>${colorBadge(it.color)}${trimBadge(it.trimColor,it.isChrist)}${extraHtml}`;
      const ready    = it.ready ?? it.qty;
      const notReady = it.notReady ?? 0;
      let out = '';
      // แถวพร้อมส่ง — มีช่องติ๊ก
      if (ready > 0) {
        const boxes = Array.from({length:ready},()=>'<span class="pen-box"></span>').join('');
        out += `<tr>
          <td>${nameHtml}</td>
          <td class="c-qty">${ready} ชิ้น</td>
          <td class="c-box">${boxes}</td>
        </tr>`;
      }
      // แถวยังไม่ได้แต่ง — สีจาง ไม่มีช่องติ๊ก
      if (notReady > 0) {
        out += `<tr class="row-unready">
          <td>${nameHtml} <span class="unready-tag">(ยังไม่ได้แต่ง)</span></td>
          <td class="c-qty">${notReady} ชิ้น</td>
          <td class="c-box"></td>
        </tr>`;
      }
      return out;
    }).join('');
    const extraRows = Object.entries(c.extras||{}).map(([name,qty])=>`
      <tr style="opacity:.65;">
        <td style="font-style:italic;">${name}</td>
        <td class="c-qty" style="color:#6b7280;">${qty}</td>
        <td class="c-box"></td>
      </tr>`).join('');
    const extraSection = extraRows ? `<tr><td colspan="3" style="font-size:12.5px;color:#6b7280;padding:3px 8px;border-top:1px dashed #e5e7eb;">อุปกรณ์เสริม</td></tr>${extraRows}` : '';
    return `
    <div class="cust-block">
      <div class="cust-head">
        <span class="cust-name">${c.name}</span>
        <span class="cust-count">${custUnready > 0 ? `พร้อมส่ง ${custReady} / ${custPieces} โลง` : `${custPieces} โลง`}</span>
      </div>
      <table>
        <colgroup><col class="c-name"><col class="c-qty"><col class="c-box"></colgroup>
        <thead><tr>
          <th>สินค้า</th>
          <th class="c-qty">จำนวน</th>
          <th class="c-box">เช็ค</th>
        </tr></thead>
        <tbody>${itemRows}${extraSection}</tbody>
      </table>
    </div>`;
  }).join('');

  const win = window.open('','_blank','width=794,height=1123');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
  <title>รายการออเดอร์วันนี้</title>
  <style>
    @page{size:A4 portrait;margin:10mm 12mm;}
    *{box-sizing:border-box;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
    body{font-family:'Sarabun',sans-serif;padding:10mm 12mm 8mm;color:#111;font-size:14px;margin:0;max-width:210mm;}
    h1{font-size:20px;font-weight:800;margin:0 0 2px;}
    .sub{font-size:13px;color:#555;margin-bottom:10px;}
    .grand-total{background:#1e3a8a;color:#fff;border-radius:8px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
    .grand-total .label{font-size:12px;opacity:.8;margin-bottom:1px;}
    .grand-total .num{font-size:30px;font-weight:800;letter-spacing:1px;line-height:1.1;}
    .grand-total .sub2{font-size:11px;opacity:.75;margin-top:2px;}
    .grid-wrap{columns:2;column-gap:10px;}
    .cust-block{border:2px solid #dbeafe;border-radius:8px;margin-bottom:8px;overflow:hidden;break-inside:avoid;page-break-inside:avoid;}
    .cust-head{background:#dbeafe;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #93c5fd;}
    .cust-name{font-size:15px;font-weight:800;color:#1e3a8a;letter-spacing:.2px;}
    .cust-count{font-size:12px;color:#1d4ed8;font-weight:800;background:#eff6ff;padding:2px 9px;border-radius:20px;border:1.5px solid #93c5fd;}
    table{width:100%;border-collapse:collapse;table-layout:auto;}
    th{text-align:left;background:#f8fafc;padding:4px 8px;font-size:11px;color:#64748b;font-weight:700;letter-spacing:.3px;}
    th.c-qty,td.c-qty{text-align:center;white-space:nowrap;width:1%;}
    th.c-box,td.c-box{text-align:left;padding-left:8px;white-space:nowrap;width:1%;}
    td{padding:5px 8px;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:middle;}
    tbody tr:last-child td{border-bottom:none;}
    td.c-qty{font-weight:800;color:#1e40af;font-size:14px;}
    .pen-box{display:inline-block;width:18px;height:18px;border:1.5px solid #374151;border-radius:2px;margin-right:3px;vertical-align:middle;}
    .row-unready td{color:#9ca3af!important;}
    .row-unready td strong{font-weight:500;color:#9ca3af!important;}
    .row-unready td span{opacity:.45;}
    .row-unready td.c-qty{color:#9ca3af!important;font-weight:600!important;}
    .unready-tag{font-size:11.5px;color:#9ca3af;font-style:italic;white-space:nowrap;opacity:1!important;}
    .no-print{margin-top:16px;}
    @media print{
      body{padding:0;}
      .no-print{display:none!important;}
      .grand-total,.cust-head{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    }
  </style></head><body>
  <h1>🚚 รายการรอส่ง${printAll ? ' <span style="font-size:14px;font-weight:600;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:2px 10px;vertical-align:middle;">พิมพ์ล่วงหน้า</span>' : ''}</h1>
  <div class="sub">${d.dateLabel}${printAll ? ' · ใบนี้แสดงทุกรายการ ยังไม่ได้แยกว่าแต่งเสร็จหรือยัง' : ''}</div>
  <div class="grand-total">
    <div>
      <div class="label">สรุปยอดรวมทั้งหมด</div>
      <div class="num">${totalPieces} โลง</div>
      <div class="sub2">${totalCusts} ลูกค้า — ${list.map(c=>c.name).join(' · ')}</div>
    </div>
    <div style="font-size:32px;opacity:.3;">📦</div>
  </div>
  <div class="grid-wrap">${rows}</div>
  <div class="no-print">
    <button onclick="window.print()" style="padding:10px 26px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">🖨️ พิมพ์</button>
  </div>
  <script>window.addEventListener('load',function(){var b=document.body;var h=b.scrollHeight;if(h>1056){b.style.zoom=1056/h;}});<\/script>
  </body></html>`);
  win.document.close();
}

async function onOrderCustChange(sel) {
  window._orderCustId = sel.value || null;
  // เปลี่ยนลูกค้า → เติมราคาใหม่ตามราคาเฉพาะลูกค้ารายนั้น
  await ocRefreshPrice();
  const cart = window._ordCart || [];
  for (const x of cart) {
    const prod = (window._orderProds||[]).find(p => p.id === x.productId);
    if (!prod) continue;
    let base = prod.price || 0;
    if (prod.priceMap && Object.keys(prod.priceMap).length) {
      base = (x.trimColor && prod.priceMap[x.trimColor] != null)
        ? prod.priceMap[x.trimColor]
        : (prod.priceMap[Object.keys(prod.priceMap)[0]] || 0);
    }
    if (window._orderCustId) {
      try { base = await DB.getEffectivePrice(window._orderCustId, prod.id, base, x.trimColor||''); } catch(e){}
    }
    x.price = base;
  }
  renderOrdCart();
  paintOcSteps();
  checkExistingOrderToday();
}

// ── ลูกค้ารายนี้มีออเดอร์ของวันนี้อยู่แล้วไหม ──
// ดักนิสัย "เปิดใบใหม่ทุกครั้ง" ตั้งแต่ต้นทาง ไม่ต้องรอให้ผู้ใช้เรียนรู้เอง
// ถามเฉพาะตอนเปิดใบใหม่และยังไม่ได้ใส่สินค้า จะได้ไม่กวนกลางทาง
async function checkExistingOrderToday() {
  try {
    const custId = window._orderCustId;
    if (!custId) return;
    if (document.getElementById('of_editId')?.value) return;      // กำลังแก้ใบเดิม
    if ((window._ordCart || []).length) return;                   // ใส่ของไปแล้ว
    const today = new Date(); today.setHours(0,0,0,0);
    const mine = (await DB.getOrders())
      .filter(o => String(o.customerId) === String(custId) && o.createdAt >= today.getTime())
      .sort((a,b) => b.createdAt - a.createdAt);
    if (!mine.length) return;

    const o = mine[0];
    const items = (o.items||[]).length;
    const name  = o.customerName || 'ลูกค้ารายนี้';
    U_confirm(
      `<b>${U.esc(name)}</b> มีออเดอร์ของวันนี้อยู่แล้ว<br>
       <span style="color:#6b7280;font-size:13.5px;">${U.esc(o.orderNo||'')} · ${items} รายการ</span><br><br>
       จะเพิ่มสินค้าเข้าใบเดิม หรือเปิดใบใหม่?`,
      () => { closeModal('orderModal'); showAddItemsModal(o.id); },
      { title:'ลูกค้ารายนี้มีออเดอร์วันนี้แล้ว', icon:'fa-circle-question', iconColor:'#2563eb',
        yesLabel:'เพิ่มเข้าใบเดิม', yesCls:'btn-primary' }
    );
    // ปุ่ม "ยกเลิก" ของกล่องนี้ = เปิดใบใหม่ต่อตามปกติ จึงไม่ต้องผูกอะไรเพิ่ม
    setTimeout(() => {
      const c = document.querySelector('#confirmDialog .btn-secondary');
      if (c) c.innerHTML = '<i class="fa-solid fa-file-circle-plus me-1"></i>เปิดใบใหม่';
    }, 60);
  } catch(e) { console.warn('checkExistingOrderToday:', e); }
}

function calcOrderTotal() {
  const cart = window._ordCart || [];
  const sub = cart.reduce((a,x) => a + (x.qty||0) * (x.price||0), 0);
  const disc = parseFloat(document.getElementById('of_discount')?.value||0) || 0;
  const s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=U.money(v);};
  s('os_sub',sub); s('os_disc',disc); s('os_total',Math.max(0, sub-disc));
}

// คืน array [{customerName, items:[{name,qty,color,trimColor,action}]}] ของออเดอร์วันนี้
// options:
//   currentOrderId — ID ของออเดอร์ที่เพิ่ง new/edit
//   actionType     — 'new' | 'edit'
//   actionItemKeys — array ของ "name|color|trimColor" ที่ต้องการ tag (สำหรับ edit)
//                    ถ้าไม่ส่ง (new order) → tag ทุก item ในออเดอร์นั้น
async function getTodayOrdersSummary({ currentOrderId, actionType, actionItemKeys } = {}) {
  const all = await DB.getOrders();
  const keySet = actionItemKeys ? new Set(actionItemKeys) : null;
  return all
    .filter(o => !isOrderFullyDelivered(o))
    .map(o => {
      const isCurrent = currentOrderId && String(o.id) === String(currentOrderId);
      const ds = o.deliveryStatus || {};
      return {
        customerName: o.customerName,
        items: (o.items||[]).map(it => {
          // แสดงเฉพาะจำนวนคงเหลือ (หักที่จัดส่งไปแล้ว)
          const remain = it.qty - getDeliveredQty(ds[deliverKey(it)], it.qty, o.isDelivered);
          if (remain <= 0) return null;
          let action = '';
          if (isCurrent) {
            if (actionType === 'new') {
              action = 'new'; // ทุก item ในออเดอร์ใหม่
            } else if (actionType === 'edit' && keySet) {
              const k = `${it.productName}|${it.color||''}|${it.trimColor||''}`;
              if (keySet.has(k)) action = 'edit';
            }
          }
          return { name: it.productName, qty: remain, color: it.color||'', trimColor: it.trimColor||'', action };
        }).filter(Boolean)
      };
    })
    .filter(o => o.items.length > 0);
}

// กดบันทึก → เปิดหน้าตรวจสอบก่อน ยังไม่เขียนลงฐานข้อมูล
function saveOrder() {
  const custId = document.getElementById('of_cust')?.value || '';
  if (!custId) { U.toast('กรุณาเลือกลูกค้า','error'); return; }
  const items = (window._ordCart||[]).filter(x => x.productId && x.qty >= 1);
  if (!items.length) { U.toast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ','error'); return; }
  showOrderConfirm();
}

// บันทึกจริง — เรียกจากปุ่ม "ยืนยันบันทึก" ในหน้าตรวจสอบเท่านั้น
async function doSaveOrder() {
  if (window._saving){return;} window._saving=true;
  // กันเหนียว: ถ้ามีอะไรค้างจนโค้ดข้างล่างไม่จบ ปลดล็อกให้กดใหม่ได้
  clearTimeout(window._savingWatchdog);
  window._savingWatchdog = setTimeout(() => { window._saving = false; }, 45000);
  try {
    const custId=document.getElementById('of_cust')?.value||'';
    if (!custId){U.toast('กรุณาเลือกลูกค้า','error');return;}
    const cust=await DB.getCustomer(custId);

    // อ่านจากตะกร้าใน memory (ไม่ขูดจาก DOM แล้ว)
    const items = (window._ordCart||[])
      .filter(x => x.productId && x.qty >= 1)
      .map(x => ({productId:x.productId, productName:x.productName, qty:x.qty, price:x.price||0,
                  color:x.color||'', trimColor:x.trimColor||'', extra:x.extra||'',
                  specialNote:(x.specialNote||'').trim()}));
    if (!items.length){U.toast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ','error');return;}

    const editId=document.getElementById('of_editId')?.value||'';
    const dateStr=document.getElementById('of_date')?.value;
    // Bangkok timezone: ประกอบ timestamp จาก date picker + เวลา Bangkok ปัจจุบัน
    const createdAt=dateStr
      ?new Date(dateStr+'T'+new Date().toLocaleTimeString('sv-SE',{timeZone:'Asia/Bangkok'}).slice(0,5)+':00+07:00').getTime()
      :Date.now();

    const data={
      customerId:custId, customerName:cust?.name||'',
      items,
      discount:parseFloat(document.getElementById('of_discount')?.value||0),
      notes:document.getElementById('of_notes')?.value.trim()||'',
      createdAt,
    };
    let savedOrderNo = '';
    if (editId) {
      const old=await DB.getOrder(editId);
      savedOrderNo = old?.orderNo || '';
      await DB.putOrder({...old,...data,id:editId});
      U.toast('แก้ไขออเดอร์แล้ว ✓');
      // แจ้งเตือน LINE กลุ่ม — แก้ไขออเดอร์ (เฉพาะรายการที่เปลี่ยน)
      const oldItemMap = {};
      (old.items||[]).forEach(it => { oldItemMap[it.productId] = it; });
      const newItemMap = {};
      (data.items||[]).forEach(it => { newItemMap[it.productId] = it; });
      const changedItems = [];
      // เพิ่มใหม่ หรือ แก้ไข
      for (const it of data.items) {
        const prev = oldItemMap[it.productId];
        if (!prev) {
          changedItems.push({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'', changeType: 'added' });
        } else if (it.qty !== prev.qty || (it.color||'') !== (prev.color||'') || (it.trimColor||'') !== (prev.trimColor||'') || (it.extra||'') !== (prev.extra||'')) {
          changedItems.push({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'', changeType: 'modified' });
        }
      }
      // ลบออก
      for (const it of (old.items||[])) {
        if (!newItemMap[it.productId]) {
          changedItems.push({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'', changeType: 'removed' });
        }
      }
      const custChanged = data.customerName !== (old.customerName || '');
      if (changedItems.length > 0 || custChanged) {
        // ถ้าชื่อลูกค้าเปลี่ยนแต่ไม่มีรายการเปลี่ยน ให้แสดงว่าแก้ไขชื่อ
        const notifyItems = changedItems.length > 0 ? changedItems
          : [{ name: `(เปลี่ยนชื่อจาก "${old.customerName}" → "${data.customerName}")`, qty: 0, color: '', trimColor: '', changeType: 'modified' }];
        const actionItemKeys = notifyItems.map(it => `${it.name}|${it.color||''}|${it.trimColor||''}`);
        const todayEdit = await getTodayOrdersSummary({ currentOrderId: editId, actionType: 'edit', actionItemKeys });
        sendLineNotify({
          type: 'edit',
          customerName: data.customerName,
          items: notifyItems,
          createdAt: data.createdAt,
          todayOrders: todayEdit
        });
      }
    } else {
      data.orderNo=await DB.nextOrderNo();
      savedOrderNo = data.orderNo;
      const newOrderId = await DB.addOrder(data);
      U.toast('บันทึกออเดอร์แล้ว ✓');
      // แจ้งเตือน LINE กลุ่ม — ออเดอร์ใหม่ (fire-and-forget)
      const lineItems = data.items.map(it=>({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'' }));
      const todayNew = await getTodayOrdersSummary({ currentOrderId: newOrderId, actionType: 'new' });
      sendLineNotify({
        type: 'new',
        orderNo: data.orderNo,
        customerName: data.customerName,
        items: lineItems,
        createdAt: data.createdAt,
        todayOrders: todayNew
      });
    }
    closeModal('orderModal');
    navigate(editId ? 'orders' : 'dashboard');
    // ตรวจสอบไปแล้วก่อนบันทึก → แจ้งสั้นๆ พอ ไม่ต้องเด้งสรุปซ้ำ
    if (savedOrderNo) {
      setTimeout(() => U.toast(`${editId?'แก้ไข':'บันทึก'}ออเดอร์ ${savedOrderNo} แล้ว ✓`), 400);
    }
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

function deleteOrder(id) {
  U_confirm('ต้องการลบออเดอร์นี้ใช่ไหม?', async(reason)=>{
    // ดึงข้อมูลออเดอร์ก่อนลบ เพื่อส่ง LINE notify
    const order = await DB.getOrder(id);
    await DB.delOrder(id, reason);
    U.toast('ลบออเดอร์แล้ว');
    navigate('orders');
    // แจ้งเตือน LINE กลุ่ม — ลบออเดอร์ (fire-and-forget)
    if (order) {
      const lineItems = (order.items||[]).map(it=>({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'' }));
      const todayDel = await getTodayOrdersSummary(); // cache แล้วไม่มีออเดอร์ที่ลบ
      sendLineNotify({
        type: 'delete',
        orderNo: order.orderNo,
        customerName: order.customerName,
        items: lineItems,
        createdAt: order.createdAt,
        todayOrders: todayDel
      });
    }
  }, {askReason:true});
}

function renderCustRows(list) {
  return list.map((c,i)=>custRow(c,i)).join('')||emptyRow(7,'ไม่พบลูกค้า');
}
function filterCustTable(val) {
  const q=val.toLowerCase();
  const data=(window._custData||[]).filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q));
  document.getElementById('custTbody').innerHTML=renderCustRows(data);
}

async function showCustomerHistory(custId) {
  const [cust,orders,invoices]=await Promise.all([DB.getCustomer(custId),DB.getOrders(),DB.getInvoices()]);
  if(!cust)return;
  const cOrders=orders.filter(o=>String(o.customerId)===String(custId)).sort((a,b)=>b.createdAt-a.createdAt);
  const cInvs=invoices.filter(i=>String(i.customerId)===String(custId)).sort((a,b)=>b.createdAt-a.createdAt);
  const totalSpent=cInvs.reduce((s,inv)=>s+U.invTotal(inv).total,0);
  const unpaid=cInvs.filter(i=>!i.isPaid).reduce((s,inv)=>s+U.invTotal(inv).total,0);
  const ordRows=cOrders.length?cOrders.map(o=>`<tr>
    <td style="font-size:12px;white-space:nowrap;">${U.datetime(o.createdAt)}</td>
    <td><code style="background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:12px;">${U.esc(o.orderNo)}</code></td>
    <td style="font-size:12px;color:#6b7280;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${(o.items||[]).map(i=>U.esc(i.productName)+'×'+i.qty).join(', ')||'-'}</td>
    <td style="font-weight:700;white-space:nowrap;">${U.money(U.orderTotal(o))}</td>
  </tr>`).join(''):`<tr><td colspan="4"><div class="empty-state" style="padding:20px"><i class="fa-solid fa-inbox"></i><p>ไม่มีออเดอร์</p></div></td></tr>`;
  const invRows=cInvs.length?cInvs.map(inv=>{
    const t=U.invTotal(inv);
    const badge=inv.isPaid?`<span class="badge-paid"><i class="fa-solid fa-check me-1"></i>ชำระแล้ว</span>`:`<span class="badge-unpaid"><i class="fa-solid fa-clock me-1"></i>ค้างชำระ</span>`;
    return `<tr>
      <td style="font-size:12px;white-space:nowrap;">${U.date(inv.createdAt)}</td>
      <td><strong style="font-size:13px;">${U.esc(inv.invoiceNo)}</strong></td>
      <td style="font-weight:700;white-space:nowrap;">${U.money(t.total)}</td>
      <td>${badge}</td>
      <td><button class="btn btn-sm btn-outline-primary btn-icon" onclick="printReceiptById('${inv.id}')" title="พิมพ์"><i class="fa-solid fa-print"></i></button></td>
    </tr>`;
  }).join(''):`<tr><td colspan="5"><div class="empty-state" style="padding:20px"><i class="fa-solid fa-file-circle-xmark"></i><p>ไม่มีใบเสร็จ</p></div></td></tr>`;
  const body=`
    <div class="row g-3 mb-3">
      <div class="col-4"><div class="stat-card"><div class="label">ออเดอร์</div><div class="value" style="font-size:22px;">${cOrders.length}</div></div></div>
      <div class="col-4"><div class="stat-card"><div class="label">ยอดรวม</div><div class="value" style="font-size:18px;">${U.money(totalSpent)}</div></div></div>
      <div class="col-4"><div class="stat-card"><div class="label">ค้างชำระ</div><div class="value" style="font-size:18px;color:${unpaid>0?'#dc2626':'#16a34a'};">${U.money(unpaid)}</div></div></div>
    </div>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#chOrd">ออเดอร์ (${cOrders.length})</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#chInv">ใบเสร็จ (${cInvs.length})</a></li>
    </ul>
    <div class="tab-content">
      <div class="tab-pane fade show active" id="chOrd"><div class="table-scroll">
        <table class="table-clean"><thead><tr><th>วันที่</th><th>เลขออเดอร์</th><th>รายการ</th><th>ยอดรวม</th></tr></thead>
        <tbody>${ordRows}</tbody></table></div></div>
      <div class="tab-pane fade" id="chInv"><div class="table-scroll">
        <table class="table-clean"><thead><tr><th>วันที่</th><th>เลขใบเสร็จ</th><th>ยอดรวม</th><th>สถานะ</th><th></th></tr></thead>
        <tbody>${invRows}</tbody></table></div></div>
    </div>`;
  showModal('custHistModal',`ประวัติ: ${U.esc(cust.name)}`,body,`<button class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>`,'modal-lg');

async function saveCustomer() {
  if (window._saving){return;} window._saving=true;
  // กันเหนียว: ถ้ามีอะไรค้างจนโค้ดข้างล่างไม่จบ ปลดล็อกให้กดใหม่ได้
  clearTimeout(window._savingWatchdog);
  window._savingWatchdog = setTimeout(() => { window._saving = false; }, 45000);
  try {
    const name=document.getElementById('cf_name')?.value.trim();
    if (!name){U.toast('กรุณากรอกชื่อ','error');return;}
    const id=document.getElementById('cf_id')?.value||'';
    const data={name,phone:document.getElementById('cf_phone')?.value.trim()||'',taxId:document.getElementById('cf_taxId')?.value.trim()||'',address:document.getElementById('cf_address')?.value.trim()||'',notes:document.getElementById('cf_notes')?.value.trim()||''};
    if (id){const old=await DB.getCustomer(id);await DB.putCustomer({...old,...data});U.toast('แก้ไขข้อมูลลูกค้าแล้ว ✓');}
    else{await DB.addCustomer(data);U.toast('เพิ่มลูกค้าแล้ว ✓');}
    closeModal('custModal');navigate('customers');
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

async function deleteCustomer(id) {
  const [orders, invoices] = await Promise.all([DB.getOrders(), DB.getInvoices()]);
  const hasOrders   = orders.find(o=>String(o.customerId)===String(id));
  const hasInvoices = invoices.find(i=>String(i.customerId)===String(id));
  if (hasOrders || hasInvoices) {
    U.toast(`ไม่สามารถลบได้ มีออเดอร์/ใบเสร็จที่เชื่อมกับลูกค้านี้อยู่`, 'error'); return;
  }
  U_confirm('ต้องการลบลูกค้านี้ใช่ไหม?', async(reason)=>{
    await DB.delCustomer(id, reason);U.toast('ลบลูกค้าแล้ว');navigate('customers');
  }, {askReason:true});
}

// ── ราคาพิเศษต่อลูกค้า ──
async function showCustomerPriceModal(custId) {
  const [cust, products] = await Promise.all([DB.getCustomer(custId), DB.getProducts()]);
  if (!cust||!products.length){U.toast('กรุณาเพิ่มสินค้าก่อน','error');return;}
  const lineIcons={ทอง:'🟡',เงิน:'🔘',ซีด:'🥉',ขาว:'⬜',คริสต์:'✝',ผ้าจีบ:'🪷',ผ้าดอก:'🌸'};
  const rows=products.map(p=>{
    const spec=COFFIN_SPEC[p.name];
    const lines=spec?.lines||Object.keys(p.priceMap||{});
    const cpObj=cust.customPrices?.[p.id];
    if(!lines.length){
      const val=(typeof cpObj==='number')?cpObj:'';
      return `<tr style="background:#f8fafc;"><td colspan="2"><strong>${U.esc(p.name)}</strong></td>
        <td><input type="number" class="form-control form-control-sm" id="cp_${p.id}__" min="0" value="${val}" placeholder="ราคาปกติ ${U.money(p.price)}"></td></tr>`;
    }
    const subRows=lines.map(l=>{
      const defPrice=p.priceMap?.[l]??p.price;
      const val=(typeof cpObj==='object'&&cpObj?.[l]!==undefined)?cpObj[l]:'';
      return `<tr><td style="padding-left:24px;font-size:13px;">${lineIcons[l]||''} เส้น${l}</td>
        <td style="text-align:center;font-size:13px;color:#6b7280;">${U.money(defPrice)}</td>
        <td><input type="number" class="form-control form-control-sm" id="cp_${p.id}_${l}" min="0" value="${val}" placeholder="ราคาปกติ ${U.money(defPrice)}"></td></tr>`;
    }).join('');
    return `<tr style="background:#eff6ff;"><td colspan="3" style="padding:7px 12px;font-weight:700;color:#1e3a8a;font-size:14px;">📦 ${U.esc(p.name)}</td></tr>${subRows}`;
  }).join('');
  const body=`<p style="font-size:13px;color:#6b7280;margin-bottom:12px;">ตั้งราคาพิเศษสำหรับ <strong>${U.esc(cust.name)}</strong><br>ปล่อยว่างไว้ = ใช้ราคาปกติของสินค้า</p>
    <table class="table-clean"><thead><tr><th>สีเส้น</th><th style="text-align:center;">ราคาปกติ</th><th>ราคาของร้านนี้</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
  showModal('custPriceModal',`ราคาพิเศษ — ${U.esc(cust.name)}`,body,
    `<button class="btn btn-primary" onclick="saveCustomerPrices('${custId}')"><i class="fa-solid fa-floppy-disk me-1"></i>บันทึกราคา</button>
     <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>`,'modal-lg');
  window._custPriceProducts=products;
}

async function saveCustomerPrices(custId) {
  const cust=await DB.getCustomer(custId);
  const customPrices={};
  (window._custPriceProducts||[]).forEach(p=>{
    const spec=COFFIN_SPEC[p.name];
    const lines=spec?.lines||Object.keys(p.priceMap||{});
    if(!lines.length){
      const el=document.getElementById(`cp_${p.id}__`);
      const val=el?.value.trim();
      if(val!=='') customPrices[p.id]=parseFloat(val);
    } else {
      const pricePerLine={};
      lines.forEach(l=>{
        const el=document.getElementById(`cp_${p.id}_${l}`);
        const val=el?.value.trim();
        if(val!=='') pricePerLine[l]=parseFloat(val);
      });
      if(Object.keys(pricePerLine).length) customPrices[p.id]=pricePerLine;
    }
  });
  await DB.putCustomer({...cust,customPrices});
  U.toast('บันทึกราคาพิเศษแล้ว ✓');
  closeModal('custPriceModal');
  navigate('customers');
}
