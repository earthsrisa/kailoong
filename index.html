function prodRow(p,i) {
  const spec=COFFIN_SPEC[p.name];
  const specLines=spec?.lines||[];
  const pm=p.priceMap||{};
  const extraKeys=Object.keys(pm).filter(k=>!specLines.includes(k)&&(pm[k]||0)>0);
  const lines=(Array.isArray(p.lines)&&p.lines.length) ? p.lines
    : (specLines.length?[...specLines,...extraKeys]:Object.keys(pm));
  const lineIcons={ทอง:'🟡',เงิน:'🔘',ซีด:'🥉',ขาว:'⬜',คริสต์:'✝',ผ้าจีบ:'🪷',ผ้าดอก:'🌸'};
  let priceCell;
  const hasPm=lines.length&&Object.keys(pm).some(k=>pm[k]>0);
  if(hasPm){
    priceCell=lines.filter(l=>pm[l]!=null).map(l=>
      `<span style="font-size:12.5px;background:#eff6ff;color:#1e40af;border-radius:5px;padding:2px 7px;margin:1px 2px;display:inline-block;white-space:nowrap;">${lineIcons[l]||''}${l} <b>${U.money(pm[l])}</b></span>`
    ).join('');
  } else {
    priceCell=`<span style="font-weight:700;color:#2563eb;">${U.money(p.price)}</span>`;
  }
  return `<tr>
    <td data-label="รหัส"><code style="background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:12px;">${U.esc(p.code||'-')}</code></td>
    <td class="g-title"><strong>${U.esc(p.name)}</strong></td>
    <td data-label="ประเภท" style="font-size:13px;color:#6b7280;">${U.esc(p.category||'-')}</td>
    <td data-label="หน่วย" style="font-size:13px;">${U.esc(p.unit||'โลง')}</td>
    <td data-label="ราคาตามสีเส้น" class="g-wrap">${priceCell}</td>
    <td class="g-act d-flex gap-1">
      <button class="btn btn-sm btn-outline-primary btn-icon" onclick="showProductModal('${p.id}')" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
      <button class="btn btn-sm btn-outline-danger btn-icon" onclick="deleteProduct('${p.id}')" title="ลบ"><i class="fa-solid fa-trash"></i></button>
    </td>
  </tr>`;
}

function filterProdTable(val) {
  const q=val.toLowerCase();
  const data=(window._prodData||[]).filter(p=>!q||p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q));
  document.getElementById('prodTbody').innerHTML=data.map((p,i)=>prodRow(p,i)).join('')||emptyRow(6,'ไม่พบสินค้า');
}

function buildPriceFields(prodName, existingPm, savedLines, savedColors) {
  const spec=COFFIN_SPEC[prodName];
  const pmKeys=Object.keys(existingPm||{}).filter(k=>k!=='__default'&&(existingPm[k]||0)>0);
  const DEFAULT_LINES=['ทอง','เงิน'];
  const specLines=spec?.lines||[];
  // ถ้าเคยบันทึกรายการสีเส้นไว้แล้ว ยึดตามนั้น — ที่ลบออกจะไม่โผล่กลับมา
  const extraKeys=pmKeys.filter(k=>!specLines.includes(k));
  const lines=(Array.isArray(savedLines)&&savedLines.length)
    ? savedLines
    : (specLines.length?[...specLines,...extraKeys]:(pmKeys.length?pmKeys:DEFAULT_LINES));
  const lineIcons={ทอง:'🟡',เงิน:'🔘',ซีด:'🥉',ขาว:'⬜',คริสต์:'✝',ผ้าจีบ:'🪷',ผ้าดอก:'🌸'};
  const rows=lines.map(l=>`
    <div class="pf-line-row" style="display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;align-items:center;">
      <input type="text" class="form-control form-control-sm pf-line-name" value="${U.esc(l)}" placeholder="ชื่อสีเส้น">
      <input type="number" class="form-control form-control-sm pf-line-price" min="0" placeholder="ราคา..." value="${existingPm?.[l]||''}">
      <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.pf-line-row').remove()" style="padding:4px 7px;"><i class="fa-solid fa-trash"></i></button>
    </div>`).join('');
  return `<div class="col-12">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <label class="form-label fw-semibold mb-0">✨ ราคาตามสีเส้น (บาท)</label>
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="addPriceLineRow()"><i class="fa-solid fa-plus me-1"></i>เพิ่มสีเส้น</button>
    </div>
    <div id="pf_lines_wrap" style="display:flex;flex-direction:column;gap:8px;">${rows}</div>
  </div>
  ${buildColorFields(prodName, savedColors)}
  <input type="hidden" id="pf_price" value="0">`;
}

// ── ตั้งค่าสีโลงของสินค้า — ลบให้หมด = ไม่ต้องเลือกสีตอนสั่ง ──
function buildColorFields(prodName, savedColors) {
  const colors = Array.isArray(savedColors) ? savedColors
    : (COFFIN_SPEC[prodName]?.colors ?? ['ขาว','แดง']);
  const rows = colors.map(c => `
    <div class="pf-color-row" style="display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center;">
      <span class="pf-sw" style="${COLOR_SWATCH[c]||'background:#e5e7eb;'}"></span>
      <input type="text" class="form-control form-control-sm pf-color-name" value="${U.esc(c)}"
        placeholder="ชื่อสี" oninput="refreshColorSwatch(this)">
      <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.pf-color-row').remove();updateColorHint()" style="padding:4px 7px;"><i class="fa-solid fa-trash"></i></button>
    </div>`).join('');
  return `<div class="col-12">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <label class="form-label fw-semibold mb-0">🎨 สีโลง</label>
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="addColorRow()"><i class="fa-solid fa-plus me-1"></i>เพิ่มสี</button>
    </div>
    <div id="pf_colors_wrap" style="display:flex;flex-direction:column;gap:8px;">${rows}</div>
    <div id="pf_color_hint" style="font-size:12px;color:#6b7280;margin-top:7px;"></div>
  </div>`;
}

function refreshColorSwatch(inp) {
  const sw = inp.closest('.pf-color-row')?.querySelector('.pf-sw');
  if (sw) sw.style.cssText = 'width:26px;height:26px;border-radius:50%;flex-shrink:0;'
    + (COLOR_SWATCH[inp.value.trim()] || 'background:#e5e7eb;border:1.5px solid #cbd5e1;');
}
function updateColorHint() {
  const n = document.querySelectorAll('.pf-color-row').length;
  const el = document.getElementById('pf_color_hint');
  if (el) el.innerHTML = n
    ? `<i class="fa-solid fa-circle-info me-1"></i>ตอนรับออเดอร์จะให้เลือก ${n} สีนี้`
    : `<span style="color:#0891b2;font-weight:600;"><i class="fa-solid fa-check me-1"></i>ไม่มีสี — ตอนรับออเดอร์จะข้ามขั้นเลือกสีโลงไปเลย (เหมาะกับไม้สัก)</span>`;
}
function addColorRow() {
  const wrap = document.getElementById('pf_colors_wrap');
  if (!wrap) return;
  const row = document.createElement('div');
  row.className = 'pf-color-row';
  row.style.cssText = 'display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center;';
  row.innerHTML = `
    <span class="pf-sw" style="background:#e5e7eb;border:1.5px solid #cbd5e1;"></span>
    <input type="text" class="form-control form-control-sm pf-color-name" placeholder="ชื่อสี เช่น ขาว" oninput="refreshColorSwatch(this)">
    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.pf-color-row').remove();updateColorHint()" style="padding:4px 7px;"><i class="fa-solid fa-trash"></i></button>`;
  wrap.appendChild(row);
  row.querySelector('.pf-color-name').focus();
  updateColorHint();
}

function addPriceLineRow() {
  const wrap=document.getElementById('pf_lines_wrap');
  if(!wrap) return;
  const row=document.createElement('div');
  row.className='pf-line-row';
  row.style.cssText='display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;align-items:center;';
  row.innerHTML=`
    <input type="text" class="form-control form-control-sm pf-line-name" placeholder="ชื่อสีเส้น เช่น ม่วง">
    <input type="number" class="form-control form-control-sm pf-line-price" min="0" placeholder="ราคา...">
    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.pf-line-row').remove()" style="padding:4px 7px;"><i class="fa-solid fa-trash"></i></button>`;
  wrap.appendChild(row);
  row.querySelector('.pf-line-name').focus();
}

function refreshPriceFields(name) {
  const wrap=document.getElementById('pf_price_wrap');
  if(wrap){ wrap.innerHTML=buildPriceFields(name,{}); updateColorHint(); }
}

async function saveProduct() {
  if (window._saving){return;} window._saving=true;
  // กันเหนียว: ถ้ามีอะไรค้างจนโค้ดข้างล่างไม่จบ ปลดล็อกให้กดใหม่ได้
  clearTimeout(window._savingWatchdog);
  window._savingWatchdog = setTimeout(() => { window._saving = false; }, 45000);
  try {
    const name=document.getElementById('pf_name')?.value.trim();
    if (!name){U.toast('กรุณากรอกชื่อสินค้า','error');return;}
    const id=document.getElementById('pf_id')?.value||'';
    const priceMap={};
    const lines=[];   // เก็บลำดับสีเส้นที่ตั้งไว้ เพื่อให้ลบแล้วไม่กลับมาอีก
    document.querySelectorAll('.pf-line-row').forEach(row=>{
      const l=row.querySelector('.pf-line-name')?.value.trim();
      if(!l) return;
      lines.push(l);
      const v=parseFloat(row.querySelector('.pf-line-price')?.value||'');
      if(!isNaN(v)&&v>0) priceMap[l]=v;
    });
    // สีโลง — เก็บเป็น array ว่างได้ (= ไม่ต้องเลือกสี เช่น ไม้สัก)
    const colors=[];
    document.querySelectorAll('.pf-color-name').forEach(el=>{
      const c=el.value.trim();
      if(c && !colors.includes(c)) colors.push(c);
    });
    const defaultPrice=parseFloat(document.getElementById('pf_price')?.value||0)||0;
    const data={code:document.getElementById('pf_code')?.value.trim()||'',name,
      category:document.getElementById('pf_cat')?.value.trim()||'',
      unit:document.getElementById('pf_unit')?.value.trim()||'โลง',
      price:defaultPrice, priceMap, lines, colors};
    if (id){const old=await DB.getProduct(id);await DB.putProduct({...old,...data});U.toast('แก้ไขสินค้าแล้ว ✓');}
    else{await DB.addProduct(data);U.toast('เพิ่มสินค้าแล้ว ✓');}
    closeModal('prodModal');navigate('products');
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

async function deleteProduct(id) {
  const orders = await DB.getOrders();
  const inUse = orders.find(o=>(o.items||[]).some(it=>String(it.productId)===String(id)));
  if (inUse) {
    U.toast('ไม่สามารถลบได้ มีออเดอร์ที่ใช้สินค้านี้อยู่', 'error'); return;
  }
  U_confirm('ต้องการลบสินค้านี้ใช่ไหม?', async(reason)=>{
    await DB.delProduct(id, reason);U.toast('ลบสินค้าแล้ว');navigate('products');
  }, {askReason:true});
}

function renderInvRows(list) {
  return list.map(inv=>invRow(inv)).join('')||emptyRow(7,'ยังไม่มีใบเสร็จ','fa-file-circle-xmark');
}

function invPaid(inv) {
  if (inv.paidAmount!=null) return inv.paidAmount;
  if (inv.isPaid) return U.invTotal(inv).total;
  return 0;
}
function invRow(inv) {
  const t=U.invTotal(inv);
  const isPaid=inv.isPaid||false;
  const statusBadge=isPaid
    ?`<span class="badge-paid"><i class="fa-solid fa-check me-1"></i>ชำระแล้ว</span>`
    :`<span class="badge-unpaid"><i class="fa-solid fa-clock me-1"></i>ค้างชำระ</span>`;
  const payBtn=isPaid
    ?`<button class="btn btn-sm btn-outline-secondary btn-icon" onclick="toggleInvPaid('${inv.id}',false)" title="ยกเลิกชำระ"><i class="fa-solid fa-rotate-left"></i></button>`
    :`<button class="btn btn-sm btn-outline-success btn-icon" onclick="toggleInvPaid('${inv.id}',true)" title="บันทึกชำระแล้ว"><i class="fa-solid fa-check"></i></button>`;
  return `<tr>
    <td class="g-title"><strong>${U.esc(inv.invoiceNo)}</strong></td>
    <td data-label="ลูกค้า">${U.esc(inv.customerName||'-')}</td>
    <td data-label="วันที่" style="white-space:nowrap;font-size:13px;">${U.date(inv.createdAt)}</td>

    <td data-label="ยอดรวม" style="text-align:right;font-weight:700;">${U.money(t.total)}</td>

    <td class="g-act d-flex gap-1">
      ${payBtn}
      <button class="btn btn-sm btn-outline-primary btn-icon" onclick="printReceiptById('${inv.id}')" title="พิมพ์"><i class="fa-solid fa-print"></i></button>
      <button class="btn btn-sm btn-outline-secondary btn-icon" onclick="showCreateReceiptModal('${inv.id}')" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
      <button class="btn btn-sm btn-outline-danger btn-icon" onclick="deleteInvoice('${inv.id}')" title="ลบ"><i class="fa-solid fa-trash"></i></button>
    </td>
  </tr>`;
}

function applyInvFilter() {
  const q = (document.getElementById('invSearch')?.value||'').toLowerCase();
  const custId = document.getElementById('invFilterCust')?.value||'';
  const status = document.getElementById('invFilterStatus')?.value||'';
  const from = document.getElementById('invFilterFrom')?.value||'';
  const to   = document.getElementById('invFilterTo')?.value||'';
  let data = window._invData||[];
  if (q)      data = data.filter(i=>i.invoiceNo?.toLowerCase().includes(q)||i.customerName?.toLowerCase().includes(q));
  if (custId) data = data.filter(i=>String(i.customerId)===custId);
  if (status==='paid')   data = data.filter(i=>i.isPaid);
  if (status==='unpaid') data = data.filter(i=>!i.isPaid);
  if (from)   data = data.filter(i=>new Date(i.createdAt).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'})>=from);
  if (to)     data = data.filter(i=>new Date(i.createdAt).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'})<=to);
  document.getElementById('invTbody').innerHTML=data.map(invRow).join('')||emptyRow(7,'ไม่พบใบเสร็จ');
}

             </div>
             <p style="font-size:13px;color:#374151;margin:0;">ต้องการทำอะไร?</p>`,

               <i class="fa-solid fa-pen-to-square me-1"></i>แก้ไขใบเดิม (${U.esc(existing.invoiceNo)})

  // รายการที่เลือกมาจากรายการรอส่ง (ปุ่ม "ออกบิลที่เลือก")
  const pendItems = window._pendBillItems; window._pendBillItems = null;

  const initItems=edit?.items || pendItems || [{name:'',qty:1,price:0}];

  const body=`<form class="row g-3">
    <div class="col-sm-5">
      <label class="form-label">ลูกค้า <span class="text-danger">*</span></label>
      <select class="form-select" id="rc_cust" onchange="onRcCustChange(this)">

    </div>
    <div class="col-sm-4 d-flex align-items-end">

    </div>
    <div class="col-12">
      <label class="form-label">รายการสินค้า</label>
      <table class="items-table w-100">
        <thead><tr>
          <th style="width:40%">ชื่อสินค้า</th>
          <th style="width:8%">จำนวน</th>
          <th style="width:20%">ราคา/ชิ้น</th>
          <th style="width:16%">รวม</th>

          <tr><td style="padding:3px 8px;color:#6b7280;">ภาษีมูลค่าเพิ่ม</td><td id="rcs_tax" style="text-align:right;">0.00</td></tr>
          <tr style="border-top:2px solid #1a2332;"><td style="padding:8px;font-weight:700;font-size:16px;">รวมทั้งสิ้น</td>
            <td id="rcs_total" style="text-align:right;font-weight:700;font-size:16px;">0.00</td></tr>

  showModal('rcModal',edit?`แก้ไข ${U.esc(edit.invoiceNo)}`:'ออกใบเสร็จรับเงิน',body,

     <button class="btn btn-outline-primary" onclick="saveReceipt(true)"><i class="fa-solid fa-print me-1"></i>บันทึก & พิมพ์</button>
     <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>`,

function rcItemRow(i, item={}) {
  const opts=(window._rcProdList||[]).map(p=>`<option value="${p.id}" data-price="${p.price}" data-name="${U.esc(p.name)}">${U.esc(p.name)}</option>`).join('');
  return `<tr id="rcrow_${i}">
    <td><input type="text" class="form-control form-control-sm" id="rcname_${i}" value="${U.esc(item.name||'')}" placeholder="ชื่อสินค้า" oninput="calcRcTotal()"></td>
    <td><input type="number" class="form-control form-control-sm" id="rcqty_${i}" value="${item.qty||1}" min="1" oninput="calcRcTotal()"></td>
    <td><input type="number" class="form-control form-control-sm" id="rcprice_${i}" value="${item.price||0}" min="0" oninput="calcRcTotal()"></td>
    <td><span id="rctotal_${i}" style="font-size:13px;font-weight:600;">${U.money((item.qty||1)*(item.price||0))}</span></td>
    <td>
      <select class="form-select form-select-sm" onchange="onRcProdSelect(this,${i})" style="font-size:12px;">
        <option value="">เลือกสินค้า...</option>${opts}
      </select>

}

function addRcItemRow() {
  const i=window._rcItemIdx++;
  document.getElementById('rcItemsBody').insertAdjacentHTML('beforeend',rcItemRow(i));
}

function onRcCustChange(sel) {
  window._rcCustId=sel.value||null;
  const cust=(window._rcCustList||[]).find(c=>c.id===window._rcCustId);
  const addrEl=document.getElementById('rc_addr');
  if (addrEl&&cust?.address) addrEl.value=cust.address;
}

// ดึงออเดอร์ของลูกค้าในวันที่เลือกมาใส่บิลอัตโนมัติ
// เปิด receipt modal ใหม่โดยข้ามการตรวจสอบใบซ้ำ (กรณีผู้ใช้ยืนยันสร้างใหม่)
function _forceNewInvoice(encodedName) {
  window._skipDupCheck = true;
  showCreateReceiptModal(null, encodedName);
}

function pullOrdersToReceipt() {
  const custId=window._rcCustId;
  if (!custId){U.toast('กรุณาเลือกลูกค้าก่อน','error');return;}

  const orders=(window._rcAllOrders||[]).filter(o=>
    o.customerId===custId && !isOrderFullyDelivered(o)
  );

  if (!orders.length){
    U.toast('ไม่พบออเดอร์ค้างส่งของลูกค้านี้', 'error');
    return;
  }

  // รวมรายการทั้งหมดจากทุกออเดอร์ (หักจำนวนที่จัดส่งไปแล้ว)
  const merged = {};
  orders.forEach(o=>(o.items||[]).forEach(i=>{
    const remain = i.qty - getDeliveredQty((o.deliveryStatus||{})[deliverKey(i)], i.qty, o.isDelivered);
    if (remain <= 0) return;
    const key = i.productName+'|'+i.price+'|'+(i.color||'')+'|'+(i.trimColor||'')+'|'+(i.style||'')+'|'+(i.specialNote||'');
    if (merged[key]) { merged[key].qty+=remain; }
    else { merged[key]={name:itemLabel(i),qty:remain,price:i.price}; }
  }));

  const items=Object.values(merged);
  window._rcItemIdx=items.length;
  document.getElementById('rcItemsBody').innerHTML=items.map((item,i)=>rcItemRow(i,item)).join('');
  calcRcTotal();
  U.toast(`✓ ดึง ${items.length} รายการ จาก ${orders.length} ออเดอร์ค้างส่ง`);
}

function itemLabel(i) {
  let label=i.productName||'';
  if (i.color && i.color!=='-') label+=' '+i.color;
  const isChrist = i.trimColor==='คริสต์' || i.style==='คริสต์';
  if (isChrist) label+=' ✝คริสต์';
  else if (i.trimColor) label+=' เส้น'+i.trimColor;
  if (i.extra)       label+=' '+i.extra;
  if (i.specialNote) label+=' ('+i.specialNote+')';
  return label;
}

async function onRcProdSelect(sel,i) {
  const opt=sel.options[sel.selectedIndex];
  const prodId=sel.value; if(!prodId)return;
  const defaultPrice=parseFloat(opt.dataset.price||0);
  let price=defaultPrice;
  if (window._rcCustId) price=await DB.getEffectivePrice(window._rcCustId,prodId,defaultPrice);
  const nameEl=document.getElementById(`rcname_${i}`);
  const priceEl=document.getElementById(`rcprice_${i}`);
  if (nameEl) nameEl.value=opt.dataset.name||opt.text;
  if (priceEl) priceEl.value=price;
  sel.value=''; calcRcTotal();
}

function calcRcTotal() {
  let sub=0;
  document.querySelectorAll('#rcItemsBody tr').forEach(row=>{
    const m=row.id?.match(/rcrow_(\d+)/); if(!m)return;
    const i=m[1];
    const qty=parseFloat(document.getElementById(`rcqty_${i}`)?.value||0);
    const pr=parseFloat(document.getElementById(`rcprice_${i}`)?.value||0);
    const t=qty*pr;
    const tel=document.getElementById(`rctotal_${i}`); if(tel)tel.textContent=U.money(t);
    sub+=t;
  });
  const disc=parseFloat(document.getElementById('rc_disc')?.value||0);
  const taxRate=parseFloat(document.getElementById('rc_tax')?.value||0);
  const base=sub-disc; const tax=base*taxRate/100;
  const s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=U.money(v);};
  s('rcs_sub',sub);s('rcs_disc',disc);s('rcs_tax',tax);s('rcs_total',base+tax);
}

async function saveReceipt(andPrint=false) {
  if (window._saving){return;} window._saving=true;
  const custId=document.getElementById('rc_cust')?.value||'';
  if (!custId){window._saving=false;U.toast('กรุณาเลือกลูกค้า','error');return;}
  const cust=(window._rcCustList||[]).find(c=>c.id===custId)||{};

  const items=[];
  document.querySelectorAll('#rcItemsBody tr').forEach(row=>{
    const m=row.id?.match(/rcrow_(\d+)/); if(!m)return;
    const i=m[1];
    const name=document.getElementById(`rcname_${i}`)?.value.trim();
    const qty=parseFloat(document.getElementById(`rcqty_${i}`)?.value||0);
    const price=parseFloat(document.getElementById(`rcprice_${i}`)?.value||0);
    if (name) items.push({name,qty,price});
  });
  if (!items.length){U.toast('กรุณาเพิ่มรายการสินค้า','error');return;}

  const editId=document.getElementById('rc_editId')?.value||'';
  const data={
    type:'receipt',
    customerId:custId, customerName:cust.name||'',
    customerAddress:document.getElementById('rc_addr')?.value.trim()||'',
    customerPhone:cust.phone||'', customerTaxId:cust.taxId||'',
    items,
    discount:parseFloat(document.getElementById('rc_disc')?.value||0),
    taxRate:parseFloat(document.getElementById('rc_tax')?.value||0),
    notes:document.getElementById('rc_notes')?.value.trim()||'',
  };

  // ── ป้องกันออกบิลซ้ำวันเดียวกัน (เฉพาะบิลใหม่) ──────────────────────
  if (!editId && !window._rcConfirmedDup) {
    const allInv=await DB.getInvoices();
    const todayStart=new Date(); todayStart.setHours(0,0,0,0);
    const existing=allInv.find(inv=>inv.customerId===custId&&inv.createdAt>=todayStart.getTime());
    if (existing) {
      const ap=andPrint;
      showModal('dupInvModal','พบใบเสร็จซ้ำ',
        `<div style="background:#fef3c7;border-radius:10px;padding:14px 18px;border-left:4px solid #f59e0b;margin-bottom:12px;">
           <strong style="color:#92400e;">⚠️ พบใบเสร็จวันนี้แล้ว</strong><br>
           <span style="font-size:13px;color:#78350f;">ลูกค้า <strong>${U.esc(cust.name)}</strong>
           มีใบเสร็จวันนี้แล้ว เลขที่ <strong>${U.esc(existing.invoiceNo)}</strong> (${U.money(U.invTotal(existing).total)})</span>
         </div>
         <p style="font-size:13px;color:#374151;margin:0;">ต้องการทำอะไร?</p>`,
        `<button class="btn btn-warning" onclick="closeModal('dupInvModal');showCreateReceiptModal('${existing.id}');">
           <i class="fa-solid fa-pen-to-square me-1"></i>แก้ไขใบเดิม (${U.esc(existing.invoiceNo)})
         </button>
         <button class="btn btn-primary" onclick="closeModal('dupInvModal');window._rcConfirmedDup=true;saveReceipt(${ap});">
           <i class="fa-solid fa-plus me-1"></i>ออกใบใหม่เพิ่ม
         </button>
         <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>`);
      return;
    }
  }
  window._rcConfirmedDup=false;
  // ─────────────────────────────────────────────────────────────────────────

  try {
    let savedId;
    if (editId){const old=await DB.getInvoice(editId);await DB.putInvoice({...old,...data});savedId=editId;U.toast('แก้ไขใบเสร็จแล้ว ✓');}
    else{data.invoiceNo=await DB.nextReceiptNo();savedId=await DB.addInvoice(data);U.toast('ออกใบเสร็จแล้ว ✓');}
    // ── บันทึก billedStatus กลับไปยังออเดอร์ต้นทาง (กันออกบิลซ้ำ) ──
    const plan = window._pendBillPlan; window._pendBillPlan = null;
    if (plan && plan.length && !editId) {
      const byOrder = {};
      for (const p of plan) { (byOrder[p.orderId] ||= {})[p.dKey] = p.qty; }
      const billedAt = Date.now();
      await Promise.all(Object.entries(byOrder).map(async ([oid, keyMap]) => {
        const o = await DB.getOrder(oid); if (!o) return;
        const bsNew = {...(o.billedStatus||{})};
        for (const [k, q] of Object.entries(keyMap)) bsNew[k] = {billedQty:q, invoiceId:savedId, billedAt};
        await DB.putOrder({...o, billedStatus: bsNew});
      })).catch(e => console.error('billedStatus write error:', e));
      // ล้างที่ติ๊กไว้ของลูกค้ารายนี้
      if (window._pendBillGid && window._pendSel) delete window._pendSel[window._pendBillGid];
      window._pendBillGid = null;
    }
    closeModal('rcModal');
    if (andPrint){
      const inv=await DB.getInvoice(savedId);
      setTimeout(()=>printReceiptData(inv), 400);
    }
    navigate('invoices');
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

async function showBulkInvoiceModal() {
  const [allOrders, allInvoices] = await Promise.all([DB.getOrders(), DB.getInvoices()]);

    const k = o.customerId || o.customerName;

    custMap.get(k).orders.push(o);

async function bulkCreateInvoices(andPrint = false) {
  const checked = [...document.querySelectorAll('.bulk-inv-chk:checked')].map(c => c.value);
  if (!checked.length) { U.toast('กรุณาเลือกลูกค้าอย่างน้อย 1 คน', 'error'); return; }

  const raw = document.getElementById('bulkInvOrdersJson')?.value;
  if (!raw) return;
  const custList = JSON.parse(raw);
  const selectedList = custList.filter(c => checked.includes(c.id || c.name));

  closeModal('bulkInvModal');
  U.toast(`กำลังสร้าง ${selectedList.length} ใบเสร็จ...`);

  const createdInvs = [];
  for (const c of selectedList) {
    // รวมรายการ (เหมือน pullOrdersToReceipt)
    const merged = {};
    for (const o of c.orders) {
      for (const i of (o.items || [])) {
        const key = i.productName+'|'+i.price+'|'+(i.color||'')+'|'+(i.trimColor||'')+'|'+(i.style||'')+'|'+(i.specialNote||'');
        if (merged[key]) merged[key].qty += i.qty;
        else merged[key] = { name: itemLabel(i), qty: i.qty, price: i.price };
      }
    }
    const items = Object.values(merged);
    if (!items.length) continue;

    const data = {
      type: 'receipt',
      customerId: c.id,
      customerName: c.name,
      customerAddress: '',
      customerPhone: '',
      customerTaxId: '',
      items,
      discount: 0,
      taxRate: 0,
      notes: '',
      invoiceNo: await DB.nextReceiptNo(),
    };
    const savedId = await DB.addInvoice(data);
    const saved = await DB.getInvoice(savedId);
    if (saved) createdInvs.push(saved);
  }

  U.toast(`✓ ออกบิลแล้ว ${createdInvs.length} ใบ`);
  navigate('invoices');

  if (andPrint && createdInvs.length) {
    setTimeout(() => printMultipleReceipts(createdInvs), 600);
  }
}

function _promptpayPayload(rawId, amount) {
  function crc16(s){
    let c=0xFFFF;
    for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);}
    return(c&0xFFFF).toString(16).toUpperCase().padStart(4,'0');
  }
  function f(tag,val){return tag+String(val.length).padStart(2,'0')+val;}
  const id=rawId.replace(/[^0-9]/g,'');
  let ptype,pval;
  if(id.length===10){ptype='01';pval='0066'+id.slice(1);}
  else if(id.length===13){ptype='02';pval=id;}
  else return null;
  const acct=f('00','A000000677010111')+f(ptype,pval);
  let p=f('00','01')+f('01','11')+f('29',acct)+f('52','0000')+f('53','764');
  if(amount>0) p+=f('54',amount.toFixed(2));
  p+=f('58','TH')+f('59','PromptPay')+f('60','Bangkok')+'6304';
  return p+crc16(p);
}

function deleteInvoice(id) {
  U_confirm('ต้องการลบใบเสร็จนี้ใช่ไหม?', async(reason)=>{
    await DB.delInvoice(id, reason);U.toast('ลบใบเสร็จแล้ว');navigate('invoices');
  }, {askReason:true});
}

async function toggleInvPaid(id, paid) {
  const inv=await DB.getInvoice(id); if(!inv)return;
  await DB.putInvoice({...inv, isPaid:paid, paidAt:paid?Date.now():null, paidAmount:null});
  U.toast(paid?'บันทึกชำระแล้ว ✓':'ยกเลิกสถานะชำระแล้ว');
  navigate('invoices');
}

async function exportExcel() {
  U.toast('กำลังเตรียมไฟล์ Excel...');
  if (!(await ensureXLSX())) { U.toast('โหลดตัวสร้าง Excel ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต','error'); return; }
  const [invoices,customers]=await Promise.all([DB.getInvoices(),DB.getCustomers()]);
  invoices.sort((a,b)=>a.createdAt-b.createdAt);
  const invSheet=invoices.map(inv=>{
    const t=U.invTotal(inv);
    return {'เลขที่ใบเสร็จ':inv.invoiceNo||'','ลูกค้า':inv.customerName||'','วันที่':U.date(inv.createdAt),
      'รายการสินค้า':(inv.items||[]).map(i=>i.name+' x'+i.qty).join(', '),
      'ยอดก่อนส่วนลด':t.sub,'ส่วนลด':t.disc,'ยอดสุทธิ':t.total,
      'ชำระแล้ว (บาท)':invPaid(inv),'ยังค้าง (บาท)':Math.max(0,t.total-invPaid(inv)),
      'สถานะ':invPaid(inv)>=t.total&&t.total>0?'ชำระแล้ว':invPaid(inv)>0?'ชำระบางส่วน':'ค้างชำระ','วันที่ชำระ':inv.paidAt?U.date(inv.paidAt):''};
  });
  const outstanding={},outCount={};
  invoices.forEach(i=>{
    const rem=Math.max(0,U.invTotal(i).total-invPaid(i));
    if(rem>0&&i.customerId){outstanding[i.customerId]=(outstanding[i.customerId]||0)+rem;
      outCount[i.customerId]=(outCount[i.customerId]||0)+1;}
  });
  const custSheet=customers.filter(c=>outstanding[c.id]>0)
    .sort((a,b)=>(outstanding[b.id]||0)-(outstanding[a.id]||0))
    .map(c=>({'ชื่อลูกค้า':c.name,'จำนวนบิลค้าง':outCount[c.id]||0,'ยอดค้างชำระ (บาท)':outstanding[c.id]||0}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(invSheet),'ใบเสร็จทั้งหมด');
  if(custSheet.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(custSheet),'ยอดค้างชำระ');
  const d=new Date();
  XLSX.writeFile(wb,'kailoong_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.xlsx');
  U.toast('Export Excel สำเร็จ ✓');
}

function setReportRange(r) {
  window._reportRange = r;

async function renderReports(el) {
  // ── ดึง filter ที่บันทึกไว้ (default: เดือนนี้) ──
  const rng = window._reportRange || 'month';
  const now = new Date();
  function getRangeTs(r) {
    const y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
    if (r==='today')  return new Date(y,m,d).getTime();
    if (r==='week')   return new Date(y,m,d-now.getDay()).getTime();
    if (r==='month')  return new Date(y,m,1).getTime();
    if (r==='year')   return new Date(y,0,1).getTime();
    if (r==='custom') {
      const v=document.getElementById('rpt_from')?.value||window._reportFrom||'';
      return v ? new Date(v).getTime() : 0;
    }
    return 0; // all
  }
  function getRangeEnd(r) {
    if (r==='custom') {
      const v=document.getElementById('rpt_to')?.value||window._reportTo||'';
      return v ? new Date(v).setHours(23,59,59,999) : Date.now();
    }
    return Date.now();
  }
  const rangeStart = getRangeTs(rng);
  const rangeEnd   = getRangeEnd(rng);

  const rangeLabels={today:'วันนี้',week:'สัปดาห์นี้',month:'เดือนนี้',year:'ปีนี้',all:'ทั้งหมด',custom:'กำหนดเอง'};

  const [orders,invoices,customers,expenses]=await Promise.all([DB.getOrders(),DB.getInvoices(),DB.getCustomers(),DB.getExpenses()]);
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();

  // ── วันนี้ (fixed — ไม่เปลี่ยนตาม filter) ──
  const todayOrders=orders.filter(o=>U.isToday(o.createdAt));
  const todayItemsMap={};
  todayOrders.forEach(o=>(o.items||[]).forEach(i=>{
    if(!todayItemsMap[i.productName])todayItemsMap[i.productName]={qty:0,total:0};
    todayItemsMap[i.productName].qty+=i.qty;
    todayItemsMap[i.productName].total+=i.qty*i.price;
  }));
  const todayTotal=todayOrders.reduce((a,o)=>a+U.orderTotal(o),0);

  // ── ช่วงที่เลือก ──
  const rangeInvoices=invoices.filter(i=>i.createdAt>=rangeStart&&i.createdAt<=rangeEnd);
  const rangeOrders=orders.filter(o=>o.createdAt>=rangeStart&&o.createdAt<=rangeEnd);
  const rangeExpenses=expenses.filter(e=>e.date>=rangeStart&&e.date<=rangeEnd);
  const monthIncome=rangeInvoices.reduce((a,i)=>a+U.invTotal(i).total,0);

  // ── 6 เดือน ──
  const months=Array.from({length:6},(_,k)=>{
    const d=new Date(now.getFullYear(),now.getMonth()-5+k,1);
    return {year:d.getFullYear(),month:d.getMonth(),label:d.toLocaleDateString('th-TH-u-ca-buddhist',{month:'short',year:'2-digit'})};
  });
  const monthRevenue=months.map(m=>invoices.filter(r=>{const d=new Date(r.createdAt);return d.getFullYear()===m.year&&d.getMonth()===m.month;}).reduce((a,r)=>a+U.invTotal(r).total,0));
  const monthOrderCt=months.map(m=>orders.filter(o=>{const d=new Date(o.createdAt);return d.getFullYear()===m.year&&d.getMonth()===m.month;}).length);

  // ── สินค้าขายดี (ตามช่วงที่เลือก) ──
  const prodCount={};
  rangeOrders.forEach(o=>(o.items||[]).forEach(i=>{prodCount[i.productName]=(prodCount[i.productName]||0)+i.qty;}));
  const topProds=Object.entries(prodCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const avgOrder=rangeOrders.length?rangeOrders.reduce((a,o)=>a+U.orderTotal(o),0)/rangeOrders.length:0;

  // ── กำไร/ขาดทุน (ตามช่วงที่เลือก) ──
  const monthExpenseTotal = rangeExpenses.reduce((a,e)=>a+(e.amount||0),0);
  const allExpenseTotal   = expenses.reduce((a,e)=>a+(e.amount||0),0);
  const allIncomeTotal    = invoices.reduce((a,i)=>a+U.invTotal(i).total,0);
  const monthProfit       = monthIncome - monthExpenseTotal;
  const allProfit         = allIncomeTotal - allExpenseTotal;

async function renderCraftsmen(el) {
  document.getElementById('topbarActions').innerHTML =
    `<a href="/craft.html" target="_blank" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-up-right-from-square me-1"></i>เปิดหน้าช่าง</a>
     <button class="btn btn-primary btn-sm" onclick="showCraftsmanModal()"><i class="fa-solid fa-plus me-1"></i>เพิ่มช่าง</button>`;

  const [craftsmen, products] = await Promise.all([DB.getCraftsmen(), DB.getProducts()]);
  window._settingsCraftsmen = craftsmen;
  window._settingsProducts  = products;

  // สถิติ craftStatus จาก orders
  const orders = await DB.getOrders();
  const craftedCount = {};
  const totalCount   = {};
  for (const o of orders) {
    if (isOrderFullyDelivered(o)) continue;
    const cs = o.craftStatus || {};
    for (const it of (o.items || [])) {
      const key = craftKey(it);
      totalCount[key] = (totalCount[key] || 0) + it.qty;
      const cqStat = getCraftedFor(cs, it);
      if (cqStat > 0) craftedCount[key] = (craftedCount[key] || 0) + cqStat;
    }
  }

  // สรุป pending per craftsman
  const craftsmanStats = craftsmen.map(c => {
    const myTypes = new Set(c.productTypes || []);
    const allTypes = !c.productTypes?.length;
    let pending = 0, done = 0;
    for (const o of orders) {
      if (isOrderFullyDelivered(o)) continue;
      const cs = o.craftStatus || {};
      for (const it of (o.items || [])) {
        if (!allTypes && !myTypes.has(it.productName)) continue;
        const cqPer = getCraftedFor(cs, it);
        done    += cqPer;
        pending += (it.qty - cqPer);
      }
    }
    return { ...c, pending, done };
  });

  el.innerHTML = `
  <div class="row g-3">

    <!-- สถิติ -->
    <div class="col-12">
      <div class="row g-3">
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="label">จำนวนช่างแต่ง</div>
                <div class="value">${craftsmen.length}</div>
                <div class="sub">คน</div>
              </div>
              <div class="icon-wrap" style="background:#fef3c7;color:#d97706;"><i class="fa-solid fa-hammer"></i></div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="label">รายการค้างแต่ง</div>
                <div class="value" style="color:#dc2626;">${Object.keys(totalCount).reduce((s,k)=>s+(totalCount[k]-(craftedCount[k]||0)),0)}</div>
                <div class="sub">ใบ (ยังไม่เสร็จ)</div>
              </div>
              <div class="icon-wrap" style="background:#fee2e2;color:#dc2626;"><i class="fa-solid fa-clock"></i></div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="label">แต่งเสร็จแล้ว</div>
                <div class="value" style="color:#16a34a;">${Object.values(craftedCount).reduce((s,v)=>s+v,0)}</div>
                <div class="sub">ใบ (รอส่ง)</div>
              </div>
              <div class="icon-wrap" style="background:#dcfce7;color:#16a34a;"><i class="fa-solid fa-check-circle"></i></div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="label">ประเภทหีบ</div>
                <div class="value">${[...new Set(products.map(p=>p.name))].length}</div>
                <div class="sub">ประเภท</div>
              </div>
              <div class="icon-wrap" style="background:#ede9fe;color:#7c3aed;"><i class="fa-solid fa-box"></i></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ตารางช่าง -->
    <div class="col-12">
      <div class="card-box">
        <div class="card-head">
          <h2><i class="fa-solid fa-hammer me-2 text-warning"></i>รายชื่อช่างแต่ง</h2>
        </div>
        <div id="craftsmanPageList">
          ${craftsmen.length === 0
            ? `<div class="empty-state"><i class="fa-solid fa-hammer"></i><p>ยังไม่มีช่างแต่ง กด "เพิ่มช่าง" เพื่อเริ่มต้น</p></div>`
            : `<div class="table-scroll"><table class="table-clean">
                <thead><tr>
                  <th>ชื่อช่าง</th>
                  <th>ประเภทหีบที่รับผิดชอบ</th>
                  <th style="text-align:center;">ค้างแต่ง</th>
                  <th style="text-align:center;">เสร็จแล้ว</th>
                  <th></th>
                </tr></thead>
                <tbody>
                  ${craftsmanStats.map(c => {
                    const types = (c.productTypes||[]).length
                      ? (c.productTypes||[]).map(t=>`<span style="background:#eff6ff;color:#1e40af;font-size:12.5px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-block;margin:1px 2px;">${U.esc(t)}</span>`).join('')
                      : `<span style="color:#6b7280;font-size:13px;">ทุกประเภท</span>`;
                    const pendingStyle = c.pending > 0 ? 'color:#dc2626;font-weight:700;' : 'color:#6b7280;';
                    const doneStyle = c.done > 0 ? 'color:#16a34a;font-weight:700;' : 'color:#6b7280;';
                    return `<tr>
                      <td><strong>${U.esc(c.name)}</strong></td>
                      <td>${types}</td>
                      <td style="text-align:center;${pendingStyle}">${c.pending > 0 ? c.pending+' ใบ' : '—'}</td>
                      <td style="text-align:center;${doneStyle}">${c.done > 0 ? c.done+' ใบ' : '—'}</td>
                      <td>
                        <div class="d-flex gap-1">
                          <button class="btn btn-sm btn-outline-primary btn-icon" onclick="showCraftsmanModal('${c.id}')" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
                          <button class="btn btn-sm btn-outline-danger btn-icon" onclick="deleteCraftsman('${c.id}')" title="ลบ"><i class="fa-solid fa-trash"></i></button>
                        </div>
                      </td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table></div>`
          }
        </div>
      </div>
    </div>

    <!-- คำแนะนำ -->
    <div class="col-12">
      <div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:16px 20px;">
        <div style="font-size:14px;font-weight:600;color:#0369a1;margin-bottom:8px;"><i class="fa-solid fa-circle-info me-2"></i>วิธีใช้งาน</div>
        <ul style="margin:0;padding-left:18px;font-size:13px;color:#374151;line-height:1.9;">
          <li>เพิ่มรายชื่อช่างแต่งพร้อมระบุประเภทหีบที่รับผิดชอบ</li>
          <li>ช่างเปิดหน้า <a href="/craft.html" target="_blank" style="color:#2563eb;font-weight:600;">craft.html</a> → เลือกชื่อตัวเอง → จะเห็นเฉพาะรายการที่ตัวเองรับผิดชอบ</li>
          <li>ช่างกดติ๊กเสร็จแล้ว ระบบจะแสดงสถานะ "✅ แต่งเสร็จแล้ว" ในหน้ารายการรอส่ง</li>
          <li>ถ้าไม่ระบุประเภทหีบ ช่างคนนั้นจะเห็นทุกรายการ</li>
        </ul>
      </div>
    </div>

  </div>`;
}

    <label style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;border:1.5px solid ${selectedTypes.has(name)?'#2563eb':'#e5e7eb'};background:${selectedTypes.has(name)?'#eff6ff':'#fff'};margin-bottom:4px;transition:all .15s;" id="cm_lbl_${btoa(encodeURIComponent(name)).slice(0,8)}">

      <input type="text" class="form-control" id="cm_name" value="${U.esc(c?.name||'')}" placeholder="เช่น ช่างสมชาย">

    `<button class="btn btn-primary" onclick="saveCraftsman()"><i class="fa-solid fa-floppy-disk me-1"></i>บันทึก</button>

async function saveCraftsman() {
  if (window._saving) return; window._saving = true;
  try {
    const name = document.getElementById('cm_name')?.value.trim();
    if (!name) { U.toast('กรุณากรอกชื่อช่าง','error'); return; }
    const productTypes = [...document.querySelectorAll('.cm-type-cb:checked')].map(cb => cb.value);
    const id = document.getElementById('cm_id')?.value||'';
    const data = { name, productTypes };
    if (id) { const old=await DB.getCraftsman(id); await DB.putCraftsman({...old,...data}); U.toast('แก้ไขข้อมูลช่างแล้ว ✓'); }
    else { await DB.addCraftsman(data); U.toast('เพิ่มช่างแล้ว ✓'); }
    closeModal('craftsmanModal');
    navigate(window._craftsmanReturnPage || 'craftsmen');
  } catch(e) { U.toast('เกิดข้อผิดพลาด: '+e.message,'error'); }
  finally { window._saving = false; }
}

// ── BACKUP ──
// ดึงข้อมูลทั้งระบบมาเป็นก้อนเดียว — แยกออกมาเพื่อให้ "สำรองก่อนกู้คืน" เรียกใช้ซ้ำได้
async function buildBackupPayload() {
  const [customers, products, orders, invoices, expenses, craftsmen] = await Promise.all([
    DB.getCustomers(), DB.getProducts(), DB.getOrders(), DB.getInvoices(), DB.getExpenses(),
    DB.getCraftsmen()
  ]);
  // settings เก็บเป็น doc เดี่ยว ไม่ได้ผ่าน DB shortcut
  const setSnap = await DB._fs.collection('settings').get();
  const settings = setSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  return {
    version: 3,
    exportedAt: Date.now(),
    exportedBy: CFG.businessName,
    data: { customers, products, orders, invoices, expenses, craftsmen, settings }
  };
}

// เซฟก้อนข้อมูลลงเครื่องเป็นไฟล์ คืนชื่อไฟล์ที่เซฟ
function saveBackupFile(backup, prefix) {
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const now  = new Date();
  const pad  = n => String(n).padStart(2,'0');
  const fname= `${prefix}_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.json`;
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return fname;
}

async function backupData() {
  try {
    const backup = await buildBackupPayload();
    const fname  = saveBackupFile(backup, 'backup');
    await DB.setSetting('lastBackup', Date.now());
    U.toast(`✅ สำรองข้อมูลแล้ว — ${fname}`);
    setTimeout(() => navigate('settings'), 800);
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: ' + e.message, 'error');
  }
}

async function confirmRestore() {
  const data = window._pendingRestore;
  if (!data) { U.toast('ไม่พบข้อมูลสำหรับกู้คืน', 'error'); return; }

  // ประกาศนอก try เพราะ catch ด้านล่างต้องใช้บอกชื่อไฟล์กู้กลับ
  let safetyFile = '';
  try {
    closeModal('restoreConfirmModal');

    // ── สำรองของเดิมก่อนเสมอ ──
    // การกู้คืนคือการ "ลบทิ้งทั้งหมดแล้วเขียนใหม่" ถ้าเลือกไฟล์ผิด
    // หรือขาดเน็ตกลางคัน ข้อมูลเดิมจะหายโดยไม่มีทางถอย
    // จึงบังคับเซฟของเดิมลงเครื่องก่อน และถ้าเซฟไม่สำเร็จ = ไม่กู้คืนต่อ
    U.toast('กำลังสำรองข้อมูลเดิมก่อน...');
    try {
      const pre = await buildBackupPayload();
      safetyFile = saveBackupFile(pre, 'ก่อนกู้คืน');
    } catch (preErr) {
      U.toast('สำรองข้อมูลเดิมไม่สำเร็จ — ยกเลิกการกู้คืนเพื่อความปลอดภัย', 'error');
      console.error('pre-restore backup failed:', preErr);
      return;
    }

    U.toast('กำลังกู้คืนข้อมูล...');

    // ── กู้คืนแบบไม่ลบอะไรเลย ──
    // เดิม: ลบทั้ง collection ทิ้ง แล้วค่อยเขียนกลับทีละรายการ
    //       ถ้าพลาดกลางทาง = ลบไปแล้วแต่เขียนไม่ครบ ข้อมูลหายจริง
    // ใหม่: เขียนทับตรง ๆ ส่วนรายการที่ไม่มีในไฟล์ให้ทำเครื่องหมายว่าลบ
    //       ข้อมูลเดิมไม่เคยหายไปไหน ยังกดกู้จากถังขยะได้
    //       และไม่ต้องใช้การลบจริง จึงเข้ากับกฎ "ห้ามลบจริง" ใน Firestore
    const stores = ['customers','products','orders','invoices','expenses'];
    if (Array.isArray(data.craftsmen)) stores.push('craftsmen');

    for (const store of stores) {
      const incoming = data[store] || [];
      const incomingIds = new Set(incoming.map(x => String(x.id)));

      // 1) เขียนทับทุกรายการที่มีในไฟล์
      for (const rec of incoming) {
        const { id, ...rest } = rec;
        if (!id) continue;
        // เขียนทับทั้งเอกสาร และล้างเครื่องหมายลบออก (ของในไฟล์ถือว่ายังใช้อยู่)
        await DB._fs.collection(store).doc(String(id))
          .set({ ...rest, isDeleted: rest.isDeleted === true }, { merge: false });
      }

      // 2) รายการที่มีอยู่ในระบบแต่ไม่มีในไฟล์ → ทำเครื่องหมายว่าลบ ไม่ได้ลบจริง
      const current = await DB._all(store);
      for (const old of current) {
        if (incomingIds.has(String(old.id))) continue;
        if (old.isDeleted === true) continue;          // ทำเครื่องหมายไว้อยู่แล้ว
        await DB._del(store, old.id, 'ไม่มีในไฟล์ที่กู้คืน');
      }
    }
    DB._cache = {};   // ข้อมูลเปลี่ยนยกชุด ล้าง cache ให้อ่านใหม่
    // ตั้งค่าร้าน (ชื่อร้าน ที่อยู่ PromptPay ฯลฯ)
    for (const st of (data.settings||[])) {
      const { id, ...rest } = st;
      if (id) await DB._fs.collection('settings').doc(String(id)).set(rest, { merge: true });
    }
    // ตัวนับเลขออเดอร์: ตั้งใหม่ให้ตรงกับข้อมูลที่กู้คืน กันเลขซ้ำ
    try {
      const yr = new Date().getFullYear() + 543;
      const maxOf = (arr, field, prefix) => {
        const nums = (arr||[]).map(x => x[field]).filter(n => typeof n === 'string' && n.startsWith(prefix))
          .map(n => parseInt(n.slice(prefix.length)) || 0);
        return nums.length ? Math.max(...nums) : 0;
      };
      await DB._fs.collection('counters').doc(`orders-${yr}`)
        .set({ seq: maxOf(data.orders, 'orderNo', `ORD-${yr}-`), updatedAt: Date.now() }, { merge: true });
      await DB._fs.collection('counters').doc(`invoices-${yr}`)
        .set({ seq: maxOf(data.invoices, 'invoiceNo', `RC-${yr}-`), updatedAt: Date.now() }, { merge: true });
    } catch(e) { console.error('reset counters:', e); }

    // ⚠️ เดิมตรงนี้เขียน lastBackup = ตอนนี้ ซึ่งผิด
    // การกู้คืนไม่ใช่การสำรอง ถ้าบันทึกแบบนั้นแถบเตือนจะนึกว่าเพิ่งสำรองไป
    // แล้วเงียบไปอีก 7 วัน ทั้งที่ยังไม่มีไฟล์สำรองของข้อมูลชุดใหม่เลย
    await DB.setSetting('lastRestore', Date.now());
    window._pendingRestore = null;

    // ── ตรวจนับว่าเข้าครบไหม ──
    // เขียนทีละรายการหลายร้อยครั้ง ถ้าพลาดกลางทางบางรายการจะหายเงียบ ๆ
    DB._cache = {};   // ล้าง cache ให้ไปนับของจริงจากเซิร์ฟเวอร์
    // นับเฉพาะรายการที่ "ใช้งานอยู่" ทั้งสองฝั่ง
    // (ไฟล์สำรองเก็บของที่อยู่ในถังขยะมาด้วย และฐานข้อมูลก็ยังมีของที่ทำเครื่องหมายลบ
    //  ถ้านับดิบ ๆ ทั้งสองฝั่งจะไม่มีทางตรงกัน)
    const liveCount = arr => (arr||[]).filter(x => x.isDeleted !== true).length;
    const expect = {
      customers: liveCount(data.customers), products: liveCount(data.products),
      orders:    liveCount(data.orders),    invoices: liveCount(data.invoices),
      expenses:  liveCount(data.expenses)
    };
    if (Array.isArray(data.craftsmen)) expect.craftsmen = liveCount(data.craftsmen);
    const missing = [];
    for (const [col, want] of Object.entries(expect)) {
      try {
        const snap = await DB._fs.collection(col).get();
        const got = snap.docs.filter(d => d.data().isDeleted !== true).length;
        if (got !== want) missing.push(`${THAI_COL[col]||col} ${got}/${want}`);
      } catch(e) { missing.push(`${THAI_COL[col]||col} ตรวจไม่ได้`); }
    }

    if (missing.length) {
      U.toast('⚠️ กู้คืนแล้วแต่จำนวนไม่ตรง: ' + missing.join(', ') + ' — ไฟล์สำรองของเดิมคือ ' + safetyFile, 'error');
    } else {
      U.toast('✅ กู้คืนข้อมูลสำเร็จ ตรวจนับครบทุกรายการแล้ว');
    }
    setTimeout(() => navigate('dashboard'), 1200);
  } catch(err) {
    U.toast('เกิดข้อผิดพลาดระหว่างกู้คืน: ' + err.message
      + (safetyFile ? ' — กู้กลับได้จากไฟล์ ' + safetyFile : ''), 'error');
  }
}

  invoices:'ใบเสร็จ', expenses:'รายจ่าย', craftsmen:'ช่างแต่ง' };

const TRASH_COLS = ['orders','invoices','customers','products','expenses','craftsmen'];
// ป้ายชื่อแต่ละรายการ ให้คนอ่านรู้ว่าลบอะไรไป
function trashLabel(col, r) {
  if (col === 'orders')    return `${r.orderNo || 'ออเดอร์'} · ${r.customerName || '-'}`;
  if (col === 'invoices')  return `${r.invoiceNo || 'ใบเสร็จ'} · ${r.customerName || '-'}`;
  if (col === 'customers') return r.name || '(ไม่มีชื่อ)';
  if (col === 'products')  return r.name || '(ไม่มีชื่อ)';
  if (col === 'craftsmen') return r.name || '(ไม่มีชื่อ)';
  if (col === 'expenses')  return `${r.category || 'รายจ่าย'} · ${U.money(r.amount||0)} บาท`;
  return r.id;
}

// ตั้งเวลาปิดแจ้งเตือน — hours เป็นตัวเลขชั่วโมง, 'forever' = จนกว่าจะกดเปิดเอง, 0 = เปิดเลย
async function setMute(hours) {
  try {
    const ts = hours === 'forever' ? MUTE_FOREVER
             : hours ? Date.now() + hours * 3600000
             : 0;
    await setMuteUntil(ts);
    U.toast(ts ? `ปิดแจ้งเตือน LINE แล้ว ${hours === 'forever' ? '(จนกว่าจะเปิดเอง)' : `${hours} ชั่วโมง`}`
                : 'เปิดแจ้งเตือน LINE แล้ว ✓');
    navigate('settings');
  } catch(e) { U.toast('ตั้งค่าไม่สำเร็จ: ' + e.message, 'error'); }
}

      — และไม่ถูกนับในรายงานหรือยอดเงินใดๆ
    </div>
    ${total ? blocks : `<div class="empty-state" style="padding:40px"><i class="fa-solid fa-trash-can"></i><p>ถังขยะว่าง</p></div>`}`;

async function restoreTrashItem(btn) {
  const col = btn.dataset.col, id = btn.dataset.id;
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  try {
    await DB._undel(col, id);
    U.toast(`กู้คืน${THAI_COL[col]}แล้ว ✓`);
    navigate('trash');
  } catch(e) {
    U.toast('กู้คืนไม่สำเร็จ: ' + e.message, 'error');
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-rotate-left me-1"></i>กู้คืน';
  }
}

async function showExpenseModal(id) {
  const CATS = ['วัตถุดิบ','ค่าแรง','ค่าไฟ/น้ำ','ค่าเช่า','ขนส่ง','ซ่อมแซม','อื่นๆ'];
  const exp = id ? await DB.getExpense(id) : null;
  const today = todayLocal();

  const body = `
    <div class="row g-3">
      <div class="col-sm-6">
        <label class="form-label">วันที่ <span class="text-danger">*</span></label>
        <input type="date" class="form-control" id="exp_date" value="${exp ? new Date(exp.date).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'}) : today}">
      </div>
      <div class="col-sm-6">
        <label class="form-label">หมวดหมู่</label>
        <select class="form-select" id="exp_cat">
          ${CATS.map(c=>`<option value="${c}" ${exp?.category===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">รายละเอียด</label>
        <input type="text" class="form-control" id="exp_note" placeholder="เช่น ซื้อไม้สัก 100 แผ่น" value="${U.esc(exp?.note||'')}">
      </div>
      <div class="col-12">
        <label class="form-label">จำนวนเงิน (บาท) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" id="exp_amount" placeholder="0" min="0" step="1" value="${exp?.amount||''}">
      </div>
    </div>`;

  window._editExpenseId = id || null;
  showModal('expenseModal', id ? 'แก้ไขรายจ่าย' : 'เพิ่มรายจ่าย', body,
    `<button class="btn btn-danger" onclick="saveExpense()"><i class="fa-solid fa-save me-1"></i>บันทึก</button>
     <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>`);
  setTimeout(()=>document.getElementById('exp_amount')?.focus(),300);
}

async function saveExpense() {
  if (window._saving){return;} window._saving=true;
  // กันเหนียว: ถ้ามีอะไรค้างจนโค้ดข้างล่างไม่จบ ปลดล็อกให้กดใหม่ได้
  clearTimeout(window._savingWatchdog);
  window._savingWatchdog = setTimeout(() => { window._saving = false; }, 45000);
  try {
    const dateVal   = document.getElementById('exp_date')?.value;
    const amountStr = document.getElementById('exp_amount')?.value;
    const amount    = parseFloat(amountStr);
    if (!dateVal)                              { U.toast('กรุณาเลือกวันที่','error'); return; }
    if (!amountStr||amount<=0||isNaN(amount))  { U.toast('กรุณากรอกจำนวนเงินที่ถูกต้อง','error'); return; }

    const data = {
      date:     new Date(dateVal).getTime(),
      category: document.getElementById('exp_cat')?.value  || 'อื่นๆ',
      note:     document.getElementById('exp_note')?.value.trim() || '',
      amount
    };

    if (window._editExpenseId) {
      await DB.putExpense({ ...data, id: window._editExpenseId });
      U.toast('แก้ไขรายจ่ายแล้ว ✓');
    } else {
      await DB.addExpense(data);
      U.toast('เพิ่มรายจ่ายแล้ว ✓');
    }
    closeModal('expenseModal');
    navigate('expenses');
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

function deleteExpense(id) {
  U_confirm('ต้องการลบรายจ่ายนี้ใช่ไหม?', async(reason)=>{
    await DB.delExpense(id, reason);
    U.toast('ลบรายจ่ายแล้ว');
    navigate('expenses');
  }, {askReason:true});
}

// ═══════════════════════════════════════
//  SERVICE WORKER + สถานะออฟไลน์
// ═══════════════════════════════════════
// sw.js เก็บไฟล์แอพ (HTML/ไอคอน) ไว้ในเครื่อง → เปิดครั้งต่อไปเร็วขึ้นมาก
// ข้อมูลจาก Firestore ไม่ถูกเก็บที่นี่ (sw.js ปล่อยผ่าน) → ยังสดเสมอ
function klRegisterSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;   // เปิดไฟล์ตรงๆ ใช้ไม่ได้
  // ครั้งแรกที่ติดตั้ง controller จะเปลี่ยนเองโดยไม่ใช่การอัปเดต — ห้ามรีโหลด
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('/sw.js').then(reg => {
    // มีเวอร์ชันใหม่รออยู่ตั้งแต่เปิดหน้า
    if (reg.waiting && navigator.serviceWorker.controller) klShowUpdateBar(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        // controller มีค่า = เคยติดตั้งแล้ว แปลว่านี่คือ "อัปเดต" ไม่ใช่ครั้งแรก
        if (nw.state === 'installed' && navigator.serviceWorker.controller) klShowUpdateBar(nw);
      });
    });
  }).catch(e => console.warn('sw register failed', e));

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    klReloadOnce();
  });
}
let _klReloading = false;
function klReloadOnce() {
  if (_klReloading) return;
  _klReloading = true;
  location.reload();
}

function klShowUpdateBar(worker) {
  if (document.getElementById('klUpdateBar')) return;
  const d = document.createElement('div');
  d.id = 'klUpdateBar';
  d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:3000;background:#1a2332;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:15px;';
  d.innerHTML = `<i class="fa-solid fa-arrows-rotate" style="color:#60a5fa"></i>
    <span style="flex:1">มีเวอร์ชันใหม่พร้อมใช้</span>
    <button id="klUpdNow" style="border:0;background:#3b82f6;color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;">อัปเดต</button>
    <button id="klUpdLater" style="border:0;background:transparent;color:#9aa8bd;font-size:15px;padding:8px;">ภายหลัง</button>`;
  document.body.appendChild(d);
  d.querySelector('#klUpdNow').onclick = () => {
    d.remove();
    worker.postMessage({ type: 'SKIP_WAITING' });   // เสร็จแล้ว controllerchange จะรีโหลดเอง
    setTimeout(klReloadOnce, 1500);                 // เผื่อ controllerchange ไม่ยิง
  };
  d.querySelector('#klUpdLater').onclick = () => d.remove();
}

// ── ป้ายบอกว่าออฟไลน์ ──
function klOfflineBadge(show) {
  let b = document.getElementById('klOffBadge');
  if (!show) { b?.remove(); return; }
  if (b) return;
  b = document.createElement('div');
  b.id = 'klOffBadge';
  b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:3000;background:#b45309;color:#fff;border-radius:20px;padding:7px 16px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);';
  b.innerHTML = '<i class="fa-solid fa-wifi" style="opacity:.7"></i> ออฟไลน์ — ข้อมูลอาจไม่ล่าสุด';
  document.body.appendChild(b);
}
window.addEventListener('online',  () => { klOfflineBadge(false); U.toast?.('กลับมาออนไลน์แล้ว','success'); });
window.addEventListener('offline', () => klOfflineBadge(true));
if (!navigator.onLine) klOfflineBadge(true);

klRegisterSW();
</script>
