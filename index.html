async function onOrderCustChange(sel) {
  window._orderCustId = sel.value || null;
  // เปลี่ยนลูกค้า → เติมราคาใหม่ตามราคาเฉพาะลูกค้ารายนั้น
  await ocRefreshPrice();
  const cart = window._ordCart || [];
  for (const x of cart) {
    const prod = (window._orderProds||[]).find(p => p.id === x.productId);
    if (!prod) continue;
    let base = prod.price || 0;
    if (prod.priceMap && Object.keys(prod.priceMap).length) {
      base = (x.trimColor && prod.priceMap[x.trimColor] != null)
        ? prod.priceMap[x.trimColor]
        : (prod.priceMap[Object.keys(prod.priceMap)[0]] || 0);
    }
    if (window._orderCustId) {
      try { base = await DB.getEffectivePrice(window._orderCustId, prod.id, base, x.trimColor||''); } catch(e){}
    }
    x.price = base;
  }
  renderOrdCart();
  paintOcSteps();
  checkExistingOrderToday();
}

// ── ช่วงเวลาที่ช่างยังแก้ออเดอร์ที่ตัวเองรับได้ (ต้องตรงกับ craft.html) ──
const EDIT_WINDOW_MS = 30 * 60 * 1000;

// ── หาใบของลูกค้ารายนี้ "ในวันเดียวกัน" ที่ยังเพิ่มของเข้าไปได้อย่างปลอดภัย ──
//
// เดิมระบบถามผู้ใช้ว่า "จะเพิ่มเข้าใบเดิม หรือเปิดใบใหม่?" ซึ่งเป็นคำถามที่
// ตอบยังไงปลายทางก็เหมือนกัน (หน้าแรกกับหน้าช่างจัดกลุ่มตามลูกค้าอยู่แล้ว)
// แต่ไปขวางคนกรอกกลางคัน → ตัดคำถามทิ้ง ให้ระบบตัดสินเองตามกฎข้างล่าง
//
// เพิ่มเข้าใบเดิมได้ ก็ต่อเมื่อใบนั้น "ยังแตะได้" ครบทุกข้อ:
//   1. วันเดียวกับวันที่กรอกในฟอร์ม (ไม่ใช่ "วันนี้" — เผื่อกรอกย้อนหลัง)
//   2. ยังส่งไม่ครบ — ถ้าส่งไปแล้วการไปเพิ่มของทำให้ยอดที่ปิดไปแล้วเพี้ยน
//   3. ยังไม่ออกบิลสักชิ้น — บิลที่ออกไปแล้วจะไม่ตรงกับใบ
//   4. ไม่ใช่ใบที่ช่างเพิ่งรับและยังแก้ได้อยู่ — ถ้าช่างกดแก้ทีหลัง
//      มันเขียนทับรายการทั้งชุด ของที่เราเพิ่งเพิ่มเข้าไปจะหาย
// ไม่เข้าข้อไหนสักข้อ = เปิดใบใหม่ (ปลอดภัยเสมอ)
async function findMergeableOrder(custId, atTs) {
  try {
    if (!custId) return null;
    const d = new Date(atTs || Date.now()); d.setHours(0,0,0,0);
    const from = d.getTime(), to = from + 86400000;
    const now = Date.now();
    const list = (await DB.getOrders()).filter(o =>
      String(o.customerId) === String(custId) &&
      o.createdAt >= from && o.createdAt < to &&
      !isOrderFullyDelivered(o) &&
      !Object.keys(o.billedStatus || {}).length &&
      !(o.createdByCraftsmanId && (now - (o.takenAt || o.createdAt || 0)) < EDIT_WINDOW_MS)
    );
    return list.sort((a,b) => b.createdAt - a.createdAt)[0] || null;
  } catch(e) { console.warn('findMergeableOrder:', e); return null; }
}

// ── บอกให้รู้เฉย ๆ ว่าของจะไปรวมกับใบเดิม ไม่ใช่คำถาม ไม่ต้องตอบ ──
// ขึ้นตอนเลือกลูกค้าเสร็จ แล้วหายไปเอง คนกรอกไม่ต้องตัดสินใจอะไร
async function checkExistingOrderToday() {
  try {
    const custId = window._orderCustId;
    if (!custId) return;
    if (document.getElementById('of_editId')?.value) return;      // กำลังแก้ใบเดิม
    if ((window._ordCart || []).length) return;                   // ใส่ของไปแล้ว
    const dateStr = document.getElementById('of_date')?.value;
    const atTs = dateStr ? new Date(dateStr + 'T12:00:00+07:00').getTime() : Date.now();
    const o = await findMergeableOrder(custId, atTs);
    if (!o) return;
    U.toast(`${o.customerName||'ลูกค้ารายนี้'} มีใบวันนี้อยู่แล้ว — ของที่เพิ่มจะรวมเข้าใบ ${o.orderNo||''}`);
  } catch(e) { console.warn('checkExistingOrderToday:', e); }
}

function calcOrderTotal() {
  const cart = window._ordCart || [];
  const sub = cart.reduce((a,x) => a + (x.qty||0) * (x.price||0), 0);
  const disc = parseFloat(document.getElementById('of_discount')?.value||0) || 0;
  // แถบยอดในฟอร์มรับออเดอร์ใช้แบบไม่มี .00 (ใบเสร็จ/รายงานยังใช้ money() เหมือนเดิม)
  const s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=U.baht(v)+' บาท';};
  s('os_sub',sub); s('os_disc',disc); s('os_total',Math.max(0, sub-disc));
}

// คืน array [{customerName, items:[{name,qty,color,trimColor,action}]}] ของออเดอร์วันนี้
// options:
//   currentOrderId — ID ของออเดอร์ที่เพิ่ง new/edit
//   actionType     — 'new' | 'edit'
//   actionItemKeys — array ของ "name|color|trimColor" ที่ต้องการ tag (สำหรับ edit)
//                    ถ้าไม่ส่ง (new order) → tag ทุก item ในออเดอร์นั้น
async function getTodayOrdersSummary({ currentOrderId, actionType, actionItemKeys } = {}) {
  const all = await DB.getOrders();
  const keySet = actionItemKeys ? new Set(actionItemKeys) : null;
  return all
    .filter(o => !isOrderFullyDelivered(o))
    .map(o => {
      const isCurrent = currentOrderId && String(o.id) === String(currentOrderId);
      const ds = o.deliveryStatus || {};
      return {
        customerName: o.customerName,
        items: (o.items||[]).map(it => {
          // แสดงเฉพาะจำนวนคงเหลือ (หักที่จัดส่งไปแล้ว)
          const remain = it.qty - getDeliveredQty(ds[deliverKey(it)], it.qty, o.isDelivered);
          if (remain <= 0) return null;
          let action = '';
          if (isCurrent) {
            if (actionType === 'new') {
              action = 'new'; // ทุก item ในออเดอร์ใหม่
            } else if (actionType === 'edit' && keySet) {
              const k = `${it.productName}|${it.color||''}|${it.trimColor||''}`;
              if (keySet.has(k)) action = 'edit';
            }
          }
          return { name: it.productName, qty: remain, color: it.color||'', trimColor: it.trimColor||'', action };
        }).filter(Boolean)
      };
    })
    .filter(o => o.items.length > 0);
}

// กดบันทึก → เปิดหน้าตรวจสอบก่อน ยังไม่เขียนลงฐานข้อมูล
function saveOrder() {
  const custId = document.getElementById('of_cust')?.value || '';
  if (!custId) { U.toast('กรุณาเลือกลูกค้า','error'); return; }
  const items = (window._ordCart||[]).filter(x => x.productId && x.qty >= 1);
  if (!items.length) { U.toast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ','error'); return; }
  showOrderConfirm();
}

// บันทึกจริง — เรียกจากปุ่ม "ยืนยันบันทึก" ในหน้าตรวจสอบเท่านั้น
async function doSaveOrder() {
  if (window._saving){return;} window._saving=true;
  // กันเหนียว: ถ้ามีอะไรค้างจนโค้ดข้างล่างไม่จบ ปลดล็อกให้กดใหม่ได้
  clearTimeout(window._savingWatchdog);
  window._savingWatchdog = setTimeout(() => { window._saving = false; }, 45000);
  try {
    const custId=document.getElementById('of_cust')?.value||'';
    if (!custId){U.toast('กรุณาเลือกลูกค้า','error');return;}
    const cust=await DB.getCustomer(custId);

    // อ่านจากตะกร้าใน memory (ไม่ขูดจาก DOM แล้ว)
    const items = (window._ordCart||[])
      .filter(x => x.productId && x.qty >= 1)
      .map(x => ({productId:x.productId, productName:x.productName, qty:x.qty, price:x.price||0,
                  color:x.color||'', trimColor:x.trimColor||'', extra:x.extra||'',
                  specialNote:(x.specialNote||'').trim()}));
    if (!items.length){U.toast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ','error');return;}

    const editId=document.getElementById('of_editId')?.value||'';
    const dateStr=document.getElementById('of_date')?.value;
    // Bangkok timezone: ประกอบ timestamp จาก date picker + เวลา Bangkok ปัจจุบัน
    const createdAt=dateStr
      ?new Date(dateStr+'T'+new Date().toLocaleTimeString('sv-SE',{timeZone:'Asia/Bangkok'}).slice(0,5)+':00+07:00').getTime()
      :Date.now();

    const data={
      customerId:custId, customerName:cust?.name||'',
      items,
      discount:parseFloat(document.getElementById('of_discount')?.value||0),
      notes:document.getElementById('of_notes')?.value.trim()||'',
      createdAt,
    };
    let savedOrderNo = '';
    let mergedInto = '';          // มีค่าเมื่อของถูกรวมเข้าใบเดิมของวันเดียวกัน
    if (editId) {
      const old=await DB.getOrder(editId);
      savedOrderNo = old?.orderNo || '';
      // แก้รายการในออเดอร์ที่ส่งครบแล้ว → ตรึงของเดิมไว้ก่อน แล้วคิดธงส่งครบใหม่
      // ถ้าออเดอร์ยังส่งไม่ครบ ฟังก์ชันนี้คืนค่าเดิมทันที ไม่แตะอะไรเลย
      await DB.putOrder(freezeDeliveryBeforeEdit({...old,...data,id:editId}, old?.items||[]));
      U.toast('แก้ไขออเดอร์แล้ว ✓');
      // แจ้งเตือน LINE กลุ่ม — แก้ไขออเดอร์ (เฉพาะรายการที่เปลี่ยน)
      const oldItemMap = {};
      (old.items||[]).forEach(it => { oldItemMap[it.productId] = it; });
      const newItemMap = {};
      (data.items||[]).forEach(it => { newItemMap[it.productId] = it; });
      const changedItems = [];
      // เพิ่มใหม่ หรือ แก้ไข
      for (const it of data.items) {
        const prev = oldItemMap[it.productId];
        if (!prev) {
          changedItems.push({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'', changeType: 'added' });
        } else if (it.qty !== prev.qty || (it.color||'') !== (prev.color||'') || (it.trimColor||'') !== (prev.trimColor||'') || (it.extra||'') !== (prev.extra||'')) {
          changedItems.push({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'', changeType: 'modified' });
        }
      }
      // ลบออก
      for (const it of (old.items||[])) {
        if (!newItemMap[it.productId]) {
          changedItems.push({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'', changeType: 'removed' });
        }
      }
      const custChanged = data.customerName !== (old.customerName || '');
      if (changedItems.length > 0 || custChanged) {
        // ถ้าชื่อลูกค้าเปลี่ยนแต่ไม่มีรายการเปลี่ยน ให้แสดงว่าแก้ไขชื่อ
        const notifyItems = changedItems.length > 0 ? changedItems
          : [{ name: `(เปลี่ยนชื่อจาก "${old.customerName}" → "${data.customerName}")`, qty: 0, color: '', trimColor: '', changeType: 'modified' }];
        const actionItemKeys = notifyItems.map(it => `${it.name}|${it.color||''}|${it.trimColor||''}`);
        const todayEdit = await getTodayOrdersSummary({ currentOrderId: editId, actionType: 'edit', actionItemKeys });
        sendLineNotify({
          type: 'edit',
          customerName: data.customerName,
          items: notifyItems,
          createdAt: data.createdAt,
          todayOrders: todayEdit
        });
      }
    } else {
      // ── ลูกค้ารายนี้มีใบของวันเดียวกันที่ยังแตะได้ไหม ──
      // มี → รวมเข้าใบเดิมเงียบ ๆ / ไม่มี → เปิดใบใหม่ ทั้งคู่ไม่ต้องถามผู้ใช้
      // ต้องเช็คก่อนเรียก nextOrderNo() ไม่งั้นจะเผาเลขออเดอร์ทิ้งฟรี ๆ
      const mergeTarget = await findMergeableOrder(custId, data.createdAt);

      if (mergeTarget) {
        const origItems = (mergeTarget.items || []).map(i => ({...i}));
        // ของที่เหมือนกันเป๊ะ (สินค้า+สี+เส้น+ขนาด) ให้บวกจำนวนเข้าบรรทัดเดิม
        // ไม่ใช่ต่อท้ายเป็นบรรทัดใหม่ — ใบจะได้ไม่ยาวรุงรัง และตรงกับพฤติกรรม
        // ของปุ่ม "เพิ่มรายการเข้าออเดอร์" ที่มีอยู่เดิม
        const combined = origItems.map(i => ({...i}));
        items.forEach(n => {
          const j = combined.findIndex(x =>
            String(x.productId) === String(n.productId) &&
            (x.color||'')     === (n.color||'') &&
            (x.trimColor||'') === (n.trimColor||'') &&
            (x.extra||'')     === (n.extra||''));
          if (j >= 0) {
            combined[j].qty = (Number(combined[j].qty)||0) + (Number(n.qty)||0);
            if (n.specialNote) combined[j].specialNote =
              (combined[j].specialNote ? combined[j].specialNote + ' | ' : '') + n.specialNote;
          } else combined.push({...n});
        });
        const merged = { ...mergeTarget, items: combined };
        // ส่วนลดของสองใบบวกกัน — ยอดรวมที่ลูกค้าต้องจ่ายจึงยังถูกต้อง
        merged.discount = (Number(mergeTarget.discount) || 0) + (Number(data.discount) || 0);
        if (data.notes) merged.notes = (merged.notes ? merged.notes + ' | ' : '') + data.notes;
        // ใบที่ยังส่งไม่ครบ freeze จะคืนค่าเดิมทันที แต่เรียกไว้กันเหนียว
        // เผื่อวันหลังกฎการรวมเปลี่ยนไปรับใบที่ส่งครบแล้วด้วย
        await DB.putOrder(freezeDeliveryBeforeEdit(merged, origItems));
        savedOrderNo = mergeTarget.orderNo || '';
        mergedInto = savedOrderNo;
        // แจ้ง LINE แบบเดียวกับตอนกด "เพิ่มรายการเข้าออเดอร์" — รูปแบบเดิมที่กลุ่มคุ้นอยู่แล้ว
        const addKeys = items.map(it => `${it.productName}|${it.color||''}|${it.trimColor||''}`);
        const todayAdd = await getTodayOrdersSummary({ currentOrderId: mergeTarget.id, actionType: 'edit', actionItemKeys: addKeys });
        sendLineNotify({
          type: 'edit',
          orderNo: mergeTarget.orderNo,
          customerName: data.customerName,
          items: items.map(it => ({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'', changeType: 'added' })),
          createdAt: mergeTarget.createdAt,
          todayOrders: todayAdd
        });
      } else {
        data.orderNo=await DB.nextOrderNo();
        // ออเดอร์ใหม่ต้องมีธงนี้ติดมาเสมอ (ไม่ใช่ปล่อยว่าง) เพื่อให้ขั้นต่อไป
        // ดึงเฉพาะออเดอร์ที่ยังส่งไม่ครบจากเซิร์ฟเวอร์ได้ — ถ้าไม่มีช่องนี้
        // เอกสารจะไม่เข้าเงื่อนไข where และออเดอร์จะหายจากหน้าจอโดยไม่มี error
        // ค่า false มีความหมายเท่ากับ "ไม่มีช่องนี้" ทุกประการ จึงไม่กระทบของเดิม
        data.isDelivered = false;
        savedOrderNo = data.orderNo;
        const newOrderId = await DB.addOrder(data);
        // แจ้งเตือน LINE กลุ่ม — ออเดอร์ใหม่ (fire-and-forget)
        const lineItems = data.items.map(it=>({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'' }));
        const todayNew = await getTodayOrdersSummary({ currentOrderId: newOrderId, actionType: 'new' });
        sendLineNotify({
          type: 'new',
          orderNo: data.orderNo,
          customerName: data.customerName,
          items: lineItems,
          createdAt: data.createdAt,
          todayOrders: todayNew
        });
      }
    }
    closeModal('orderModal');
    navigate(editId ? 'orders' : 'dashboard');
    // ตรวจสอบไปแล้วก่อนบันทึก → แจ้งสั้นๆ พอ ไม่ต้องเด้งสรุปซ้ำ
    if (savedOrderNo) {
      // รวมเข้าใบเดิม → ต้องบอกให้ชัดว่าไปอยู่ใบไหน ไม่งั้นคนจะหาใบใหม่ไม่เจอ
      const msg = mergedInto
        ? `เพิ่มเข้าใบ ${mergedInto} ของวันนี้แล้ว ✓`
        : `${editId?'แก้ไข':'บันทึก'}ออเดอร์ ${savedOrderNo} แล้ว ✓`;
      setTimeout(() => U.toast(msg), 400);
    }
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

function deleteOrder(id) {
  U_confirm('ต้องการลบออเดอร์นี้ใช่ไหม?', async(reason)=>{
    // ดึงข้อมูลออเดอร์ก่อนลบ เพื่อส่ง LINE notify
    const order = await DB.getOrder(id);
    await DB.delOrder(id, reason);
    U.toast('ลบออเดอร์แล้ว');
    navigate('orders');
    // แจ้งเตือน LINE กลุ่ม — ลบออเดอร์ (fire-and-forget)
    if (order) {
      const lineItems = (order.items||[]).map(it=>({ name: it.productName, qty: it.qty, color: it.color||'', trimColor: it.trimColor||'' }));
      const todayDel = await getTodayOrdersSummary(); // cache แล้วไม่มีออเดอร์ที่ลบ
      sendLineNotify({
        type: 'delete',
        orderNo: order.orderNo,
        customerName: order.customerName,
        items: lineItems,
        createdAt: order.createdAt,
        todayOrders: todayDel
      });
    }
  }, {askReason:true});
}

async function renderCustomers(el) {
  document.getElementById('topbarActions').innerHTML=
    `<button class="btn btn-primary" onclick="showCustomerModal()"><i class="fa-solid fa-plus me-1"></i>เพิ่มลูกค้า</button>`;
  const [customers,invoices,orders]=await Promise.all([DB.getCustomers(),DB.getInvoices(),DB.getOrders()]);
  customers.sort((a,b)=>a.name.localeCompare(b.name,'th'));

  // ── สรุปยอดของแต่ละราย คำนวณรอบเดียวตอนเปิดหน้า ──
  // ไม่คำนวณซ้ำทุกครั้งที่พิมพ์ค้นหา เพราะต้องวนใบเสร็จ 182 + ออเดอร์ 329 ทุกที
  const sumBy = {};
  customers.forEach(c => { sumBy[String(c.id)] = { spent:0, orders:0, last:0 }; });
  invoices.forEach(i => { const s = sumBy[String(i.customerId)];
    if (s) s.spent += U.invTotal(i).total; });
  orders.forEach(o => { const s = sumBy[String(o.customerId)];
    if (s) { s.orders++; if ((o.createdAt||0) > s.last) s.last = o.createdAt||0; } });
  window._custStats = sumBy;
  window._custData  = customers;
  window._custChip  = '';

  el.innerHTML=`
  <div class="oh">
    <div><h2>ลูกค้า</h2><div class="cnt" id="custCount"></div></div>
    <button class="btn btn-primary" onclick="showCustomerModal()" style="white-space:nowrap;">
      <i class="fa-solid fa-plus me-1"></i>เพิ่ม</button>
  </div>
  <div class="osearch">
    <i class="fa-solid fa-search"></i>
    <input type="text" id="custSearch" placeholder="ค้นหาชื่อ / เบอร์โทร" oninput="filterCustTable()">
  </div>
  <div class="ochips" id="custChips"></div>
  <div id="custList"></div>`;

  paintCustChips();
  filterCustTable();
}

// ลูกค้าที่สั่งบ่อย — 10 ออเดอร์ขึ้นไป (ของจริงแบ่งได้ชัด: 99/90/68/67 กับ 3/2/1/1)
const CUST_FREQ_MIN = 10;
function custStat(c) { return (window._custStats||{})[String(c.id)] || {spent:0,orders:0,last:0}; }
function custHasPrice(c) { return Object.keys(c.customPrices||{}).length > 0; }

function paintCustChips() {
  const box = document.getElementById('custChips'); if (!box) return;
  const all = window._custData || [];
  const chip = (k,label,n) =>
    `<button type="button" class="ochip${window._custChip===k?' on':''}" onclick="setCustChip('${k}')">
      ${label}<span class="b">${n}</span></button>`;
  box.innerHTML = chip('', 'ทั้งหมด', all.length)
    + chip('freq',  '🔁 ซื้อบ่อย',     all.filter(c => custStat(c).orders >= CUST_FREQ_MIN).length)
    + chip('price', '🏷️ มีราคาพิเศษ', all.filter(custHasPrice).length);
}
function setCustChip(k) { window._custChip = k; paintCustChips(); filterCustTable(); }

// ── การ์ดลูกค้า 1 ราย ──
function custCardHtml(c) {
  const s = custStat(c);
  const phone = (c.phone||'').trim();
  const addr  = (c.address||'').trim();

  const lastTxt = s.last ? U.date(s.last) : '—';
  const lastDays = s.last ? Math.floor((Date.now() - s.last) / 86400000) : null;

  return `<div class="ccard">
    <div class="top">
      <div class="ava" style="background:${ocAvaColor(c.name||'')}">${U.esc(U.initial(c.name||'?'))}</div>
      <div class="who">
        <div class="nm">${U.esc(c.name||'-')}${nPrice
          ? `<span class="ctag"><i class="fa-solid fa-tag"></i>ราคาพิเศษ ${nPrice}</span>` : ''}</div>
        ${phone ? `<div class="ph"><i class="fa-solid fa-phone me-1" style="opacity:.6;"></i>${U.esc(phone)}</div>` : ''}
      </div>
      ${phone ? `<a class="callbtn" href="tel:${U.esc(phone.replace(/[^0-9+]/g,''))}" title="โทรหา ${U.esc(c.name||'')}">
        <i class="fa-solid fa-phone"></i></a>` : ''}
    </div>
    ${addr ? `<div class="addr"><i class="fa-solid fa-location-dot me-1" style="opacity:.6;"></i>${U.esc(addr)}</div>` : ''}
    <div class="cstats">
      <div class="st"><div class="n">${U.baht(s.spent)}</div><div class="l">ยอดซื้อรวม (บาท)</div></div>
      <div class="st"><div class="n">${s.orders}</div><div class="l">ออเดอร์</div></div>
      <div class="st"><div class="n" style="font-size:13.5px;">${lastTxt}</div>
        <div class="l">${lastDays === null ? 'ยังไม่เคยซื้อ' : lastDays === 0 ? 'ซื้อวันนี้' : `ซื้อล่าสุด · ${lastDays} วันก่อน`}</div></div>
    </div>
    <div class="acts">
      <button type="button" class="aa hist" onclick="showCustomerHistory('${c.id}')">
        <i class="fa-solid fa-clock-rotate-left"></i>ประวัติการซื้อ</button>
      <button type="button" class="aa price" onclick="showCustomerPriceModal('${c.id}')">
        <i class="fa-solid fa-tag"></i>ราคา</button>
      <button type="button" class="aa more" onclick="this.closest('.ccard').querySelector('.cmenu').classList.toggle('open')">
        <i class="fa-solid fa-ellipsis-vertical"></i></button>
    </div>
    <div class="cmenu">
      <button type="button" class="aa edit" onclick="showCustomerModal('${c.id}')"><i class="fa-solid fa-pen"></i>แก้ไข</button>
      <button type="button" class="aa del" onclick="deleteCustomer('${c.id}')"><i class="fa-solid fa-trash"></i>ลบ</button>
    </div>
  </div>`;
}

function custRow(c,i) {

  return `<tr>
    <td class="g-hide" style="color:#6b7280;font-size:12px;">${i+1}</td>
    <td class="g-title"><strong>${U.esc(c.name)}</strong></td>
    <td data-label="เบอร์โทร">${U.esc(c.phone||'-')}</td>
    <td data-label="ที่อยู่" class="g-wrap" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#6b7280;">${U.esc(c.address||'-')}</td>
    <td>${customCount?`<span class="price-custom"><i class="fa-solid fa-tag me-1"></i>${customCount} สินค้า</span>`:

      <button class="btn btn-sm btn-outline-warning btn-icon" onclick="showCustomerPriceModal('${c.id}')" title="จัดการราคา"><i class="fa-solid fa-tag"></i></button>

function renderCustRows(list) {
  return list.map((c,i)=>custRow(c,i)).join('')||emptyRow(7,'ไม่พบลูกค้า');
}
function filterCustTable() {
  const q = (document.getElementById('custSearch')?.value || '').toLowerCase().trim();
  const chip = window._custChip || '';
  let data = window._custData || [];
  if (chip === 'freq')  data = data.filter(c => custStat(c).orders >= CUST_FREQ_MIN);
  if (chip === 'price') data = data.filter(custHasPrice);
  if (q) data = data.filter(c => (c.name||'').toLowerCase().includes(q) || (c.phone||'').includes(q));

  const box = document.getElementById('custList');
  if (box) box.innerHTML = data.length
    ? data.map(custCardHtml).join('')
    : `<div class="empty-state" style="padding:36px"><i class="fa-solid fa-users-slash"></i><p>ไม่พบลูกค้า</p></div>`;

  const cnt = document.getElementById('custCount');
  if (cnt) {
    const all = window._custData || [];
    const freq = all.filter(c => custStat(c).orders >= CUST_FREQ_MIN).length;
    cnt.innerHTML = `ทั้งหมด <b>${all.length}</b> ราย · ซื้อบ่อย <b>${freq}</b>`
      + (data.length !== all.length ? ` · ตรงกับที่กรอง <b>${data.length}</b>` : '');
  }
}

async function showCustomerHistory(custId) {
  const [cust,orders,invoices]=await Promise.all([DB.getCustomer(custId),DB.getOrders(),DB.getInvoices()]);
  if(!cust)return;
  const cOrders=orders.filter(o=>String(o.customerId)===String(custId)).sort((a,b)=>b.createdAt-a.createdAt);
  const cInvs=invoices.filter(i=>String(i.customerId)===String(custId)).sort((a,b)=>b.createdAt-a.createdAt);
  const totalSpent=cInvs.reduce((s,inv)=>s+U.invTotal(inv).total,0);
  const unpaid=cInvs.filter(i=>!i.isPaid).reduce((s,inv)=>s+U.invTotal(inv).total,0);
  const ordRows=cOrders.length?cOrders.map(o=>`<tr>
    <td style="font-size:12px;white-space:nowrap;">${U.datetime(o.createdAt)}</td>
    <td><code style="background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:12px;">${U.esc(o.orderNo)}</code></td>
    <td style="font-size:12px;color:#6b7280;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${(o.items||[]).map(i=>U.esc(i.productName)+'×'+i.qty).join(', ')||'-'}</td>
    <td style="font-weight:700;white-space:nowrap;">${U.money(U.orderTotal(o))}</td>
  </tr>`).join(''):`<tr><td colspan="4"><div class="empty-state" style="padding:20px"><i class="fa-solid fa-inbox"></i><p>ไม่มีออเดอร์</p></div></td></tr>`;
  const invRows=cInvs.length?cInvs.map(inv=>{
    const t=U.invTotal(inv);
    const badge=inv.isPaid?`<span class="badge-paid"><i class="fa-solid fa-check me-1"></i>ชำระแล้ว</span>`:`<span class="badge-unpaid"><i class="fa-solid fa-clock me-1"></i>ค้างชำระ</span>`;
    return `<tr>
      <td style="font-size:12px;white-space:nowrap;">${U.date(inv.createdAt)}</td>
      <td><strong style="font-size:13px;">${U.esc(inv.invoiceNo)}</strong></td>

async function saveCustomer() {
  if (window._saving){return;} window._saving=true;
  // กันเหนียว: ถ้ามีอะไรค้างจนโค้ดข้างล่างไม่จบ ปลดล็อกให้กดใหม่ได้
  clearTimeout(window._savingWatchdog);
  window._savingWatchdog = setTimeout(() => { window._saving = false; }, 45000);
  try {
    const name=document.getElementById('cf_name')?.value.trim();
    if (!name){U.toast('กรุณากรอกชื่อ','error');return;}
    const id=document.getElementById('cf_id')?.value||'';
    const data={name,phone:document.getElementById('cf_phone')?.value.trim()||'',taxId:document.getElementById('cf_taxId')?.value.trim()||'',address:document.getElementById('cf_address')?.value.trim()||'',notes:document.getElementById('cf_notes')?.value.trim()||''};
    if (id){const old=await DB.getCustomer(id);await DB.putCustomer({...old,...data});U.toast('แก้ไขข้อมูลลูกค้าแล้ว ✓');}
    else{await DB.addCustomer(data);U.toast('เพิ่มลูกค้าแล้ว ✓');}
    closeModal('custModal');navigate('customers');
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

async function deleteCustomer(id) {
  const [orders, invoices] = await Promise.all([DB.getOrders(), DB.getInvoices()]);
  const hasOrders   = orders.find(o=>String(o.customerId)===String(id));
  const hasInvoices = invoices.find(i=>String(i.customerId)===String(id));
  if (hasOrders || hasInvoices) {
    U.toast(`ไม่สามารถลบได้ มีออเดอร์/ใบเสร็จที่เชื่อมกับลูกค้านี้อยู่`, 'error'); return;
  }
  U_confirm('ต้องการลบลูกค้านี้ใช่ไหม?', async(reason)=>{
    await DB.delCustomer(id, reason);U.toast('ลบลูกค้าแล้ว');navigate('customers');
  }, {askReason:true});
}

// ── ราคาพิเศษต่อลูกค้า ──
async function showCustomerPriceModal(custId) {
  const [cust, products] = await Promise.all([DB.getCustomer(custId), DB.getProducts()]);
  if (!cust||!products.length){U.toast('กรุณาเพิ่มสินค้าก่อน','error');return;}
  const cards = products.map(p => {
    const cpObj = cust.customPrices?.[p.id];
    const lines = cpLinesOf(p);
    if (!lines.length) {
      // สินค้าที่ไม่มีสีเส้น — ช่องเดียว
      const val = (typeof cpObj === 'number') ? cpObj : '';
      return `<div class="cpprod" data-name="${U.esc(p.name)}">
        <div class="ph"><span class="pi"><i class="fa-solid fa-box"></i></span>${U.esc(p.name)}
          <span class="set" style="display:none;">พิเศษ 1</span></div>
        <div class="cprow${val!==''?' special':''}">
          <div class="li"><div class="ln">ราคาเดียว</div>
            <div class="normal">ราคาปกติ ${U.baht(p.price||0)} บาท</div>
            <span class="cpsaved"><i class="fa-solid fa-check"></i>ราคาพิเศษ</span></div>
          <div class="cpin"><input type="number" min="0" inputmode="decimal"
            data-pid="${U.esc(String(p.id))}" data-line="" value="${val}"
            placeholder="ปกติ" oninput="cpPaint()"><span class="b">บ.</span></div>
        </div></div>`;
    }
    const rows = lines.map(l => {
      const def = p.priceMap?.[l] ?? p.price;
      const val = (typeof cpObj === 'object' && cpObj?.[l] !== undefined) ? cpObj[l] : '';
      // สีเส้นแบบ '-' หรือ '(ไม่แต่ง)' ไม่ต้องเติมคำว่า "เส้น" ข้างหน้า จะอ่านไม่รู้เรื่อง
      const plain = ['-','(ไม่แต่ง)',''].includes(l);
      return `<div class="cprow${val!==''?' special':''}">
        <div class="li">
          <div class="ln"><span class="sym">${TRIM_ICON[l]||'▫'}</span>${plain?'ราคาปกติ':'เส้น'+U.esc(l)}</div>
          <div class="normal">ราคาปกติ ${U.baht(def||0)} บาท</div>
          <span class="cpsaved"><i class="fa-solid fa-check"></i>ราคาพิเศษ</span>
        </div>
        <div class="cpin"><input type="number" min="0" inputmode="decimal"
          data-pid="${U.esc(String(p.id))}" data-line="${U.esc(l)}" value="${val}"
          placeholder="ปกติ" oninput="cpPaint()"><span class="b">บ.</span></div>
      </div>`;
    }).join('');
    return `<div class="cpprod" data-name="${U.esc(p.name)}">
      <div class="ph"><span class="pi"><i class="fa-solid fa-box"></i></span>${U.esc(p.name)}
        <span class="set" style="display:none;"></span></div>${rows}</div>`;
  }).join('');

  const body = `
    <div class="cphint"><i class="fa-solid fa-circle-info me-1" style="color:#2563eb;"></i>
      ช่องไหนไม่กรอก = ใช้ราคาปกติของสินค้า</div>
    <div class="cpsearch"><i class="fa-solid fa-search"></i>
      <input type="text" id="cpSearch" placeholder="ค้นหาชื่อสินค้า" oninput="cpFilter()"></div>
    <div id="cpList">${cards}</div>`;

  const foot = `<div class="cpfoot">
    <div class="note" id="cpNote"></div>
    <button type="button" class="save" onclick="saveCustomerPrices('${custId}')">
      <i class="fa-solid fa-floppy-disk me-1"></i>บันทึกราคา</button>
    <button type="button" class="cancel" data-bs-dismiss="modal">ยกเลิก</button>
  </div>`;

  showModal('custPriceModal',
    `ราคาพิเศษ <span class="oc-prog" style="background:#f5f0ff;color:#6d28d9;">${U.esc(cust.name)}</span>`,
    body, foot, 'modal-lg');
  window._custPriceProducts = products;
  cpPaint();
}

// ── สีเส้นของสินค้า ──
// ⚠️ ต้องอ่านจาก priceMap ของสินค้าจริง ไม่ใช่ COFFIN_SPEC ที่เขียนตายไว้ในโค้ด
// เดิมใช้ SPEC ก่อน ทำให้สีเส้นที่เพิ่มเข้ามาทีหลังตั้งราคาพิเศษไม่ได้เลย
// (เช่น มุกใหญ่ "ผ้าจีบทอง" 4,200 และ ธรรมดา "คริสต์"/"(ไม่แต่ง)" — ช่องไม่ขึ้นให้กรอก)
function cpLinesOf(p) {
  const pm = p.priceMap || {};
  const fromMap = Object.keys(pm).filter(k => k !== '__default' && Number(pm[k]) > 0);
  if (fromMap.length) return fromMap;
  const spec = (typeof COFFIN_SPEC !== 'undefined' && COFFIN_SPEC[p.name]) || null;
  return (spec && spec.lines) || [];
}

// ทาสีแถวที่กรอกแล้ว + นับจำนวนที่ตั้งไว้ (ทั้งบนหัวการ์ดและแถบล่าง)
function cpPaint() {
  let total = 0;
  document.querySelectorAll('#cpList .cpprod').forEach(card => {
    let n = 0;
    card.querySelectorAll('.cprow').forEach(row => {
      const on = (row.querySelector('input')?.value || '').trim() !== '';
      row.classList.toggle('special', on);
      if (on) n++;
    });
    const tag = card.querySelector('.ph .set');
    if (tag) { tag.textContent = n ? `พิเศษ ${n}` : ''; tag.style.display = n ? '' : 'none'; }
    total += n;
  });
  const note = document.getElementById('cpNote');
  if (note) note.innerHTML = total
    ? `ตั้งราคาพิเศษไว้ <b>${total} รายการ</b> · ที่เหลือใช้ราคาปกติ`
    : 'ยังไม่ได้ตั้งราคาพิเศษ — ใช้ราคาปกติทั้งหมด';
}

// ค้นหาสินค้า — 21 รายการคูณสีเส้นแล้วเกือบ 60 ช่อง เลื่อนหาเองไม่ไหว
function cpFilter() {
  const q = (document.getElementById('cpSearch')?.value || '').toLowerCase().trim();
  document.querySelectorAll('#cpList .cpprod').forEach(card => {
    const hit = !q || (card.dataset.name || '').toLowerCase().includes(q);
    card.style.display = hit ? '' : 'none';
  });
}

async function saveCustomerPrices(custId) {
  const cust = await DB.getCustomer(custId);
  const customPrices = {};
  // อ่านจากช่องที่วาดอยู่จริงบนหน้าจอ (data-pid / data-line)
  // ดีกว่าไปไล่ชื่อ id เพราะชื่อสีเส้นมีวงเล็บและขีด เช่น "(ไม่แต่ง)" ซึ่งทำ selector พัง
  document.querySelectorAll('#cpList input[data-pid]').forEach(el => {
    const val = (el.value || '').trim();
    if (val === '') return;
    const num = parseFloat(val);
    if (!isFinite(num) || num < 0) return;      // กันค่าติดลบ/ขยะ
    const pid = el.dataset.pid, line = el.dataset.line || '';
    if (!line) { customPrices[pid] = num; return; }        // สินค้าไม่มีสีเส้น = ราคาเดียว
    if (typeof customPrices[pid] !== 'object' || customPrices[pid] === null) customPrices[pid] = {};
    customPrices[pid][line] = num;
  });
  await DB.putCustomer({...cust,customPrices});
  U.toast('บันทึกราคาพิเศษแล้ว ✓');
  closeModal('custPriceModal');
  navigate('customers');
}

// ── โลง หรือ อุปกรณ์เสริม ──
// เกณฑ์เดียวกับ isAccessory() ที่ทั้งระบบใช้อยู่: หน่วยไม่ใช่ "โลง" = อุปกรณ์เสริม
// แยกฟังก์ชันไว้เพราะหน้านี้มีตัวสินค้าอยู่ในมือแล้ว ไม่ต้องไปค้นจาก cache ตามชื่อ
function prodIsAcc(p) { return ((p && p.unit) || 'โลง').trim() !== 'โลง'; }

// ── ชิปกรอง: ทั้งหมด / โลง / อุปกรณ์เสริม ──
// เดิมแยกตามหน่วยดิบ ๆ ได้ 6 ชิป (โลง มัด ชิ้น ชุด ดอก ม้วน) ละเอียดเกินจำเป็น
// สิ่งที่ต่างกันจริงในการทำงานคือ "ต้องแต่งหรือไม่" จึงจัดเป็น 2 พวกพอ
function paintProdChips() {
  const box = document.getElementById('prodChips'); if (!box) return;
  const all = window._prodData || [];
  const nCof = all.filter(p => !prodIsAcc(p)).length;
  const nAcc = all.length - nCof;
  const chip = (k, label, n) =>
    `<button type="button" class="ochip${window._prodUnit===k?' on':''}" onclick="setProdUnit('${k}')">
      ${label}<span class="b">${n}</span></button>`;
  box.innerHTML = chip('', 'ทั้งหมด', all.length)
    + chip('coffin', '⚰️ โลง', nCof)
    + chip('acc', '🔧 อุปกรณ์เสริม', nAcc);
}
function setProdUnit(u) { window._prodUnit = u; paintProdChips(); filterProdTable(); }

// ── สีไอคอนตามหน่วย ── โลง=ส้ม ที่เหลือแยกสีกันไว้ กวาดตาแล้วรู้ว่าอันไหนโลงอันไหนของประกอบ
const PROD_UNIT_STYLE = {
  'โลง':  { bg:'linear-gradient(135deg,#fbbf24,#b45309)', icon:'fa-box' },
  'ชุด':  { bg:'linear-gradient(135deg,#c084fc,#7c3aed)', icon:'fa-layer-group' },
  'ม้วน': { bg:'linear-gradient(135deg,#67e8f9,#0891b2)', icon:'fa-scroll' },
  'มัด':  { bg:'linear-gradient(135deg,#86efac,#15803d)', icon:'fa-boxes-stacked' },
  'ดอก':  { bg:'linear-gradient(135deg,#f9a8d4,#be185d)', icon:'fa-fan' },
  'ชิ้น': { bg:'linear-gradient(135deg,#a5b4fc,#4338ca)', icon:'fa-cube' },
};
// สีจุดหน้าชื่อสีเส้น
const TRIM_DOT = {
  'ทอง':'#c8961e', 'เงิน':'#94a3b8', 'ขาว':'#cbd5e1', 'ซีด':'#a9743f',
  'คริสต์':'#3b82f6', 'ผ้าจีบ':'#a78bfa', 'ผ้าจีบทอง':'#d6a83a', 'ผ้าดอก':'#f472b6',
};

// ── การ์ดสินค้า 1 รายการ ──
function prodCardHtml(p) {
  const st = PROD_UNIT_STYLE[p.unit] || { bg:'linear-gradient(135deg,#cbd5e1,#64748b)', icon:'fa-box' };
  const pm = p.priceMap || {};
  // เอาเฉพาะสีเส้นที่มีราคาจริง
  const keys = Object.keys(pm).filter(k => k !== '__default' && Number(pm[k]) > 0);
  const vals = keys.map(k => Number(pm[k]));
  const allSame = vals.length > 1 && new Set(vals).size === 1;
  // '-' หรือ '(ไม่แต่ง)' = สินค้าที่ไม่มีสีเส้น ไม่ต้องโชว์จุดสีกับชื่อสีที่อ่านไม่รู้เรื่อง
  const noTrim = keys.length === 1 && ['-','(ไม่แต่ง)',''].includes(keys[0]);

  let body, label;
  if (!keys.length) {
    label = 'ราคา';
    body = `<div class="pgrid one"><div class="pcell">
      <span class="dot" style="background:#e2e8f0;"></span><span class="ln">ราคาปกติ</span>
      <span class="pc">${U.baht(p.price||0)}<small> ฿</small></span></div></div>`;
  } else if (noTrim) {
    label = 'ราคา';
    body = `<div class="pgrid one"><div class="pcell">
      <span class="dot" style="background:#e2e8f0;"></span><span class="ln">ราคาปกติ</span>
      <span class="pc">${U.baht(pm[keys[0]])}<small> ฿</small></span></div></div>`;
  } else if (allSame) {
    // ทุกสีเส้นราคาเท่ากัน — ยุบเหลือบรรทัดเดียว ไม่ต้องโชว์เลขซ้ำหลายช่อง
    label = 'ราคาตามสีเส้น';
    body = `<div class="pgrid one"><div class="pcell">
      <span class="dot" style="background:linear-gradient(135deg,#c8961e,#94a3b8);"></span>
      <span class="ln">ทุกสีเส้น (${keys.length} แบบ)</span>
      <span class="pc">${U.baht(vals[0])}<small> ฿</small></span></div></div>`;
  } else {
    label = 'ราคาตามสีเส้น';
    body = `<div class="pgrid">${keys.map(k => `<div class="pcell">
      <span class="dot" style="background:${TRIM_DOT[k]||'#e2e8f0'};"></span>
      <span class="ln">${U.esc(k)}</span>
      <span class="pc">${U.baht(pm[k])}<small> ฿</small></span></div>`).join('')}</div>`;
  }

  return `<div class="pcard">
    <div class="top">
      <div class="pic" style="background:${st.bg};"><i class="fa-solid ${st.icon}"></i></div>
      <div class="who">
        <div class="nm">${U.esc(p.name)}</div>
        <div class="meta">หน่วย: ${U.esc(p.unit||'-')}${p.code?' · '+U.esc(p.code):''}${p.category?' · '+U.esc(p.category):''}</div>
        <div style="margin-top:6px;">${prodIsAcc(p)
          ? `<span class="pbadge acc"><i class="fa-solid fa-truck-fast"></i>ไม่ต้องแต่ง · ส่งได้เลย</span>`
          : `<span class="pbadge cof"><i class="fa-solid fa-hammer"></i>ต้องแต่งก่อนส่ง</span>`}</div>
      </div>
    </div>
    <div class="prices"><div class="plbl">${label}</div>${body}</div>
    <div class="acts">
      <button type="button" class="aa edit" onclick="showProductModal('${p.id}')"><i class="fa-solid fa-pen"></i>แก้ไข</button>
      <button type="button" class="aa del" onclick="deleteProduct('${p.id}')"><i class="fa-solid fa-trash"></i>ลบ</button>
    </div>
  </div>`;
}

function prodRow(p,i) {
  const spec=COFFIN_SPEC[p.name];
  const specLines=spec?.lines||[];
  const pm=p.priceMap||{};
  const extraKeys=Object.keys(pm).filter(k=>!specLines.includes(k)&&(pm[k]||0)>0);
  const lines=(Array.isArray(p.lines)&&p.lines.length) ? p.lines
    : (specLines.length?[...specLines,...extraKeys]:Object.keys(pm));
  const lineIcons={ทอง:'🟡',เงิน:'🔘',ซีด:'🥉',ขาว:'⬜',คริสต์:'✝',ผ้าจีบ:'🪷',ผ้าดอก:'🌸'};
  let priceCell;
  const hasPm=lines.length&&Object.keys(pm).some(k=>pm[k]>0);
  if(hasPm){
    priceCell=lines.filter(l=>pm[l]!=null).map(l=>
      `<span style="font-size:12.5px;background:#eff6ff;color:#1e40af;border-radius:5px;padding:2px 7px;margin:1px 2px;display:inline-block;white-space:nowrap;">${lineIcons[l]||''}${l} <b>${U.money(pm[l])}</b></span>`
    ).join('');
  } else {
    priceCell=`<span style="font-weight:700;color:#2563eb;">${U.money(p.price)}</span>`;
  }
  return `<tr>
    <td data-label="รหัส"><code style="background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:12px;">${U.esc(p.code||'-')}</code></td>
    <td class="g-title"><strong>${U.esc(p.name)}</strong></td>
    <td data-label="ประเภท" style="font-size:13px;color:#6b7280;">${U.esc(p.category||'-')}</td>
    <td data-label="หน่วย" style="font-size:13px;">${U.esc(p.unit||'โลง')}</td>
    <td data-label="ราคาตามสีเส้น" class="g-wrap">${priceCell}</td>
    <td class="g-act d-flex gap-1">
      <button class="btn btn-sm btn-outline-primary btn-icon" onclick="showProductModal('${p.id}')" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
      <button class="btn btn-sm btn-outline-danger btn-icon" onclick="deleteProduct('${p.id}')" title="ลบ"><i class="fa-solid fa-trash"></i></button>
    </td>
  </tr>`;
}

function filterProdTable() {
  const q = (document.getElementById('prodSearch')?.value || '').toLowerCase().trim();
  const kind = window._prodUnit || '';
  let data = window._prodData || [];
  if (kind === 'coffin') data = data.filter(p => !prodIsAcc(p));
  if (kind === 'acc')    data = data.filter(p =>  prodIsAcc(p));
  if (q)    data = data.filter(p => (p.name||'').toLowerCase().includes(q)
                                 || (p.code||'').toLowerCase().includes(q));

  const box = document.getElementById('prodList');
  if (box) {
    if (!data.length) {
      box.innerHTML = `<div class="empty-state" style="padding:36px"><i class="fa-solid fa-box-open"></i><p>ไม่พบสินค้า</p></div>`;
    } else if (kind) {
      // เลือกชนิดเดียวอยู่แล้ว ไม่ต้องมีหัวข้อคั่นซ้ำอีก
      box.innerHTML = data.map(prodCardHtml).join('');
    } else {
      // ดูทั้งหมด → คั่นเป็น 2 กลุ่มให้เห็นชัดว่าอันไหนต้องแต่ง อันไหนส่งได้เลย
      const cof = data.filter(p => !prodIsAcc(p));
      const acc = data.filter(p =>  prodIsAcc(p));
      const head = (icon, name, n, hint) =>
        `<div class="phead">${icon}${name}<span class="n">${n}</span><span class="hint">${hint}</span></div>`;
      box.innerHTML =
        (cof.length ? head('⚰️ ', 'โลง', cof.length, 'ต้องแต่งก่อนส่ง') + cof.map(prodCardHtml).join('') : '')
      + (acc.length ? head('🔧 ', 'อุปกรณ์เสริม', acc.length, 'ไม่ต้องแต่ง') + acc.map(prodCardHtml).join('') : '');
    }
  }
  const cnt = document.getElementById('prodCount');
  if (cnt) {
    const all = window._prodData || [];
    cnt.innerHTML = `ทั้งหมด <b>${all.length}</b> รายการ`
      + (data.length !== all.length ? ` · ตรงกับที่กรอง <b>${data.length}</b>` : '');
  }
}

function buildPriceFields(prodName, existingPm, savedLines, savedColors) {
  const spec=COFFIN_SPEC[prodName];
  const pmKeys=Object.keys(existingPm||{}).filter(k=>k!=='__default'&&(existingPm[k]||0)>0);
  const DEFAULT_LINES=['ทอง','เงิน'];
  const specLines=spec?.lines||[];
  // ถ้าเคยบันทึกรายการสีเส้นไว้แล้ว ยึดตามนั้น — ที่ลบออกจะไม่โผล่กลับมา
  const extraKeys=pmKeys.filter(k=>!specLines.includes(k));
  const lines=(Array.isArray(savedLines)&&savedLines.length)
    ? savedLines
    : (specLines.length?[...specLines,...extraKeys]:(pmKeys.length?pmKeys:DEFAULT_LINES));
  const lineIcons={ทอง:'🟡',เงิน:'🔘',ซีด:'🥉',ขาว:'⬜',คริสต์:'✝',ผ้าจีบ:'🪷',ผ้าดอก:'🌸'};
  const rows=lines.map(l=>`
    <div class="pf-line-row" style="display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;align-items:center;">
      <input type="text" class="form-control form-control-sm pf-line-name" value="${U.esc(l)}" placeholder="ชื่อสีเส้น">
      <input type="number" class="form-control form-control-sm pf-line-price" min="0" placeholder="ราคา..." value="${existingPm?.[l]||''}">
      <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.pf-line-row').remove()" style="padding:4px 7px;"><i class="fa-solid fa-trash"></i></button>
    </div>`).join('');
  return `<div class="col-12">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <label class="form-label fw-semibold mb-0">✨ ราคาตามสีเส้น (บาท)</label>
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="addPriceLineRow()"><i class="fa-solid fa-plus me-1"></i>เพิ่มสีเส้น</button>
    </div>
    <div id="pf_lines_wrap" style="display:flex;flex-direction:column;gap:8px;">${rows}</div>
  </div>
  ${buildColorFields(prodName, savedColors)}
  <input type="hidden" id="pf_price" value="0">`;
}

// ── ตั้งค่าสีโลงของสินค้า — ลบให้หมด = ไม่ต้องเลือกสีตอนสั่ง ──
function buildColorFields(prodName, savedColors) {
  const colors = Array.isArray(savedColors) ? savedColors
    : (COFFIN_SPEC[prodName]?.colors ?? ['ขาว','แดง']);
  const rows = colors.map(c => `
    <div class="pf-color-row" style="display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center;">
      <span class="pf-sw" style="${COLOR_SWATCH[c]||'background:#e5e7eb;'}"></span>
      <input type="text" class="form-control form-control-sm pf-color-name" value="${U.esc(c)}"
        placeholder="ชื่อสี" oninput="refreshColorSwatch(this)">
      <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.pf-color-row').remove();updateColorHint()" style="padding:4px 7px;"><i class="fa-solid fa-trash"></i></button>
    </div>`).join('');
  return `<div class="col-12">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <label class="form-label fw-semibold mb-0">🎨 สีโลง</label>
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="addColorRow()"><i class="fa-solid fa-plus me-1"></i>เพิ่มสี</button>
    </div>
    <div id="pf_colors_wrap" style="display:flex;flex-direction:column;gap:8px;">${rows}</div>
    <div id="pf_color_hint" style="font-size:12px;color:#6b7280;margin-top:7px;"></div>
  </div>`;
}

function refreshColorSwatch(inp) {
  const sw = inp.closest('.pf-color-row')?.querySelector('.pf-sw');
  if (sw) sw.style.cssText = 'width:26px;height:26px;border-radius:50%;flex-shrink:0;'
    + (COLOR_SWATCH[inp.value.trim()] || 'background:#e5e7eb;border:1.5px solid #cbd5e1;');
}
function updateColorHint() {
  const n = document.querySelectorAll('.pf-color-row').length;
  const el = document.getElementById('pf_color_hint');
  if (el) el.innerHTML = n
    ? `<i class="fa-solid fa-circle-info me-1"></i>ตอนรับออเดอร์จะให้เลือก ${n} สีนี้`
    : `<span style="color:#0891b2;font-weight:600;"><i class="fa-solid fa-check me-1"></i>ไม่มีสี — ตอนรับออเดอร์จะข้ามขั้นเลือกสีโลงไปเลย (เหมาะกับไม้สัก)</span>`;
}
function addColorRow() {
  const wrap = document.getElementById('pf_colors_wrap');
  if (!wrap) return;
  const row = document.createElement('div');
  row.className = 'pf-color-row';
  row.style.cssText = 'display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center;';
  row.innerHTML = `
    <span class="pf-sw" style="background:#e5e7eb;border:1.5px solid #cbd5e1;"></span>
    <input type="text" class="form-control form-control-sm pf-color-name" placeholder="ชื่อสี เช่น ขาว" oninput="refreshColorSwatch(this)">
    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.pf-color-row').remove();updateColorHint()" style="padding:4px 7px;"><i class="fa-solid fa-trash"></i></button>`;
  wrap.appendChild(row);
  row.querySelector('.pf-color-name').focus();
  updateColorHint();
}

function addPriceLineRow() {
  const wrap=document.getElementById('pf_lines_wrap');
  if(!wrap) return;
  const row=document.createElement('div');
  row.className='pf-line-row';
  row.style.cssText='display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;align-items:center;';

    <input type="text" class="form-control form-control-sm pf-line-name" placeholder="ชื่อสีเส้น เช่น ม่วง">

  const specNames=Object.keys(COFFIN_SPEC);
  const nameOpts=specNames.map(n=>`<option value="${n}">`).join('');
  const initPriceFields=buildPriceFields(p?.name||'',p?.priceMap||{},p?.lines,p?.colors);
  const body=`<form class="row g-3">
    <div class="col-sm-4"><label class="form-label">รหัสสินค้า</label>
      <input type="text" class="form-control" id="pf_code" placeholder="เช่น L001" value="${U.esc(p?.code||'')}"></div>
    <div class="col-sm-8"><label class="form-label">ชื่อสินค้า <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="pf_name" required value="${U.esc(p?.name||'')}" placeholder="ชื่อโลง / รุ่น" list="specNameList" oninput="refreshPriceFields(this.value)" onchange="refreshPriceFields(this.value)">
      <datalist id="specNameList">${nameOpts}</datalist></div>
    <div class="col-sm-6"><label class="form-label">ประเภท</label>
      <input type="text" class="form-control" id="pf_cat" value="${U.esc(p?.category||'')}" placeholder="เช่น ไม้สัก, MDF"></div>
    <div class="col-sm-3"><label class="form-label">หน่วย</label>
      <input type="text" class="form-control" id="pf_unit" value="${U.esc(p?.unit||'โลง')}"></div>
    <div class="col-sm-3"></div>
    <div class="col-12" id="pf_price_wrap">${initPriceFields}</div>
    <input type="hidden" id="pf_id" value="${p?.id||''}">
  </form>`;
  setTimeout(updateColorHint, 60);
  showModal('prodModal',p?'แก้ไขสินค้า':'เพิ่มสินค้าใหม่',body,
    `<button class="btn btn-primary" onclick="saveProduct()"><i class="fa-solid fa-floppy-disk me-1"></i>บันทึก</button>
     <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>`,'modal-lg');
}
function refreshPriceFields(name) {
  const wrap=document.getElementById('pf_price_wrap');
  if(wrap){ wrap.innerHTML=buildPriceFields(name,{}); updateColorHint(); }
}

async function saveProduct() {
  if (window._saving){return;} window._saving=true;
  // กันเหนียว: ถ้ามีอะไรค้างจนโค้ดข้างล่างไม่จบ ปลดล็อกให้กดใหม่ได้
  clearTimeout(window._savingWatchdog);
  window._savingWatchdog = setTimeout(() => { window._saving = false; }, 45000);
  try {
    const name=document.getElementById('pf_name')?.value.trim();
    if (!name){U.toast('กรุณากรอกชื่อสินค้า','error');return;}
    const id=document.getElementById('pf_id')?.value||'';
    const priceMap={};
    const lines=[];   // เก็บลำดับสีเส้นที่ตั้งไว้ เพื่อให้ลบแล้วไม่กลับมาอีก
    document.querySelectorAll('.pf-line-row').forEach(row=>{
      const l=row.querySelector('.pf-line-name')?.value.trim();
      if(!l) return;
      lines.push(l);
      const v=parseFloat(row.querySelector('.pf-line-price')?.value||'');
      if(!isNaN(v)&&v>0) priceMap[l]=v;
    });
    // สีโลง — เก็บเป็น array ว่างได้ (= ไม่ต้องเลือกสี เช่น ไม้สัก)
    const colors=[];
    document.querySelectorAll('.pf-color-name').forEach(el=>{
      const c=el.value.trim();
      if(c && !colors.includes(c)) colors.push(c);
    });
    const defaultPrice=parseFloat(document.getElementById('pf_price')?.value||0)||0;
    const data={code:document.getElementById('pf_code')?.value.trim()||'',name,
      category:document.getElementById('pf_cat')?.value.trim()||'',
      unit:document.getElementById('pf_unit')?.value.trim()||'โลง',
      price:defaultPrice, priceMap, lines, colors};
    if (id){const old=await DB.getProduct(id);await DB.putProduct({...old,...data});U.toast('แก้ไขสินค้าแล้ว ✓');}
    else{await DB.addProduct(data);U.toast('เพิ่มสินค้าแล้ว ✓');}
    closeModal('prodModal');navigate('products');
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

async function deleteProduct(id) {
  const orders = await DB.getOrders();
  const inUse = orders.find(o=>(o.items||[]).some(it=>String(it.productId)===String(id)));
  if (inUse) {
    U.toast('ไม่สามารถลบได้ มีออเดอร์ที่ใช้สินค้านี้อยู่', 'error'); return;
  }
  U_confirm('ต้องการลบสินค้านี้ใช่ไหม?', async(reason)=>{
    await DB.delProduct(id, reason);U.toast('ลบสินค้าแล้ว');navigate('products');
  }, {askReason:true});
}

// ── ล้างชื่อรายการในบิลเก่า ──
// ชื่อในใบเสร็จถูกประกอบเป็นข้อความตั้งแต่ตอนออกบิล บางใบเก่ามี "เส้น-" หรือ "(-)"
// ติดมาด้วย (ตอนนั้นยังไม่ได้กรองค่า '-' ออก) อ่านแล้วงง
// แก้ที่ตอนแสดงผลอย่างเดียว ไม่ไปยุ่งกับข้อมูลที่เก็บไว้ — ของเก่าจึงไม่เสี่ยง
// ระวังอย่าไปลบ "เส้นทอง" / "เส้นเงิน" ที่ถูกต้อง จึงบังคับให้ตามด้วยช่องว่างหรือจบข้อความ
function invItemName(s) {
  return String(s||'')
    .replace(/\s*เส้น-(?=\s|$)/g, '')
    .replace(/\s*\(-\)/g, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

// ── การ์ดใบเสร็จ 1 ใบ ──
// หมายเหตุเรื่องคำ: ร้านเก็บเงินสดตลอด ไม่มีลูกหนี้ให้ตาม
// ธง isPaid ที่ใช้อยู่จริงจึงมีความหมายว่า "ลงบัญชีแล้วหรือยัง" ไม่ใช่ "ลูกค้าค้างเงิน"
// คำบนป้ายเลยใช้ว่า "บันทึกรับเงินแล้ว / ยังไม่ได้บันทึก" ให้ตรงกับที่ใช้งานจริง
function invCardHtml(inv) {
  const t = U.invTotal(inv).total;
  const paid = inv.isPaid === true;
  const items = inv.items || [];
  const firstTwo = items.slice(0, 2)
    .map(i => `${U.esc(invItemName(i.name))} ×${i.qty}`).join(' · ');
  const rest = items.length > 2 ? ` <span class="more">· ฯลฯ อีก ${items.length - 2} รายการ</span>` : '';

  return `<div class="ivcard${paid ? '' : ' nopay'}">
    <div class="top">
      <div class="ivno">
        <div class="no"><span class="ic"><i class="fa-solid fa-file-invoice"></i></span>${U.esc(inv.invoiceNo || '-')}</div>
        <div class="cust">${U.esc(inv.customerName || '-')}</div>
        <div class="dt">${U.date(inv.createdAt)}</div>
      </div>
      <div class="amt"><div class="n">${U.baht(t)}</div><div class="u">บาท</div></div>
    </div>
    <div class="rows">${firstTwo || '-'}${rest}</div>
    <div class="stat">${paid
      ? `<span class="otag ready"><i class="fa-solid fa-check"></i>บันทึกรับเงินแล้ว</span>`
      : `<span class="otag craft"><i class="fa-solid fa-clock"></i>ยังไม่ได้บันทึกรับเงิน</span>`}</div>
    <div class="acts">
      ${paid ? '' : `<button type="button" class="aa pay" onclick="toggleInvPaid('${inv.id}',true)">
        <i class="fa-solid fa-check"></i>บันทึกรับเงิน</button>`}
      <button type="button" class="aa print${paid?' solo':''}" onclick="printReceiptById('${inv.id}')">

// ── ชิปกรองใบเสร็จ ── เงื่อนไขชุดเดียว ใช้ทั้งนับเลขและกรองจริง
const INV_CHIPS = {
  all:   { label:'ทั้งหมด', test: () => true },
  today: { label:'วันนี้',  test: i => new Date(i.createdAt).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'}) === todayLocal() },
  month: { label:'เดือนนี้', test: i => { const d=new Date(i.createdAt), n=new Date();
           return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth(); } },
  nopay: { label:'ยังไม่ได้บันทึกรับเงิน', test: i => i.isPaid !== true },
};

function paintInvChips() {
  const box = document.getElementById('invChips'); if (!box) return;
  const all = window._invData || [];
  box.innerHTML = Object.entries(INV_CHIPS).map(([k,c]) => {
    const n = all.filter(c.test).length;
    return `<button type="button" class="ochip${window._invChip===k?' on':''}" onclick="setInvChip('${k}')">
      ${c.label}<span class="b">${n}</span></button>`;
  }).join('');
}
function setInvChip(k) {
  window._invChip = k;
  window._invShown = ORD_PAGE;
  paintInvChips();
  applyInvFilter(true);
}
function invShowMore() {
  window._invShown = (window._invShown || ORD_PAGE) + ORD_PAGE;
  applyInvFilter(true);
}

function invPaid(inv) {
  if (inv.paidAmount!=null) return inv.paidAmount;
  if (inv.isPaid) return U.invTotal(inv).total;
  return 0;
}
function invRow(inv) {

function applyInvFilter(keepPage) {
  const q = (document.getElementById('invSearch')?.value||'').toLowerCase().trim();
  const custId = document.getElementById('invFilterCust')?.value||'';
  const from = document.getElementById('invFilterFrom')?.value||'';
  const to   = document.getElementById('invFilterTo')?.value||'';
  if (!keepPage) window._invShown = ORD_PAGE;   // พิมพ์ค้นหาใหม่ ให้เริ่มนับหน้าใหม่

  let data = window._invData||[];
  const chip = INV_CHIPS[window._invChip || 'all'];
  if (chip)   data = data.filter(chip.test);
  if (q)      data = data.filter(i=>i.invoiceNo?.toLowerCase().includes(q)||i.customerName?.toLowerCase().includes(q));
  if (custId) data = data.filter(i=>String(i.customerId)===custId);
  if (from)   data = data.filter(i=>new Date(i.createdAt).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'})>=from);
  if (to)     data = data.filter(i=>new Date(i.createdAt).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'})<=to);

  const box = document.getElementById('invList');
  if (box) {
    const shown = Math.min(data.length, window._invShown || ORD_PAGE);
    box.innerHTML = data.length
      ? data.slice(0, shown).map(invCardHtml).join('')
      : `<div class="empty-state" style="padding:36px"><i class="fa-solid fa-file-circle-xmark"></i><p>ไม่พบใบเสร็จ</p></div>`;
    const more = document.getElementById('invMoreWrap');
    if (more) more.innerHTML = data.length > shown
      ? `<button type="button" class="omore" onclick="invShowMore()">แสดงเพิ่ม (เหลืออีก ${data.length - shown} ใบ)</button>` : '';
  }

  // ── แถบม่วง: สรุปยอดของ "ชุดที่กรองอยู่" ไม่ใช่ทั้งหมดเสมอ ──
  // กดชิป "เดือนนี้" แล้วเห็นยอดเดือนนี้ทันที ไม่ต้องไปเปิดหน้ารายงาน
  const sumBox = document.getElementById('invSum');
  if (sumBox) {
    const total = data.reduce((a,i)=>a+(i._total||0), 0);
    const label = (INV_CHIPS[window._invChip||'all']||{}).label || 'ทั้งหมด';
    sumBox.innerHTML = `
      <div><div class="big">${U.baht(total)}฿</div><div class="lb">ยอดรวม · ${U.esc(label)}</div></div>
      <div class="divi"></div>
      <div class="side"><div class="n">${data.length} ใบ</div><div class="l">จำนวนใบเสร็จ</div></div>`;
  }
  const cnt = document.getElementById('invCount');
  if (cnt) {
    const all = window._invData || [];
    cnt.innerHTML = `ทั้งหมด <b>${all.length}</b> ใบ`
      + (data.length !== all.length ? ` · ตรงกับที่กรอง <b>${data.length}</b>` : '');
  }
}

function rcItemRow(i, item={}) {
  const opts=(window._rcProdList||[]).map(p=>`<option value="${p.id}" data-price="${p.price}" data-name="${U.esc(p.name)}">${U.esc(p.name)}</option>`).join('');

    <td><input type="text" class="form-control form-control-sm" id="rcname_${i}" value="${U.esc(item.name||'')}" placeholder="ชื่อสินค้า" oninput="calcRcTotal()"></td>
    <td><input type="number" class="form-control form-control-sm" id="rcqty_${i}" value="${item.qty||1}" min="1" oninput="calcRcTotal()"></td>
    <td><input type="number" class="form-control form-control-sm" id="rcprice_${i}" value="${item.price||0}" min="0" oninput="calcRcTotal()"></td>
    <td><span id="rctotal_${i}" style="font-size:13px;font-weight:600;">${U.money((item.qty||1)*(item.price||0))}</span></td>
    <td>
      <select class="form-select form-select-sm" onchange="onRcProdSelect(this,${i})" style="font-size:12px;">
        <option value="">เลือกสินค้า...</option>${opts}
      </select>

function addRcItemRow() {
  const i=window._rcItemIdx++;
  document.getElementById('rcItemsBody').insertAdjacentHTML('beforeend',rcItemRow(i));
}

function onRcCustChange(sel) {
  window._rcCustId=sel.value||null;
  const cust=(window._rcCustList||[]).find(c=>c.id===window._rcCustId);
  const addrEl=document.getElementById('rc_addr');
  if (addrEl&&cust?.address) addrEl.value=cust.address;
}

// ดึงออเดอร์ของลูกค้าในวันที่เลือกมาใส่บิลอัตโนมัติ
// เปิด receipt modal ใหม่โดยข้ามการตรวจสอบใบซ้ำ (กรณีผู้ใช้ยืนยันสร้างใหม่)
function _forceNewInvoice(encodedName) {
  window._skipDupCheck = true;
  showCreateReceiptModal(null, encodedName);
}

function pullOrdersToReceipt() {
  const custId=window._rcCustId;
  if (!custId){U.toast('กรุณาเลือกลูกค้าก่อน','error');return;}

  const orders=(window._rcAllOrders||[]).filter(o=>
    o.customerId===custId && !isOrderFullyDelivered(o)
  );

  if (!orders.length){
    U.toast('ไม่พบออเดอร์ค้างส่งของลูกค้านี้', 'error');
    return;
  }

  // รวมรายการทั้งหมดจากทุกออเดอร์ (หักจำนวนที่จัดส่งไปแล้ว)
  const merged = {};
  orders.forEach(o=>(o.items||[]).forEach(i=>{
    const remain = i.qty - getDeliveredQty((o.deliveryStatus||{})[deliverKey(i)], i.qty, o.isDelivered);
    if (remain <= 0) return;
    const key = i.productName+'|'+i.price+'|'+(i.color||'')+'|'+(i.trimColor||'')+'|'+(i.style||'')+'|'+(i.specialNote||'');
    if (merged[key]) { merged[key].qty+=remain; }
    else { merged[key]={name:itemLabel(i),qty:remain,price:i.price}; }
  }));

  const items=Object.values(merged);
  window._rcItemIdx=items.length;
  document.getElementById('rcItemsBody').innerHTML=items.map((item,i)=>rcItemRow(i,item)).join('');
  calcRcTotal();
  U.toast(`✓ ดึง ${items.length} รายการ จาก ${orders.length} ออเดอร์ค้างส่ง`);
}

function itemLabel(i) {
  let label=i.productName||'';
  if (i.color && i.color!=='-') label+=' '+i.color;
  const isChrist = i.trimColor==='คริสต์' || i.style==='คริสต์';
  if (isChrist) label+=' ✝คริสต์';
  else if (i.trimColor) label+=' เส้น'+i.trimColor;
  if (i.extra)       label+=' '+i.extra;
  if (i.specialNote) label+=' ('+i.specialNote+')';
  return label;
}

async function onRcProdSelect(sel,i) {
  const opt=sel.options[sel.selectedIndex];
  const prodId=sel.value; if(!prodId)return;
  const defaultPrice=parseFloat(opt.dataset.price||0);
  let price=defaultPrice;
  if (window._rcCustId) price=await DB.getEffectivePrice(window._rcCustId,prodId,defaultPrice);
  const nameEl=document.getElementById(`rcname_${i}`);
  const priceEl=document.getElementById(`rcprice_${i}`);
  if (nameEl) nameEl.value=opt.dataset.name||opt.text;
  if (priceEl) priceEl.value=price;
  sel.value=''; calcRcTotal();
}

function calcRcTotal() {
  let sub=0;
  document.querySelectorAll('#rcItemsBody tr').forEach(row=>{
    const m=row.id?.match(/rcrow_(\d+)/); if(!m)return;
    const i=m[1];
    const qty=parseFloat(document.getElementById(`rcqty_${i}`)?.value||0);
    const pr=parseFloat(document.getElementById(`rcprice_${i}`)?.value||0);
    const t=qty*pr;
    const tel=document.getElementById(`rctotal_${i}`); if(tel)tel.textContent=U.money(t);
    sub+=t;
  });
  const disc=parseFloat(document.getElementById('rc_disc')?.value||0);
  const taxRate=parseFloat(document.getElementById('rc_tax')?.value||0);
  const base=sub-disc; const tax=base*taxRate/100;
  const s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=U.money(v);};
  s('rcs_sub',sub);s('rcs_disc',disc);s('rcs_tax',tax);s('rcs_total',base+tax);
}

async function saveReceipt(andPrint=false) {
  if (window._saving){return;} window._saving=true;
  const custId=document.getElementById('rc_cust')?.value||'';
  if (!custId){window._saving=false;U.toast('กรุณาเลือกลูกค้า','error');return;}
  const cust=(window._rcCustList||[]).find(c=>c.id===custId)||{};

  const items=[];
  document.querySelectorAll('#rcItemsBody tr').forEach(row=>{
    const m=row.id?.match(/rcrow_(\d+)/); if(!m)return;
    const i=m[1];
    const name=document.getElementById(`rcname_${i}`)?.value.trim();
    const qty=parseFloat(document.getElementById(`rcqty_${i}`)?.value||0);
    const price=parseFloat(document.getElementById(`rcprice_${i}`)?.value||0);
    if (name) items.push({name,qty,price});
  });
  if (!items.length){U.toast('กรุณาเพิ่มรายการสินค้า','error');return;}

  const editId=document.getElementById('rc_editId')?.value||'';
  const data={
    type:'receipt',
    customerId:custId, customerName:cust.name||'',
    customerAddress:document.getElementById('rc_addr')?.value.trim()||'',
    customerPhone:cust.phone||'', customerTaxId:cust.taxId||'',
    items,
    discount:parseFloat(document.getElementById('rc_disc')?.value||0),
    taxRate:parseFloat(document.getElementById('rc_tax')?.value||0),
    notes:document.getElementById('rc_notes')?.value.trim()||'',
  };

  // ── ป้องกันออกบิลซ้ำวันเดียวกัน (เฉพาะบิลใหม่) ──────────────────────
  if (!editId && !window._rcConfirmedDup) {
    const allInv=await DB.getInvoices();
    const todayStart=new Date(); todayStart.setHours(0,0,0,0);
    const existing=allInv.find(inv=>inv.customerId===custId&&inv.createdAt>=todayStart.getTime());
    if (existing) {
      const ap=andPrint;
      showModal('dupInvModal','พบใบเสร็จซ้ำ',
        `<div style="background:#fef3c7;border-radius:10px;padding:14px 18px;border-left:4px solid #f59e0b;margin-bottom:12px;">
           <strong style="color:#92400e;">⚠️ พบใบเสร็จวันนี้แล้ว</strong><br>
           <span style="font-size:13px;color:#78350f;">ลูกค้า <strong>${U.esc(cust.name)}</strong>
           มีใบเสร็จวันนี้แล้ว เลขที่ <strong>${U.esc(existing.invoiceNo)}</strong> (${U.money(U.invTotal(existing).total)})</span>
         </div>
         <p style="font-size:13px;color:#374151;margin:0;">ต้องการทำอะไร?</p>`,
        `<button class="btn btn-warning" onclick="closeModal('dupInvModal');showCreateReceiptModal('${existing.id}');">
           <i class="fa-solid fa-pen-to-square me-1"></i>แก้ไขใบเดิม (${U.esc(existing.invoiceNo)})
         </button>
         <button class="btn btn-primary" onclick="closeModal('dupInvModal');window._rcConfirmedDup=true;saveReceipt(${ap});">
           <i class="fa-solid fa-plus me-1"></i>ออกใบใหม่เพิ่ม
         </button>
         <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>`);
      return;
    }
  }
  window._rcConfirmedDup=false;
  // ─────────────────────────────────────────────────────────────────────────

  try {
    let savedId;
    if (editId){const old=await DB.getInvoice(editId);await DB.putInvoice({...old,...data});savedId=editId;U.toast('แก้ไขใบเสร็จแล้ว ✓');}
    else{data.invoiceNo=await DB.nextReceiptNo();savedId=await DB.addInvoice(data);U.toast('ออกใบเสร็จแล้ว ✓');}
    // ── บันทึก billedStatus กลับไปยังออเดอร์ต้นทาง (กันออกบิลซ้ำ) ──
    const plan = window._pendBillPlan; window._pendBillPlan = null;
    if (plan && plan.length && !editId) {
      const byOrder = {};
      for (const p of plan) { (byOrder[p.orderId] ||= {})[p.dKey] = p.qty; }
      const billedAt = Date.now();
      await Promise.all(Object.entries(byOrder).map(async ([oid, keyMap]) => {
        const o = await DB.getOrder(oid); if (!o) return;
        const bsNew = {...(o.billedStatus||{})};
        for (const [k, q] of Object.entries(keyMap)) bsNew[k] = {billedQty:q, invoiceId:savedId, billedAt};
        await DB.putOrder({...o, billedStatus: bsNew});
      })).catch(e => console.error('billedStatus write error:', e));
      // ล้างที่ติ๊กไว้ของลูกค้ารายนี้
      if (window._pendBillGid && window._pendSel) delete window._pendSel[window._pendBillGid];
      window._pendBillGid = null;
    }
    closeModal('rcModal');
    if (andPrint){
      const inv=await DB.getInvoice(savedId);
      setTimeout(()=>printReceiptData(inv), 400);
    }
    navigate('invoices');
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

async function showBulkInvoiceModal() {
  const [allOrders, allInvoices] = await Promise.all([DB.getOrders(), DB.getInvoices()]);

    U.toast('ไม่มีออเดอร์ค้างส่ง', 'info'); return;
  }

  // จัดกลุ่มตาม customerId
  const custMap = new Map();
  for (const o of pending) {
    const k = o.customerId || o.customerName;
    if (!custMap.has(k)) custMap.set(k, { id: o.customerId, name: o.customerName, orders: [] });
    custMap.get(k).orders.push(o);
  }

  // ตรวจบิลวันนี้แล้วหรือยัง
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);

    allInvoices.filter(i => i.createdAt >= todayStart.getTime()).map(i => i.customerId)
  );

    const totalQty = c.orders.reduce((s,o)=>(o.items||[]).reduce((ss,i)=>ss+i.qty,0)+s, 0);

      <td style="width:36px;text-align:center;">

    </tr>`;
  }).join('');

  const body = `

      เลือกลูกค้าที่ต้องการออกบิล ระบบจะรวมออเดอร์ค้างส่งทั้งหมดของแต่ละคนเป็น 1 บิล

    </div>

      <thead>
        <tr style="border-bottom:2px solid #e5e7eb;">
          <th style="width:36px;"></th>

async function bulkCreateInvoices(andPrint = false) {
  const checked = [...document.querySelectorAll('.bulk-inv-chk:checked')].map(c => c.value);
  if (!checked.length) { U.toast('กรุณาเลือกลูกค้าอย่างน้อย 1 คน', 'error'); return; }

  const raw = document.getElementById('bulkInvOrdersJson')?.value;
  if (!raw) return;
  const custList = JSON.parse(raw);
  const selectedList = custList.filter(c => checked.includes(c.id || c.name));

  closeModal('bulkInvModal');
  U.toast(`กำลังสร้าง ${selectedList.length} ใบเสร็จ...`);

  const createdInvs = [];
  for (const c of selectedList) {
    // รวมรายการ (เหมือน pullOrdersToReceipt)
    const merged = {};
    for (const o of c.orders) {
      for (const i of (o.items || [])) {
        const key = i.productName+'|'+i.price+'|'+(i.color||'')+'|'+(i.trimColor||'')+'|'+(i.style||'')+'|'+(i.specialNote||'');
        if (merged[key]) merged[key].qty += i.qty;
        else merged[key] = { name: itemLabel(i), qty: i.qty, price: i.price };
      }
    }
    const items = Object.values(merged);
    if (!items.length) continue;

    const data = {
      type: 'receipt',
      customerId: c.id,
      customerName: c.name,
      customerAddress: '',
      customerPhone: '',
      customerTaxId: '',
      items,
      discount: 0,
      taxRate: 0,
      notes: '',
      invoiceNo: await DB.nextReceiptNo(),
    };
    const savedId = await DB.addInvoice(data);
    const saved = await DB.getInvoice(savedId);
    if (saved) createdInvs.push(saved);
  }

  U.toast(`✓ ออกบิลแล้ว ${createdInvs.length} ใบ`);
  navigate('invoices');

  if (andPrint && createdInvs.length) {
    setTimeout(() => printMultipleReceipts(createdInvs), 600);
  }
}

function _promptpayPayload(rawId, amount) {
  function crc16(s){
    let c=0xFFFF;
    for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);}
    return(c&0xFFFF).toString(16).toUpperCase().padStart(4,'0');
  }
  function f(tag,val){return tag+String(val.length).padStart(2,'0')+val;}
  const id=rawId.replace(/[^0-9]/g,'');
  let ptype,pval;
  if(id.length===10){ptype='01';pval='0066'+id.slice(1);}
  else if(id.length===13){ptype='02';pval=id;}
  else return null;
  const acct=f('00','A000000677010111')+f(ptype,pval);
  let p=f('00','01')+f('01','11')+f('29',acct)+f('52','0000')+f('53','764');
  if(amount>0) p+=f('54',amount.toFixed(2));
  p+=f('58','TH')+f('59','PromptPay')+f('60','Bangkok')+'6304';
  return p+crc16(p);
}

function deleteInvoice(id) {
  U_confirm('ต้องการลบใบเสร็จนี้ใช่ไหม?', async(reason)=>{
    await DB.delInvoice(id, reason);U.toast('ลบใบเสร็จแล้ว');navigate('invoices');
  }, {askReason:true});
}

async function toggleInvPaid(id, paid) {
  const inv=await DB.getInvoice(id); if(!inv)return;
  await DB.putInvoice({...inv, isPaid:paid, paidAt:paid?Date.now():null, paidAmount:null});
  U.toast(paid?'บันทึกชำระแล้ว ✓':'ยกเลิกสถานะชำระแล้ว');
  navigate('invoices');
}

async function exportExcel() {
  U.toast('กำลังเตรียมไฟล์ Excel...');
  if (!(await ensureXLSX())) { U.toast('โหลดตัวสร้าง Excel ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต','error'); return; }
  const [invoices,customers]=await Promise.all([DB.getInvoices(),DB.getCustomers()]);
  invoices.sort((a,b)=>a.createdAt-b.createdAt);
  const invSheet=invoices.map(inv=>{
    const t=U.invTotal(inv);
    return {'เลขที่ใบเสร็จ':inv.invoiceNo||'','ลูกค้า':inv.customerName||'','วันที่':U.date(inv.createdAt),
      'รายการสินค้า':(inv.items||[]).map(i=>i.name+' x'+i.qty).join(', '),
      'ยอดก่อนส่วนลด':t.sub,'ส่วนลด':t.disc,'ยอดสุทธิ':t.total,
      'ชำระแล้ว (บาท)':invPaid(inv),'ยังค้าง (บาท)':Math.max(0,t.total-invPaid(inv)),
      'สถานะ':invPaid(inv)>=t.total&&t.total>0?'ชำระแล้ว':invPaid(inv)>0?'ชำระบางส่วน':'ค้างชำระ','วันที่ชำระ':inv.paidAt?U.date(inv.paidAt):''};
  });
  const outstanding={},outCount={};
  invoices.forEach(i=>{
    const rem=Math.max(0,U.invTotal(i).total-invPaid(i));
    if(rem>0&&i.customerId){outstanding[i.customerId]=(outstanding[i.customerId]||0)+rem;
      outCount[i.customerId]=(outCount[i.customerId]||0)+1;}
  });
  const custSheet=customers.filter(c=>outstanding[c.id]>0)
    .sort((a,b)=>(outstanding[b.id]||0)-(outstanding[a.id]||0))
    .map(c=>({'ชื่อลูกค้า':c.name,'จำนวนบิลค้าง':outCount[c.id]||0,'ยอดค้างชำระ (บาท)':outstanding[c.id]||0}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(invSheet),'ใบเสร็จทั้งหมด');
  if(custSheet.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(custSheet),'ยอดค้างชำระ');
  const d=new Date();
  XLSX.writeFile(wb,'kailoong_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.xlsx');
  U.toast('Export Excel สำเร็จ ✓');
}

function setReportRange(r) {
  window._reportRange = r;
  navigate('reports');
}

async function renderReports(el) {
  // ── ดึง filter ที่บันทึกไว้ (default: เดือนนี้) ──
  const rng = window._reportRange || 'month';
  const now = new Date();
  function getRangeTs(r) {
    const y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
    if (r==='today')  return new Date(y,m,d).getTime();
    if (r==='week')   return new Date(y,m,d-now.getDay()).getTime();
    if (r==='month')  return new Date(y,m,1).getTime();
    if (r==='year')   return new Date(y,0,1).getTime();
    if (r==='custom') {
      const v=document.getElementById('rpt_from')?.value||window._reportFrom||'';
      return v ? new Date(v).getTime() : 0;
    }
    return 0; // all
  }
  function getRangeEnd(r) {
    if (r==='custom') {
      const v=document.getElementById('rpt_to')?.value||window._reportTo||'';
      return v ? new Date(v).setHours(23,59,59,999) : Date.now();
    }
    return Date.now();
  }
  const rangeStart = getRangeTs(rng);
  const rangeEnd   = getRangeEnd(rng);

  const rangeLabels={today:'วันนี้',week:'สัปดาห์นี้',month:'เดือนนี้',year:'ปีนี้',all:'ทั้งหมด',custom:'กำหนดเอง'};

  // ไม่ดึง customers แล้ว — การ์ด "ลูกค้าทั้งหมด" ย้ายไปอยู่หน้าตั้งค่า/หน้าลูกค้า
  // ดึงน้อยลง 1 คอลเลกชัน = ประหยัดโควต้าอ่านของ Firestore
  const [orders,invoices,expenses]=await Promise.all([DB.getOrders(),DB.getInvoices(),DB.getExpenses()]);

  // ── วันนี้ (fixed — ไม่เปลี่ยนตาม filter) ──
  const todayOrders=orders.filter(o=>U.isToday(o.createdAt));
  const todayItemsMap={};
  todayOrders.forEach(o=>(o.items||[]).forEach(i=>{
    if(!todayItemsMap[i.productName])todayItemsMap[i.productName]={qty:0,total:0};
    todayItemsMap[i.productName].qty+=i.qty;
    todayItemsMap[i.productName].total+=i.qty*i.price;
  }));
  const todayTotal=todayOrders.reduce((a,o)=>a+U.orderTotal(o),0);

  // ── ช่วงที่เลือก ──
  const rangeInvoices=invoices.filter(i=>i.createdAt>=rangeStart&&i.createdAt<=rangeEnd);
  const rangeOrders=orders.filter(o=>o.createdAt>=rangeStart&&o.createdAt<=rangeEnd);
  const rangeExpenses=expenses.filter(e=>e.date>=rangeStart&&e.date<=rangeEnd);
  const monthIncome=rangeInvoices.reduce((a,i)=>a+U.invTotal(i).total,0);

  // ── 6 เดือน ──
  const months=Array.from({length:6},(_,k)=>{
    const d=new Date(now.getFullYear(),now.getMonth()-5+k,1);
    return {year:d.getFullYear(),month:d.getMonth(),label:d.toLocaleDateString('th-TH-u-ca-buddhist',{month:'short',year:'2-digit'})};
  });
  const monthRevenue=months.map(m=>invoices.filter(r=>{const d=new Date(r.createdAt);return d.getFullYear()===m.year&&d.getMonth()===m.month;}).reduce((a,r)=>a+U.invTotal(r).total,0));
  const monthOrderCt=months.map(m=>orders.filter(o=>{const d=new Date(o.createdAt);return d.getFullYear()===m.year&&d.getMonth()===m.month;}).length);

  // ── สินค้าขายดี (ตามช่วงที่เลือก) ──
  const prodCount={};
  rangeOrders.forEach(o=>(o.items||[]).forEach(i=>{prodCount[i.productName]=(prodCount[i.productName]||0)+i.qty;}));
  const topProds=Object.entries(prodCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const avgOrder=rangeOrders.length?rangeOrders.reduce((a,o)=>a+U.orderTotal(o),0)/rangeOrders.length:0;

  // ── กำไร/ขาดทุน (ตามช่วงที่เลือก) ──
  const monthExpenseTotal = rangeExpenses.reduce((a,e)=>a+(e.amount||0),0);
  const allExpenseTotal   = expenses.reduce((a,e)=>a+(e.amount||0),0);
  const allIncomeTotal    = invoices.reduce((a,i)=>a+U.invTotal(i).total,0);
  const monthProfit       = monthIncome - monthExpenseTotal;
  const allProfit         = allIncomeTotal - allExpenseTotal;

  // ── Top ลูกค้า (ตามช่วงที่เลือก) ──
  const custMap={};
  rangeOrders.forEach(o=>{
    if(!custMap[o.customerId]) custMap[o.customerId]={name:o.customerName,orderCount:0,total:0,items:0};
    custMap[o.customerId].orderCount++;
    custMap[o.customerId].total+=U.orderTotal(o);
    custMap[o.customerId].items+=(o.items||[]).reduce((a,i)=>a+i.qty,0);
  });
  const topCusts=Object.values(custMap).sort((a,b)=>b.total-a.total).slice(0,5);

  // ── ยอดขาย 6 เดือน: หาค่าสูงสุดไว้คิดความสูงแท่ง (กัน /0 ตอนยังไม่มีข้อมูล) ──
  const maxRev  = Math.max(1, ...monthRevenue);
  const maxProd = Math.max(1, ...topProds.map(([,v]) => v));
  const curMi   = months.length - 1;   // เดือนปัจจุบันคือช่องสุดท้าย

  el.innerHTML=`
  <div class="oh">
    <div><h2>รายงาน</h2>
      <div class="cnt">${rangeLabels[rng]} · <b>${rangeOrders.length}</b> ออเดอร์ · <b>${rangeInvoices.length}</b> ใบเสร็จ</div></div>
  </div>

  <div class="ochips">
    ${['today','week','month','year','all','custom'].map(r=>`
      <button type="button" class="ochip${rng===r?' on':''}" onclick="setReportRange('${r}')">${rangeLabels[r]}</button>`).join('')}
  </div>

  ${rng==='custom' ? `
  <div class="rpanel" style="padding:13px 14px;">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;">
      <input type="date" id="rpt_from" value="${window._reportFrom||''}" onchange="window._reportFrom=this.value"
        style="flex:1;min-width:130px;min-height:44px;border:1px solid #e6ebf1;border-radius:11px;padding:0 10px;font-family:inherit;">
      <span style="color:#64748b;">ถึง</span>
      <input type="date" id="rpt_to" value="${window._reportTo||''}" onchange="window._reportTo=this.value"
