<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ขายโลง">
<meta name="theme-color" content="#1a2332">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>ระบบจัดการธุรกิจ — ขายส่งโลงศพ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<!-- chart.js / xlsx ไม่โหลดตรงนี้แล้ว — โหลดตอนใช้จริงผ่าน loadScriptOnce()
     ช่วยให้หน้าแรกเบาลงเกือบ 1 MB (ดู renderReports / exportExcel) -->
<style>
* { font-family: 'Sarabun', sans-serif; }
body { background: #f0f2f5; margin: 0; }

/* ── Sidebar ── */
#sidebar {
  width: 240px; min-height: 100vh; background: #1a2332;
  position: fixed; top: 0; left: 0; z-index: 100;
  display: flex; flex-direction: column; transition: width .25s;
}
#sidebar .brand { padding: 22px 20px 18px; border-bottom: 1px solid #2d3f57; color: #fff; }
#sidebar .brand .biz-name { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; }
#sidebar .brand .biz-sub  { font-size:12.5px; color: #8fa3bf; margin-top: 2px; }
#sidebar nav { padding: 12px 0; flex: 1; }
#sidebar .nav-link {
  color: #8fa3bf; padding: 11px 20px; font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  border: none; background: none; text-decoration: none; width: 100%; transition: all .18s;
}
#sidebar .nav-link i { width: 18px; text-align: center; font-size: 15px; }
#sidebar .nav-link:hover { color: #fff; background: #243040; }
#sidebar .nav-link.active { color: #fff; background: #2563eb; }
#sidebar .nav-section { font-size:12px; color: #506070; padding: 14px 20px 4px; text-transform: uppercase; letter-spacing: 1px; }

/* ── Main ── */
#main { margin-left: 240px; min-height: 100vh; max-width: calc(100vw - 240px); overflow-x: hidden; }
#topbar {
  background: #fff; border-bottom: 1px solid #e5e7eb;
  padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
#topbar h1 { font-size: 20px; font-weight: 700; margin: 0; color: #1a2332; }
#page-content { padding: 28px; box-sizing: border-box; }

/* ── Cards ── */
.stat-card {
  background: #fff; border-radius: 12px; padding: 22px 24px;
  border: 1px solid #e8ecf0; box-shadow: 0 1px 4px rgba(0,0,0,.04);
}
.stat-card .label { font-size: 13px; color: #6b7280; font-weight: 500; }
.stat-card .value { font-size: 28px; font-weight: 700; color: #1a2332; margin: 4px 0 0; line-height: 1.2; }
.stat-card .sub   { font-size: 12px; color: #6b7280; margin-top: 2px; }
.stat-card .icon-wrap {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.card-box { background: #fff; border-radius: 12px; border: 1px solid #e8ecf0; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
.card-box .card-head {
  padding: 16px 20px; border-bottom: 1px solid #f1f3f5;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.card-box .card-head h2 { font-size: 16px; font-weight: 700; margin: 0; color: #1a2332; }

/* ── Table ── */
.table-clean { width: 100%; border-collapse: collapse; }
.table-clean th {
  font-size: 12px; color: #6b7280; font-weight: 600; padding: 10px 16px;
  background: #f8f9fa; text-transform: uppercase; letter-spacing: .4px;
  border-bottom: 1px solid #e8ecf0; white-space: nowrap;
}
.table-clean td { padding: 13px 16px; font-size: 14px; color: #374151; border-bottom: 1px solid #f1f3f5; vertical-align: middle; }
.table-clean tr:last-child td { border-bottom: none; }
.table-clean tr:hover td { background: #fafbfc; }

/* ── Forms ── */
.form-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
.form-control, .form-select {
  font-size: 14px; border-radius: 8px; border-color: #d1d5db;
  font-family: 'Sarabun', sans-serif;
}
.form-control:focus, .form-select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

/* ── Modal ── */
.modal-header { border-bottom: 1px solid #f1f3f5; padding: 18px 24px; }
.modal-footer { border-top: 1px solid #f1f3f5; padding: 14px 24px; }
.modal-title  { font-size: 17px; font-weight: 700; }
.modal-body   { padding: 24px; overflow-x: hidden; }
.modal-content { border-radius: 14px; border: none; }

/* ── Buttons ── */
.btn-primary  { background: #2563eb; border-color: #2563eb; font-weight: 600; }
.btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
.btn-sm { font-size: 13px; padding: 5px 12px; }
.btn-icon { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; }

/* ── Misc ── */
.empty-state { text-align: center; padding: 60px 20px; color: #6b7280; }
.empty-state i { font-size: 42px; margin-bottom: 12px; display: block; }
.empty-state p { margin: 0; font-size: 15px; }
.search-box { position: relative; }
.search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 13px; }
.search-box input { padding-left: 34px; }
.ord-item { display: inline-block; }
.ord-item-d { display: inline; }
.ord-item-d + .ord-item-d::before { content: ' · '; color: #6b7280; }

/* ── Order item rows ── */
.items-table { width: 100%; border-collapse: collapse; }
.items-table th { font-size: 12px; color: #6b7280; font-weight: 600; padding: 8px 10px; background: #f8f9fa; border: 1px solid #e8ecf0; }
.items-table td { padding: 7px 8px; border: 1px solid #e8ecf0; font-size: 14px; vertical-align: middle; }
.items-table td input, .items-table td select {
  border: none; background: transparent; font-family: 'Sarabun',sans-serif;
  font-size: 14px; width: 100%; padding: 2px 4px;
}
.items-table td input:focus, .items-table td select:focus { outline: 1px solid #2563eb; border-radius: 4px; background: #f0f7ff; }

/* ── Total box ── */
.total-box { background: #f8f9fa; border-radius: 10px; padding: 14px 18px; }
.total-row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; color: #374151; }
.total-row.grand { font-size: 18px; font-weight: 700; color: #1a2332; border-top: 1px solid #e8ecf0; margin-top: 8px; padding-top: 10px; }

/* ── Customer price badge ── */
.price-custom { background: #dbeafe; color: #1e40af; font-size:12.5px; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
.badge-paid { background:#dcfce7; color:#166534; font-size:12.5px; padding:2px 8px; border-radius:20px; font-weight:600; }
.badge-unpaid { background:#fef3c7; color:#92400e; font-size:12.5px; padding:2px 8px; border-radius:20px; font-weight:600; white-space:nowrap; }
.badge-partial { background:#fff3cd; color:#856404; font-size:12.5px; padding:2px 8px; border-radius:20px; font-weight:600; white-space:nowrap; }
.badge-outstanding { background:#fee2e2; color:#991b1b; font-size:12.5px; padding:2px 8px; border-radius:20px; font-weight:600; }

/* ── Today highlight ── */
/* ปลายอ่อนของ gradient เดิมสว่างเกินไป (#2563eb / #0d9488) ตัวหนังสือขาว
   ที่ทับอยู่ตรงนั้นได้ contrast แค่ 3.7-4.4 ตกเกณฑ์อ่านง่าย (ต้อง 4.5 ขึ้นไป)
   ทำปลายให้เข้มลงหนึ่งขั้น ตัวหนังสือทุกตัวบนการ์ดผ่านเกณฑ์พร้อมกันหมด
   ฟ้า  #2563eb → #1d4ed8  (ขาวได้ 6.70)
   เขียว #0d9488 → #0f766e  (ขาวได้ 5.47) */
.today-card { background: linear-gradient(135deg,#1e3a5f,#1d4ed8); color: #fff; border-radius: 14px; padding: 20px 24px; }
.cust-today-card { background: linear-gradient(135deg,#134e4a,#0f766e); color: #fff; border-radius: 14px; padding: 20px 24px; overflow-y:auto;max-height:420px; }
.btn-card-outline { background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:7px;padding:5px 12px;font-size:13px;cursor:pointer; }
.btn-card-outline:hover { background:rgba(255,255,255,.15); }
.btn-card-solid { background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600; }
.btn-card-solid:hover { background:rgba(255,255,255,.35); }
/* ปุ่มรับออเดอร์ใหม่ — เด่นกว่าปุ่มอื่นในการ์ด */
.btn-neworder-hero {
  display:inline-flex; align-items:center; gap:7px;
  background:#fff; color:#065f46; border:none; border-radius:9px;
  padding:9px 18px; font-size:14.5px; font-weight:800; cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.22); transition:transform .12s, box-shadow .12s;
  font-family:'Sarabun',sans-serif; white-space:nowrap;
}
.btn-neworder-hero i { font-size:15px; }
.btn-neworder-hero:hover { transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.28); }
.btn-neworder-hero:active { transform:translateY(0); }
@media (max-width:767px){ .btn-neworder-hero { width:100%; justify-content:center; padding:11px; font-size:15px; } }
.today-card h3 { font-size: 15px; font-weight: 700; margin: 0 0 14px; opacity: .85; }
.today-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 14px; }
.today-item:last-child { border-bottom: none; }
/* ชิปเลือกลูกค้า — เดิมขาวโปร่ง 15% บนพื้นเขียว ตัวหนังสือขาวได้ contrast ~3.4
   กลางแดดอ่านไม่ออก เปลี่ยนเป็นพื้นขาวทึบ ตัวหนังสือเขียวเข้ม ได้เกิน 12
   หมายเหตุ: เอกสารแนะนำให้เพิ่มความทึบของพื้นขาว ซึ่งกลับทำให้แย่ลง
   เพราะพื้นยิ่งสว่าง ตัวหนังสือขาวยิ่งจม */
.cust-chip { background:rgba(255,255,255,.92);border:none;color:#0f3d38;border-radius:20px;padding:4px 12px;font-size:12.5px;cursor:pointer;font-weight:600;transition:transform .06s,box-shadow .15s;white-space:nowrap;line-height:1.4; }
.cust-chip:hover { background:#fff; }
.cust-chip:active { transform:scale(.96); }
/* active ไม่ได้บอกด้วยสีอย่างเดียว — มีวงแหวนรอบและตัวหนาขึ้นด้วย */
.cust-chip.active { background:#fff;color:#0b2e2a;font-weight:800;box-shadow:0 0 0 2.5px rgba(255,255,255,.6); }

/* ── การตอบสนองเวลาแตะบนมือถือ ── */
/* ยุบตัวทันทีที่นิ้วแตะ ให้รู้ว่ากดติดแล้ว ไม่ต้องกดซ้ำ */
.oc-color:active, .oc-stp:active, .oc-ico:active, .btn-icon:active,
.bnav-item:active, .oc-trim:active { transform: scale(.96); }
.oc-color, .oc-stp, .oc-ico, .btn-icon, .bnav-item, .oc-trim { transition: transform .05s ease; }

/* จอสัมผัสไม่มี hover จริง — ถ้าไม่ดักไว้ สีตอน hover จะค้างหลังปล่อยนิ้ว
   ทำให้ดูเหมือนปุ่มยังถูกเลือกอยู่ ทั้งที่กดไปแล้ว */
@media (hover: none) {
  .btn-card-outline:hover { background: transparent; }
  .btn-card-solid:hover   { background: rgba(255,255,255,.22); }
  .cust-chip:hover        { background: rgba(255,255,255,.92); }
  .cust-chip.active:hover { background: #fff; }
  .btn-neworder-hero:hover { transform: none; box-shadow: 0 2px 10px rgba(0,0,0,.22); }
  .dash-recent tr:hover   { background: transparent; }
}

/* ── Scrollable ── */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; display: block; width: 100%; }

/* ── Print ── */
@media print {
  #sidebar, #main, #topbar, #modal-container { display: none !important; }
  #print-area { display: block !important; }
  body { background: #fff; }
  @page { size: A5 portrait; margin: 8mm 10mm; }

  /* บังคับให้สีและ background พิมพ์ออกมาครบ ไม่ซีด */
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }

  /* ซ่อน toast และ modal backdrop ตอนปริ้น */
  .toast-notif, .modal-backdrop, .modal { display: none !important; }
}
#print-area { display: none; }

/* ── Receipt design — clean black & white ── */
.inv-page { font-family: 'Sarabun', sans-serif; color: #000; background: #fff; max-width: 680px; margin: 0 auto; }
.inv-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 10px; border-bottom: 2px solid #000; margin-bottom: 12px; }
.inv-company h1 { font-size: 18px; font-weight: 800; color: #000; margin: 0 0 3px; }
.inv-company p  { font-size:12.5px; color: #333; margin: 2px 0; }
.inv-doc-info { text-align: right; }
.inv-doc-info .doc-type { font-size: 20px; font-weight: 800; color: #000; margin-bottom: 4px; }
.inv-doc-info table { margin-left: auto; font-size:12.5px; }
.inv-doc-info td { padding: 1px 4px; color: #000; }
.inv-doc-info td:first-child { color: #555; padding-right: 8px; }
.inv-doc-info td:last-child { font-weight: 700; }
.inv-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.inv-party { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 8px 12px; }
.inv-party h3 { font-size: 9px; text-transform: uppercase; color: #555; margin: 0 0 4px; letter-spacing: 1px; border-bottom: 1px solid #ddd; padding-bottom: 3px; }
.inv-party p  { font-size: 12px; margin: 1px 0; color: #000; }
.inv-items table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.inv-items th { background: #fff; color: #000; font-size:12.5px; font-weight: 700; padding: 6px 10px; border-top: 2px solid #000; border-bottom: 1px solid #000; }
.inv-items td { padding: 6px 10px; border-bottom: 1px solid #ddd; font-size: 12px; color: #000; background: #fff; }
.inv-totals { display: flex; justify-content: flex-end; margin-bottom: 12px; }
.inv-totals table { font-size: 12px; min-width: 220px; border-top: 1px solid #ccc; }
.inv-totals td { padding: 3px 8px; color: #000; }
.inv-totals .grand-row td { font-size: 15px; font-weight: 800; border-top: 2px solid #000; padding-top: 6px; }
.inv-notes { font-size:12.5px; color: #333; border: 1px solid #ccc; padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; background: #fff; }
.inv-sig { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 24px; }
.inv-sig-box { text-align: center; }
.inv-sig-box .sig-line { border-top: 1px solid #000; margin-top: 36px; padding-top: 5px; font-size:12.5px; color: #333; }

/* ── Bottom Nav (mobile) ── */
#bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 200;
  background: #1a2332;
  border-top: 1px solid #2d3f57;
  justify-content: space-around;
  align-items: stretch;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: none; border: none; color: #8fa3bf;
  font-size:12px; gap: 3px; padding: 8px 4px; cursor: pointer;
  transition: color .15s; min-height: 56px;
}
.bnav-item i { font-size: 19px; }
.bnav-item span { font-family: 'Sarabun', sans-serif; }
.bnav-item.active { color: #60a5fa; }
.bnav-item:hover { color: #fff; }
/* ── ปุ่มรับออเดอร์กลางแถบล่าง ──
   งานที่ทำบ่อยที่สุดของร้าน ควรกดได้จากทุกหน้าโดยไม่ต้องกลับหน้าแรกก่อน
   ลอยขึ้นเหนือแถบ + ขอบสีเดียวกับแถบ ทำให้ดูเหมือนเจาะทะลุออกมา หาง่ายด้วยหางตา */
.bnav-fab {
  flex: 0 0 auto; align-self: stretch; width: 88px;
  background: none; border: none; padding: 8px 4px 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px;
}
/* วงกลมลอยขึ้นเหนือแถบ ขอบสีเดียวกับพื้นแถบจึงดูเหมือนเจาะทะลุออกมา */
.bnav-fab .fc {
  width: 54px; height: 54px; border-radius: 50%; margin-top: -26px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  border: 4px solid #1a2332;
  box-shadow: 0 5px 14px rgba(37,99,235,.5);
  color: #fff; display: flex; align-items: center; justify-content: center;
  transition: transform .05s ease;
}
.bnav-fab .fc i { font-size: 22px; }
/* ป้ายอยู่ "นอก" วงกลม — ถ้ายัดไว้ในวงคำว่า รับออเดอร์ จะล้นออกมาเป็นแถบดำ */
.bnav-fab .fl {
  font-size: 12px; font-weight: 700; color: #60a5fa;
  font-family: 'Sarabun', sans-serif; white-space: nowrap;
}
.bnav-fab:active .fc { transform: scale(.93); }
/* ── ซ่อนแถบล่างตอนเปิดฟอร์ม ──
   แถบล่างเป็น position:fixed z-index 200 ส่วนฉากมืดของ Bootstrap อยู่ที่ 1050
   → แถบยังถูกวาดอยู่ใต้ฉากมืด กลายเป็นแถบจาง ๆ โผล่ใต้ฟอร์ม
   และปุ่มกลมที่ลอยขึ้น 26px ก็ไปโผล่ในช่องว่างระหว่างขอบฟอร์มกับแถบพอดี
   (วัดจริงบนจอ 375x812: ฟอร์มจบที่ 728 ปุ่มกลมอยู่ 736 แถบเริ่ม 753)

   ใช้เลื่อนลง+จางหาย ไม่ใช่ display:none เพราะ display กระพริบหายทันที
   ระยะ 130% เผื่อปุ่มกลมที่ยื่นพ้นขอบบนของแถบขึ้นมา 26px ให้ลงไปพ้นจอด้วย
   จังหวะ .24s ใกล้เคียงกับที่ฟอร์มของ Bootstrap เลื่อนขึ้นมา จะได้ไปด้วยกัน */
#bottom-nav { transition: transform .24s ease, opacity .2s ease; }
body.modal-open #bottom-nav {
  transform: translateY(130%);
  opacity: 0;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  #bottom-nav { transition: none; }
}

/* ══ ฟอร์มรับออเดอร์ — ขั้นที่เสร็จแล้ว / ขั้นที่ทำอยู่ ══ */
/* ขั้นที่เลือกเสร็จ: แถบเขียวเต็มใบ เห็นปราดเดียวว่าข้อไหนทำแล้ว
   พื้นเขียวอ่อน + ขอบเขียว + แถบเขียวเข้มด้านซ้าย — ย้ำ 3 ชั้นให้คนแก่ไม่พลาด */
.ocd { display:flex; align-items:center; gap:11px; background:#f0fdf4;
  border:1.5px solid #86efac; border-left:5px solid #16a34a;
  border-radius:14px; padding:9px 11px; margin-bottom:8px; }
.ocd .ck { width:29px; height:29px; border-radius:9px; background:#16a34a; color:#fff; font-size:13px;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  box-shadow:0 2px 5px rgba(22,163,74,.3); }
.ocd .tx { flex:1; min-width:0; }
.ocd .lb { font-size:11.5px; color:#15803d; font-weight:700; line-height:1.2; }
.ocd .vl { font-weight:800; font-size:15.5px; color:#0f172a; margin-top:1px;
  display:flex; align-items:center; gap:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ocd .change { font-size:13px; font-weight:700; color:#15803d; flex:0 0 auto;
  background:#fff; border:1.5px solid #bbf7d0; border-radius:9px;
  padding:9px 11px; min-height:44px; font-family:inherit; cursor:pointer; }
/* ขั้นที่ยังไม่บังคับและยังไม่ได้เลือก (เช่น ขนาด) — เทา ไม่ใช่เขียว จะได้ไม่สับสนว่าทำแล้ว */
.ocd.skip { background:#fff; border:1.5px solid #e9eef5; border-left:5px solid #cbd5e1; }
.ocd.skip .lb { color:#64748b; }   /* #94a3b8 บนขาว = 2.56 ตกเกณฑ์ ต้องเข้มกว่านี้ */

/* ขั้นที่กำลังทำ: การ์ดขอบน้ำเงิน เด่นกว่าทุกอย่างบนจอ */
.oca { background:#fff; border:2px solid #2563eb; border-radius:18px; padding:15px;
  margin-bottom:12px; box-shadow:0 6px 18px rgba(37,99,235,.12); }
.oca .ah { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.oca .num { width:30px; height:30px; border-radius:9px; background:#2563eb; color:#fff;
  font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.oca .at { font-weight:800; font-size:16px; }
.oca .fl { font-size:12.5px; color:#64748b; font-weight:600; margin-bottom:7px; }

/* จำนวน — ปุ่มใหญ่ 58px คนแก่กดไม่พลาด */
.ocq { display:flex; align-items:stretch; gap:9px; height:58px; margin-bottom:13px; }
.ocq button { width:56px; flex:0 0 auto; border:2px solid #e2e8f0; background:#fff; border-radius:14px;
  font-size:27px; font-weight:800; color:#334155; font-family:inherit; cursor:pointer;
  display:flex; align-items:center; justify-content:center; }
.ocq button.plus { background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; border:none; }
.ocq button.bulk { width:50px; font-size:15px; }
.ocq .n { flex:1; border:1px solid #eef2f6; border-radius:14px; background:#f8fafc;
  display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ocq .n b { font-size:26px; font-weight:800; line-height:1; }
.ocq .n em { font-size:10.5px; color:#64748b; font-style:normal; margin-top:2px; }

/* ราคา — ตัวใหญ่ ชิดขวา มี ฿ นำ และ บาท ปิดท้าย */
.ocp { position:relative; margin-bottom:12px; }
.ocp input { width:100%; height:54px; border:1.5px solid #e2e8f0; border-radius:14px; background:#fff;
  font-family:inherit; font-size:21px; font-weight:800; text-align:right; padding:0 54px 0 34px; color:#0f172a; }
.ocp .cap { position:absolute; left:15px; top:50%; transform:translateY(-50%);
  font-size:16px; color:#64748b; font-weight:800; pointer-events:none; }
.ocp .cur { position:absolute; right:15px; top:50%; transform:translateY(-50%);
  font-size:14px; color:#64748b; font-weight:800; pointer-events:none; }

/* บรรทัดสรุปก่อนกดเพิ่ม — เห็นผลคูณก่อน จะได้ไม่กดผิดแล้วมารู้ทีหลัง */
.ocline { display:flex; align-items:center; justify-content:space-between; background:#f0fdf4;
  border:1px solid #bbf7d0; border-radius:12px; padding:10px 13px; margin-bottom:13px;
  font-size:13px; color:#15803d; font-weight:600; }
.ocline b { font-size:17px; font-weight:800; }

.ocadd { width:100%; height:54px; border:none; border-radius:14px; cursor:pointer;
  background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; font-family:inherit;
  font-weight:800; font-size:16px; box-shadow:0 4px 12px rgba(22,163,74,.3); }
.ocadd:active { transform:scale(.985); }
.occancel { width:100%; height:44px; margin-top:8px; border:none; background:none; cursor:pointer;
  font-family:inherit; font-size:13.5px; font-weight:700; color:#64748b; }

/* ══ หน้าออเดอร์ — การ์ดแทนตาราง ══ */
.oh { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
.oh h2 { font-size:22px; font-weight:800; margin:0; letter-spacing:-.3px; }
.oh .cnt { font-size:12.5px; color:#64748b; margin-top:2px; }
.oh .cnt b { color:#2563eb; }
.osearch { display:flex; align-items:center; gap:9px; background:#fff; border:1px solid #e6ebf1;
  border-radius:13px; padding:0 14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
.osearch i { color:#94a3b8; font-size:14px; }
.osearch input { flex:1; border:none; outline:none; background:none; font-family:inherit;
  font-size:14px; padding:12px 0; min-height:44px; }
/* ชิปกรอง — เลื่อนซ้ายขวาได้ ไม่ตัดบรรทัด */
.ochips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none; }
.ochips::-webkit-scrollbar { display:none; }
.ochip { flex:0 0 auto; font-size:13px; font-weight:600; padding:0 15px; min-height:44px;
  border-radius:999px; background:#fff; border:1px solid #e6ebf1; color:#475569;
  display:flex; align-items:center; gap:6px; font-family:inherit; cursor:pointer; }
.ochip .b { background:#eef2f6; border-radius:999px; padding:0 7px; font-size:11.5px; font-weight:700; color:#64748b; }
.ochip.on { background:#0f172a; border-color:#0f172a; color:#fff; }
.ochip.on .b { background:rgba(255,255,255,.22); color:#fff; }

.ocard { position:relative; background:#fff; border-radius:18px; padding:15px 15px 13px 18px;
  margin-bottom:13px; box-shadow:0 2px 10px rgba(15,23,42,.06); overflow:hidden; }
.ocard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:#cbd5e1; }
.ocard.s-craft::before { background:#ea580c; }
.ocard.s-ready::before { background:#16a34a; }
.ocard.s-sent::before  { background:#94a3b8; }
.ocard .top { display:flex; align-items:flex-start; gap:11px; }
.ocard .ava { width:42px; height:42px; border-radius:12px; display:flex; align-items:center;
  justify-content:center; color:#fff; font-weight:800; font-size:17px; flex:0 0 auto; }
.ocard .who { flex:1; min-width:0; }
.ocard .nm { font-weight:800; font-size:16px; line-height:1.15; }
.ocard .no { display:flex; align-items:center; gap:5px; flex-wrap:wrap; font-size:11.5px; color:#64748b; margin-top:3px; }
.ocard .no .code { background:#f1f5f9; border-radius:5px; padding:1px 7px; font-weight:600; }
.ocard .amt { text-align:right; flex:0 0 auto; }
.ocard .amt .n { font-weight:800; font-size:17px; line-height:1; }
.ocard .amt .u { font-size:11px; color:#64748b; font-weight:600; }
.ocard .its { margin-top:12px; border-top:1px dashed #e9eef4; padding-top:10px;
  display:flex; flex-direction:column; gap:7px; }
.ocard .it { display:flex; align-items:center; gap:8px; font-size:13px; color:#334155; }
.ocard .it .dot { width:11px; height:11px; border-radius:50%; flex:0 0 auto;
  border:2px solid #fff; box-shadow:0 0 0 1px #e2e8f0; }
.ocard .it .nm2 { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ocard .it .q { font-weight:700; color:#0f172a; }
.ocard .it .ck { width:19px; height:19px; border-radius:50%; font-size:10px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; background:#dcfce7; color:#15803d; }
.ocard .it .ck.wait { background:#fef3c7; color:#a16207; }
.ocard .stat { display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
.otag { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:5px 10px; border-radius:8px; }
.otag.craft { background:#fff7ed; color:#9a3412; }
.otag.ready { background:#ecfdf5; color:#047857; }
.otag.sent  { background:#f1f5f9; color:#475569; }
.ocard .prog { margin-top:11px; }
.ocard .prog .lbl { display:flex; justify-content:space-between; font-size:11.5px; color:#64748b; margin-bottom:5px; }
.ocard .bar { height:7px; border-radius:999px; background:#eef2f6; overflow:hidden; }
.ocard .bar > i { display:block; height:100%; border-radius:999px; }
.ocard .acts { display:flex; gap:9px; margin-top:14px; }
.ocard .aa { flex:1; min-height:44px; border-radius:12px; border:1px solid #e6ebf1; background:#fff;
  display:flex; align-items:center; justify-content:center; gap:7px;
  font-weight:700; font-size:13.5px; font-family:inherit; cursor:pointer; }
.ocard .aa.edit { color:#1d4ed8; background:#f5f8ff; border-color:#dbe6ff; }
.ocard .aa.add  { color:#047857; background:#f0fdf4; border-color:#bbf7d0; }
.ocard .aa.del  { color:#b91c1c; background:#fef2f2; border-color:#fcd6d6; }
.omore { width:100%; min-height:48px; border-radius:13px; border:1px dashed #cbd5e1; background:#fff;
  font-family:inherit; font-size:13.5px; font-weight:700; color:#475569; cursor:pointer; margin-bottom:10px; }
/* จอกว้างวางสองคอลัมน์ ไม่ให้การ์ดยืดจนอ่านยาก */
@media (min-width: 900px) { #ordersList, #invList { display:grid; grid-template-columns:1fr 1fr; gap:0 13px; } }

/* ══ หน้าใบเสร็จ — การ์ดแทนตาราง ══ */
/* แถบสรุปยอดขาย — แบบร่างเดิมเป็น "ยอดค้างชำระรวม" แต่ร้านเก็บเงินสดตลอด
   เลขนั้นจะเป็น 0 ทุกวันตลอดไป จึงเปลี่ยนเป็นยอดขายที่ได้ใช้จริง */
.ivsum { border-radius:16px; padding:15px 16px; margin-bottom:12px; color:#fff;
  background:linear-gradient(135deg,#5b21b6,#7c3aed); box-shadow:0 6px 16px rgba(124,58,237,.28);
  display:flex; align-items:center; gap:14px; }
.ivsum .big { font-size:24px; font-weight:800; line-height:1; }
.ivsum .lb { font-size:12px; opacity:.9; margin-top:3px; }
.ivsum .divi { width:1px; height:34px; background:rgba(255,255,255,.25); }
.ivsum .side { margin-left:auto; text-align:right; }
.ivsum .side .n { font-size:17px; font-weight:800; }
.ivsum .side .l { font-size:11px; opacity:.85; }

.ivcard { position:relative; background:#fff; border-radius:18px; padding:15px 15px 13px 18px;
  margin-bottom:13px; box-shadow:0 2px 10px rgba(15,23,42,.06); overflow:hidden; }
.ivcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:#16a34a; }
.ivcard.nopay::before { background:#ea580c; }
.ivcard .top { display:flex; align-items:flex-start; gap:11px; }
.ivcard .ivno { flex:1; min-width:0; }
.ivcard .no { font-weight:800; font-size:15.5px; display:flex; align-items:center; gap:7px; }
.ivcard .no .ic { width:26px; height:26px; border-radius:8px; background:#f5f0ff; color:#7c3aed;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:12px; }
.ivcard .cust { font-size:13.5px; color:#334155; margin-top:5px; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ivcard .dt { font-size:11.5px; color:#64748b; margin-top:2px; }
.ivcard .amt { text-align:right; flex:0 0 auto; }
.ivcard .amt .n { font-weight:800; font-size:18px; line-height:1; }
.ivcard .amt .u { font-size:11px; color:#64748b; font-weight:600; }
.ivcard .rows { margin-top:12px; border-top:1px dashed #e9eef4; padding-top:9px;
  font-size:12.5px; color:#475569; line-height:1.5; }
.ivcard .rows .more { color:#64748b; font-weight:600; }
.ivcard .stat { margin-top:11px; }
.ivcard .acts { display:flex; gap:9px; margin-top:14px; }
.ivcard .aa { min-height:44px; border-radius:12px; border:1px solid #e6ebf1; background:#fff;
  display:flex; align-items:center; justify-content:center; gap:7px;
  font-weight:700; font-size:13.5px; font-family:inherit; color:#475569; cursor:pointer; }
.ivcard .aa.pay { flex:1.3; color:#fff; background:linear-gradient(135deg,#16a34a,#15803d); border:none; }
.ivcard .aa.print { flex:1; color:#1d4ed8; background:#f5f8ff; border-color:#dbe6ff; }
.ivcard .aa.print.solo { flex:1.3; }
.ivcard .aa.more { width:50px; flex:0 0 auto; color:#64748b; }
/* ══ หน้าช่างแต่ง (ฝั่งแอดมิน) ══ */
.cmban { border-radius:14px; padding:13px 15px; margin-bottom:12px; color:#fff;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  display:flex; align-items:center; gap:12px; text-decoration:none; }
.cmban .ic { width:38px; height:38px; border-radius:11px; flex:0 0 auto; color:#fbbf24;
  background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; font-size:17px; }
.cmban .t { font-weight:700; font-size:13.5px; color:#fff; }
.cmban .s { font-size:11px; opacity:.75; }
.cmban .go { margin-left:auto; background:#fbbf24; color:#0f172a; font-weight:700; font-size:12.5px;
  border-radius:9px; padding:9px 13px; white-space:nowrap; }
.cmstats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:14px; }
.cmstats .t { background:#fff; border:1px solid #eef2f6; border-radius:14px; padding:12px 10px;
  text-align:center; box-shadow:0 1px 2px rgba(15,23,42,.04); }
.cmstats .t .n { font-size:20px; font-weight:800; line-height:1; }
.cmstats .t .l { font-size:10.5px; color:#64748b; margin-top:4px; }
.cmcard { background:#fff; border-radius:18px; padding:15px; margin-bottom:12px;
  box-shadow:0 2px 10px rgba(15,23,42,.06); }
.cmcard .top { display:flex; align-items:center; gap:12px; }
.cmcard .ava { width:46px; height:46px; border-radius:14px; flex:0 0 auto; color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; }
.cmcard .who { flex:1; min-width:0; }
.cmcard .nm { font-weight:800; font-size:16.5px; line-height:1.15; }
.cmtypes { display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
.cmtp { font-size:10.5px; font-weight:600; color:#475569; background:#f1f5f9;
  border-radius:6px; padding:2px 8px; }
.cmtp.all { background:#eff6ff; color:#1d4ed8; }
.cmtp.more { background:#f8fafc; color:#64748b; }
.cmpend { text-align:right; flex:0 0 auto; }
.cmpend .n { font-size:22px; font-weight:800; line-height:1; color:#dc2626; }
.cmpend .n.zero { color:#16a34a; }
.cmpend .l { font-size:10.5px; color:#64748b; margin-top:2px; }
.cmcard .acts { display:flex; gap:9px; margin-top:14px; }
.cmcard .aa { min-height:44px; border-radius:12px; border:1px solid #e6ebf1; background:#fff;
  display:flex; align-items:center; justify-content:center; gap:7px; text-decoration:none;
  font-weight:700; font-size:13.5px; font-family:inherit; color:#475569; cursor:pointer; }
.cmcard .aa.view { flex:1.3; color:#b45309; background:#fffbeb; border-color:#fde68a; }
.cmcard .aa.edit { flex:1; color:#1d4ed8; background:#f5f8ff; border-color:#dbe6ff; }
.cmcard .aa.more { width:50px; flex:0 0 auto; color:#64748b; }
.cmmenu { display:none; gap:9px; margin-top:9px; }
.cmmenu.open { display:flex; }
.cmmenu .aa { flex:1; color:#b91c1c; background:#fef2f2; border-color:#fcd6d6; }
@media (min-width: 900px) { #cmList { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; } }

/* ══ หน้ารายงาน ══ */
.rkpi { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.rk { border-radius:15px; padding:14px; background:#fff; border:1px solid #eef2f6;
  box-shadow:0 1px 2px rgba(15,23,42,.04); }
.rk .lb { font-size:11.5px; color:#64748b; font-weight:600; display:flex; align-items:center; gap:6px; }
.rk .lb .d { width:9px; height:9px; border-radius:3px; flex:0 0 auto; }
.rk .n { font-size:21px; font-weight:800; margin-top:7px; line-height:1.15; }
.rk .n small { font-size:12px; font-weight:700; color:#94a3b8; }
.rk .s2 { font-size:10.5px; color:#94a3b8; margin-top:4px; }
.rk.profit { background:linear-gradient(135deg,#1e3a8a,#2563eb); border:none; color:#fff; }
.rk.profit.loss { background:linear-gradient(135deg,#9f1239,#e11d48); }
.rk.profit .lb, .rk.profit .s2 { color:rgba(255,255,255,.85); }
.rk.profit .n small { color:rgba(255,255,255,.72); }
.rpanel { background:#fff; border:1px solid #eef2f6; border-radius:16px; padding:15px;
  margin-bottom:14px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
.rpanel .ph { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:14px; }
.rpanel .ph .t { font-weight:800; font-size:14.5px; }
.rpanel .ph .s { font-size:11px; color:#94a3b8; text-align:right; }
.rchart { display:flex; align-items:flex-end; gap:8px; height:152px; padding-top:18px; }
.rcol { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; height:100%; gap:5px; }
.rcol .v { font-size:10px; font-weight:700; color:#94a3b8; }
.rcol .bar { width:66%; background:#bfdbfe; border-radius:5px 5px 0 0; min-height:4px; }
.rcol.cur .bar { background:linear-gradient(180deg,#2563eb,#1d4ed8); }
.rcol.cur .v { color:#1d4ed8; }
.rcol .mo { font-size:10.5px; color:#64748b; font-weight:600; white-space:nowrap; }
.rcol .oc { font-size:9.5px; color:#cbd5e1; font-weight:700; }
.rcol.cur .oc { color:#93c5fd; }
.raxis { border-top:1px solid #eef2f6; margin-top:6px; padding-top:7px;
  font-size:10.5px; color:#94a3b8; text-align:center; }
.todr { display:flex; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid #f4f6f9; }
.todr .tn { font-weight:700; font-size:13.5px; flex:1; min-width:0; }
.todr .tq { font-size:17px; font-weight:800; color:#2563eb; white-space:nowrap; }
.todr .tq small { font-size:11px; font-weight:600; color:#94a3b8; }
.todr .tv { font-size:12.5px; font-weight:700; color:#0f172a; width:76px; text-align:right; flex:0 0 auto; }
.todc { font-size:11px; color:#94a3b8; margin:-3px 0 7px; line-height:1.5; }
.todsum { display:flex; align-items:center; justify-content:space-between; gap:8px;
  border-top:1px solid #eef2f6; margin-top:9px; padding-top:11px; font-size:12.5px; }
.rrank { display:flex; flex-direction:column; gap:11px; }
.rrow { display:flex; align-items:center; gap:10px; }
.rrow .nm { font-size:12.5px; font-weight:600; color:#334155; width:82px; flex:0 0 auto;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rrow .track { flex:1; height:9px; border-radius:999px; background:#f1f5f9; overflow:hidden; }
.rrow .track > i { display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg,#60a5fa,#2563eb); }
.rrow .q { font-size:12px; font-weight:800; color:#0f172a; width:52px; text-align:right; flex:0 0 auto; }
.rcust { display:flex; flex-direction:column; gap:13px; }

  border: none; background: none; padding: 6px 0; cursor: pointer;
  flex: 0 0 auto; min-height: 44px; display: flex; align-items: center;
}

  width: 56px; height: 32px; border-radius: 999px; background: #cbd5e1;
  position: relative; display: block; transition: background .18s;
}
.kl-switch .kn {
  position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.28);
  transition: left .18s;
}
.kl-switch.on .tr { background: #16a34a; }
.kl-switch.on .kn { left: 27px; }

}

  /* เผื่อความสูงแถบล่าง + ปุ่มรับออเดอร์ที่ลอยขึ้นมา 22px จะได้ไม่บังบรรทัดสุดท้าย */
  #page-content { padding: 10px 10px 104px; }
  .card-box { padding: 14px 12px; }
  .card-head { flex-wrap: wrap; gap: 8px; }
  .card-head h2 { font-size: 14px; }
  .table-clean th { padding: 9px 10px; font-size: 12px; }
  .table-clean td { padding: 10px 10px; font-size: 13px; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .order-item-num { display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:12px;padding:2px 10px;font-size:12.5px;font-weight:700;margin-bottom:5px; }
  .btn { font-size: 13px; padding: 6px 10px; }
  .btn-sm { font-size: 12px; padding: 4px 8px; }
  .modal-dialog { margin: 0.4rem; max-width: calc(100vw - 0.8rem) !important; }
  .modal-body { padding: 14px 16px; overflow-x: hidden; }
  .modal-header, .modal-footer { padding: 12px 16px; }
  .today-card, .cust-today-card { padding: 16px 14px; }
  .stat-card { padding: 12px 14px; }
  .stat-card .value { font-size: 22px; }
  .topbar-actions-btn { font-size: 12px !important; padding: 5px 10px !important; }

  /* กัน iOS ซูมหน้าจอเองเวลากดช่องกรอก — Safari ซูมถ้าฟอนต์เล็กกว่า 16px */
  input[type="text"], input[type="number"], input[type="date"], input[type="tel"],
  input[type="search"], input[type="email"], select, textarea,
  .form-control, .form-control-sm, .form-select, .form-select-sm {
    font-size: 16px !important;
  }
  /* ปุ่ม −/+ และไอคอน — มาตรฐานนิ้วโป้งคือ 44px เดิมอยู่ 38-40 กดพลาดบ่อย
     กลุ่มนี้เป็นปุ่มที่กดถี่ที่สุด ขยายจริงไปเลยทั้งขนาดที่เห็นและพื้นที่กด */
  .oc-stp, .ord-cart-x, .oc-ico { min-width: 44px !important; min-height: 44px !important; }

  /* .btn-icon อยู่เรียงกันหลายปุ่มในแถวเดียว ถ้าขยายจริงจะเบียดกันน่าเกลียด
     จึงคงขนาดที่ตาเห็นไว้ 38px แต่ขยาย "พื้นที่รับนิ้ว" ที่มองไม่เห็นเป็น 44px
     (ยื่นออกด้านละ 3px ซึ่งน้อยกว่าช่องไฟระหว่างปุ่ม 6px จึงไม่แย่งกดกัน) */
  .btn-icon { min-width: 38px; min-height: 38px; position: relative; }
  .btn-icon::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); width: 44px; height: 44px;
  }

  /* รายการโลง — แสดง 1 บรรทัดต่อรายการบนมือถือ */
  .ord-item { display: block !important; margin: 2px 0 !important; }
  .ord-item-d { display: block; font-size: 12px; line-height: 1.6; }
  .ord-item-d + .ord-item-d::before { content: ''; }

  /* ประวัติออเดอร์ — ซ่อน เลขออเดอร์ + หมายเหตุ บนมือถือ */
  .orders-history-table th:nth-child(2),
  .orders-history-table td:nth-child(2),
  .orders-history-table th:nth-child(6),
  .orders-history-table td:nth-child(6) { display: none; }
  /* วันที่ column แคบลง */
  .orders-history-table td:nth-child(1) { font-size:12.5px; white-space:nowrap; }
  /* รายการรอส่ง — ขนาดตัวหนังสือใหญ่ขึ้น + ไม่จำกัดความสูง (ไม่ scroll ภายใน) */
  .pend-row { font-size: 16px !important; padding: 4px 8px !important; line-height:1.5; }
  .pend-row span:first-child { font-size: 16px; }
  .cust-today-card { max-height: none !important; overflow-y: visible !important; }
}

/* ── PWA Standalone (iPhone) safe-area ── */
/* ใช้ JS เพิ่ม class pwa-ios แทน @media display-mode เพราะ reliable กว่าบน iOS */
#pwa-safe-top { display: none; }
html.pwa-ios body { overscroll-behavior: none; -webkit-overflow-scrolling: auto; }
html.pwa-ios #pwa-safe-top {
  display: block;
  height: env(safe-area-inset-top, 44px);
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 100;
}
html.pwa-ios #topbar {
  top: env(safe-area-inset-top, 44px) !important;
  padding-top: 14px !important;
  align-items: center !important;
}
html.pwa-ios #sidebar {
  top: 0;
  padding-top: env(safe-area-inset-top, 44px);
  height: 100vh;
}
html.pwa-ios .modal {
  padding-top: env(safe-area-inset-top, 44px) !important;
  z-index: 1060 !important;
}
html.pwa-ios .modal-backdrop { z-index: 1055 !important; }
html.pwa-ios body.modal-open { overflow: hidden !important; position: fixed !important; width: 100% !important; }
html.pwa-ios #page-content { padding-bottom: max(14px, env(safe-area-inset-bottom, 20px)); }

/* ── ตารางออเดอร์ → การ์ด เฉพาะบนมือถือ ── */
@media (max-width: 767px) {
  .ord-card-tbl, .ord-card-tbl tbody, .ord-card-tbl tr, .ord-card-tbl td { display: block; width: 100%; }

  .ord-card-tbl tr {
    background: #fff; border: 1px solid #e8ecf0; border-radius: 12px;
    padding: 11px 13px; margin-bottom: 9px;
    display: grid; grid-template-columns: 1fr auto;
    grid-template-areas: "cust total" "meta meta" "items items" "notes notes" "act act";
    column-gap: 9px; row-gap: 0;
  }
  .ord-card-tbl tr:active { background: #f8fafc; }

  .ord-card-tbl td.c-cust  { grid-area: cust; font-size: 15px; font-weight: 800; color: #1a2332; }
  .ord-card-tbl td.c-total { grid-area: total; text-align: right; font-size: 16px; font-weight: 800;
    color: #1a2332; white-space: nowrap; }

    font-size: 12px !important; color: #6b7280 !important; }
  .ord-card-tbl td.c-no::after { content: ' · '; }
  .ord-card-tbl td.c-date br { display: none; }
  /* ซ่อน br แล้ววันที่กับเวลาจะติดกัน (7 ก.ย. 6915:02) — คั่นด้วยจุด */
  .ord-card-tbl td.c-date br + span::before { content: ' · '; }
  .ord-card-tbl td.c-date span { font-size: 12px !important; color: #6b7280 !important; }
  .ord-card-tbl td.c-items { grid-area: items; margin-top: 8px !important;
    border-top: 1px solid #f1f5f9 !important; padding-top: 7px !important; }
  .ord-card-tbl td.c-notes { grid-area: notes; font-size:12.5px !important; color: #6b7280 !important;
    max-width: none !important; white-space: normal !important; overflow: visible !important;
    margin-top: 6px !important; padding-top: 6px !important; border-top: 1px dashed #f1f5f9 !important; }
  .ord-card-tbl td.c-notes:empty, .ord-card-tbl td.c-notes.blank { display: none; }
  .ord-card-tbl td.c-act { grid-area: act; display: flex !important; justify-content: flex-end;
    gap: 6px; margin-top: 9px !important; padding-top: 8px !important; border-top: 1px solid #f1f5f9 !important; }
  .ord-card-tbl td.c-act .btn { flex: 1; max-width: 92px; }
  /* รายการสินค้า: บรรทัดละรายการ จำนวนชิดขวา */
  .ord-card-tbl .ord-item-d, .ord-card-tbl .ord-item {
    display: flex !important; justify-content: space-between; align-items: baseline; gap: 8px;
    padding: 3px 0 !important; margin: 0 !important; background: none !important; font-size: 12.5px;
  }
  .ord-card-tbl .ord-item-d + .ord-item-d::before { content: none !important; }
  .ord-card-tbl .oi-q { font-weight: 800; color: #1a2332; white-space: nowrap; }
}

/* ═══ กล่อง "ออเดอร์ล่าสุด" — ชื่อลูกค้าเด่น มีวงกลมตัวอักษรนำ ═══ */
.dash-recent .cust-av {

}
.dash-recent .cust-nm { font-weight: 800; color: #111827; letter-spacing: -.2px; }
.dash-recent .new-dot {
  display: inline-block; background: #ef4444; color: #fff; font-size: 11px; font-weight: 700;
  border-radius: 20px; padding: 2px 8px; margin-left: 7px; vertical-align: middle; letter-spacing: .2px;
}
.dash-recent .c-total .baht { font-size: .82em; opacity: .55; font-weight: 600; }
.dash-recent .act-lbl { display: none; }
/* บนคอม: ชื่อใหญ่ขึ้น ยอดเงินหนา */

  .dash-recent .cust-av { width: 30px; height: 30px; border-radius: 9px; font-size: 13px; margin-right: 8px; }

}
/* บนมือถือ: การ์ดมีแถบสีซ้าย ชื่อใหญ่ วันที่เยื้องใต้ชื่อ */
@media (max-width: 767px) {
  .dash-recent tr {
    border: 1px solid #e6ebf2; border-left: 4px solid #cbd5e1;
    border-radius: 14px; padding: 13px 14px 11px; margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(16,32,58,.05);
    grid-template-areas: "cust total" "meta total" "items items" "act act";
    align-items: start;
  }
  .dash-recent tr.is-new { border-left-color: #ef4444; background: #fffdfd; }

    font-size: 17px; font-weight: 800; line-height: 1.25;
  }

  .dash-recent .cust-nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-recent td.c-cust > span:not(.cust-nm) { flex: none; }
  .dash-recent td.c-total {
    align-self: start; font-size: 18px; font-weight: 800; color: #0f766e; padding-top: 4px !important;

  .dash-recent td.c-act {
    margin-top: 8px !important; padding-top: 0 !important; border-top: 0 !important;

    font-size: 13px; font-weight: 600; color: #64748b; border-color: #dbe2ea;
  }
  .dash-recent .act-lbl { display: inline; margin-left: 6px; }

/* ── ตารางทั่วไป → การ์ด บนมือถือ (ใบเสร็จ / ลูกค้า / สินค้า) ── */
@media (max-width: 767px) {
  .gen-card-tbl, .gen-card-tbl tbody, .gen-card-tbl tr, .gen-card-tbl td { display: block; width: 100%; }
  .gen-card-tbl thead, .gen-card-tbl colgroup { display: none; }
  .gen-card-tbl { border-collapse: separate; }
  .gen-card-tbl tr {
    background: #fff; border: 1px solid #e8ecf0; border-radius: 12px;
    padding: 11px 13px; margin-bottom: 9px;
  }
  .gen-card-tbl td {
    border: none !important; padding: 4px 0 !important; font-size: 13px;
    max-width: none !important; white-space: normal !important;
    overflow: visible !important; text-overflow: clip !important;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  /* ชื่อป้ายกำกับจาก data-label */
  .gen-card-tbl td::before {
    content: attr(data-label); font-size:12.5px; color: #6b7280;
    font-weight: 600; flex-shrink: 0; white-space: nowrap;
  }
  .gen-card-tbl td:not([data-label])::before { content: none; }
  /* หัวการ์ด */
  .gen-card-tbl td.g-title {
    display: block; font-size: 15.5px !important; font-weight: 800; color: #1a2332;
    border-bottom: 1px solid #f1f5f9 !important;
    padding-bottom: 8px !important; margin-bottom: 3px !important; text-align: left !important;
  }

  /* แถวปุ่มล่างสุด */
  .gen-card-tbl td.g-act {
    display: flex !important; justify-content: flex-end; gap: 6px;
    border-top: 1px solid #f1f5f9 !important;
    margin-top: 7px !important; padding-top: 9px !important;
  }
  .gen-card-tbl td.g-act::before { content: none; }
  .gen-card-tbl td.g-act .btn { flex: 1; max-width: 90px; }
  /* ช่องที่ไม่ต้องแสดงบนมือถือ (เช่น เลขลำดับแถว) */
  .gen-card-tbl td.g-hide { display: none !important; }
  /* ค่าที่ยาว เช่น รายการสินค้า ให้ขึ้นบรรทัดใหม่ */
  .gen-card-tbl td.g-wrap { display: block; }

/* ── ฟอร์มออเดอร์แบบตะกร้า ── */
.oc-grid { display:grid; grid-template-columns:1fr; gap:12px; }
/* บนคอม: ขั้นตอนอยู่ซ้าย (กว้างคงที่ ปุ่มสีไม่ยืดจนเพี้ยน) รายการอยู่ขวา
   บนมือถือ: เรียงตาม DOM คือขั้นตอนมาก่อน แล้วรายการตามลงมา */
@media (min-width:768px){ .oc-grid { grid-template-columns:360px 1fr; align-items:start; } }
.oc-hdr { display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  font-size:15px; font-weight:800; color:#1a2332; margin-bottom:4px; }
/* แถวรายการ — เป็นการ์ดแยกใบชัดเจน มีกรอบ+เงาบางๆ ไม่กลืนกัน */
.oc-row { display:flex; gap:11px; background:#fff; border:1.5px solid #e2e8f0;
  border-radius:12px; padding:12px 13px; margin-bottom:10px;
  box-shadow:0 1px 3px rgba(16,32,58,.05); }
/* แถวที่เพิ่งเพิ่ม — กะพริบเขียวหลายครั้งให้เห็นชัดว่า "เพิ่งใส่อันนี้เข้าไป" */
.oc-row.hl { animation:ocRowPulse 2.6s ease; border-radius:9px; }
@keyframes ocRowPulse {
  0%   { background:#dcfce7; box-shadow:inset 0 0 0 2px #16a34a; }
  12%  { background:#86efac; }
  24%  { background:#dcfce7; }
  36%  { background:#86efac; }
  48%  { background:#dcfce7; }
  60%  { background:#86efac; }
  72%  { background:#dcfce7; }
  100% { background:transparent; box-shadow:inset 0 0 0 0 transparent; }
}
.oc-row.editing { display:block; background:#fffbeb; border:2px solid #f59e0b;
  border-radius:10px; padding:10px 11px; margin:7px 0; }
.oc-top { display:flex; align-items:center; gap:8px; }
.oc-name { flex:1; min-width:0; font-size:14.5px; font-weight:700; color:#1a2332; word-break:break-word; }

.oc-ico { width:27px; height:27px; border-radius:7px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; font-size:12px; border:1.5px solid #e5e7eb; background:#f8fafc; color:#64748b; }
.oc-ico.del { border-color:#fecaca; background:#fef2f2; color:#dc2626; }

.oc-calc .r { font-size:15px; font-weight:800; color:#1a2332; }
.oc-note { width:100%; border:1.5px solid #e5e7eb; border-radius:7px; padding:4px 8px; font-size:12px;
  margin-top:6px; font-family:inherit; background:#f8fafc; color:#374151; }
.oc-note:focus { outline:none; border-color:#2563eb; background:#fff; }
.oc-editrow { display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap; }
.oc-stp { width:32px; height:32px; border-radius:7px; border:2px solid #d1d5db; background:#fff;
  font-size:17px; font-weight:800; color:#374151; cursor:pointer; line-height:1; flex-shrink:0; font-family:inherit; }
.oc-stp.plus { background:#2563eb; border-color:#2563eb; color:#fff; }

.oc-qn { font-size:18px; font-weight:800; min-width:28px; text-align:center; }
.oc-pr { flex:1; min-width:80px; border:2px solid #fcd34d; border-radius:7px; padding:5px 7px;

/* กล่องขั้นตอน — เอากรอบประออก ดูสะอาดขึ้นและไม่ทำให้สับสนว่าคืออะไร */
.oc-add { background:#fff; border:1px solid #e8ecf0; border-radius:12px; padding:12px 13px; }

/* ── แถบชื่อลูกค้าติดบนสุด ── */

/* จำนวน × ราคา — ตัวใหญ่ขึ้น เข้มขึ้น เน้นเลขจำนวนเป็นตัวหนา คนแก่มองเห็นชัด */

const COFFIN_SPEC = {

};
// ── getCraftedQty: backward-compatible ─ handles both old {isCrafted} and new {craftedQty} schema ──
function getCraftedQty(csEntry, orderQty) {
  if (!csEntry) return 0;
  if (csEntry.craftedQty !== undefined) return Math.min(csEntry.craftedQty, orderQty);
  if (csEntry.isCrafted) return orderQty; // legacy schema
  return 0;
}
// ── craftKey: คีย์ craftStatus (รวมขนาด extra เพื่อไม่ให้ "กลาง 24 นิ้ว" กับ "28 นิ้ว" ชนกัน) ──
function craftKey(i)       { return `${i.productName}|${i.color||''}|${i.trimColor||''}|${i.extra||''}`; }
function craftKeyLegacy(i) { return `${i.productName}|${i.color||''}|${i.trimColor||''}`; }
// อ่าน craftStatus โดยลองคีย์ใหม่ก่อน ถ้าไม่มีค่อย fallback คีย์เก่า (ข้อมูลก่อนอัปเดตไม่หาย)
function readCraftEntry(cs, i) {
  if (!cs) return undefined;
  const k = craftKey(i);
  if (cs[k] !== undefined) return cs[k];
  return cs[craftKeyLegacy(i)];
}
function getCraftedFor(cs, i) { return getCraftedQty(readCraftEntry(cs, i), i.qty); }
// ── getDeliveredQty: อ่านจำนวนที่จัดส่งไปแล้วของ item นั้น ──
// backward-compatible: ออเดอร์เก่าที่ isDelivered=true แต่ไม่มี deliveryStatus → ถือว่าส่งครบ
function getDeliveredQty(dsEntry, orderQty, orderIsDelivered) {
  if (!dsEntry) return orderIsDelivered ? orderQty : 0;
  if (dsEntry.deliveredQty !== undefined) return Math.min(dsEntry.deliveredQty, orderQty);
  return orderIsDelivered ? orderQty : 0;
}
// ── getBilledQty: อ่านจำนวนที่ออกบิลไปแล้วของ item นั้น ──
function getBilledQty(bsEntry, orderQty) {
  if (!bsEntry) return 0;
  if (bsEntry.billedQty !== undefined) return Math.min(bsEntry.billedQty, orderQty);
  return 0;
}
// ── isOrderFullyDelivered: เช็คว่าทุก item ในออเดอร์ส่งครบหรือยัง ──
function isOrderFullyDelivered(order) {
  const ds = order.deliveryStatus || {};
  const items = order.items || [];
  if (!items.length) return !!order.isDelivered;
  // ⚠️ ต้องรวมจำนวนตาม key ก่อนเทียบ ห้ามเทียบทีละบรรทัด
  // สินค้าเดียวกัน (ชื่อ+สี+เส้น+ขนาดเดียวกัน) ถูกแยกเป็นหลายบรรทัดในใบเดียวได้
  // แต่ deliveryStatus เก็บเป็น "ยอดรวมต่อ key" ไม่ได้เก็บรายบรรทัด
  // ถ้าเทียบทีละบรรทัดจะได้ผลผิด เช่น 6 บรรทัด บรรทัดละ 1 ส่งไปจริง 5
  // → เทียบทีละบรรทัดได้ 5>=1 ครบทุกบรรทัด = "ส่งครบ" ทั้งที่ยังเหลือ 1
  const need = {};
  items.forEach(i => { const k = deliverKey(i); need[k] = (need[k]||0) + (Number(i.qty)||0); });
  return Object.entries(need).every(([k, q]) => getDeliveredQty(ds[k], q, order.isDelivered) >= q);
}
// ── deliverKey: key สำหรับ deliveryStatus/billedStatus (รวม extra ต่างจาก craftStatus) ──
function deliverKey(i) {
  return `${i.productName}|${i.color||''}|${i.trimColor||''}|${i.extra||''}`;
}

// ── ตรึงสถานะจัดส่งของรายการเดิม ก่อนเพิ่ม/แก้รายการในออเดอร์ที่ส่งครบแล้ว ──
//
// ปัญหาเดิม: ออเดอร์ที่ส่งครบแล้วมักมีแค่ธง isDelivered:true โดยไม่มี
//   deliveryStatus รายชิ้น (ออเดอร์เก่าทั้งหมดเป็นแบบนี้) ส่วน getDeliveredQty
//   ตีความว่า "ไม่มีข้อมูลรายชิ้น + ธงเป็น true = ชิ้นนี้ส่งแล้ว"
//   → พอเพิ่มของใหม่เข้าไปในออเดอร์นั้น ของใหม่ก็พลอยถูกนับว่าส่งแล้วไปด้วย
//   → ไม่ขึ้นรายการรอส่ง ไม่ถูกออกบิล หายเงียบโดยไม่มี error
//
// วิธีแก้: เขียนจำนวนที่ส่งไปแล้วของรายการ "เดิม" ลงเป็นรายชิ้นก่อน
//   แล้วค่อยปลดธง → ของเดิมยังนับว่าส่งครบเหมือนเดิม ของใหม่เริ่มที่ 0
//
// originalItems = รายการก่อนแก้ (ต้องเก็บไว้ก่อนไปยุ่งกับ order.items)
// ออเดอร์ที่ยังส่งไม่ครบ (isDelivered ไม่ใช่ true) คืนค่าเดิมทันที ไม่แตะอะไร
function freezeDeliveryBeforeEdit(order, originalItems) {
  if (!order || order.isDelivered !== true) return order;
  const ds = { ...(order.deliveryStatus || {}) };
  const at = order.deliveredAt || order.createdAt || Date.now();
  // รวมจำนวนตาม key ก่อน — ออเดอร์เดียวมีสินค้าชื่อ/สี/เส้นเดียวกันแยกหลายบรรทัดได้
  // (เช่น "บ่าง" x1 ห้าบรรทัด) ซึ่ง deliveryStatus เก็บเป็นยอดรวมต่อ key
  const sumByKey = {};
  (originalItems || []).forEach(i => {
    const k = deliverKey(i);
    sumByKey[k] = (sumByKey[k] || 0) + (Number(i.qty) || 0);
  });
  Object.entries(sumByKey).forEach(([k, q]) => {
    const already = ds[k] && ds[k].deliveredQty !== undefined ? ds[k].deliveredQty : 0;
    ds[k] = { deliveredQty: Math.max(already, q), deliveredAt: (ds[k] && ds[k].deliveredAt) || at };
  });
  // ตอนนี้ deliveryStatus ครบทุกชิ้นแล้ว จึงคิดธงใหม่จากของจริงได้ตรง ๆ
  // (ตั้ง false ไว้ก่อนเพื่อไม่ให้ getDeliveredQty ใช้ธงเก่าเป็น fallback อีก)
  //   เพิ่มของใหม่  → ชิ้นใหม่ยังไม่มีใน ds → ธงเป็น false ถูกต้อง
  //   ลบของออกเฉย ๆ → ที่เหลือยังส่งครบ → ธงกลับเป็น true เหมือนเดิม
  const out = { ...order, deliveryStatus: ds, isDelivered: false };
  out.isDelivered = isOrderFullyDelivered(out);
  return out;
}
// ── แยกอุปกรณ์เสริมออกจากโลง ──
// เกณฑ์หลัก: ช่อง "หน่วย" ของสินค้า ถ้าไม่ใช่ "โลง" = อุปกรณ์เสริม
// ถ้าไม่เจอสินค้าในระบบ ใช้ชื่อเป็นตัวช่วยเดา
const ACC_HINTS = ['เทพ','นางฟ้า','มุม','กางเขน','ดอกพิกุล','พลาสติก','ม้วน'];
function isAccessory(productName) {
  const p = (window._allProductsCache||{})[productName];
  if (p) return (p.unit||'โลง').trim() !== 'โลง';
  return ACC_HINTS.some(k => (productName||'').includes(k));
}
// อุปกรณ์เสริมไม่ต้องแต่ง → นับเป็นพร้อมส่งเต็มจำนวนเสมอ
function readyQtyFor(item, craftedQty) {
  return isAccessory(item.productName) ? item.qty : craftedQty;
}

// ── โหลดไลบรารีตอนใช้จริง (lazy load) ──
// โหลดครั้งเดียวต่อ session ครั้งถัดไปคืนค่าเดิมทันที
const _scriptCache = {};
function loadScriptOnce(url) {
  if (_scriptCache[url]) return _scriptCache[url];
  _scriptCache[url] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => { delete _scriptCache[url]; reject(new Error('โหลดไม่สำเร็จ: ' + url)); };
    document.head.appendChild(s);
  });
  return _scriptCache[url];
}

// ข้อความบอกสถานะ ใช้ทั้งหน้าตั้งค่าและแถบเตือน
function muteLabel(until) {
  if (!until || Date.now() >= until) return null;
  if (until >= MUTE_FOREVER) return 'ปิดอยู่ จนกว่าจะกดเปิดเอง';
  const mins = Math.ceil((until - Date.now()) / 60000);
  if (mins < 60) return `ปิดอยู่ อีก ${mins} นาทีจะเปิดเอง`;
  return `ปิดอยู่ ถึง ${U.datetime(until).replace(/.*? /, '')} น.`;
}

// รอ promise แบบมีเพดานเวลา — งานที่ค้างจะกลายเป็น error ที่เห็นได้
// แทนที่จะเงียบหายจนปุ่มตาย
function withTimeout(promise, ms, msg) {
  let t;
  return Promise.race([
    promise.finally(() => clearTimeout(t)),
    new Promise((_, rej) => { t = setTimeout(() => rej(new Error(msg || 'หมดเวลารอ')), ms); })
  ]);
}

// ═══════════════════════════════════════
//  OrdersFeed — ตัวดักฟังออเดอร์ตัวเดียวของทั้งแอพ
// ═══════════════════════════════════════
// เดิม: หน้า Dashboard กับหน้าประวัติออเดอร์ ต่างคนต่างเปิด onSnapshot
// ของตัวเอง แล้ว navigate() ปิดทิ้งทุกครั้งที่เปลี่ยนหน้า
// → สลับหน้าที = อ่านออเดอร์ทั้ง collection ใหม่ทั้งก้อน
// → สลับไปมาทั้งวันจนเกินโควตาอ่านของ Firebase (แผนฟรี 50,000 ครั้ง/วัน)
//   แล้วทุกอย่างพังหมดรวมถึงการบันทึก ("Quota exceeded.")
//
// ใหม่: เปิดตัวเดียว ไม่ปิดจนกว่าจะปิดแอพ ใครอยากได้ข้อมูลก็มาสมัครรับ
// เปลี่ยนหน้ากี่รอบก็ไม่เสียโควตาเพิ่ม
const OrdersFeed = {
  _unsub: null,
  _subs: new Set(),
  _last: null,
  subscribe(fn) {
    this._subs.add(fn);
    // มีข้อมูลอยู่แล้วก็ส่งให้เลย ไม่ต้องรออ่านรอบใหม่
    // หน่วงเป็น microtask ให้ผู้เรียกเก็บค่า unsubscribe ให้เสร็จก่อน
    if (this._last) {
      // กรองของที่ลบออกเหมือนกับตอนส่งปกติ ไม่งั้นคนที่มาสมัครทีหลัง
      // จะได้ข้อมูลดิบที่มีออเดอร์ที่ลบแล้วปนมาด้วย
      const snapshot = this._last.filter(o => o.isDeleted !== true);
      Promise.resolve().then(() => {
        if (this._subs.has(fn)) { try { fn(snapshot); } catch (e) { console.error(e); } }
      });
    }
    this._start();
    return () => { this._subs.delete(fn); };   // "ยกเลิก" = แค่เลิกฟัง ไม่ปิดตัวจริง
  },
  _start() {
    if (this._unsub) return;
    this._unsub = DB._fs.collection('orders').onSnapshot(snap => {
      const raw = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      this._last = raw;                     // ดิบ — ใช้เป็นแหล่งของ _all/ถังขยะ
      const live = raw.filter(o => o.isDeleted !== true);   // ที่ส่งให้หน้าจอ
      window._allOrdersCache = live;
      this._subs.forEach(fn => { try { fn(live); } catch (e) { console.error('OrdersFeed sub:', e); } });
    }, err => console.error('OrdersFeed error:', err));
  }
};

const DB = {
  _fs: null,
  _cache: {},         // { col: { ts, data } }
  // เดิม 90 วินาที → ทำให้ลูกค้า/สินค้า/ใบเสร็จถูกอ่านใหม่ทุก 1 นาทีครึ่ง
  // ระหว่างใช้งาน กินโควตาอ่านฟรีๆ ทั้งที่ข้อมูลไม่ได้เปลี่ยน
  //
  // ยืดเป็น 15 นาทีได้ปลอดภัย เพราะ:
  //   • _add/_put/_del อัปเดต cache ในเครื่องให้เองอยู่แล้ว → ของที่เราแก้เองเห็นทันที
  //   • ออเดอร์ (ตัวเดียวที่เครื่องอื่นเขียนด้วย) ไม่ใช้ cache นี้แล้ว ใช้ OrdersFeed แบบ real-time
  //   • ถ้าอยากได้สดจริงๆ กดปุ่มรีเฟรชมุมขวาบน (ล้าง cache ทั้งหมด)
  _CACHE_TTL: 900000,  // 15 นาที

  async init() {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    this._fs = firebase.firestore();
    await this._enableOffline();
  },

  // ⚠️ Firestore offline cache — ปิดไว้ (9 ก.ย. 69)
  //
  // เปิดแล้วบันทึกออเดอร์ในมือถือไม่ได้ สาเหตุ:
  // enablePersistence ทำให้ runTransaction (ที่ใช้ออกเลขออเดอร์)
  // ต้องต่อเซิร์ฟเวอร์ได้จริงเท่านั้น ถ้าเน็ตมือถืออืดหรือ IndexedDB
  // บน iOS มีปัญหา มันจะ "ค้าง" ไม่ error → doSaveOrder ไม่จบ
  // → window._saving ค้างเป็น true ตลอด → กดบันทึกอีกกี่ครั้งก็เงียบ
  //
  // ถ้าจะเปิดใหม่ ต้องแก้ _nextSeq ให้ไม่ใช้ transaction ก่อน
  // เปลี่ยน false เป็น true เพื่อทดลองเปิด
  _OFFLINE_CACHE: false,
  async _enableOffline() {
    if (!this._OFFLINE_CACHE) { window._klOfflineOn = false; return; }
    if (window._klOfflineTried) return;
    window._klOfflineTried = true;
    try {
      await this._fs.enablePersistence({ synchronizeTabs: true });
      window._klOfflineOn = true;
    } catch (e) {
      window._klOfflineOn = false;
      console.warn('offline cache off:', e && e.code || e);
    }
  },

  // ── Generic CRUD ──
  async _all(col) {
    // ออเดอร์: ถ้า OrdersFeed ต่ออยู่แล้ว ใช้ข้อมูลจากมันเลย
    // มันสดกว่า cache 90 วิ และไม่เสียโควตาอ่านเพิ่มสักครั้ง
    if (col === 'orders' && OrdersFeed._unsub && OrdersFeed._last) return OrdersFeed._last;
    const now = Date.now();
    const c = this._cache[col];
    if (c && now - c.ts < this._CACHE_TTL) return c.data;
    const snap = await this._fs.collection(col).get();
    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    this._cache[col] = { ts: now, data };
    return data;
  },
  _bust(col) { delete this._cache[col]; },
  async _get(col, id) {
    // ดึงจาก cache ก่อน ไม่ต้องยิง Firestore แยก
    const c = this._cache[col];
    if (c) { const found = c.data.find(r => String(r.id) === String(id)); if (found) return found; }
    const snap = await this._fs.collection(col).doc(String(id)).get();
    return snap.exists ? { id: snap.id, ...snap.data() } : null;
  },
  async _add(col, d) {
    const { id: _id, ...rest } = d;
    const data = { ...rest, createdAt: rest.createdAt || Date.now() };
    let newId;
    if (_id) {
      // restore: preserve original ID
      await this._fs.collection(col).doc(String(_id)).set(data);
      newId = String(_id);
    } else {
      const ref = await this._fs.collection(col).add(data);
      newId = ref.id;
    }
    // อัพเดท cache ทันที แทนที่จะล้างทิ้ง
    const c = this._cache[col];
    if (c) c.data.push({ id: newId, ...data });
    return newId;
  },
  async _put(col, d) {
    const { id, ...rest } = d;
    // merge:false — เขียนทับทั้งเอกสาร ไม่งั้นค่าที่ลบออก (เช่น สีเส้นใน priceMap
    // หรือราคาพิเศษของลูกค้า) จะไม่ถูกลบจริง เพราะ merge เก็บ key เดิมไว้
    // ทุกที่ที่เรียก _put ส่ง object เต็มอยู่แล้ว ({...old, ...ใหม่})
    await this._fs.collection(col).doc(String(id)).set(rest);
    // อัพเดท cache record ตรง ๆ
    const c = this._cache[col];
    if (c) { const i = c.data.findIndex(r => String(r.id) === String(id)); if (i >= 0) c.data[i] = { id, ...rest }; }
    return id;
  },
  // ── ลบ = ทำเครื่องหมาย ไม่ได้ลบจริง ──
  // ทุกการลบในระบบวิ่งผ่านตรงนี้จุดเดียว แก้ที่นี่ที่เดียวจึงครอบคลุม
  // ออเดอร์ ใบเสร็จ ลูกค้า สินค้า รายจ่าย ช่าง พร้อมกันหมด
  async _del(col, id, reason) {
    const mark = {
      isDeleted: true,
      deletedAt: Date.now(),
      deletedBy: null,              // ยังไม่มีล็อกอิน — เติมได้ตอนทำ 0.5
      deleteReason: (reason || '').trim()
    };
    await this._fs.collection(col).doc(String(id)).set(mark, { merge: true });
    // อัปเดต cache ในเครื่องให้ตรงกัน ไม่ต้องยิงอ่านใหม่
    const c = this._cache[col];
    if (c) {
      const i = c.data.findIndex(r => String(r.id) === String(id));
      if (i >= 0) c.data[i] = { ...c.data[i], ...mark };
    }
  },
  // เอาเครื่องหมายออก = กู้คืน
  async _undel(col, id) {
    const FV = firebase.firestore.FieldValue;
    await this._fs.collection(col).doc(String(id)).set({
      isDeleted: false, deletedAt: FV.delete(),
      deletedBy: FV.delete(), deleteReason: FV.delete()
    }, { merge: true });
    const c = this._cache[col];
    if (c) {
      const i = c.data.findIndex(r => String(r.id) === String(id));
      if (i >= 0) {
        const { deletedAt, deletedBy, deleteReason, ...rest } = c.data[i];
        c.data[i] = { ...rest, isDeleted: false };
      }
    }
  },
  // ⚠️ ลบจริง — ตอนนี้ไม่มีที่ไหนในแอปเรียกใช้แล้ว และ Firestore Rules
  //    ตั้งเป็น "allow delete: if false" ไว้ ถ้าเรียกจะโดนปฏิเสธอยู่ดี
  //    เก็บไว้เผื่ออนาคต แต่ให้มันบอกเหตุผลชัด ๆ แทนที่จะพังเงียบ
  async _hardDel(col, id) {
    throw new Error(
      'ระบบปิดการลบถาวรไว้ — ใช้ _del (ถังขยะ) แทน ' +
      'ถ้าจำเป็นต้องลบจริง ต้องไปแก้ Firestore Rules ก่อน'
    );
  },

  // ── Settings ──
  async getSetting(key) {
    const snap = await this._fs.collection('settings').doc(key).get();
    return snap.exists ? snap.data().value : null;
  },
  async setSetting(key, value) {
    await this._fs.collection('settings').doc(key).set({ value });
  },
  async loadSettings() {
    // ดึงทั้ง collection ครั้งเดียว แทน 4 queries แยก
    const snap = await this._fs.collection('settings').get();
    const map = {}; snap.docs.forEach(d => { map[d.id] = d.data().value; });
    for (const k of ['businessName','sellerName','businessAddress','businessPhone','businessTaxId','promptpayId']) {
      if (map[k] !== undefined) CFG[k] = map[k];
    }
  },

  // ── Sequence helpers ──
  // ⚠️ เดิมใช้ runTransaction แต่ Firebase ปฏิเสธ transaction ด้วย
  // resource-exhausted ("Quota exceeded.") ทั้งที่การเขียนธรรมดายังทำงานปกติ
  // → ออกเลขออเดอร์ไม่ได้ = บันทึกออเดอร์ไม่ได้เลย
  //
  // เปลี่ยนมาใช้ FieldValue.increment แทน มันบวกเลขที่ฝั่งเซิร์ฟเวอร์
  // เป็น "การเขียนธรรมดา" ไม่ใช่ transaction จึงไม่ติดข้อจำกัดตัวเดียวกัน
  // และยังกันเลขซ้ำได้เพราะเซิร์ฟเวอร์เป็นคนบวกให้ ไม่ใช่ต่างคนต่างบวกในเครื่อง
  //
  // จุดอ่อนเดียว: ถ้าสองเครื่องกดพร้อมกันเป๊ะๆ อาจอ่านค่ากลับมาได้เลขเดียวกัน
  // → ผู้เรียก (nextOrderNo/nextReceiptNo) เช็คซ้ำกับรายการที่มีอยู่อีกชั้น
  async _nextSeq(counterKey, seedFn) {
    const ref = this._fs.collection('counters').doc(counterKey);
    const FV = firebase.firestore.FieldValue;
    // ครั้งแรกที่ยังไม่มีตัวนับ → ตั้งต้นจากเลขล่าสุดที่ใช้ไปแล้ว
    const snap0 = await withTimeout(ref.get(), 15000, 'อ่านตัวนับไม่สำเร็จ');
    if (!snap0.exists) {
      const seed = await seedFn();
      await withTimeout(ref.set({ seq: seed, updatedAt: Date.now() }, { merge: true }), 15000, 'ตั้งตัวนับไม่สำเร็จ');
    }
    await withTimeout(
      ref.set({ seq: FV.increment(1), updatedAt: Date.now() }, { merge: true }),
      15000, 'ออกเลขไม่สำเร็จ — เน็ตอาจไม่เสถียร ลองใหม่อีกครั้ง'
    );
    const snap = await withTimeout(ref.get(), 15000, 'อ่านเลขกลับไม่สำเร็จ');
    return (snap.data() || {}).seq || 1;
  },
  // กันเลขซ้ำอีกชั้น — ถ้าเลขที่ได้ถูกใช้ไปแล้วให้ขยับขึ้นจนกว่าจะว่าง
  _uniqueNo(prefix, n, usedSet) {
    let no = `${prefix}${String(n).padStart(4,'0')}`;
    let guard = 0;
    while (usedSet.has(no) && guard++ < 200) {
      n++;
      no = `${prefix}${String(n).padStart(4,'0')}`;
    }
    return no;
  },
  async nextOrderNo() {
    const yr = new Date().getFullYear() + 543;
    const prefix = `ORD-${yr}-`;
    const n = await this._nextSeq(`orders-${yr}`, async () => {
      const all = await this.getOrders();
      const nums = all.filter(o=>o.orderNo?.startsWith(prefix)).map(o=>parseInt(o.orderNo.slice(prefix.length))||0);
      return nums.length ? Math.max(...nums) : 0;
    });
    const used = new Set((OrdersFeed._last || await this.getOrders()).map(o => o.orderNo).filter(Boolean));
    return this._uniqueNo(prefix, n, used);
  },
  async nextReceiptNo() {
    const yr = new Date().getFullYear() + 543;
    const prefix = `RC-${yr}-`;
    const n = await this._nextSeq(`invoices-${yr}`, async () => {
      const all = await this.getInvoices();
      const nums = all.filter(i=>i.invoiceNo?.startsWith(prefix)).map(i=>parseInt(i.invoiceNo.slice(prefix.length))||0);
      return nums.length ? Math.max(...nums) : 0;
    });
    const used = new Set((await this.getInvoices()).map(i => i.invoiceNo).filter(Boolean));
    return this._uniqueNo(prefix, n, used);
  },
  async getEffectivePrice(customerId, productId, defaultPrice, trimColor='') {
    const c = await this.getCustomer(customerId);
    const cp = c?.customPrices?.[productId];
    if (cp !== undefined) {
      if (typeof cp === 'object' && cp !== null) {
        if (trimColor && cp[trimColor] !== undefined) return cp[trimColor];
      } else { return cp; }
    }
    if (trimColor) {
      const p = await this.getProduct(productId);
      if (p?.priceMap?.[trimColor] != null) return p.priceMap[trimColor];
    }
    return defaultPrice;
  },

  // ── ตัวกรองของที่ถูกลบ ──
  // _all คืนข้อมูลดิบทั้งหมด (รวมที่ลบแล้ว) และยังทำ cache เหมือนเดิม
  // ส่วน getter ทุกตัวด้านล่างกรองออกให้ → หน้าจอและรายงานไม่เห็นของที่ลบ
  // เอกสารเก่าที่ยังไม่มีช่อง isDeleted จะผ่านตัวกรองนี้อัตโนมัติ
  // (เพราะ undefined !== true) จึงไม่ต้องรันสคริปต์แก้ข้อมูลเก่าเลย
  _live(col)  { return this._all(col).then(r => r.filter(x => x.isDeleted !== true)); },
  _trash(col) { return this._all(col).then(r => r.filter(x => x.isDeleted === true)); },

  // ── Per-store shortcuts ──
  getCustomers()   { return this._live('customers'); },
  getCustomer(id)  { return this._get('customers',id); },
  addCustomer(d)   { return this._add('customers',d); },
  putCustomer(d)   { return this._put('customers',d); },
  delCustomer(id,r)  { return this._del('customers',id,r); },

  getProducts()    { return this._live('products'); },
  getProduct(id)   { return this._get('products',id); },
  addProduct(d)    { return this._add('products',d); },
  putProduct(d)    { return this._put('products',d); },
  delProduct(id,r)   { return this._del('products',id,r); },

  getOrders()      { return this._live('orders'); },
  getOrder(id)     { return this._get('orders',id); },
  addOrder(d)      { return this._add('orders',d); },
  putOrder(d)      { return this._put('orders',d); },
  delOrder(id,r)     { return this._del('orders',id,r); },

  getInvoices()    { return this._live('invoices'); },
  getInvoice(id)   { return this._get('invoices',id); },
  addInvoice(d)    { return this._add('invoices',d); },
  putInvoice(d)    { return this._put('invoices',d); },
  delInvoice(id,r)   { return this._del('invoices',id,r); },

  getExpenses()    { return this._live('expenses'); },
  getExpense(id)   { return this._get('expenses',id); },
  addExpense(d)    { return this._add('expenses',d); },
  putExpense(d)    { return this._put('expenses',d); },
  delExpense(id,r)   { return this._del('expenses',id,r); },

  getCraftsmen()   { return this._live('craftsmen'); },
  getCraftsman(id) { return this._get('craftsmen',id); },
  addCraftsman(d)  { return this._add('craftsmen',d); },
  putCraftsman(d)  { return this._put('craftsmen',d); },
  delCraftsman(id,r) { return this._del('craftsmen',id,r); },
};

const U = {
  money(n)  { return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); },
  // ── เงินแบบอ่านง่าย: ไม่โชว์ .00 ถ้าเป็นจำนวนเต็ม ──
  // ราคาโลงเป็นเลขกลม ๆ แทบทั้งหมด การโชว์ .00 ทุกที่ทำให้ตาลาย
  // ถ้ามีเศษสตางค์จริง (1,500.50) ยังโชว์ให้ครบเหมือนเดิม
  // ⚠️ ห้ามเอาไปแทน money() ในใบเสร็จ/รายงาน ที่นั่นต้องมี .00 ตามแบบเอกสาร
  baht(n)   { const v = Number(n||0);
              return v.toLocaleString('th-TH', Number.isInteger(v)
                ? {maximumFractionDigits:0} : {minimumFractionDigits:2,maximumFractionDigits:2}); },
  date(ts)  { if(!ts)return'-'; return new Date(ts).toLocaleDateString('th-TH-u-ca-buddhist',{year:'numeric',month:'short',day:'numeric'}); },
  datetime(ts) { if(!ts)return'-'; return new Date(ts).toLocaleDateString('th-TH-u-ca-buddhist',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); },
  dateInput(ts) { if(!ts)return''; return new Date(ts).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'}); },
  dateCompact(ts) {
    if(!ts)return'-';
    const d=new Date(ts);
    const dt=d.toLocaleDateString('th-TH-u-ca-buddhist',{day:'numeric',month:'short'});
    const yr=String(d.getFullYear()+543).slice(-2);
    const tm=d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});
    return `<span style="white-space:nowrap;">${dt} ${yr}</span><br><span style="color:#6b7280;font-size:12px;">${tm}</span>`;
  },
  esc(s)    { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); },
  // ตัวอักษรแรกของชื่อ สำหรับวงกลมหน้าชื่อลูกค้า
  // ภาษาไทยต้องเก็บสระหน้า (เ แ โ ใ ไ) และวรรณยุกต์ที่เกาะอยู่ด้วย
  // ไม่งั้น "ป้าขวัญ" ได้ "ป" และ "เจ๊หมู" ได้ "เ" ซึ่งอ่านไม่ออก
  initial(s) {
    const t = String(s||'').trim();
    if (!t) return '?';
    const m = t.match(/^[เแโใไ]?.[ัิ-ฺ็-๎]*/);
    return this.esc(m ? m[0] : t.charAt(0));
  },
  // สีวงกลมคงที่ต่อชื่อ — ลูกค้าคนเดิมได้สีเดิมเสมอ จำง่าย
  avatarHue(s) {
    let h = 0, str = String(s||'');
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  },
  orderTotal(o) {
    const sub=(o.items||[]).reduce((a,i)=>a+(i.qty*i.price),0);
    return sub-(o.discount||0);
  },
  invTotal(inv) {
    const sub=(inv.items||[]).reduce((a,i)=>a+(i.qty*i.price),0);
    const disc=inv.discount||0;
    const base=sub-disc;
    const tax=inv.taxRate?base*inv.taxRate/100:0;
    return {sub,disc,base,tax,total:base+tax};
  },
  isToday(ts) {
    const d=new Date(ts).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'});
    const n=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'});
    return d===n;
  },
  toast(msg,type='success') {
    const el=document.createElement('div');
    el.className='toast-notif';
    // บนมือถือ (bottom-nav แสดง) เลื่อน toast ขึ้น 72px ไม่ให้ทับ
    const isMobile=window.innerWidth<992;
    // เดิมใช้ 82px คงที่ — บน iPhone ที่มีแถบขีดล่าง toast จะไปนั่งทับเมนู
    // env(safe-area-inset-bottom) คือความสูงของแถบนั้น (เครื่องที่ไม่มีจะได้ 0)
    // ใช้ได้เพราะ meta viewport มี viewport-fit=cover อยู่แล้ว
    const bottom=isMobile?'82px':'24px';
    el.style.cssText=`position:fixed;bottom:calc(${bottom} + env(safe-area-inset-bottom, 0px));right:16px;z-index:9999;min-width:220px;max-width:calc(100vw - 32px);`;
    el.innerHTML=`<div class="alert alert-${type==='success'?'success':'danger'} shadow-sm d-flex align-items-center gap-2" style="border-radius:10px;font-size:14px;">
      <i class="fa-solid ${type==='success'?'fa-circle-check':'fa-circle-xmark'}"></i>${msg}</div>`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  },
};

// ═══════════════════════════════════════
const _sortState={};
function sortTable(tbodyId, key, renderRow, dataKey) {
  const prev=_sortState[tbodyId]||{key:null,asc:true};
  const asc = prev.key===key ? !prev.asc : true;
  _sortState[tbodyId]={key,asc};
  const data=window[dataKey]||[];
  const sorted=[...data].sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(typeof av==='string') return asc?av.localeCompare(bv,'th'):bv.localeCompare(av,'th');
    return asc?(av||0)-(bv||0):(bv||0)-(av||0);
  });
  document.getElementById(tbodyId).innerHTML=renderRow(sorted);
  // อัปเดต indicator ลูกศร
  document.querySelectorAll(`[data-sort-tbody="${tbodyId}"]`).forEach(th=>{
    const arr=th.querySelector('.sort-arr');
    if(arr) arr.textContent = th.dataset.sortKey===key ? (asc?'↑':'↓') : '↕';
  });
}
function sortTh(label, tbodyId, key, dataKey) {
  return `<span data-sort-tbody="${tbodyId}" data-sort-key="${key}" onclick="sortTable('${tbodyId}','${key}',${dataKey==='_allOrders'?'renderOrderRows':dataKey==='_custData'?'renderCustRows':'renderInvRows'},'${dataKey}')" style="cursor:pointer;user-select:none;">${label} <span class="sort-arr" style="font-size:12px;opacity:.5;">↕</span></span>`;
}

const PAGE_TITLES = { dashboard:'Dashboard', orders:'ประวัติออเดอร์', invoices:'ใบเสร็จรับเงิน', customers:'ลูกค้า', products:'สินค้า', craftsmen:'จัดการช่างแต่ง', reports:'รายงาน', expenses:'รายจ่ายโรงงาน', settings:'ตั้งค่าร้าน', trash:'ถังขยะ' };

const SKELETON_CARDS = `

// navigate(page)            → เปลี่ยนหน้าปกติ (บันทึกลงประวัติเบราว์เซอร์)
// navigate(page, {fromPop}) → เรียกจากปุ่มย้อนกลับ ไม่ต้องบันทึกซ้ำ
function navigate(page, opt) {
  closeBnavMore();
  document.getElementById('ordConfirmOv')?.remove();   // ปิด overlay ค้างถ้ามี
  // Cleanup dashboard real-time listener when leaving dashboard
  if (window._dashUnsubOrders && page !== 'dashboard') {
    window._dashUnsubOrders(); window._dashUnsubOrders = null;
  }
  // เคลียร์ listener หน้าประวัติออเดอร์ด้วย — เดิมค้างจนกว่าจะมี snapshot ถัดไป
  if (window._ordersUnsub && page !== 'orders') {
    window._ordersUnsub(); window._ordersUnsub = null;
  }
  // ── ประวัติหน้า: ให้ปุ่ม back ของมือถือย้อนหน้าในแอป ไม่ใช่ออกจากแอป ──
  if (!opt?.fromPop && page !== window._currentPage) {
    try {
      history.pushState({page}, '', '#' + page);
      localStorage.setItem('kl_lastPage', page);
    } catch(e) {}
  }
  window._currentPage = page;
  document.querySelectorAll('#sidebar .nav-link').forEach(l=>l.classList.toggle('active',l.dataset.page===page));
  document.querySelectorAll('#bottom-nav .bnav-item').forEach(l=>l.classList.toggle('active',l.dataset.page===page));
  // ถ้าหน้าอยู่ใน more-menu ให้ไฮไลท์ปุ่ม "เพิ่มเติม" แทน
  const morePages=['customers','products','craftsmen','reports','expenses','settings','trash'];
  document.getElementById('bnavMoreBtn')?.classList.toggle('active', morePages.includes(page));
  document.querySelectorAll('#bnav-more-menu .bm-item').forEach(l=>l.classList.toggle('active',l.dataset.page===page));
  document.getElementById('pageTitle').textContent=PAGE_TITLES[page]||page;
  document.getElementById('topbarActions').innerHTML='';
  // สร้าง element ใหม่ทุกครั้ง เพื่อป้องกัน async render เก่า update ทับหน้าใหม่
  const old = document.getElementById('page-content');
  const el = document.createElement('div');
  el.id = 'page-content';
  old.parentNode.replaceChild(el, old);
  // Dashboard แสดง skeleton ทันที, หน้าอื่นแสดง spinner
  el.innerHTML = page==='dashboard' ? SKELETON_CARDS
    : '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>กำลังโหลด...</p></div>';
  ({dashboard:renderDashboard,orders:renderOrders,invoices:renderInvoices,customers:renderCustomers,products:renderProducts,craftsmen:renderCraftsmen,reports:renderReports,expenses:renderExpenses,settings:renderSettings,trash:renderTrash}[page]||((el)=>{el.innerHTML='<div class="empty-state"><p>ไม่พบหน้านี้</p></div>';}))(el);
}

function showModal(id,title,body,footer,size='') {
  const old=document.getElementById(id); if(old)old.remove();
  const div=document.createElement('div');
  div.className='modal fade'; div.id=id; div.tabIndex=-1;
  div.innerHTML=`<div class="modal-dialog ${size} modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">${title}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer">${footer}</div>
  </div></div>`;
  document.getElementById('modal-container').appendChild(div);
  const m=new bootstrap.Modal(div);
  div.addEventListener('hidden.bs.modal',()=>{m.dispose();div.remove();});
  // Keyboard: Ctrl+Enter = กดปุ่มแรกใน footer, Escape จัดการโดย Bootstrap อยู่แล้ว
  div.addEventListener('keydown',(e)=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
      e.preventDefault();
      div.querySelector('.modal-footer button:not([data-bs-dismiss])')?.click();
    }
  });
  m.show(); return m;
}
function closeModal(id) { const el=document.getElementById(id); if(el){try{bootstrap.Modal.getInstance(el)?.hide();}catch(e){}el.remove();} }

// ── Custom Confirm Dialog (แทน browser confirm) ──
function U_confirm(msg, onYes, {title='ยืนยันการดำเนินการ', yesLabel='ยืนยัน', yesCls='btn-danger', icon='fa-triangle-exclamation', iconColor='#dc2626', askReason=false}={}) {
  // เก็บ callback ไว้ใน window แทนการ serialize เป็น string (ป้องกัน closure หาย)
  window._confirmCb = onYes;
  const reasonBox = askReason ? `
    <div style="margin-top:14px;">
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px;">
        เหตุผล <span style="font-weight:400;color:#9ca3af;">(ไม่ใส่ก็ได้)</span>
      </label>
      <input id="confirmReason" class="form-control" maxlength="120"
        placeholder="เช่น ลูกค้ายกเลิก, คีย์ผิด" autocomplete="off">
      <div style="font-size:12px;color:#6b7280;margin-top:6px;">
        <i class="fa-solid fa-recycle me-1"></i>กู้คืนได้จากถังขยะในหน้าตั้งค่า
      </div>
    </div>` : '';
  showModal('confirmDialog', title,
    `<div class="d-flex align-items-start gap-3">
       <i class="fa-solid ${icon}" style="font-size:28px;color:${iconColor};flex-shrink:0;margin-top:2px;"></i>
       <p style="margin:0;font-size:15px;line-height:1.6;">${msg}</p>
     </div>${reasonBox}`,
    `<button class="btn ${yesCls}" onclick="_confirmYes()">
       <i class="fa-solid fa-check me-1"></i>${yesLabel}
     </button>
     <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>`);
}
// อ่านค่าเหตุผลก่อนปิดกล่อง เพราะปิดแล้ว DOM จะหายไป
function _confirmYes() {
  const box = document.getElementById('confirmReason');
  const reason = box ? box.value.trim() : '';
  closeModal('confirmDialog');
  if (window._confirmCb) window._confirmCb(reason);
}
