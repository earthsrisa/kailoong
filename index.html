async function renderCraftsmen(el) {
  // ปุ่มเปิดหน้าช่าง/เพิ่มช่าง ย้ายไปอยู่ในหน้าแล้ว (แถบดำด้านบน + ปุ่มมุมขวา)
  document.getElementById('topbarActions').innerHTML = '';

  const [craftsmen, products] = await Promise.all([DB.getCraftsmen(), DB.getProducts()]);
  window._settingsCraftsmen = craftsmen;
  window._settingsProducts  = products;

  // สถิติ craftStatus จาก orders
  const orders = await DB.getOrders();
  const craftedCount = {};
  const totalCount   = {};
  for (const o of orders) {
    if (isOrderFullyDelivered(o)) continue;
    const cs = o.craftStatus || {};
    for (const it of (o.items || [])) {
      const key = craftKey(it);
      totalCount[key] = (totalCount[key] || 0) + it.qty;
      const cqStat = getCraftedFor(cs, it);
      if (cqStat > 0) craftedCount[key] = (craftedCount[key] || 0) + cqStat;
    }
  }

  // สรุป pending per craftsman
  const craftsmanStats = craftsmen.map(c => {
    const myTypes = new Set(c.productTypes || []);
    const allTypes = !c.productTypes?.length;
    let pending = 0, done = 0;
    for (const o of orders) {
      if (isOrderFullyDelivered(o)) continue;
      const cs = o.craftStatus || {};
      for (const it of (o.items || [])) {
        if (!allTypes && !myTypes.has(it.productName)) continue;
        const cqPer = getCraftedFor(cs, it);
        done    += cqPer;
        pending += (it.qty - cqPer);
      }
    }
    return { ...c, pending, done };
  });

  // เสร็จวันนี้ทั้งร้าน — นับจาก log การกดของช่างทุกคนในวันนี้ (รวมบรรทัดยกเลิกด้วย)
  const todayKey = new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Bangkok'});
  let doneToday = 0;
  for (const o of orders) {
    for (const e of Object.values(o.craftStatus || {})) {
      if (!e || !Array.isArray(e.log)) continue;
      for (const L of e.log) {
        if (new Date(L.at||0).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'}) === todayKey)
          doneToday += Number(L.qty) || 0;
      }
    }
  }
  const totalPending = craftsmanStats.reduce((a,c)=>a+Math.max(0,c.pending), 0);
  const allTypeCount = [...new Set(products.map(p=>p.name))].length;

  el.innerHTML = `
  <div class="oh">
    <div><h2>ช่างแต่ง</h2><div class="cnt">ทั้งหมด <b>${craftsmen.length}</b> คน</div></div>
    <button class="btn btn-primary" onclick="showCraftsmanModal()" style="white-space:nowrap;">
      <i class="fa-solid fa-plus me-1"></i>เพิ่มช่าง</button>
  </div>

  <a class="cmban" href="/craft.html" onclick="return goCraftPage()">
    <span class="ic"><i class="fa-solid fa-hammer"></i></span>
    <span><span class="t">เปิดหน้าช่าง</span><br><span class="s">หน้าที่ช่างใช้กดแต่งเสร็จในโรงงาน</span></span>
    <span class="go">เปิด →</span>
  </a>

  <div class="cmstats">
    <div class="t"><div class="n" style="color:#b45309;">${craftsmen.length}</div><div class="l">ช่างแต่ง (คน)</div></div>
    <div class="t"><div class="n" style="color:${totalPending?'#dc2626':'#16a34a'};">${totalPending}</div><div class="l">ค้างแต่ง (ใบ)</div></div>
    <div class="t"><div class="n" style="color:#16a34a;">${Math.max(0,doneToday)}</div><div class="l">เสร็จวันนี้ (ใบ)</div></div>
  </div>

  <div style="font-weight:800;font-size:14px;margin:4px 2px 10px;">ช่างและภาระงาน</div>
  <div id="cmList">${craftsmen.length
    ? craftsmanStats.map(c => craftsmanCardHtml(c, allTypeCount)).join('')
    : `<div class="empty-state" style="padding:36px"><i class="fa-solid fa-hammer"></i><p>ยังไม่มีช่างแต่ง กด "เพิ่มช่าง" เพื่อเริ่มต้น</p></div>`}</div>

  <div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:14px 16px;margin-top:6px;">
    <div style="font-size:13.5px;font-weight:700;color:#0369a1;margin-bottom:7px;">
      <i class="fa-solid fa-circle-info me-1"></i>วิธีใช้งาน</div>
    <ul style="margin:0;padding-left:18px;font-size:12.5px;color:#374151;line-height:1.9;">
      <li>กด "ดูงานของช่าง" จะเปิดหน้าช่างพร้อมเลือกชื่อคนนั้นให้เลย</li>
      <li>ถ้าไม่ระบุประเภทหีบ ช่างคนนั้นจะเห็นทุกรายการ</li>
      <li>ช่างกดแต่งเสร็จแล้ว รายการรอส่งจะขึ้นสถานะให้อัตโนมัติ</li>
    </ul>
  </div>`;
  return;
}

// ── การ์ดช่าง 1 คน ──
// ประเภทที่รับผิดชอบบางคนตั้งไว้ถึง 20 อัน ถ้าโชว์หมดการ์ดจะยาวกว่าเนื้อหาอื่นรวมกัน
// → ครบทุกประเภท = ชิปเดียว "ทุกประเภท" / ไม่ครบ = 3 อันแรก + "อีก N ประเภท"
function craftsmanCardHtml(c, allTypeCount) {
  const types = c.productTypes || [];
  const isAll = !types.length || (allTypeCount && types.length >= allTypeCount);
  let chips;
  if (isAll) {
    chips = `<span class="cmtp all">ทุกประเภท</span>`;
  } else {
    chips = types.slice(0,3).map(t => `<span class="cmtp">${U.esc(t)}</span>`).join('')
          + (types.length > 3 ? `<span class="cmtp more">อีก ${types.length-3} ประเภท</span>` : '');
  }
  const pend = Math.max(0, c.pending || 0);
  return `<div class="cmcard">
    <div class="top">
      <div class="ava" style="background:${ocAvaColor(c.name||'')}">${U.esc(U.initial(c.name||'?'))}</div>
      <div class="who"><div class="nm">${U.esc(c.name||'-')}</div>
        <div class="cmtypes">${chips}</div></div>
      <div class="cmpend"><div class="n${pend?'':' zero'}">${pend}</div><div class="l">ค้างแต่ง (ใบ)</div></div>
    </div>
    <div class="acts">
      <a class="aa view" href="/craft.html?cm=${encodeURIComponent(c.id)}" onclick="return goCraftPage()">
        <i class="fa-solid fa-hammer"></i>ดูงานของช่าง</a>
      <button type="button" class="aa edit" onclick="showCraftsmanModal('${c.id}')">
        <i class="fa-solid fa-pen"></i>แก้ไข</button>
      <button type="button" class="aa more" onclick="this.closest('.cmcard').querySelector('.cmmenu').classList.toggle('open')">
        <i class="fa-solid fa-ellipsis-vertical"></i></button>
    </div>
    <div class="cmmenu">
      <button type="button" class="aa" onclick="deleteCraftsman('${c.id}')"><i class="fa-solid fa-trash"></i>ลบช่างคนนี้</button>
    </div>
  </div>`;
}

async function renderSettings(el) {
  document.getElementById('topbarActions').innerHTML = '';

  const [orders, customers, products, invoices] = await Promise.all([
    DB.getOrders(), DB.getCustomers(), DB.getProducts(), DB.getInvoices()
  ]);
  const lastBackup = await DB.getSetting('lastBackup');
  const muteUntil  = await getMuteUntil();
  const isMuted    = !!muteLabel(muteUntil);   // ปิดอยู่จริงไหม (เลยเวลาแล้ว = ไม่ปิด)
  const craftOn    = await getCraftOrderEnabled();

async function saveCraftsman() {
  if (window._saving) return; window._saving = true;
  try {
    const name = document.getElementById('cm_name')?.value.trim();
    if (!name) { U.toast('กรุณากรอกชื่อช่าง','error'); return; }
    const productTypes = [...document.querySelectorAll('.cm-type-cb:checked')].map(cb => cb.value);
    const id = document.getElementById('cm_id')?.value||'';
    const data = { name, productTypes };
    if (id) { const old=await DB.getCraftsman(id); await DB.putCraftsman({...old,...data}); U.toast('แก้ไขข้อมูลช่างแล้ว ✓'); }
    else { await DB.addCraftsman(data); U.toast('เพิ่มช่างแล้ว ✓'); }
    closeModal('craftsmanModal');
    navigate(window._craftsmanReturnPage || 'craftsmen');
  } catch(e) { U.toast('เกิดข้อผิดพลาด: '+e.message,'error'); }
  finally { window._saving = false; }
}

// ── BACKUP ──
// ดึงข้อมูลทั้งระบบมาเป็นก้อนเดียว — แยกออกมาเพื่อให้ "สำรองก่อนกู้คืน" เรียกใช้ซ้ำได้
async function buildBackupPayload() {
  const [customers, products, orders, invoices, expenses, craftsmen] = await Promise.all([
    DB.getCustomers(), DB.getProducts(), DB.getOrders(), DB.getInvoices(), DB.getExpenses(),
    DB.getCraftsmen()
  ]);
  // settings เก็บเป็น doc เดี่ยว ไม่ได้ผ่าน DB shortcut
  const setSnap = await DB._fs.collection('settings').get();
  const settings = setSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  return {
    version: 3,
    exportedAt: Date.now(),
    exportedBy: CFG.businessName,
    data: { customers, products, orders, invoices, expenses, craftsmen, settings }
  };
}

// เซฟก้อนข้อมูลลงเครื่องเป็นไฟล์ คืนชื่อไฟล์ที่เซฟ
function saveBackupFile(backup, prefix) {
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const now  = new Date();
  const pad  = n => String(n).padStart(2,'0');
  const fname= `${prefix}_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.json`;
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return fname;
}

async function backupData() {
  try {
    const backup = await buildBackupPayload();
    const fname  = saveBackupFile(backup, 'backup');
    await DB.setSetting('lastBackup', Date.now());
    U.toast(`✅ สำรองข้อมูลแล้ว — ${fname}`);
    setTimeout(() => navigate('settings'), 800);
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: ' + e.message, 'error');
  }
}

      window._pendingRestore = backup.data;

    } catch(err) {
      U.toast('อ่านไฟล์ไม่ได้: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

async function confirmRestore() {
  const data = window._pendingRestore;
  if (!data) { U.toast('ไม่พบข้อมูลสำหรับกู้คืน', 'error'); return; }

  // ประกาศนอก try เพราะ catch ด้านล่างต้องใช้บอกชื่อไฟล์กู้กลับ
  let safetyFile = '';
  try {
    closeModal('restoreConfirmModal');

    // ── สำรองของเดิมก่อนเสมอ ──
    // การกู้คืนคือการ "ลบทิ้งทั้งหมดแล้วเขียนใหม่" ถ้าเลือกไฟล์ผิด
    // หรือขาดเน็ตกลางคัน ข้อมูลเดิมจะหายโดยไม่มีทางถอย
    // จึงบังคับเซฟของเดิมลงเครื่องก่อน และถ้าเซฟไม่สำเร็จ = ไม่กู้คืนต่อ
    U.toast('กำลังสำรองข้อมูลเดิมก่อน...');
    try {
      const pre = await buildBackupPayload();
      safetyFile = saveBackupFile(pre, 'ก่อนกู้คืน');
    } catch (preErr) {
      U.toast('สำรองข้อมูลเดิมไม่สำเร็จ — ยกเลิกการกู้คืนเพื่อความปลอดภัย', 'error');
      console.error('pre-restore backup failed:', preErr);
      return;
    }

    U.toast('กำลังกู้คืนข้อมูล...');

    // ── กู้คืนแบบไม่ลบอะไรเลย ──
    // เดิม: ลบทั้ง collection ทิ้ง แล้วค่อยเขียนกลับทีละรายการ
    //       ถ้าพลาดกลางทาง = ลบไปแล้วแต่เขียนไม่ครบ ข้อมูลหายจริง
    // ใหม่: เขียนทับตรง ๆ ส่วนรายการที่ไม่มีในไฟล์ให้ทำเครื่องหมายว่าลบ
    //       ข้อมูลเดิมไม่เคยหายไปไหน ยังกดกู้จากถังขยะได้
    //       และไม่ต้องใช้การลบจริง จึงเข้ากับกฎ "ห้ามลบจริง" ใน Firestore
    const stores = ['customers','products','orders','invoices','expenses'];
    if (Array.isArray(data.craftsmen)) stores.push('craftsmen');

    for (const store of stores) {
      const incoming = data[store] || [];
      const incomingIds = new Set(incoming.map(x => String(x.id)));

      // 1) เขียนทับทุกรายการที่มีในไฟล์
      for (const rec of incoming) {
        const { id, ...rest } = rec;
        if (!id) continue;
        // เขียนทับทั้งเอกสาร และล้างเครื่องหมายลบออก (ของในไฟล์ถือว่ายังใช้อยู่)
        await DB._fs.collection(store).doc(String(id))
          .set({ ...rest, isDeleted: rest.isDeleted === true }, { merge: false });
      }

      // 2) รายการที่มีอยู่ในระบบแต่ไม่มีในไฟล์ → ทำเครื่องหมายว่าลบ ไม่ได้ลบจริง
      const current = await DB._all(store);
      for (const old of current) {
        if (incomingIds.has(String(old.id))) continue;
        if (old.isDeleted === true) continue;          // ทำเครื่องหมายไว้อยู่แล้ว
        await DB._del(store, old.id, 'ไม่มีในไฟล์ที่กู้คืน');
      }
    }
    DB._cache = {};   // ข้อมูลเปลี่ยนยกชุด ล้าง cache ให้อ่านใหม่
    // ตั้งค่าร้าน (ชื่อร้าน ที่อยู่ PromptPay ฯลฯ)
    for (const st of (data.settings||[])) {
      const { id, ...rest } = st;
      if (id) await DB._fs.collection('settings').doc(String(id)).set(rest, { merge: true });
    }
    // ตัวนับเลขออเดอร์: ตั้งใหม่ให้ตรงกับข้อมูลที่กู้คืน กันเลขซ้ำ
    try {
      const yr = new Date().getFullYear() + 543;
      const maxOf = (arr, field, prefix) => {
        const nums = (arr||[]).map(x => x[field]).filter(n => typeof n === 'string' && n.startsWith(prefix))
          .map(n => parseInt(n.slice(prefix.length)) || 0);
        return nums.length ? Math.max(...nums) : 0;
      };
      await DB._fs.collection('counters').doc(`orders-${yr}`)
        .set({ seq: maxOf(data.orders, 'orderNo', `ORD-${yr}-`), updatedAt: Date.now() }, { merge: true });
      await DB._fs.collection('counters').doc(`invoices-${yr}`)
        .set({ seq: maxOf(data.invoices, 'invoiceNo', `RC-${yr}-`), updatedAt: Date.now() }, { merge: true });
    } catch(e) { console.error('reset counters:', e); }

    // ⚠️ เดิมตรงนี้เขียน lastBackup = ตอนนี้ ซึ่งผิด
    // การกู้คืนไม่ใช่การสำรอง ถ้าบันทึกแบบนั้นแถบเตือนจะนึกว่าเพิ่งสำรองไป
    // แล้วเงียบไปอีก 7 วัน ทั้งที่ยังไม่มีไฟล์สำรองของข้อมูลชุดใหม่เลย
    await DB.setSetting('lastRestore', Date.now());
    window._pendingRestore = null;

    // ── ตรวจนับว่าเข้าครบไหม ──
    // เขียนทีละรายการหลายร้อยครั้ง ถ้าพลาดกลางทางบางรายการจะหายเงียบ ๆ
    DB._cache = {};   // ล้าง cache ให้ไปนับของจริงจากเซิร์ฟเวอร์
    // นับเฉพาะรายการที่ "ใช้งานอยู่" ทั้งสองฝั่ง
    // (ไฟล์สำรองเก็บของที่อยู่ในถังขยะมาด้วย และฐานข้อมูลก็ยังมีของที่ทำเครื่องหมายลบ
    //  ถ้านับดิบ ๆ ทั้งสองฝั่งจะไม่มีทางตรงกัน)
    const liveCount = arr => (arr||[]).filter(x => x.isDeleted !== true).length;
    const expect = {
      customers: liveCount(data.customers), products: liveCount(data.products),
      orders:    liveCount(data.orders),    invoices: liveCount(data.invoices),
      expenses:  liveCount(data.expenses)
    };
    if (Array.isArray(data.craftsmen)) expect.craftsmen = liveCount(data.craftsmen);
    const missing = [];
    for (const [col, want] of Object.entries(expect)) {
      try {
        const snap = await DB._fs.collection(col).get();
        const got = snap.docs.filter(d => d.data().isDeleted !== true).length;
        if (got !== want) missing.push(`${THAI_COL[col]||col} ${got}/${want}`);
      } catch(e) { missing.push(`${THAI_COL[col]||col} ตรวจไม่ได้`); }
    }

    if (missing.length) {
      U.toast('⚠️ กู้คืนแล้วแต่จำนวนไม่ตรง: ' + missing.join(', ') + ' — ไฟล์สำรองของเดิมคือ ' + safetyFile, 'error');
    } else {
      U.toast('✅ กู้คืนข้อมูลสำเร็จ ตรวจนับครบทุกรายการแล้ว');
    }
    setTimeout(() => navigate('dashboard'), 1200);
  } catch(err) {
    U.toast('เกิดข้อผิดพลาดระหว่างกู้คืน: ' + err.message
      + (safetyFile ? ' — กู้กลับได้จากไฟล์ ' + safetyFile : ''), 'error');
  }
}
const THAI_COL = { customers:'ลูกค้า', products:'สินค้า', orders:'ออเดอร์',
  invoices:'ใบเสร็จ', expenses:'รายจ่าย', craftsmen:'ช่างแต่ง' };

const TRASH_COLS = ['orders','invoices','customers','products','expenses','craftsmen'];
// ป้ายชื่อแต่ละรายการ ให้คนอ่านรู้ว่าลบอะไรไป
function trashLabel(col, r) {
  if (col === 'orders')    return `${r.orderNo || 'ออเดอร์'} · ${r.customerName || '-'}`;
  if (col === 'invoices')  return `${r.invoiceNo || 'ใบเสร็จ'} · ${r.customerName || '-'}`;
  if (col === 'customers') return r.name || '(ไม่มีชื่อ)';
  if (col === 'products')  return r.name || '(ไม่มีชื่อ)';
  if (col === 'craftsmen') return r.name || '(ไม่มีชื่อ)';
  if (col === 'expenses')  return `${r.category || 'รายจ่าย'} · ${U.money(r.amount||0)} บาท`;
  return r.id;
}

// ตั้งเวลาปิดแจ้งเตือน — hours เป็นตัวเลขชั่วโมง, 'forever' = จนกว่าจะกดเปิดเอง, 0 = เปิดเลย
async function setMute(hours) {
  try {
    const ts = hours === 'forever' ? MUTE_FOREVER
             : hours ? Date.now() + hours * 3600000
             : 0;
    await setMuteUntil(ts);
    U.toast(ts ? `ปิดแจ้งเตือน LINE แล้ว ${hours === 'forever' ? '(จนกว่าจะเปิดเอง)' : `${hours} ชั่วโมง`}`
                : 'เปิดแจ้งเตือน LINE แล้ว ✓');
    navigate('settings');
  } catch(e) { U.toast('ตั้งค่าไม่สำเร็จ: ' + e.message, 'error'); }
}

  const blocks = groups.filter(g => g.rows.length).map(g => `

        <div style="display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap;">

          <button class="btn btn-sm btn-outline-success" style="white-space:nowrap;font-weight:600;"

      <i class="fa-solid fa-circle-info me-1"></i>
      ของที่ลบไปจะมาอยู่ที่นี่ ไม่ได้หายจากฐานข้อมูลจริง กดกู้คืนได้ตลอด
      — และไม่ถูกนับในรายงานหรือยอดเงินใดๆ
    </div>
    ${total ? blocks : `<div class="empty-state" style="padding:40px"><i class="fa-solid fa-trash-can"></i><p>ถังขยะว่าง</p></div>`}`;
}

async function restoreTrashItem(btn) {
  const col = btn.dataset.col, id = btn.dataset.id;
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  try {
    await DB._undel(col, id);
    U.toast(`กู้คืน${THAI_COL[col]}แล้ว ✓`);
    navigate('trash');
  } catch(e) {
    U.toast('กู้คืนไม่สำเร็จ: ' + e.message, 'error');
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-rotate-left me-1"></i>กู้คืน';
  }
}

};
const EXP_ALIAS = { 'วัตถุดิบ':'ค่าไม้', 'ค่าแรง':'ค่าแรงช่าง' };
const EXP_CAT_LIST = Object.keys(EXP_CATS);
function expStyle(name) {
  return EXP_CATS[name] || EXP_CATS[EXP_ALIAS[name]] || EXP_CATS['อื่นๆ'];
}

const EXP_RANGES = {
  month: 'เดือนนี้', prev: 'เดือนก่อน', year: 'ปีนี้', all: 'ทั้งหมด',
};
function setExpRange(r) {

async function renderExpenses(el) {
  const expenses = await DB.getExpenses();
  expenses.sort((a,b) => b.date - a.date);

  const rng = window._expRange || 'month';
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  let from = 0, to = Date.now();
  if (rng === 'month') from = new Date(y, m, 1).getTime();
  else if (rng === 'prev') { from = new Date(y, m-1, 1).getTime(); to = new Date(y, m, 1).getTime() - 1; }
  else if (rng === 'year') from = new Date(y, 0, 1).getTime();

  const list  = expenses.filter(e => e.date >= from && e.date <= to);
  const total = list.reduce((s,e) => s + (Number(e.amount)||0), 0);

  const byCat = {};
  list.forEach(e => { const c = e.category || 'อื่นๆ'; byCat[c] = (byCat[c]||0) + (Number(e.amount)||0); });
  const cats = Object.entries(byCat).sort((a,b) => b[1] - a[1]);
  const maxCat = Math.max(1, ...cats.map(([,v]) => v));

  el.innerHTML = `
  <div class="oh">
    <div><h2>รายจ่ายโรงงาน</h2>
      <div class="cnt">${EXP_RANGES[rng]} · <b>${list.length}</b> รายการ</div></div>

    ${Object.entries(EXP_RANGES).map(([k,label])=>`
      <button type="button" class="ochip${rng===k?' on':''}" onclick="setExpRange('${k}')">${label}</button>`).join('')}

  <div class="ivsum" style="background:linear-gradient(135deg,#9f1239,#e11d48);box-shadow:0 6px 16px rgba(225,29,72,.25);">
    <div>
      <div class="big">${U.baht(total)} <span style="font-size:15px;">บาท</span></div>
      <div class="lb">รายจ่าย${EXP_RANGES[rng]}</div>

    <div class="divi"></div>
    <div class="side"><div class="n">${list.length} รายการ</div><div class="l">${EXP_RANGES[rng]}</div></div>
  </div>

  ${cats.length ? `
  <div class="rpanel excat">
    <div class="ph"><div class="t">แยกตามหมวดหมู่</div><div class="s">${EXP_RANGES[rng]}</div></div>
    <div class="rrank">
      ${cats.map(([cat,amt])=>{
        const s = expStyle(cat);
        return `<div>
          <div class="l1">
            <span class="cat"><span class="d" style="background:${s.c};"></span>${U.esc(cat)}</span>
            <span class="amt">${U.baht(amt)} บาท</span>
          </div>
          <div class="track"><i style="width:${Math.max(4, Math.round(amt/maxCat*100))}%;background:${s.c};"></i></div>

      }).join('')}

  <div style="font-weight:800;font-size:14px;margin:4px 2px 10px;">รายการ${EXP_RANGES[rng]}</div>

  ${list.length ? list.map(e=>{
    const s = expStyle(e.category);
    return `<div class="exrow">
      <div class="ci" style="background:${s.c};"><i class="fa-solid ${s.i}"></i></div>

          <span class="exchip" style="background:${s.bg};color:${s.c};">${U.esc(e.category||'อื่นๆ')}</span>

  // ใช้รายชื่อหมวดชุดเดียวกับหน้ารายจ่าย จะได้ไม่หลุดกันเวลาแก้ชื่อหมวด
  // ⚠️ ต้องประกาศหลัง exp — ถ้ารายการเก่าใช้ชื่อหมวดที่เลิกใช้แล้ว (วัตถุดิบ/ค่าแรง)
  //    ต้องเติมกลับเข้าไปด้วย ไม่งั้นกดแก้ไขแล้วหมวดจะเด้งไปเป็นค่าแรกเงียบๆ

  const body = `

      <div class="col-sm-6">
        <label class="form-label">วันที่ <span class="text-danger">*</span></label>
        <input type="date" class="form-control" id="exp_date" value="${exp ? new Date(exp.date).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'}) : today}">
      </div>
      <div class="col-sm-6">
        <label class="form-label">หมวดหมู่</label>
        <select class="form-select" id="exp_cat">
          ${CATS.map(c=>`<option value="${c}" ${exp?.category===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">รายละเอียด</label>
        <input type="text" class="form-control" id="exp_note" placeholder="เช่น ซื้อไม้สัก 100 แผ่น" value="${U.esc(exp?.note||'')}">
      </div>
      <div class="col-12">
        <label class="form-label">จำนวนเงิน (บาท) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" id="exp_amount" placeholder="0" min="0" step="1" value="${exp?.amount||''}">
      </div>
    </div>`;

  window._editExpenseId = id || null;
  showModal('expenseModal', id ? 'แก้ไขรายจ่าย' : 'เพิ่มรายจ่าย', body,
    `<button class="btn btn-danger" onclick="saveExpense()"><i class="fa-solid fa-save me-1"></i>บันทึก</button>
     <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>`);
  setTimeout(()=>document.getElementById('exp_amount')?.focus(),300);
}

async function saveExpense() {
  if (window._saving){return;} window._saving=true;
  // กันเหนียว: ถ้ามีอะไรค้างจนโค้ดข้างล่างไม่จบ ปลดล็อกให้กดใหม่ได้
  clearTimeout(window._savingWatchdog);
  window._savingWatchdog = setTimeout(() => { window._saving = false; }, 45000);
  try {
    const dateVal   = document.getElementById('exp_date')?.value;
    const amountStr = document.getElementById('exp_amount')?.value;
    const amount    = parseFloat(amountStr);
    if (!dateVal)                              { U.toast('กรุณาเลือกวันที่','error'); return; }
    if (!amountStr||amount<=0||isNaN(amount))  { U.toast('กรุณากรอกจำนวนเงินที่ถูกต้อง','error'); return; }

    const data = {
      date:     new Date(dateVal).getTime(),
      category: document.getElementById('exp_cat')?.value  || 'อื่นๆ',
      note:     document.getElementById('exp_note')?.value.trim() || '',
      amount
    };

    if (window._editExpenseId) {
      await DB.putExpense({ ...data, id: window._editExpenseId });
      U.toast('แก้ไขรายจ่ายแล้ว ✓');
    } else {
      await DB.addExpense(data);
      U.toast('เพิ่มรายจ่ายแล้ว ✓');
    }
    closeModal('expenseModal');
    navigate('expenses');
  } catch(e) {
    U.toast('เกิดข้อผิดพลาด: '+e.message,'error');
  } finally {
    window._saving=false;
  }
}

function deleteExpense(id) {
  U_confirm('ต้องการลบรายจ่ายนี้ใช่ไหม?', async(reason)=>{
    await DB.delExpense(id, reason);
    U.toast('ลบรายจ่ายแล้ว');
    navigate('expenses');
  }, {askReason:true});
}

function emptyRow(cols,msg,icon='fa-inbox') {
  return `<tr><td colspan="${cols}"><div class="empty-state" style="padding:30px"><i class="fa-solid ${icon}"></i><p>${msg}</p></div></td></tr>`;
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
// ปุ่มย้อนกลับของเบราว์เซอร์/มือถือ → ย้อนหน้าในแอป
window.addEventListener('popstate', (e) => {
  const page = e.state?.page;
  if (page && PAGE_TITLES[page]) {
    navigate(page, {fromPop:true});
    try { localStorage.setItem('kl_lastPage', page); } catch(err) {}
  }
});

window.addEventListener('DOMContentLoaded', async () => {
  try {
    await DB.init();
    await DB.loadSettings();
    document.getElementById('sidebarBizName').textContent = CFG.businessName;
    const verEl = document.getElementById('sidebarVer');
    if (verEl) verEl.textContent = '· ' + APP_VERSION;
    // เปิดหน้าเดิมที่ค้างไว้ — จาก #hash ก่อน ถ้าไม่มีใช้ที่จำไว้ครั้งล่าสุด
    const hash  = (location.hash || '').replace('#','');
    const saved = (() => { try { return localStorage.getItem('kl_lastPage'); } catch(e) { return null; } })();
    const start = PAGE_TITLES[hash] ? hash : (PAGE_TITLES[saved] ? saved : 'dashboard');
    try { history.replaceState({page:start}, '', '#' + start); } catch(e) {}
    window._currentPage = null;   // บังคับให้ navigate ทำงานเต็มรูปแบบ
    navigate(start, {fromPop:true});
  } catch(e) {
    console.error('init error', e);
    document.getElementById('page-content').innerHTML =
      `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i><p>โหลดข้อมูลไม่ได้ กรุณารีเฟรช</p><button onclick="location.reload()" class="btn btn-primary mt-2">รีเฟรช</button></div>`;
  }
});

// ═══════════════════════════════════════
//  SERVICE WORKER + สถานะออฟไลน์
// ═══════════════════════════════════════
// sw.js เก็บไฟล์แอพ (HTML/ไอคอน) ไว้ในเครื่อง → เปิดครั้งต่อไปเร็วขึ้นมาก
// ข้อมูลจาก Firestore ไม่ถูกเก็บที่นี่ (sw.js ปล่อยผ่าน) → ยังสดเสมอ
function klRegisterSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;   // เปิดไฟล์ตรงๆ ใช้ไม่ได้
  // ครั้งแรกที่ติดตั้ง controller จะเปลี่ยนเองโดยไม่ใช่การอัปเดต — ห้ามรีโหลด
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('/sw.js').then(reg => {
    // มีเวอร์ชันใหม่รออยู่ตั้งแต่เปิดหน้า
    if (reg.waiting && navigator.serviceWorker.controller) klShowUpdateBar(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        // controller มีค่า = เคยติดตั้งแล้ว แปลว่านี่คือ "อัปเดต" ไม่ใช่ครั้งแรก
        if (nw.state === 'installed' && navigator.serviceWorker.controller) klShowUpdateBar(nw);
      });
    });
  }).catch(e => console.warn('sw register failed', e));

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    klReloadOnce();
  });
}
let _klReloading = false;
function klReloadOnce() {
  if (_klReloading) return;
  _klReloading = true;
  location.reload();
}

function klShowUpdateBar(worker) {
  if (document.getElementById('klUpdateBar')) return;
  const d = document.createElement('div');
  d.id = 'klUpdateBar';
  d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:3000;background:#1a2332;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:15px;';
  d.innerHTML = `<i class="fa-solid fa-arrows-rotate" style="color:#60a5fa"></i>
    <span style="flex:1">มีเวอร์ชันใหม่พร้อมใช้</span>
    <button id="klUpdNow" style="border:0;background:#3b82f6;color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;">อัปเดต</button>
    <button id="klUpdLater" style="border:0;background:transparent;color:#9aa8bd;font-size:15px;padding:8px;">ภายหลัง</button>`;
  document.body.appendChild(d);
  d.querySelector('#klUpdNow').onclick = () => {
    d.remove();
    worker.postMessage({ type: 'SKIP_WAITING' });   // เสร็จแล้ว controllerchange จะรีโหลดเอง
    setTimeout(klReloadOnce, 1500);                 // เผื่อ controllerchange ไม่ยิง
  };
  d.querySelector('#klUpdLater').onclick = () => d.remove();
}

// ── ป้ายบอกว่าออฟไลน์ ──
function klOfflineBadge(show) {
  let b = document.getElementById('klOffBadge');
  if (!show) { b?.remove(); return; }
  if (b) return;
  b = document.createElement('div');
  b.id = 'klOffBadge';
  b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:3000;background:#b45309;color:#fff;border-radius:20px;padding:7px 16px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);';
  b.innerHTML = '<i class="fa-solid fa-wifi" style="opacity:.7"></i> ออฟไลน์ — ข้อมูลอาจไม่ล่าสุด';
  document.body.appendChild(b);
}
window.addEventListener('online',  () => { klOfflineBadge(false); U.toast?.('กลับมาออนไลน์แล้ว','success'); });
window.addEventListener('offline', () => klOfflineBadge(true));
if (!navigator.onLine) klOfflineBadge(true);

klRegisterSW();
</script>
