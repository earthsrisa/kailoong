const FIREBASE_CONFIG_PROD = {

// ⚠️ ต้องตรงกับใน index.html / craft.html
const FIREBASE_CONFIG_TEST = {
  apiKey: "AIzaSyDmDHYILIPeZO0IplMxYO4c9mq-zBQShZk",
  authDomain: "kailoong-test.firebaseapp.com",
  projectId: "kailoong-test",
  storageBucket: "kailoong-test.firebasestorage.app",
  messagingSenderId: "142486923524",
  appId: "1:142486923524:web:5079302d0a348641688851"

const FIREBASE_CONFIG = (window.KL_IS_TEST === false) ? FIREBASE_CONFIG_PROD : FIREBASE_CONFIG_TEST;
let db = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function withTimeout(promise, ms, msg) {
  let t;
  return Promise.race([
    promise.finally(() => clearTimeout(t)),
    new Promise((_, rej) => { t = setTimeout(() => rej(new Error(msg || 'หมดเวลารอ')), ms); })
  ]);
}
function thDate(ts) { return ts ? new Date(ts).toLocaleDateString('th-TH-u-ca-buddhist', {day:'numeric', month:'short'}) : ''; }
function hhmm(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

// ── ตัวช่วยอ่านสถานะ — ⚠️ ต้องตรงกับ index.html / craft.html ──
const ACC_HINTS = ['เทพ','นางฟ้า','มุม','กางเขน','ดอกพิกุล','พลาสติก','ม้วน'];
function itemKey(i) { return `${i.productName}|${i.color||''}|${i.trimColor||''}|${i.extra||''}`; }
function itemKeyLegacy(i) { return `${i.productName}|${i.color||''}|${i.trimColor||''}`; }
function readCraftEntry(cs, i) { if (!cs) return undefined; const k = itemKey(i); return cs[k] !== undefined ? cs[k] : cs[itemKeyLegacy(i)]; }
function getCraftedQty(e, q) { if (!e) return 0; if (e.craftedQty !== undefined) return Math.min(e.craftedQty, q); return e.isCrafted ? q : 0; }
const deliverKey = itemKey;
function getDeliveredQty(e, q, all) { if (!e) return all ? q : 0; if (e.deliveredQty !== undefined) return Math.min(e.deliveredQty, q); return all ? q : 0; }
function isAccessory(name) {
  const p = (_ref.products || {})[name];
  if (p) return String(p).trim() !== 'โลง';
  return ACC_HINTS.some(k => (name || '').includes(k));
}
function itemLabel(i) {
  const isChrist = i.trimColor === 'คริสต์' || i.style === 'คริสต์';
  return (i.productName || '')
    + (i.color && i.color !== '-' ? ' (' + i.color + ')' : '')
    + (isChrist ? ' ✝คริสต์' : (i.trimColor && i.trimColor !== '-' ? ' เส้น' + i.trimColor : ''))
    + (i.extra ? ' ' + i.extra : '');
}

// ── ข้อมูลประกอบ: สายส่งของลูกค้า + สีสาย + หน่วยสินค้า ──
// เก็บไว้ในเครื่อง ดึงใหม่ทุก 6 ชม. หรือกด ↻ (ลูกค้า/สินค้าเปลี่ยนไม่บ่อย ไม่ต้องอ่านทุกครั้งที่เปิด — ประหยัดโควตา)
const REF_KEY = 'kl_view_ref_' + FIREBASE_CONFIG.projectId, REF_EVERY = 6 * 3600 * 1000;
let _ref = { routes: {}, colors: {}, products: {}, at: 0 };
try { const r = JSON.parse(localStorage.getItem(REF_KEY) || 'null'); if (r && r.routes) _ref = r; } catch (e) {}
async function loadRef(force) {
  if (!force && _ref.at && _ref.stickers && Date.now() - _ref.at < REF_EVERY) return;   // ของเก่าไม่มีสีสติ๊กเกอร์ = ดึงใหม่
  try {
    const [cs, ps, rc] = await Promise.all([
      withTimeout(db.collection('customers').get({ source: 'server' }), 15000),
      withTimeout(db.collection('products').get({ source: 'server' }), 15000),
      withTimeout(db.collection('settings').doc('routeColors').get({ source: 'server' }), 15000).catch(() => null),
    ]);
    const routes = {}, products = {}, stickers = {};
    cs.docs.forEach(d => {
      const c = d.data(); const r = String(c.route || '').replace(/\s+/g, ' ').trim(); if (r) routes[d.id] = r;
      if (c.isDeleted !== true) stickers[String(c.name || '').trim()] = custStickerName(c);   // '' = ไม่มีสติ๊กเกอร์
    });
    ps.docs.forEach(d => { const p = d.data(); if (p.isDeleted !== true && p.name) products[p.name] = p.unit || 'โลง'; });
    const colors = (rc && rc.exists && rc.data().value) || _ref.colors || {};
    _ref = { routes, colors, products, stickers, at: Date.now() };
    try { localStorage.setItem(REF_KEY, JSON.stringify(_ref)); } catch (e) {}
    render();
  } catch (e) { console.warn('loadRef:', e); }
}

// ── ออเดอร์: ใช้ที่เก็บในเครื่องชุดเดียวกับหน้าแอดมิน/หน้าช่าง + ฟังเฉพาะที่เปลี่ยน ──
// ⚠️ รูปแบบที่เก็บต้องตรงกับ DB._persist ใน index.html และ KLStore ใน craft.html
const KLStore = {
  _p: null,
  _open() {
    if (!this._p) this._p = new Promise(res => {
      try {
        const r = indexedDB.open('kl-data', 1);
        r.onupgradeneeded = () => { try { r.result.createObjectStore('cols'); } catch (e) {} };
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return withTimeout(this._p, 3000).catch(() => null);
  },
  _key(col) { return FIREBASE_CONFIG.projectId + ':' + col; },
  async get(col) {
    const d = await this._open(); if (!d) return null;
    return withTimeout(new Promise(res => {
      try { const q = d.transaction('cols').objectStore('cols').get(this._key(col)); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }
      catch (e) { res(null); }
    }), 3000).catch(() => null);
  },
  async put(col, v) {
    const d = await this._open(); if (!d) return;
    try { d.transaction('cols', 'readwrite').objectStore('cols').put(v, this._key(col)); } catch (e) {}
  },
};
const ORD_FULL_EVERY = 6 * 3600 * 1000;
let _ordP = null, _unsub = null, _lastAt = 0;
function _ordMerge(d) {
  const x = { id: d.id, ...d.data() };
  if (x.updatedAt && typeof x.updatedAt.toMillis === 'function') x.updatedAt = x.updatedAt.toMillis();
  if (typeof x.updatedAt === 'number' && !d.metadata.hasPendingWrites && x.updatedAt > _ordP.maxTs) _ordP.maxTs = x.updatedAt;
  _ordP.rows.set(String(x.id), x);
}
let _saveT = null;
function _ordSave() {
  clearTimeout(_saveT);
  _saveT = setTimeout(() => { if (_ordP) KLStore.put('orders', { rows: [..._ordP.rows.values()], maxTs: _ordP.maxTs, fullAt: _ordP.fullAt, v: 1 }); }, 400);
}
async function startOrders(full) {
  if (_unsub) { _unsub(); _unsub = null; }
  const v = await KLStore.get('orders');
  _ordP = (v && Array.isArray(v.rows)) ? { rows: new Map(v.rows.map(r => [String(r.id), r])), maxTs: v.maxTs || 0, fullAt: v.fullAt || 0 } : null;
  if (_ordP) render();     // โชว์ของในเครื่องก่อน ไม่ต้องรอเน็ต
  if (full || !_ordP || !_ordP.rows.size || Date.now() - _ordP.fullAt > ORD_FULL_EVERY) {
    // source:'server' — get() ธรรมดาตอนเน็ตหลุดคืน "ผลว่าง" จากแคช
    let snap = null;
    try { snap = await withTimeout(db.collection('orders').get({ source: 'server' }), 20000, 'หมดเวลารอข้อมูล'); }
    catch (e) { if (!_ordP || !_ordP.rows.size) throw e; }
    if (snap) {
      _ordP = { rows: new Map(), maxTs: 0, fullAt: Date.now() };
      snap.docs.forEach(_ordMerge); _ordSave();
    }
  }
  _lastAt = Date.now(); render();
  const since = firebase.firestore.Timestamp.fromMillis(Math.max(1, _ordP.maxTs));
  _unsub = db.collection('orders').where('updatedAt', '>', since).onSnapshot(snap => {
    if (snap.metadata.fromCache && snap.empty) return;
    snap.docs.forEach(_ordMerge);
    _lastAt = Date.now();
    if (snap.docs.length) _ordSave();
    render();
  }, err => { console.error(err); showTip('⚠️ เชื่อมต่อไม่ได้ กด ↻ เพื่อลองใหม่'); });
}

// ── วาดจอ: สายส่ง → ลูกค้า → ของที่ยังไม่ได้ส่ง ──
// สีประจำลูกค้า — ⚠️ เหมือน ocAvaColor / STICKER_COLORS / custStickerName ใน index.html (ลูกค้าคนเดียวกันได้สีเดียวกันทุกหน้า)
// ตั้งสีสติ๊กเกอร์ไว้ = ใช้สีนั้น · ยังไม่ได้ตั้ง = สุ่มจากชื่อ
const STICKER_COLORS = {
  'ม่วง':   { bg:'#7c3aed', fg:'#fff' },
  'น้ำเงิน': { bg:'#1d4ed8', fg:'#fff' },
  'ดำ':     { bg:'#111827', fg:'#fff' },
  'เขียว':  { bg:'#15803d', fg:'#fff' },
  'แดง':    { bg:'#dc2626', fg:'#fff' },
  'ส้ม':    { bg:'#ea580c', fg:'#fff' },
  'ชมพู':   { bg:'#db2777', fg:'#fff' },
  'เหลือง': { bg:'#facc15', fg:'#111827' },
};
const STICKER_DEFAULTS = { 'ป้าแมว':'ม่วง', 'ครูนุช':'น้ำเงิน', 'ป้าดา':'ดำ', 'ป้าขวัญ':'เขียว' };
function custStickerName(c) {
  const v = c.stickerColor;
  if (v === 'none') return '';
  if (v && STICKER_COLORS[v]) return v;
  return STICKER_DEFAULTS[String(c.name || '').trim()] || '';
}
function custSticker(name) {
  const nm = String(name || '').trim(), m = _ref.stickers || {};
  return STICKER_COLORS[nm in m ? m[nm] : STICKER_DEFAULTS[nm]] || null;
}
function custFg(name) { const s = custSticker(name); return s ? s.fg : '#fff'; }
const CUST_COLORS = ['#2563eb','#16a34a','#d97706','#7c3aed','#db2777','#0891b2','#dc2626','#4f46e5'];
function custColor(name) {
  const s = custSticker(name); if (s) return s.bg;
  let h = 0;
  for (let i = 0; i < (name||'').length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return CUST_COLORS[h % CUST_COLORS.length];
}
function render() {
  const box = document.getElementById('list');
  if (!_ordP) return;
  const groups = new Map();
  for (const o of _ordP.rows.values()) {
    if (o.isDeleted === true) continue;
    // รวมจำนวนตาม key ในใบก่อน แล้วค่อยหักที่ส่งแล้ว (ที่ส่งแล้วเก็บเป็นยอดรวมต่อ key)
    const need = new Map();
    for (const i of (o.items || [])) {
      const k = deliverKey(i); const q = Number(i.qty) || 0;
      if (need.has(k)) need.get(k).qty += q; else need.set(k, { i, qty: q });
    }
    const left = [];
    for (const [k, n] of need) {
      const sent = getDeliveredQty((o.deliveryStatus || {})[k], n.qty, o.isDelivered);
      const remain = n.qty - sent;
      if (remain <= 0) continue;
      const crafted = getCraftedQty(readCraftEntry(o.craftStatus, n.i), n.qty);
      left.push({ label: itemLabel(n.i), note: n.i.specialNote || '', remain, ready: Math.max(0, crafted - sent), acc: isAccessory(n.i.productName) });
    }
    if (!left.length) continue;
    const gk = o.customerId || o.customerName || '-';
    let g = groups.get(gk);
    if (!g) groups.set(gk, g = { name: o.customerName || '-', custId: o.customerId, first: o.createdAt || 0, items: [] });
    g.first = Math.min(g.first, o.createdAt || g.first);
    for (const it of left) {
      const ex = g.items.find(x => x.label === it.label && x.note === it.note);
      if (ex) { ex.remain += it.remain; ex.ready += it.ready; } else g.items.push({ ...it });
    }
  }
  const NONE = 'อื่น ๆ (ยังไม่ได้ตั้งสายส่ง)';
  const routes = new Map();
  for (const g of groups.values()) {
    const r = (g.custId && _ref.routes[g.custId]) || NONE;
    if (!routes.has(r)) routes.set(r, []);
    routes.get(r).push(g);
  }
  const order = [...routes.keys()].sort((a, b) => a === NONE ? 1 : b === NONE ? -1 : a.localeCompare(b, 'th'));
  let totalCoffin = 0, totalCust = groups.size;
  const html = order.map(r => {
    const list = routes.get(r).sort((a, b) => a.first - b.first);
    const pcs = list.reduce((a, g) => a + g.items.filter(x => !x.acc).reduce((s, x) => s + x.remain, 0), 0);
    totalCoffin += pcs;
    const col = r === NONE ? '#94a3b8' : (_ref.colors[r] || '#fbbf24');
    return `<div class="route">
      <div class="route-h" style="background:${col}"><span class="n">${esc(r)}</span><span class="c">${list.length} ร้าน · ${pcs} ใบ</span></div>
      ${list.map(g => {
        const allReady = g.items.every(x => x.acc || x.ready >= x.remain);
        const cpcs = g.items.filter(x => !x.acc).reduce((s, x) => s + x.remain, 0);
        const ac = custColor(g.name);
        return `<div class="cust" style="border-left-color:${ac}"><div class="cust-h">
            <span class="who"><span class="nm" style="background:${ac};color:${custFg(g.name)}">${esc(g.name)}</span><span class="dt">สั่ง ${thDate(g.first)}</span>${allReady ? '<span class="ready">พร้อมส่ง</span>' : ''}</span>
            ${cpcs ? `<span class="cc">${cpcs} ใบ</span>` : ''}
          </div><div class="cust-b">
          ${g.items.map(x => {
            const bd = x.acc ? '<span class="bd acc">อุปกรณ์</span>'
              : x.ready >= x.remain ? '<span class="bd done">แต่งแล้ว</span>'
              : x.ready > 0 ? `<span class="bd part">แต่งแล้ว ${x.ready}/${x.remain}</span>`
              : '<span class="bd not">ยังไม่แต่ง</span>';
            return `<div class="it"><span class="lb">${esc(x.label)}${bd}${x.note ? `<span class="note">${esc(x.note)}</span>` : ''}</span><span class="q">${x.remain}</span></div>`;
          }).join('')}</div></div>`;
      }).join('')}
    </div>`;
  }).join('');
  box.innerHTML = html || '<div class="empty">ส่งของครบแล้ว ไม่มีรายการรอส่ง</div>';
  document.getElementById('sub').textContent = `${totalCust} ลูกค้า · โลง ${totalCoffin} ใบ` + (_lastAt ? ` · อัปเดต ${hhmm(_lastAt)}` : '');
}
function showTip(t) {
  const box = document.getElementById('list');
  if (!document.getElementById('tip')) box.insertAdjacentHTML('afterbegin', `<div class="tip" id="tip">${esc(t)}</div>`);
}

// ═══════════════════════════════════════
//  แจ้งเตือนออเดอร์ใหม่ (Web Push) — ปุ่มกระดิ่งมุมขวาบน
//  รายชื่อเครื่อง: settings/pushSubs (ช่อง view:true) · ตัวส่ง: pushNewOrder ใน index.html / pushNewOrderCraft ใน craft.html
//  เครื่องที่เปิดฝั่งแอดมินหรือช่างไว้ด้วย จะได้ข้อความของฝั่งนั้นแทน (ไม่เด้งซ้ำ)
// ═══════════════════════════════════════
// ⚠️ ต้องตรงกับ VAPID_PUBLIC ใน index.html / craft.html
const VAPID_PUBLIC = 'BIlBe8nCh6Lvbwut0lidGPImm9I491QKsF1dFO7sl_ZSDP8LZg3O0qJ51gWRftY2Q8OmyLOlzMWedgP1nk1XCzA';
const vpDoc = () => db.collection('settings').doc('pushSubs');
function vpSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function vpIsIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function vpStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
// ⚠️ ต้องคำนวณเหมือน pushSubId() ใน index.html ทุกตัวอักษร
function vpSubId(endpoint) {
  let h = 0; for (let i = 0; i < endpoint.length; i++) h = (h * 31 + endpoint.charCodeAt(i)) >>> 0;
  return 'd' + h.toString(36) + endpoint.length.toString(36);
}
function vpKey() {
  const s = VAPID_PUBLIC, b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function vpGetSub() {
  if (!vpSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function vpRecord(sub) {
  const snap = await vpDoc().get();
  return ((snap.exists && snap.data().value) || {})[vpSubId(sub.endpoint)] || null;
}
async function vpState() {
  if (vpIsIOS() && !vpStandalone()) return 'ios-install';
  if (!vpSupported()) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  const sub = await vpGetSub().catch(() => null);
  if (!sub) return 'off';
  try { const r = await vpRecord(sub); return r && r.view ? 'on' : 'off'; }
  catch (_) { return 'off'; }
}
async function vpPaint() {
  const b = document.getElementById('pushBtn'); if (!b) return;
  const st = await vpState().catch(() => 'unsupported');
  b.style.display = st === 'unsupported' ? 'none' : '';
  b.classList.toggle('on', st === 'on');
  b.innerHTML = st === 'on' ? '&#128276;' : '&#128277;';   // 🔔 / 🔕
  b.dataset.state = st;
}
async function vpToggle() {
  const b = document.getElementById('pushBtn');
  const st = (b && b.dataset.state) || await vpState();
  if (st === 'on') { if (confirm('ปิดแจ้งเตือนออเดอร์ใหม่บนเครื่องนี้?')) vpDisable(); }
  else if (st === 'off') vpEnable();
  else if (st === 'ios-install') alert('iPhone ต้องติดตั้งก่อน:\nกดปุ่มแชร์ (สี่เหลี่ยมมีลูกศรชี้ขึ้น) → "เพิ่มไปยังหน้าจอโฮม"\nแล้วเปิดจากไอคอนนั้น จากนั้นกดกระดิ่งอีกครั้ง\n(ต้องเป็น iOS 16.4 ขึ้นไป)');
  else if (st === 'denied') alert('การแจ้งเตือนถูกบล็อกไว้\nต้องไปอนุญาตการแจ้งเตือนของเว็บนี้ในตั้งค่าเครื่อง/เบราว์เซอร์ก่อน แล้วกดกระดิ่งอีกครั้ง');
  else alert('เครื่องนี้ไม่รองรับการแจ้งเตือน');
}
async function vpEnable() {
  const b = document.getElementById('pushBtn'); if (b) b.classList.add('busy');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert(perm === 'denied' ? 'ถูกปฏิเสธ — ต้องไปอนุญาตในตั้งค่าเครื่องก่อน' : 'ยังไม่ได้กดอนุญาต'); return; }
    const reg = await withTimeout(navigator.serviceWorker.ready, 8000, 'ระบบแจ้งเตือนยังไม่พร้อม ลองปิดแล้วเปิดใหม่');
    const key = vpKey();
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey) {   // สมัครไว้ด้วยกุญแจคนละตัว → ต้องสมัครใหม่
      const old = new Uint8Array(sub.options.applicationServerKey);
      if (old.length !== key.length || old.some((x, i) => x !== key[i])) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const j = sub.toJSON();
    const rec = await vpRecord(sub).catch(() => null);
    const os = /Android/.test(navigator.userAgent) ? 'Android' : vpIsIOS() ? 'iPhone/iPad' : /Windows/.test(navigator.userAgent) ? 'Windows' : 'อุปกรณ์';
    // merge = ถ้าเครื่องนี้เปิดฝั่งแอดมิน/ช่างไว้ด้วย ช่องเดิมยังอยู่ครบ · เครื่องใหม่ = หน้าดูออเดอร์อย่างเดียว
    await vpDoc().set({ value: { [vpSubId(j.endpoint)]: {
      endpoint: j.endpoint, keys: j.keys, at: Date.now(), view: true,
      label: (rec && rec.label) || (os + ' · หน้าดูออเดอร์'),
      admin: rec ? rec.admin !== false : false,
    } } }, { merge: true });
    // ส่งทดสอบหาเครื่องตัวเอง — พิสูจน์ว่าทั้งสายใช้ได้จริง
    const r = await fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subs: [{ endpoint: j.endpoint, keys: j.keys }], title: '✅ เปิดแจ้งเตือนแล้ว',
        body: 'เครื่องนี้จะเด้งเตือนทุกครั้งที่มีออเดอร์ใหม่', url: '/view.html', tag: 'kl-test' }) });
    const res = await r.json().catch(() => ({}));
    if (!(r.ok && res.sent)) alert('บันทึกเครื่องแล้ว แต่ส่งทดสอบไม่ผ่าน: ' + (res.error || ('HTTP ' + r.status)));
  } catch (e) {
    alert('เปิดแจ้งเตือนไม่สำเร็จ: ' + (e.message || e));
  } finally {
    if (b) b.classList.remove('busy');
    vpPaint();
  }
}
async function vpDisable() {
  try {
    const sub = await vpGetSub();
    if (sub) {
      const id = vpSubId(sub.endpoint);
      const rec = await vpRecord(sub).catch(() => null);
      if (rec && (rec.admin !== false || rec.craft)) {
        // เครื่องนี้ยังรับแจ้งเตือนฝั่งแอดมิน/ช่างอยู่ → ปิดเฉพาะหน้าดูออเดอร์ ห้ามยกเลิกทั้งเครื่อง
        await vpDoc().update({ ['value.' + id + '.view']: false });
      } else {
        await sub.unsubscribe().catch(() => {});
        await vpDoc().update({ ['value.' + id]: firebase.firestore.FieldValue.delete() }).catch(() => {});
      }
    }
  } catch (e) { alert('ปิดไม่สำเร็จ: ' + (e.message || e)); }
  vpPaint();
}
// ต้องมี service worker ถึงจะรับแจ้งเตือนได้ (ตัวเดียวกับหน้าแอดมิน/หน้าช่าง)
// มีตัวใหม่รออยู่ → สลับเงียบ ๆ ตอนสลับแอพ (หน้านี้ไม่มีอะไรให้กรอก ไม่ต้องถาม)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('/sw.js').catch(e => console.warn('sw register failed', e));
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'hidden') return;
    try { const reg = await navigator.serviceWorker.getRegistration(); if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
  });
}

// ── ปุ่มแชร์ลิงก์หน้านี้ให้คนงาน (LINE ฯลฯ) — แชร์ไม่ได้ = คัดลอกลิงก์ ──
function toast(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2500);
}
async function shareLink() {
  const url = location.origin + '/view.html';
  const text = 'ดูรายการออเดอร์รอส่งของร้าน\n(iPhone: เปิดใน Safari → ปุ่มแชร์ → "เพิ่มไปยังหน้าจอโฮม")';
  if (navigator.share) {
    try { await navigator.share({ title: 'รายการออเดอร์', text, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // กดยกเลิกเอง = ไม่ต้องทำอะไร
  }
  try { await navigator.clipboard.writeText(url); toast('คัดลอกลิงก์แล้ว ไปวางในแชทได้เลย'); }
  catch (e) { prompt('คัดลอกลิงก์นี้ไปส่งให้คนงาน:', url); }
}

let _busy = false;
async function refreshAll() {
  if (_busy) return; _busy = true;
  const b = document.getElementById('rfBtn'); b.classList.add('spin');
  try { await Promise.all([startOrders(true), loadRef(true)]); }
  catch (e) { showTip('⚠️ ดึงข้อมูลไม่สำเร็จ เช็คเน็ตแล้วกด ↻ อีกครั้ง'); }
  finally { _busy = false; b.classList.remove('spin'); }
}
// กลับมาเปิดหลังพักไว้ ≥1 นาที → ต่อตัวฟังใหม่ (มือถือชอบตัดท่อตอนพักแอพ)
let _hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { _hiddenAt = Date.now(); return; }
  if (_hiddenAt && Date.now() - _hiddenAt >= 60000 && db) { _hiddenAt = 0; startOrders(false).catch(() => {}); loadRef(false); }
});

window.addEventListener('DOMContentLoaded', async () => {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    // ปุ่ม "←" กลับหน้าแอดมิน — โผล่เฉพาะตอนเปิดมาจากเมนูหน้าแอดมิน (ธง kl_fromAdmin ใน sessionStorage เหมือนหน้าช่าง)
    try { if (sessionStorage.getItem('kl_fromAdmin') === '1') document.getElementById('backAdmin').style.display = ''; } catch (e) {}
    loadRef(false);
    vpPaint();
    await startOrders(false);
  } catch (e) {
    console.error(e);
    document.getElementById('list').innerHTML = '<div class="msg">โหลดข้อมูลไม่สำเร็จ<br>เช็คเน็ตแล้วกด ↻ ด้านบน</div>';
    document.getElementById('sub').textContent = 'ยังไม่ได้ข้อมูล';
  }
});
</script>
