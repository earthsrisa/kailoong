<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ขายโลง">
<meta name="theme-color" content="#1a2332">
<link rel="apple-touch-icon" sizes="180x180" href="/craft-icon-180.png">
<title>หน้าช่างแต่ง — ขายโลง</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
* { font-family: 'Sarabun', sans-serif; box-sizing: border-box; }
body { background: #f0f2f5; margin: 0; min-height: 100vh; }

/* ── Header ── */
#header {
  background: #1a2332; color: #fff;
  padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  padding-top: max(16px, env(safe-area-inset-top, 16px));
}
#header h1 { font-size: 17px; font-weight: 700; margin: 0; }
#header .sub { font-size: 12px; color: #8fa3bf; margin-top: 3px; display: flex; align-items: center; gap: 5px; }

/* ── Live dot ── */
.live-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block;
  animation: livepulse 2s ease-in-out infinite;
}
@keyframes livepulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }

/* ── Select craftsman bar ── */
#craft-select-bar {
  background: #fff; border-bottom: 2px solid #e5e7eb;
  padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
#craft-select-bar label { font-size: 14px; font-weight: 600; color: #374151; white-space: nowrap; }
#craft-select-bar select {
  flex: 1; min-width: 180px; font-size: 15px; font-weight: 600;
  border: 2px solid #2563eb; border-radius: 10px; padding: 8px 12px;
  background: #fff; color: #1a2332; cursor: pointer; font-family: 'Sarabun', sans-serif;
}
#craft-select-bar select:focus { outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }

/* ── Date filter bar ── */
#date-filter-bar {
  background: #f8fafc; border-bottom: 1.5px solid #e5e7eb;
  padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
#date-filter-bar span { font-size: 13px; color: #6b7280; font-weight: 500; white-space: nowrap; }
.filter-btn {
  border: 1.5px solid #d1d5db; background: #fff; border-radius: 8px;
  padding: 5px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: 'Sarabun', sans-serif; color: #374151; transition: all .15s;
}
.filter-btn:hover { border-color: #2563eb; color: #2563eb; }
.filter-btn-active { background: #1a2332; color: #fff !important; border-color: #1a2332 !important; }

/* ── Content ── */
#craft-content { padding: 16px; padding-bottom: 48px; }

/* ── Customer card ── */
.order-card {
  background: #fff; border-radius: 14px; margin-bottom: 14px;
  border: 1.5px solid #e8ecf0; overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,.04);
}
.order-card-head {
  padding: 12px 16px; background: #f8fafc; border-bottom: 1.5px solid #e8ecf0;
  display: flex; align-items: center; justify-content: space-between;
}
.order-card-head .cust-name { font-size: 16px; font-weight: 700; color: #1a2332; }
.order-card-head .cust-count { font-size: 12px; color: #9ca3af; }
.order-card-body { padding: 6px 16px; }

/* ── Item row ── */
.craft-item-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid #f1f3f5; gap: 12px;
}
.craft-item-row:last-child { border-bottom: none; }
.craft-item-info { flex: 1; min-width: 0; }
.craft-item-name { font-size: 15px; font-weight: 600; color: #1a2332; line-height: 1.3; }
.craft-item-qty  { font-size: 13px; color: #6b7280; margin-top: 2px; }
.craft-item-status { flex-shrink: 0; }

/* ── Progress bar (thin) ── */
.craft-progress {
  height: 4px; background: #e5e7eb; border-radius: 99px; margin-top: 7px; overflow: hidden;
}
.craft-progress-bar {
  height: 100%; background: #2563eb; border-radius: 99px; transition: width .35s ease;
}

/* ── Stepper ── */
.stepper { display: flex; align-items: center; gap: 6px; }
.step-count {
  font-size: 14px; font-weight: 700; color: #1a2332; white-space: nowrap;
  min-width: 54px; text-align: center;
}
.btn-step {
  border: none; border-radius: 8px; cursor: pointer; font-size: 17px; font-weight: 700;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  font-family: 'Sarabun', sans-serif; transition: all .15s; flex-shrink: 0;
}
.btn-step-minus { background: #f3f4f6; color: #374151; }
.btn-step-minus:hover { background: #e5e7eb; }
.btn-step-plus {
  background: #2563eb; color: #fff; width: auto; padding: 0 13px; font-size: 13px;
}
.btn-step-plus:hover { background: #1d4ed8; }
.btn-step-plus.last-unit { background: #16a34a; }
.btn-step-plus.last-unit:hover { background: #15803d; }

/* ── Primary action button (not started) ── */
.btn-craft-done {
  background: #2563eb; color: #fff; border: none;
  border-radius: 10px; padding: 8px 16px; font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: 'Sarabun', sans-serif; transition: all .15s;
  display: flex; align-items: center; gap: 6px;
}
.btn-craft-done:hover { background: #1d4ed8; }
.btn-craft-done:active { transform: scale(.97); }

/* ── Undo button ── */
.btn-craft-undo {
  background: #f3f4f6; color: #374151; border: 1.5px solid #d1d5db;
  border-radius: 10px; padding: 7px 13px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: 'Sarabun', sans-serif; transition: all .15s;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.btn-craft-undo:hover { background: #e5e7eb; }

/* ── Done badge ── */
.badge-crafted {
  background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px; margin-top: 5px;
  display: inline-flex; align-items: center; gap: 5px;
}

/* ── Done row — faded style ── */
.craft-item-done .craft-item-name { color: #6b7280; font-weight: 500; }

/* ── Divider between pending/done inside card ── */
.done-divider {
  font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: .8px;
  padding: 8px 0 4px; border-top: 1px dashed #e5e7eb; margin-top: 4px; font-weight: 600;
}

/* ── Confirm overlay ── */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.confirm-box {
  background: #fff; border-radius: 16px; padding: 28px 24px;
  max-width: 360px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  animation: slideUp .2s ease;
}
@keyframes slideUp { from { transform:translateY(20px);opacity:0; } to { transform:translateY(0);opacity:1; } }
.confirm-box .conf-icon { font-size: 40px; text-align: center; margin-bottom: 14px; }
.confirm-box h3 { font-size: 18px; font-weight: 700; color: #1a2332; margin: 0 0 8px; text-align: center; }
.confirm-box p  { font-size: 14px; color: #6b7280; margin: 0 0 20px; text-align: center; line-height: 1.6; }
.item-preview {
  background: #eff6ff; border-radius: 10px; padding: 10px 14px;
  font-size: 14px; font-weight: 600; color: #1e40af; text-align: center; margin-bottom: 20px;
}
.confirm-actions { display: flex; flex-direction: column; gap: 8px; }
.confirm-actions button {
  width: 100%; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700;
  border: none; cursor: pointer; font-family: 'Sarabun', sans-serif; transition: all .15s;
}
.btn-conf-cancel { background: #f3f4f6; color: #374151; border: 1.5px solid #d1d5db !important; }
.btn-conf-cancel:hover { background: #e5e7eb; }

/* ── Empty / Loading ── */
.empty-craft { text-align: center; padding: 60px 20px; color: #9ca3af; }
.empty-craft i { font-size: 48px; margin-bottom: 16px; display: block; }
.empty-craft p { font-size: 15px; margin: 0; }
.spinner-wrap { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 15px; }

/* ── Refresh btn ── */
#refreshBtn {
  background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.3);
  border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; color: #fff; font-size: 15px; transition: all .15s;
}
#refreshBtn:hover { background: rgba(255,255,255,.22); }

/* ── Toast ── */
.craft-toast {
  position: fixed; bottom: 24px; right: 16px; z-index: 9999;
  background: #1e293b; color: #fff; border-radius: 12px; padding: 12px 18px;
  font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  animation: toastIn .2s ease;
}
@keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* ── All done banner ── */
.all-done-banner {
  background: linear-gradient(135deg,#14532d,#16a34a); color: #fff;
  border-radius: 14px; padding: 24px 20px; text-align: center; margin-bottom: 16px;
}
.all-done-banner i  { font-size: 36px; margin-bottom: 10px; display: block; }
.all-done-banner h3 { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
.all-done-banner p  { font-size: 14px; opacity: .85; margin: 0; }

/* ── สรุปหีบทั้งร้าน ── */
.sum-card { background:#fff; border-radius:14px; margin-bottom:14px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.sum-head { padding:12px 14px; display:flex; align-items:center; justify-content:space-between;
  cursor:pointer; background:#1a2332; color:#fff; user-select:none; }
.sum-head-l { display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:700; }
.sum-tag { font-size:10.5px; background:rgba(255,255,255,.18); border-radius:10px; padding:1.5px 8px; font-weight:600; }
.sum-stats { display:grid; grid-template-columns:1fr 1fr 1fr; border-bottom:1.5px solid #f1f5f9; }
.sum-stat { padding:13px 8px; text-align:center; border-right:1px solid #f1f5f9; }
.sum-stat:last-child { border-right:none; }
.sum-stat b { font-size:28px; font-weight:800; line-height:1; display:block; }
.sum-stat span { font-size:10.5px; color:#6b7280; margin-top:4px; display:block; }
.sum-prog { padding:11px 14px; border-bottom:1.5px solid #f1f5f9; }
.sum-prog-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.sum-prog-top span { font-size:11.5px; color:#6b7280; font-weight:600; }
.sum-prog-top b { font-size:12.5px; font-weight:800; }
.sum-bar { height:7px; background:#e5e7eb; border-radius:99px; overflow:hidden; }
.sum-bar i { display:block; height:100%; border-radius:99px; }
.sum-sec { padding:11px 14px 4px; }
.sum-sec-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
.sum-sec-head .t { font-size:11px; font-weight:700; letter-spacing:.3px; }
.sum-sec-head .n { font-size:10.5px; color:#9ca3af; }
.sum-row { margin-bottom:10px; }
.sum-row-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; gap:8px; }
.sum-row-nm { font-size:13px; font-weight:600; color:#1a2332; word-break:break-word; }
.sum-row-lf { font-size:12px; font-weight:700; color:#ea580c; white-space:nowrap; }
.sum-row-bar { display:flex; align-items:center; gap:7px; }
.sum-row-bar .b { flex:1; height:5px; background:#e5e7eb; border-radius:99px; overflow:hidden; }
.sum-row-bar .b i { display:block; height:100%; background:#2563eb; }
.sum-row-bar .c { font-size:10.5px; color:#9ca3af; white-space:nowrap; }
.sum-done-row { display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:7px 10px; background:#f0fdf4; border-radius:8px; margin-bottom:5px; }
.sum-done-row .nm { font-size:12.5px; font-weight:600; color:#166534; word-break:break-word; }
.sum-done-row .q  { font-size:11px; font-weight:700; color:#16a34a; white-space:nowrap; }
.sum-age { display:inline-block; font-size:10px; font-weight:700; border-radius:9px;
  padding:1px 7px; margin-left:5px; white-space:nowrap; vertical-align:1px; }
.sum-age-hot  { background:#fee2e2; color:#b91c1c; }
.sum-age-warn { background:#fef3c7; color:#92400e; }
.sum-other-toggle { display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  padding:11px 14px; border-top:1px dashed #e5e7eb; user-select:none; }
.sum-other-toggle .t { font-size:11.5px; color:#6b7280; font-weight:700; }
.sum-other-toggle .r { font-size:11px; color:#9ca3af; display:flex; align-items:center; gap:6px; }
.sum-other-body { padding:0 14px 10px; opacity:.72; }
.sum-empty { padding:16px 14px; text-align:center; font-size:13px; color:#9ca3af; }
.hist-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #f3f4f6; }
.hist-row:last-child { border-bottom:none; }
.hist-av { width:34px; height:34px; border-radius:9px; background:#e0e7ff; color:#3730a3;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0; }
.hist-av.me { background:#dbeafe; color:#1e40af; }
.hist-nm { flex:1; min-width:0; font-size:14px; font-weight:700; color:#1a2332; }
.hist-sub { font-size:11px; color:#9ca3af; font-weight:400; margin-top:1px; }
.hist-q { font-size:17px; font-weight:800; color:#1a2332; white-space:nowrap; }
.hist-q span { font-size:11px; font-weight:600; color:#9ca3af; }
.hist-time { display:inline-flex; align-items:center; gap:3px; font-size:12px; color:#2563eb;
  font-weight:600; background:#eff6ff; border-radius:6px; padding:1px 7px; }
.hist-time i { font-size:10.5px; }
.hist-time-approx { color:#9ca3af!important; background:#f3f4f6!important; }
.spark { display:flex; align-items:flex-end; gap:4px; height:38px; }
.spark-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.spark-bar { width:100%; background:#dbeafe; border-radius:3px 3px 0 0; min-height:2px; position:relative; }
.spark-bar.hot { background:#2563eb; }
.spark-lbl { font-size:9.5px; color:#9ca3af; white-space:nowrap; }
.spark-val { font-size:10px; font-weight:700; color:#1a2332; }

/* ── รับออเดอร์ ── */
.btn-neworder { display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
  background:#16a34a; color:#fff; border:none; border-radius:12px; padding:13px;
  font-size:15.5px; font-weight:800; font-family:'Sarabun',sans-serif; cursor:pointer; margin-bottom:14px; }
.btn-neworder:active { background:#15803d; }
.ord-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9998;
  display:flex; align-items:flex-end; justify-content:center; padding:0; }
.ord-sheet { background:#f0f2f5; width:100%; max-width:480px; max-height:94vh; overflow-y:auto;
  border-radius:16px 16px 0 0; animation:sheetUp .2s ease; }
@keyframes sheetUp { from{transform:translateY(24px);opacity:.6;} to{transform:translateY(0);opacity:1;} }
.ord-head { background:#16a34a; color:#fff; padding:14px 16px; display:flex;
  align-items:center; justify-content:space-between; position:sticky; top:0; z-index:2; }
.ord-head h3 { margin:0; font-size:15.5px; font-weight:800; }
.ord-head .sub { font-size:11.5px; opacity:.85; margin-top:2px; }
.ord-x { font-size:20px; cursor:pointer; opacity:.9; padding:0 4px; }
.ord-body { padding:12px; }
.ord-card { background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
.ord-step { display:flex; align-items:center; gap:7px; margin-bottom:9px; }
.ord-step b { width:20px; height:20px; border-radius:50%; background:#16a34a; color:#fff;
  font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ord-step span { font-size:13px; font-weight:700; color:#1a2332; }
.ord-sel { width:100%; border:2px solid #d1d5db; border-radius:9px; padding:10px 11px;
  font-size:15px; font-weight:600; font-family:'Sarabun',sans-serif; background:#fff; color:#1a2332; cursor:pointer; }
.ord-sel:focus { outline:none; border-color:#16a34a; }
.ord-sel.filled { border-color:#16a34a; }
.ord-lbl { font-size:11.5px; font-weight:700; color:#6b7280; margin-bottom:4px; }
.ord-pills { display:flex; gap:5px; }
.ord-pill { flex:1; text-align:center; border:2px solid #e5e7eb; border-radius:8px; padding:7px 0;
  font-size:13px; font-weight:600; color:#6b7280; cursor:pointer; background:#fff; font-family:'Sarabun',sans-serif; }
.ord-pill.on { border-color:#16a34a; background:#f0fdf4; color:#1a2332; font-weight:700; }
.ord-qty { display:flex; align-items:center; justify-content:center; gap:14px; }
.ord-qty button { width:46px; height:46px; border-radius:11px; border:2px solid #d1d5db; background:#f3f4f6;
  font-size:24px; font-weight:800; color:#374151; cursor:pointer; line-height:1; font-family:'Sarabun',sans-serif; }
.ord-qty button.plus { background:#16a34a; border-color:#16a34a; color:#fff; }
.ord-qty .n { font-size:32px; font-weight:800; min-width:52px; text-align:center; color:#1a2332; }
.ord-note { background:#eff6ff; border:1px solid #bfdbfe; border-radius:9px; padding:9px 12px;
  font-size:11.5px; color:#1e40af; line-height:1.5; margin-bottom:11px; }
.ord-btn { width:100%; border:none; border-radius:11px; padding:14px; font-size:16px; font-weight:800;
  cursor:pointer; font-family:'Sarabun',sans-serif; background:#16a34a; color:#fff; }
.ord-btn[disabled] { opacity:.45; pointer-events:none; }
.ord-add { border:2px dashed #cbd5e1; border-radius:11px; padding:11px; text-align:center;
  font-size:13.5px; font-weight:700; color:#6b7280; margin-bottom:10px; cursor:pointer; background:#fff; }
.ord-list-row { display:flex; align-items:center; gap:10px; padding:11px 16px; border-bottom:1px solid #f1f5f9; }
.ord-list-row .q { font-size:19px; font-weight:800; color:#1a2332; white-space:nowrap; }
.ord-list-row .q i { font-size:11.5px; font-weight:600; color:#9ca3af; font-style:normal; }
.ord-edit-row { padding:11px 16px; border-bottom:1px solid #f1f5f9; background:#fffbeb; }
.ord-chip { display:inline-block; border-radius:4px; padding:1px 7px; font-size:11.5px; margin-left:4px; }
.ord-sum { padding:11px 16px; background:#f8fafc; border-top:1px solid #e8ecf0;
  display:flex; justify-content:space-between; align-items:center; }
.ord-trash { width:30px; height:30px; border-radius:8px; border:1.5px solid #fecaca; background:#fef2f2;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:#dc2626; }
.craft-badge-mine { display:inline-block; font-size:10px; font-weight:700; background:#dcfce7;
  color:#15803d; border-radius:9px; padding:1px 7px; margin-left:5px; }
.btn-edit-order { font-size:11.5px; font-weight:700; color:#ea580c; background:#fff7ed;
  border:1.5px solid #fed7aa; border-radius:8px; padding:3px 10px; cursor:pointer; font-family:'Sarabun',sans-serif; }
</style>
</head>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAC85V_FLtSDR0BR3tJEvDDpv1hSIx2Zug",
  authDomain: "kailoong-e63ed.firebaseapp.com",
  projectId: "kailoong-e63ed",
  storageBucket: "kailoong-e63ed.firebasestorage.app",
  messagingSenderId: "388629310479",
  appId: "1:388629310479:web:9eb9565ac22ad5914b477a"
};
if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// ── State ──
let _craftsman   = null;   // { id, name, productTypes }
let _orders      = [];     // pending orders (kept fresh by onSnapshot)
let _craftsmen   = [];     // all craftsmen (loaded once)
let _groups      = [];     // built by buildGroupedData(), used by stepItem()
let _unsubOrders = null;   // Firestore realtime unsubscribe fn
let _stepping    = false;  // double-tap guard
let _customers   = [];     // สำหรับรับออเดอร์
let _products    = [];     // สำหรับรับออเดอร์

let _draftEdit   = false;  // โหมดแก้ไขใน popup ยืนยัน

// ── สเปกโลง (ต้องตรงกับ index.html) ──
const COFFIN_SPEC = {
  'ธรรมดา':           {colors:['ขาว','แดง'], lines:['ทอง','เงิน','ซีด','ขาว']},
  'บ่าง':             {colors:['ขาว','แดง'], lines:['ทอง','เงิน','ซีด','ขาว']},
  'ย้อย':             {colors:['ขาว','แดง'], lines:['ทอง','เงิน','ซีด','ขาว']},
  'กลาง':             {colors:['ขาว','แดง'], lines:['ทอง','เงิน','คริสต์'], extra:['หน้า 24 นิ้ว','หน้า 26 นิ้ว','หน้า 28 นิ้ว']},
  'มุกน้อย':          {colors:['ขาว','แดง'], lines:['เงิน','ทอง','ผ้าจีบ','ผ้าดอก']},
  'มุกใหญ่':          {colors:['ขาว','แดง'], lines:['เงิน','ทอง','ผ้าจีบ','ผ้าดอก']},
  'สิงห์น้อย':                  {colors:['ขาว','แดง'], lines:['ทอง','เงิน','ซีด','ขาว']},
  'สิงห์น้อย (ฝากระบาน)':       {colors:['ขาว','แดง'], lines:['ทอง','เงิน','ซีด','ขาว']},
  'สิงห์น้อย 3 ชั้น':            {colors:['ขาว','แดง'], lines:['ทอง','เงิน']},
  'สิงห์น้อย 3 ชั้น (ฝากระบาน)':{colors:['ขาว','แดง'], lines:['ทอง','เงิน']},
  'สิงห์ใหญ่':                  {colors:['ขาว','แดง'], lines:['ทอง','เงิน']},
  'สิงห์ใหญ่ 3 ชั้น':            {colors:['ขาว','แดง'], lines:['ทอง','เงิน']},
  'สิงห์ใหญ่ 3 ชั้น (ฝากระบาน)':{colors:['ขาว','แดง'], lines:['ทอง','เงิน']},
  'พิกุล':            {colors:[],            lines:['ทอง','เงิน']},
};
// รวมสีเส้นจาก spec + สีเส้น custom ที่ตั้งไว้ใน priceMap
function getProductLines(prodName) {
  const prod = _products.find(p => p.name === prodName);
  const specLines = COFFIN_SPEC[prodName]?.lines || ['ทอง','เงิน','ซีด','ขาว'];
  const pmKeys = Object.keys(prod?.priceMap || {}).filter(k => k !== '__default' && (prod.priceMap[k]||0) > 0);
  return [...specLines, ...pmKeys.filter(k => !specLines.includes(k))];
}
function getProductColors(prodName) {
  return COFFIN_SPEC[prodName]?.colors ?? ['ขาว','แดง'];
}
// ราคา: ราคาเฉพาะลูกค้า → ราคาตามสีเส้น → ราคาเริ่มต้น (ช่างไม่เห็นตัวเลขนี้)
function resolvePrice(customerId, prod, trimColor) {
  const cust = _customers.find(c => c.id === customerId);
  const cp = cust?.customPrices?.[prod.id];
  if (cp !== undefined && cp !== null) {
    if (typeof cp === 'object') { if (trimColor && cp[trimColor] !== undefined) return cp[trimColor]; }
    else return cp;
  }
  if (trimColor && prod.priceMap?.[trimColor] != null) return prod.priceMap[trimColor];
  const pm = prod.priceMap || {};
  const first = Object.keys(pm)[0];
  return (first ? pm[first] : prod.price) || 0;
}
let _dateFilter  = 'all'; // 'today' | 'all'

// ── Utilities ──
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg) {
  document.querySelectorAll('.craft-toast').forEach(e=>e.remove());
  const el = document.createElement('div');
  el.className = 'craft-toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}
// encodeURIComponent shorthand for onclick attrs
function encC(s) { return encodeURIComponent(String(s||'')); }

// ── Bangkok date helpers ──
function todayLocal() {
  return new Date().toLocaleDateString('sv-SE', {timeZone: 'Asia/Bangkok'});
}
function orderDateLocal(o) {
  return new Date(o.createdAt || 0).toLocaleDateString('sv-SE', {timeZone: 'Asia/Bangkok'});
}
// เวลา HH:MM ตามเวลาไทย
function hhmm(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString('th-TH', {timeZone:'Asia/Bangkok', hour:'2-digit', minute:'2-digit', hour12:false});
}

// ── Date filter toggle ──
function setDateFilter(type) {
  _dateFilter = type;
  document.getElementById('btnFilterToday')?.classList.toggle('filter-btn-active', type === 'today');
  document.getElementById('btnFilterAll')?.classList.toggle('filter-btn-active', type === 'all');
  document.getElementById('btnFilterHistory')?.classList.toggle('filter-btn-active', type === 'history');
  const lbl = document.getElementById('dateFilterLabel');
  if (lbl) {
    lbl.textContent = type === 'today'
      ? new Date().toLocaleDateString('th-TH', {timeZone:'Asia/Bangkok', weekday:'short', day:'numeric', month:'short'})
      : type === 'history' ? 'ย้อนหลัง 30 วัน'
      : `ทั้งหมด ${_orders.length} ออเดอร์`;
  }
  if (_craftsman) {
    if (type === 'history') renderHistory();
    else renderCraftOrders();
  }
}

// ── ประวัติงานช่าง: โหลดออเดอร์ที่เสร็จแล้วและแสดงงานที่ช่างคนนี้ทำ ──
async function renderHistory() {
  if (!_craftsman) return;
  const el = document.getElementById('craft-content');
  el.innerHTML = `<div class="spinner-wrap"><i class="fa-solid fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:8px;"></i>โหลดประวัติ...</div>`;

  try {
    // โหลด 30 วันย้อนหลัง (Bangkok midnight)
    const cutoff = new Date(todayLocal()+'T00:00:00+07:00').getTime() - 29 * 86400000;
    const snap = await db.collection('orders')
      .where('createdAt', '>=', cutoff)
      .get();
    const allOrders = snap.docs.map(d => ({id:d.id,...d.data()}));

    // เก็บเฉพาะ items ที่ช่างคนนี้ทำ
    const byDate = {}; // { 'YYYY-MM-DD': [{label, qty, craftedAt, customerName}] }
    const byCraftsman = {}; // สถิติของทุกช่าง (สำหรับการ์ดสรุป)
    const dayKey = ts => new Date(ts).toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'});

    for (const o of allOrders) {
      const cs = o.craftStatus || {};
      for (const [k, entry] of Object.entries(cs)) {
        const matchItem = (o.items||[]).find(i => itemKey(i) === k)
                       || (o.items||[]).find(i => itemKeyLegacy(i) === k);

        // ── มี log → ใช้เวลาจริงของแต่ละครั้งที่กด ──
        const log = Array.isArray(entry.log) ? entry.log.filter(L => (L.qty||0) > 0) : null;
        if (log && log.length) {
          for (const L of log) {
            const who   = L.byName || entry.craftedByName || 'ไม่ระบุชื่อ';
            const whoId = L.by || entry.craftedBy || '';
            const at    = L.at || entry.craftedAt || o.createdAt;
            const q     = L.qty || 0;
            if (!byCraftsman[who]) byCraftsman[who] = {name:who, id:whoId, qty:0, lines:0, days:new Set(), last:0, perDay:{}};
            const S = byCraftsman[who];
            S.qty += q; S.lines++; S.days.add(dayKey(at));
            S.perDay[dayKey(at)] = (S.perDay[dayKey(at)]||0) + q;
            if (at > S.last) S.last = at;

            if (whoId !== _craftsman.id || !matchItem) continue;
            const dk = dayKey(at);
            (byDate[dk] ||= []).push({
              label: buildLabel(matchItem),
              qty: matchItem.qty,
              craftedQty: q,
              customerName: o.customerName||'?',
              craftedAt: at,
              exact: true
            });
          }
          continue;
        }

        // ── ไม่มี log (ข้อมูลก่อนอัปเดต) → ใช้ค่าเดิมแบบเดียวกับเมื่อก่อน ──
        const who = entry.craftedByName || 'ไม่ระบุชื่อ';
        const whoId = entry.craftedBy || '';
        const q = entry.craftedQty ?? (matchItem ? matchItem.qty : 0);
        if (q > 0) {
          const at = entry.craftedAt || o.createdAt;
          if (!byCraftsman[who]) byCraftsman[who] = {name:who, id:whoId, qty:0, lines:0, days:new Set(), last:0, perDay:{}};
          const S = byCraftsman[who];
          S.qty += q; S.lines++; S.days.add(dayKey(at));
          S.perDay[dayKey(at)] = (S.perDay[dayKey(at)]||0) + q;
          if (at > S.last) S.last = at;
        }
        if (whoId !== _craftsman.id || !matchItem || q <= 0) continue;
        const dk = dayKey(entry.craftedAt || o.createdAt);
        (byDate[dk] ||= []).push({
          label: buildLabel(matchItem),
          qty: matchItem.qty,
          craftedQty: q,
          customerName: o.customerName||'?',
          craftedAt: entry.craftedAt||0,
          exact: false
        });
      }
    }

    // ── การ์ดสรุป: ใครแต่งไปกี่ใบ (แทนแถบคืบหน้าที่ไม่มีประโยชน์ในโหมดนี้) ──
    const cmList = Object.values(byCraftsman).sort((a,b) => b.qty - a.qty);
    const cmTotal = cmList.reduce((a,c) => a + c.qty, 0);

    // ── กราฟ 7 วันล่าสุดของช่างคนนี้ + ค่าเฉลี่ยต่อวัน ──
    const me = cmList.find(c => c.id === _craftsman.id);
    const myPerDay = me?.perDay || {};
    const last7 = Array.from({length:7}, (_, n) => {
      const d = new Date(new Date(todayLocal()+'T00:00:00+07:00').getTime() - (6-n)*86400000);
      const key = d.toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'});
      return {key, qty: myPerDay[key] || 0,
              lbl: d.toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',weekday:'narrow'})};
    });
    const peak = Math.max(1, ...last7.map(x => x.qty));
    const myDays = me?.days.size || 0;
    const myAvg  = myDays ? (me.qty / myDays) : 0;
    const week7  = last7.reduce((a,x) => a + x.qty, 0);

    const sparkHtml = me ? `
      <div style="padding:11px 14px; border-bottom:1.5px solid #f1f5f9;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
          <span style="font-size:11.5px; color:#6b7280; font-weight:600;">ผลงานฉัน 7 วันล่าสุด</span>
          <span style="font-size:11.5px; color:#9ca3af;">รวม ${week7} ใบ</span>
        </div>
        <div class="spark">
          ${last7.map(x => `<div class="spark-col">
            <span class="spark-val">${x.qty || ''}</span>
            <div class="spark-bar${x.qty >= peak && x.qty > 0 ? ' hot' : ''}" style="height:${x.qty ? Math.max(3, Math.round(x.qty/peak*26)) : 2}px;"></div>
            <span class="spark-lbl">${x.lbl}</span>
          </div>`).join('')}
        </div>
      </div>` : '';

    const summaryHtml = cmList.length ? `<div class="sum-card">
      <div class="sum-head" onclick="toggleSumCard()">
        <span class="sum-head-l"><i class="fa-solid fa-trophy"></i>สรุปผลงานช่าง
          <span class="sum-tag">30 วัน</span></span>
        <i id="sumChev" class="fa-solid fa-chevron-${localStorage.getItem('craft_sum_open')!=='0'?'up':'down'}"></i>
      </div>
      <div id="sumBody" style="display:${localStorage.getItem('craft_sum_open')!=='0'?'block':'none'};">
        <div class="sum-stats">
          <div class="sum-stat"><b style="color:#1a2332;">${cmTotal}</b><span>แต่งไปทั้งหมด</span></div>
          <div class="sum-stat"><b style="color:#16a34a;">${myAvg ? myAvg.toFixed(1) : '0'}</b><span>เฉลี่ยฉัน/วัน</span></div>
          <div class="sum-stat"><b style="color:#2563eb;">${cmList.length}</b><span>ช่างที่มีงาน</span></div>
        </div>
        ${sparkHtml}
        <div style="padding:6px 14px 12px;">
          ${cmList.map(c => {
            const isMe = c.id === _craftsman.id;
            const initial = (c.name||'?').trim().slice(0,2);
            const pct = cmTotal ? Math.round(c.qty/cmTotal*100) : 0;
            return `<div class="hist-row">
              <div class="hist-av${isMe?' me':''}">${esc(initial)}</div>
              <div class="hist-nm">${esc(c.name)}${isMe?' <span style="font-size:10px;background:#dbeafe;color:#1e40af;border-radius:9px;padding:1px 7px;font-weight:700;">ฉัน</span>':''}
                <div class="hist-sub">${c.lines} รายการ · ${c.days.size} วัน · ${pct}%${c.last ? ' · ล่าสุด ' + new Date(c.last).toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short'}) + ' ' + hhmm(c.last) : ''}</div></div>
              <div class="hist-q">${c.qty} <span>ใบ</span></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>` : '';

    const dates = Object.keys(byDate).sort().reverse();
    if (!dates.length) {
      el.innerHTML = summaryHtml + `<div class="empty-craft">
        <i class="fa-solid fa-calendar-xmark" style="color:#9ca3af;"></i>
        <p>ไม่พบประวัติงานของคุณใน 30 วันที่ผ่านมา</p>
        <p style="font-size:13px;color:#9ca3af;">สำหรับ ${esc(_craftsman.name)}</p>
      </div>`;
      return;
    }

    let totalItems = 0, totalQty = 0;
    const cards = dates.map(d => {
      const items = byDate[d];
      totalItems += items.length;
      totalQty += items.reduce((s,i) => s+i.craftedQty, 0);
      const thDate = new Date(d+'T12:00:00+07:00').toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',weekday:'short',day:'numeric',month:'short',year:'2-digit'});
      // เรียงตามเวลา ล่าสุดอยู่บน
      items.sort((a, b) => (b.craftedAt || 0) - (a.craftedAt || 0));
      const rows = items.map(it => {
        const tm = it.craftedAt ? hhmm(it.craftedAt) : '';
        const timeHtml = tm
          ? `<span class="hist-time${it.exact ? '' : ' hist-time-approx'}" title="${it.exact ? 'เวลาที่แต่งเสร็จ' : 'เวลาบันทึกล่าสุด (ข้อมูลก่อนอัปเดตระบบ)'}"><i class="fa-regular fa-clock"></i>${tm}${it.exact ? '' : '~'}</span>`
          : `<span class="hist-time hist-time-approx" style="opacity:.5;">ไม่มีเวลา</span>`;
        return `<div class="craft-item-row" style="opacity:.85;">
          <div class="craft-item-info">
            <div class="craft-item-name">${esc(it.label)}</div>
            <div class="craft-item-qty" style="font-size:12px;color:#9ca3af;">${esc(it.customerName)} · ${timeHtml}</div>
          </div>
          <div class="craft-item-status">
            <span style="background:#dcfce7;color:#15803d;border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700;">
              ✅ ${it.craftedQty} ใบ
            </span>
          </div>
        </div>`;
      }).join('');
      // ช่วงเวลาทำงานของวันนั้น
      const stamps = items.map(i => i.craftedAt).filter(Boolean).sort((a,b)=>a-b);
      const span = stamps.length
        ? (stamps.length > 1 && hhmm(stamps[0]) !== hhmm(stamps[stamps.length-1])
            ? `${hhmm(stamps[0])} – ${hhmm(stamps[stamps.length-1])}`
            : hhmm(stamps[0]))
        : '';
      return `<div class="order-card">
        <div class="order-card-head">
          <div class="cust-name" style="font-size:14px;">${thDate}
            ${span ? `<span style="font-size:11.5px;color:#9ca3af;font-weight:400;margin-left:6px;"><i class="fa-regular fa-clock" style="margin-right:3px;"></i>${span}</span>` : ''}
          </div>
          <span class="cust-count">${items.length} รายการ · ${items.reduce((s,i)=>s+i.craftedQty,0)} ใบ</span>
        </div>
        <div class="order-card-body">${rows}</div>
      </div>`;
    }).join('');

    el.innerHTML = summaryHtml + `
      <div style="background:#1a2332;color:#fff;border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;gap:20px;flex-wrap:wrap;">
        <div><div style="font-size:11px;opacity:.6;">ผลงานของฉัน</div><div style="font-size:22px;font-weight:700;">${totalQty} ใบ</div></div>
        <div><div style="font-size:11px;opacity:.6;">รายการ</div><div style="font-size:22px;font-weight:700;">${totalItems}</div></div>
        <div><div style="font-size:11px;opacity:.6;">วันที่มีงาน</div><div style="font-size:22px;font-weight:700;">${dates.length} วัน</div></div>
      </div>
      ${cards}`;
  } catch(e) {
    el.innerHTML = `<div class="empty-craft"><i class="fa-solid fa-circle-exclamation" style="color:#ef4444;"></i><p>โหลดประวัติไม่สำเร็จ</p><p style="font-size:13px;color:#9ca3af;">${esc(e.message)}</p></div>`;
  }
}

// ── itemKey — MUST match index.html ──
// คีย์ craftStatus — รวมขนาด (extra) เพื่อไม่ให้ "กลาง 24 นิ้ว" กับ "28 นิ้ว" ชนกัน
function itemKey(i) {
  return `${i.productName}|${i.color||''}|${i.trimColor||''}|${i.extra||''}`;
}
function itemKeyLegacy(i) {
  return `${i.productName}|${i.color||''}|${i.trimColor||''}`;
}
// อ่านค่าโดยลองคีย์ใหม่ก่อน แล้ว fallback คีย์เก่า (ข้อมูลก่อนอัปเดตไม่หาย)
function readCraftEntry(cs, i) {
  if (!cs) return undefined;
  const k = itemKey(i);
  if (cs[k] !== undefined) return cs[k];
  return cs[itemKeyLegacy(i)];
}

// ── Build display label from item ──
function buildLabel(item) {
  const lineIcons = {ทอง:'🟡',เงิน:'🔘',ซีด:'🥉',ขาว:'⬜',คริสต์:'✝',ผ้าจีบ:'🪷',ผ้าดอก:'🌸'};
  // รองรับทั้ง trimColor='คริสต์' (UI ใหม่) และ style='คริสต์' (ข้อมูลเก่า)
  const isChrist = item.style === 'คริสต์' || item.trimColor === 'คริสต์';
  const trimLabel = isChrist
    ? '✝ คริสต์'
    : item.trimColor ? (lineIcons[item.trimColor] ? lineIcons[item.trimColor] + ' ' + item.trimColor : item.trimColor) : '';
  const parts = [
    item.productName,
    item.color && item.color !== '-' ? item.color : '',
    trimLabel
  ].filter(Boolean);
  return parts.join(' ') + (item.extra ? ' ' + item.extra : '');
}

// ── getCraftedQty: backward-compatible with old isCrafted-only schema ──
function getCraftedQty(csEntry, orderQty) {
  if (!csEntry) return 0;
  if (csEntry.craftedQty !== undefined) return Math.min(csEntry.craftedQty, orderQty);
  if (csEntry.isCrafted) return orderQty; // legacy: fully done
  return 0;
}

// ── deliveryStatus helpers (ตรงกับ index.html) ──
function deliverKey(i) {
  return `${i.productName}|${i.color||''}|${i.trimColor||''}|${i.extra||''}`;
}
function getDeliveredQty(dsEntry, orderQty, orderIsDelivered) {
  if (!dsEntry) return orderIsDelivered ? orderQty : 0;
  if (dsEntry.deliveredQty !== undefined) return Math.min(dsEntry.deliveredQty, orderQty);
  return orderIsDelivered ? orderQty : 0;
}
function isOrderFullyDelivered(order) {
  const ds = order.deliveryStatus || {};
  const items = order.items || [];
  if (!items.length) return !!order.isDelivered;
  return items.every(i => getDeliveredQty(ds[deliverKey(i)], i.qty, order.isDelivered) >= i.qty);
}

// ── Check if this craftsman can work on this item ──
function craftsmanCanDo(item) {
  if (!_craftsman) return false;
  const types = _craftsman.productTypes || [];
  if (types.length === 0) return true; // ไม่กำหนด = ทำได้ทุกประเภท
  const name = (item.productName || '').trim();
  return types.some(t => (t || '').trim() === name);
}

let _unsubCraftsmen = null; // real-time craftsmen unsubscribe

async function init() {
  const contentEl = document.getElementById('craft-content');
  contentEl.innerHTML =
    `<div class="spinner-wrap"><i class="fa-solid fa-spinner fa-spin" style="font-size:28px;margin-bottom:10px;display:block;"></i>กำลังโหลด...</div>`;

  // Start real-time listener for orders immediately
  startOrdersListener();
  loadOrderRefData(); // โหลดลูกค้า/สินค้าเบื้องหลัง (ไม่บล็อกหน้าจอ)

  // Load craftsmen with timeout + retry
  let snap;
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000));
    snap = await Promise.race([db.collection('craftsmen').get(), timeout]);
  } catch (err) {
    console.error('init error:', err);
    contentEl.innerHTML = `<div class="empty-craft">
      <i class="fa-solid fa-wifi" style="color:#ef4444;"></i>
      <p style="color:#ef4444;font-weight:700;">เชื่อมต่อไม่ได้</p>
      <p style="font-size:13px;color:#9ca3af;">กรุณาตรวจสอบอินเทอร์เน็ต แล้วกดรีเฟรช</p>
      <button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">
        <i class="fa-solid fa-rotate-right me-1"></i>รีเฟรช
      </button>
    </div>`;
    return;
  }

  _craftsmen = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  // Populate dropdown
  const sel = document.getElementById('craftsmanSel');
  sel.innerHTML = '<option value="">— เลือกชื่อช่าง —</option>' +
    _craftsmen.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');

  // Empty craftsmen state
  if (!_craftsmen.length) {
    contentEl.innerHTML =
      `<div class="empty-craft"><i class="fa-solid fa-users-slash"></i><p>ยังไม่มีช่างแต่ง</p><p style="font-size:13px;color:#9ca3af;">ให้ผู้ดูแลเพิ่มข้อมูลช่างในระบบก่อน</p></div>`;
  }

  // Restore saved craftsman
  const saved = localStorage.getItem('craft_craftsman_id');
  if (saved && _craftsmen.find(c => c.id === saved)) {
    sel.value = saved;
    onCraftsmanChange();
  } else if (_craftsmen.length) {
    contentEl.innerHTML =
      `<div class="empty-craft"><i class="fa-solid fa-hard-hat"></i><p>เลือกชื่อช่างด้านบนเพื่อดูรายการงาน</p></div>`;
  }

  // Real-time craftsmen listener — keeps dropdown fresh when craftsmen are added/removed
  if (_unsubCraftsmen) _unsubCraftsmen();
  _unsubCraftsmen = db.collection('craftsmen').onSnapshot(snap => {
    _craftsmen = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const s = document.getElementById('craftsmanSel');
    if (!s) return;
    const currentVal = s.value;
    s.innerHTML = '<option value="">— เลือกชื่อช่าง —</option>' +
      _craftsmen.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    if (currentVal && _craftsmen.find(c => c.id === currentVal)) {
      s.value = currentVal; // keep selection
      // อัปเดต _craftsman object ด้วย fresh data (เช่น ชื่อหรือ productTypes ถูกแก้ไขโดยแอดมิน)
      const freshCraftsman = _craftsmen.find(c => c.id === currentVal);
      if (freshCraftsman && _craftsman && freshCraftsman.id === _craftsman.id) {
        _craftsman = freshCraftsman;
        renderCraftOrders(); // re-render ด้วยข้อมูลใหม่
      }
    } else if (currentVal) {
      // craftsman was deleted — reset
      _craftsman = null;
      localStorage.removeItem('craft_craftsman_id');
      document.getElementById('craft-content').innerHTML =
        `<div class="empty-craft"><i class="fa-solid fa-hard-hat"></i><p>เลือกชื่อช่างด้านบนเพื่อดูรายการงาน</p></div>`;
    }
  }, err => console.error('craftsmen snapshot error:', err));
}

// ── Real-time orders listener ──
function startOrdersListener() {
  if (_unsubOrders) _unsubOrders(); // cleanup previous
  _unsubOrders = db.collection('orders').onSnapshot(snap => {
    _orders = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(o => !isOrderFullyDelivered(o))
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (_craftsman) renderCraftOrders();
  }, err => {
    console.error('onSnapshot error:', err);
    toast('⚠️ เชื่อมต่อ Firestore ไม่ได้ กรุณารีเฟรช');
  });
}

// โหลดลูกค้า + สินค้า (ใช้ตอนรับออเดอร์) — โหลดครั้งเดียวพอ
async function loadOrderRefData() {
  try {
    const [cs, ps] = await Promise.all([
      db.collection('customers').get(),
      db.collection('products').get()
    ]);
    _customers = cs.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','th'));
    _products  = ps.docs.map(d => ({id:d.id, ...d.data()}));
  } catch (e) {
    console.error('loadOrderRefData:', e);
  }
}

function onCraftsmanChange() {
  const sel = document.getElementById('craftsmanSel');
  const id = sel.value;
  if (!id) {
    localStorage.removeItem('craft_craftsman_id');
    _craftsman = null;
    document.getElementById('craft-content').innerHTML =
      `<div class="empty-craft"><i class="fa-solid fa-hard-hat"></i><p>เลือกชื่อช่างด้านบนเพื่อดูรายการงาน</p></div>`;
    return;
  }
  _craftsman = _craftsmen.find(c => c.id === id) || null;
  localStorage.setItem('craft_craftsman_id', id);
  renderCraftOrders();
}

// ══════════════════════════════════════
//  รับออเดอร์ (สำหรับช่างแต่ง)
// ══════════════════════════════════════
const EDIT_WINDOW_MS = 30 * 60 * 1000; // แก้ย้อนหลังได้ 30 นาที

// ช่างแก้ออเดอร์นี้ได้ไหม
function canCraftsmanEdit(o) {
  if (!_craftsman || !o) return false;
  if (o.createdByCraftsmanId !== _craftsman.id) return false;   // ต้องเป็นคนรับเอง
  if (isOrderFullyDelivered(o) || o.isDelivered) return false;  // ส่งแล้วแก้ไม่ได้
  const base = o.takenAt || o.createdAt || 0;
  return (Date.now() - base) <= EDIT_WINDOW_MS;
}
function editMinsLeft(o) {
  const base = o.takenAt || o.createdAt || 0;
  return Math.max(0, Math.ceil((EDIT_WINDOW_MS - (Date.now() - base)) / 60000));
}

function openOrderForm(editId) {
  if (!_craftsman) { toast('กรุณาเลือกชื่อช่างก่อน'); return; }
  if (!_customers.length || !_products.length) { toast('กำลังโหลดข้อมูล กรุณารอสักครู่'); loadOrderRefData(); return; }
  _editOrderId = editId || null;
  if (editId) {
    const o = _orders.find(x => x.id === editId);
    if (!o) { toast('ไม่พบออเดอร์'); return; }
    _draft = {
      customerId: o.customerId, customerName: o.customerName,
      items: (o.items||[]).map(i => ({productId:i.productId, productName:i.productName,
        color:i.color||'', trimColor:i.trimColor||'', extra:i.extra||'', qty:i.qty}))
    };
    showConfirmSheet();
  } else {
    _draft = {customerId:'', customerName:'', items:[]};
    showItemSheet();
  }
}

function closeOrderSheet() {
  document.getElementById('ordSheet')?.remove();
  _draftEdit = false;
}
function _sheet(inner) {
  closeOrderSheet();
  const d = document.createElement('div');
  d.className = 'ord-overlay'; d.id = 'ordSheet';
  d.innerHTML = `<div class="ord-sheet">${inner}</div>`;
  d.addEventListener('click', e => { if (e.target === d) closeOrderSheet(); });
  document.body.appendChild(d);
}

// ── หน้ากรอกรายการ ──
let _cur = null; // {productId, color, trimColor, extra, qty}
function showItemSheet() {
  _cur = _cur || {productId:'', color:'', trimColor:'', extra:'', qty:1};
  const custOpts = _customers.map(c =>
    `<option value="${c.id}" ${_draft.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const prodOpts = _products.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','th'))
    .map(p => `<option value="${p.id}" ${_cur.productId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  const has = _draft.items.length;
  _sheet(`
    <div class="ord-head">
      <div><h3>${_editOrderId ? 'แก้ไขออเดอร์' : 'รับออเดอร์ใหม่'}</h3>
        <div class="sub">${esc(_craftsman.name)}</div></div>
      <span class="ord-x" onclick="closeOrderSheet()">&times;</span>
    </div>
    <div class="ord-body">
      <div class="ord-card">
        <div class="ord-step"><b>1</b><span>ลูกค้า</span></div>
        <select class="ord-sel ${_draft.customerId?'filled':''}" id="ordCust" onchange="onDraftCust(this.value)">
          <option value="">— เลือกลูกค้า —</option>${custOpts}
        </select>
      </div>
      <div class="ord-card">
        <div class="ord-step"><b>2</b><span>สินค้า</span></div>
        <select class="ord-sel ${_cur.productId?'filled':''}" id="ordProd" onchange="onDraftProd(this.value)" style="margin-bottom:9px;">
          <option value="">— เลือกสินค้า —</option>${prodOpts}
        </select>
        <div id="ordSpec">${_cur.productId ? specHtml() : ''}</div>
      </div>
      <div class="ord-card">
        <div class="ord-step"><b>3</b><span>จำนวน</span></div>
        <div class="ord-qty">
          <button onclick="draftQty(-1)">−</button>
          <span class="n" id="ordQty">${_cur.qty}</span>
          <button class="plus" onclick="draftQty(1)">+</button>
        </div>
      </div>
      <div class="ord-add" onclick="addDraftItem(true)">
        <i class="fa-solid fa-plus"></i> เพิ่มรายการนี้แล้วกรอกอันต่อไป
      </div>
      ${has ? `<div class="ord-note" style="background:#f0fdf4;border-color:#bbf7d0;color:#166534;">
        <i class="fa-solid fa-check"></i> เพิ่มไว้แล้ว ${has} รายการ · ${_draft.items.reduce((a,b)=>a+b.qty,0)} ใบ</div>` : ''}
      <div class="ord-note"><i class="fa-solid fa-circle-info"></i> ราคาเจ้าของร้านจะใส่ทีหลัง</div>
      <button class="ord-btn" onclick="addDraftItem(false)">
        <i class="fa-solid fa-arrow-right me-1"></i>ไปหน้าตรวจสอบ
      </button>
    </div>`);
}

function specHtml() {
  const prod = _products.find(p => p.id === _cur.productId);
  if (!prod) return '';
  const colors = getProductColors(prod.name);
  const lines  = getProductLines(prod.name);
  const extras = COFFIN_SPEC[prod.name]?.extra;
  if (!_cur.trimColor || !lines.includes(_cur.trimColor)) _cur.trimColor = lines[0] || '';
  if (colors.length && (!_cur.color || !colors.includes(_cur.color))) _cur.color = colors[0];
  if (!colors.length) _cur.color = '';
  return `
    <div style="display:grid;grid-template-columns:${colors.length?'1fr 1fr':'1fr'};gap:8px;">
      ${colors.length ? `<div>
        <div class="ord-lbl">สีโลง</div>
        <div class="ord-pills">${colors.map(c =>
          `<button class="ord-pill ${_cur.color===c?'on':''}" onclick="setDraftColor('${esc(c)}')">${esc(c)}</button>`).join('')}</div>
      </div>` : ''}
      <div>
        <div class="ord-lbl">สีเส้น</div>
        <select class="ord-sel" style="padding:7px 9px;font-size:13.5px;" onchange="_cur.trimColor=this.value">
          ${lines.map(l => `<option value="${esc(l)}" ${_cur.trimColor===l?'selected':''}>${esc(l)}</option>`).join('')}
        </select>
      </div>
    </div>
    ${extras ? `<div style="margin-top:8px;">
      <div class="ord-lbl">ขนาด</div>
      <select class="ord-sel" style="padding:7px 9px;font-size:13.5px;" onchange="_cur.extra=this.value">
        <option value="">— ไม่ระบุ —</option>
        ${extras.map(e => `<option value="${esc(e)}" ${_cur.extra===e?'selected':''}>${esc(e)}</option>`).join('')}
      </select></div>` : ''}`;
}

function onDraftCust(id) {
  _draft.customerId = id;
  _draft.customerName = _customers.find(c => c.id === id)?.name || '';
  document.getElementById('ordCust')?.classList.toggle('filled', !!id);
}
function onDraftProd(id) {
  _cur.productId = id; _cur.color = ''; _cur.trimColor = ''; _cur.extra = '';
  const el = document.getElementById('ordSpec'); if (el) el.innerHTML = id ? specHtml() : '';
  document.getElementById('ordProd')?.classList.toggle('filled', !!id);
}
function setDraftColor(c) {
  _cur.color = c;
  const el = document.getElementById('ordSpec'); if (el) el.innerHTML = specHtml();
}
function draftQty(d) {
  const v = _cur.qty + d; if (v < 1 || v > 999) return;
  _cur.qty = v;
  const el = document.getElementById('ordQty'); if (el) el.textContent = v;
}

// เพิ่มรายการปัจจุบันเข้าตะกร้า — more=true คือกรอกต่อ, false คือไปหน้าตรวจสอบ
function addDraftItem(more) {
  if (!_draft.customerId) { toast('⚠️ กรุณาเลือกลูกค้า'); return; }
  if (_cur.productId) {
    const prod = _products.find(p => p.id === _cur.productId);
    if (prod) {
      const key = i => `${i.productId}|${i.color}|${i.trimColor}|${i.extra}`;
      const nw = {productId:prod.id, productName:prod.name, color:_cur.color||'',
                  trimColor:_cur.trimColor||'', extra:_cur.extra||'', qty:_cur.qty};
      const ex = _draft.items.find(i => key(i) === key(nw));
      if (ex) ex.qty += nw.qty; else _draft.items.push(nw);
      _cur = {productId:'', color:'', trimColor:'', extra:'', qty:1};
    }
  }
  if (!_draft.items.length) { toast('⚠️ กรุณาเลือกสินค้าอย่างน้อย 1 รายการ'); return; }
  if (more) { showItemSheet(); toast('✅ เพิ่มรายการแล้ว'); }
  else showConfirmSheet();
}

// ── การ์ดออเดอร์ที่ฉันเพิ่งรับ (ยังแก้ได้) ──
function renderMyRecentOrders() {
  if (!_craftsman) return '';
  const mine = _orders.filter(o => canCraftsmanEdit(o))
    .sort((a,b) => (b.takenAt||b.createdAt||0) - (a.takenAt||a.createdAt||0));
  if (!mine.length) return '';
  return `<div class="order-card" style="border:2px solid #fed7aa;">
    <div class="order-card-head" style="background:#fff7ed;">
      <div class="cust-name" style="font-size:14px;color:#9a3412;">
        <i class="fa-solid fa-pen-to-square me-1"></i>ออเดอร์ที่ฉันเพิ่งรับ</div>
      <span class="cust-count" style="color:#c2410c;">ยังแก้ไขได้</span>
    </div>
    <div class="order-card-body">
      ${mine.map(o => {
        const q = (o.items||[]).reduce((a,i)=>a+i.qty,0);
        return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:14.5px;font-weight:700;color:#1a2332;">${esc(o.customerName||'-')}</div>
            <div style="font-size:11.5px;color:#9ca3af;margin-top:2px;">
              ${(o.items||[]).length} รายการ · ${q} ใบ · เหลือเวลาแก้ ${editMinsLeft(o)} นาที</div>
          </div>
          <button class="btn-edit-order" onclick="openOrderForm('${o.id}')">แก้ไข</button>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// ── Popup ยืนยัน ──
function draftLabel(i) {
  const cc = i.color==='แดง' ? 'background:#7f0000;color:#fff;' : 'background:#fff;color:#111;border:1.5px solid #333;';
  const col = i.color ? `<span class="ord-chip" style="${cc}">${esc(i.color)}</span>` : '';
  const trm = i.trimColor ? `<span class="ord-chip" style="background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;">เส้น${esc(i.trimColor)}</span>` : '';
  const ex  = i.extra ? `<span class="ord-chip" style="background:#fef3c7;color:#92400e;">${esc(i.extra)}</span>` : '';
  return `<span style="font-size:14.5px;font-weight:700;color:#1a2332;">${esc(i.productName)}</span>${col}${trm}${ex}`;
}

function showConfirmSheet() {
  const E = _draftEdit;
  const rows = _draft.items.map((i, n) => E
    ? `<div class="ord-edit-row">
         <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
           <div style="flex:1;min-width:0;">${draftLabel(i)}</div>
           <span class="ord-trash" onclick="delDraftItem(${n})"><i class="fa-solid fa-trash"></i></span>
         </div>
         <div class="ord-qty">
           <button style="width:38px;height:38px;font-size:20px;" onclick="bumpDraftItem(${n},-1)">−</button>
           <span class="n" style="font-size:24px;min-width:44px;">${i.qty}</span>
           <button class="plus" style="width:38px;height:38px;font-size:20px;" onclick="bumpDraftItem(${n},1)">+</button>
         </div>
       </div>`
    : `<div class="ord-list-row">
         <div style="flex:1;min-width:0;">${draftLabel(i)}</div>
         <div class="q">${i.qty} <i>ใบ</i></div>
       </div>`).join('') ||
    `<div style="padding:22px 16px;text-align:center;font-size:13px;color:#9ca3af;">ยังไม่มีรายการ</div>`;

  const initial = (_draft.customerName || '?').trim().slice(0, 2);
  const totalQ = _draft.items.reduce((a,b)=>a+b.qty, 0);

  _sheet(`
    <div class="ord-head" style="background:${E?'#ea580c':'#16a34a'};">
      <div><h3>${E ? 'กำลังแก้ไข' : 'ตรวจสอบก่อนบันทึก'}</h3>
        <div class="sub">${E ? 'ปรับจำนวนหรือลบรายการที่ผิด' : 'ดูให้แน่ใจว่าถูกต้องแล้วกดยืนยัน'}</div></div>
      <span class="ord-x" onclick="closeOrderSheet()">&times;</span>
    </div>
    <div style="background:#fff;">
      <div style="padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:11px;">
        <div style="width:40px;height:40px;border-radius:11px;background:#dcfce7;color:#15803d;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;">${esc(initial)}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:11px;color:#9ca3af;font-weight:600;">ลูกค้า</div>
          <div style="font-size:17px;font-weight:800;color:#1a2332;">${esc(_draft.customerName||'-')}</div>
        </div>
        ${E ? `<span class="btn-edit-order" style="color:#16a34a;background:#f0fdf4;border-color:#bbf7d0;" onclick="backToItemSheet()">เปลี่ยน</span>` : ''}
      </div>
      ${rows}
      ${E ? `<div style="padding:9px 16px 4px;"><div class="ord-add" style="margin:0;" onclick="backToItemSheet()">
        <i class="fa-solid fa-plus"></i> เพิ่มรายการ</div></div>` : ''}
      <div class="ord-sum">
        <span style="font-size:12.5px;color:#6b7280;font-weight:600;">${_draft.items.length} รายการ</span>
        <span style="font-size:15px;font-weight:800;color:#1a2332;">${totalQ} <span style="font-size:12px;font-weight:600;color:#6b7280;">ใบ</span></span>
      </div>
      <div style="padding:11px 16px 0;">
        <div class="ord-note" style="margin:0;">
          <i class="fa-solid fa-circle-info"></i> ราคาเจ้าของร้านจะใส่ทีหลัง · บันทึกในชื่อ <b>${esc(_craftsman.name)}</b>
        </div>
      </div>
      <div style="padding:13px 16px 18px;display:flex;gap:9px;">
        ${E
          ? `<button class="ord-btn" onclick="toggleDraftEdit(false)">แก้เสร็จแล้ว</button>`
          : `<button class="ord-btn" style="flex:1;background:#fff;color:#374151;border:2px solid #d1d5db;font-size:14.5px;font-weight:700;" onclick="toggleDraftEdit(true)">แก้ไข</button>
             <button class="ord-btn" style="flex:1.5;" onclick="submitDraft()" ${_draft.items.length?'':'disabled'}>ยืนยันบันทึก</button>`}
      </div>
    </div>`);
}
function toggleDraftEdit(v) { _draftEdit = v; showConfirmSheet(); }
function backToItemSheet() { _draftEdit = false; showItemSheet(); }
function bumpDraftItem(n, d) {
  const it = _draft.items[n]; if (!it) return;
  const v = it.qty + d; if (v < 1) return;
  it.qty = v; showConfirmSheet();
}
function delDraftItem(n) { _draft.items.splice(n, 1); showConfirmSheet(); }

// ── บันทึกจริง ──
let _submitting = false;
async function submitDraft() {
  if (_submitting) return;
  if (!_draft.customerId) { toast('⚠️ กรุณาเลือกลูกค้า'); return; }
  if (!_draft.items.length) { toast('⚠️ ยังไม่มีรายการ'); return; }
  _submitting = true;
  document.querySelectorAll('.ord-btn').forEach(b => { b.disabled = true; b.style.opacity = '.5'; });

  try {
    // เติมราคาเบื้องหลัง — ช่างไม่เคยเห็นตัวเลขนี้
    const items = _draft.items.map(i => {
      const prod = _products.find(p => p.id === i.productId) || {};
      return {
        productId: i.productId, productName: i.productName,
        qty: i.qty, price: resolvePrice(_draft.customerId, prod, i.trimColor),
        color: i.color || '', trimColor: i.trimColor || '', extra: i.extra || '', specialNote: ''
      };
    });

    if (_editOrderId) {
      // ── แก้ออเดอร์เดิม ──
      const ref = db.collection('orders').doc(_editOrderId);
      const cur = (await ref.get()).data() || {};
      if (!canCraftsmanEdit({...cur, id:_editOrderId})) {
        toast('⚠️ หมดเวลาแก้ไขแล้ว กรุณาแจ้งเจ้าของร้าน'); closeOrderSheet(); return;
      }
      await ref.update({
        items,
        customerId: _draft.customerId, customerName: _draft.customerName,
        needsReview: true,
        editLog: firebase.firestore.FieldValue.arrayUnion({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
          at: Date.now(), by: _craftsman.id, byName: _craftsman.name,
          itemCount: items.length, totalQty: items.reduce((a,b)=>a+b.qty,0)
        })
      });
      toast('✅ แก้ไขออเดอร์แล้ว');
      notifyLine('edit', items);
    } else {
      // ── ออเดอร์ใหม่ ──
      const now = Date.now();
      const data = {
        customerId: _draft.customerId, customerName: _draft.customerName,
        items, discount: 0, notes: '', createdAt: now,
        orderNo: await nextOrderNoCraft(),
        createdByCraftsmanId: _craftsman.id,
        createdByCraftsmanName: _craftsman.name,
        takenAt: now,
        needsReview: true
      };
      await db.collection('orders').add(data);
      toast('✅ บันทึกออเดอร์แล้ว');
      notifyLine('new', items);
    }
    _draft = null; _cur = null; _editOrderId = null;
    closeOrderSheet();
  } catch (e) {
    console.error('submitDraft:', e);
    toast('⚠️ บันทึกไม่สำเร็จ: ' + e.message);
    document.querySelectorAll('.ord-btn').forEach(b => { b.disabled = false; b.style.opacity = ''; });
  } finally {
    _submitting = false;
  }
}

// เลขออเดอร์ถัดไป — อ่านใบล่าสุดของปีนี้แทนการโหลดทั้ง collection
async function nextOrderNoCraft() {
  const yr = new Date().getFullYear() + 543;
  const prefix = `ORD-${yr}-`;
  try {
    const snap = await db.collection('orders')
      .orderBy('orderNo', 'desc').limit(20).get();
    const nums = snap.docs.map(d => d.data().orderNo)
      .filter(n => typeof n === 'string' && n.startsWith(prefix))
      .map(n => parseInt(n.slice(prefix.length)) || 0);
    return prefix + String(nums.length ? Math.max(...nums) + 1 : 1).padStart(4, '0');
  } catch (e) {
    // สำรอง: ใช้เวลาต่อท้ายกันชนกัน
    return prefix + String(Date.now()).slice(-4);
  }
}

function notifyLine(type, items) {
  fetch('/api/notify-line', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      type,
      customerName: _draft.customerName,
      takenBy: _craftsman.name,
      items: items.map(i => ({name:i.productName, qty:i.qty, color:i.color, trimColor:i.trimColor,
                              changeType: type==='edit' ? 'modified' : undefined})),
      createdAt: Date.now(),
      todayOrders: []
    })
  }).catch(()=>{});
}

// ══════════════════════════════════════
//  สรุปหีบทั้งร้าน
// ══════════════════════════════════════

// นับทุกชิ้นในร้าน (ไม่กรองตามช่าง) แยกเป็น "งานของฉัน" กับ "ช่างคนอื่น"
function buildShopSummary() {
  const today = todayLocal();
  const visibleOrders = _dateFilter === 'today'
    ? _orders.filter(o => orderDateLocal(o) === today)
    : _orders;

  const mine = {}, other = {};
  for (const o of visibleOrders) {
    const cs = o.craftStatus || {};
    const ds = o.deliveryStatus || {};
    for (const item of (o.items || [])) {
      const craftedRaw   = getCraftedQty(readCraftEntry(cs, item), item.qty);
      const deliveredRaw = getDeliveredQty(ds[deliverKey(item)], item.qty, o.isDelivered);
      const remainQty  = item.qty - deliveredRaw;              // คงเหลือหลังหักที่ส่งแล้ว
      const craftedQty = Math.max(0, craftedRaw - deliveredRaw); // แต่งเสร็จที่ยังไม่ได้ส่ง
      if (remainQty <= 0) continue;

      const bucket = craftsmanCanDo(item) ? mine : other;
      const k = itemKey(item);
      if (!bucket[k]) bucket[k] = { label: buildLabel(item), total: 0, done: 0, oldest: o.createdAt || 0 };
      bucket[k].total += remainQty;
      bucket[k].done  += craftedQty;
      if ((o.createdAt || 0) < bucket[k].oldest) bucket[k].oldest = o.createdAt || 0;
    }
  }
  const srt = obj => Object.values(obj).sort((a, b) => (b.total - b.done) - (a.total - a.done));
  return { mine: srt(mine), other: srt(other) };
}

// ป้ายเตือนงานค้างนาน (นับจากวันที่รับออเดอร์)
function ageBadge(oldestTs, isDone) {
  if (isDone || !oldestTs) return '';
  const days = Math.floor((Date.now() - oldestTs) / 86400000);
  if (days >= 5) return `<span class="sum-age sum-age-hot">🔴 ค้าง ${days} วัน</span>`;
  if (days >= 3) return `<span class="sum-age sum-age-warn">⏳ ค้าง ${days} วัน</span>`;
  return '';
}

function sumRows(list) {
  if (!list.length) return `<div style="font-size:12px;color:#9ca3af;padding:2px 0 10px;">ไม่มีรายการ</div>`;
  return list.map(it => {
    const left = it.total - it.done;
    const pct  = it.total ? Math.round(it.done / it.total * 100) : 0;
    if (left <= 0) {
      return `<div class="sum-done-row">
        <span class="nm">${esc(it.label)}</span>
        <span class="q">เสร็จ ${it.done}/${it.total}</span></div>`;
    }
    return `<div class="sum-row">
      <div class="sum-row-top">
        <span class="sum-row-nm">${esc(it.label)}${ageBadge(it.oldest, false)}</span>
        <span class="sum-row-lf">เหลือ ${left}</span>
      </div>
      <div class="sum-row-bar">
        <span class="b"><i style="width:${pct}%;"></i></span>
        <span class="c">${it.done}/${it.total}</span>
      </div></div>`;
  }).join('');
}

function renderSummaryCard() {
  const { mine, other } = buildShopSummary();
  const all  = mine.concat(other);
  const tot  = all.reduce((a, x) => a + x.total, 0);
  const done = all.reduce((a, x) => a + x.done, 0);
  const left = tot - done;
  const pct  = tot ? Math.round(done / tot * 100) : 0;
  const col  = pct >= 100 ? '#16a34a' : '#2563eb';
  const mineLeft = mine.reduce((a, x) => a + (x.total - x.done), 0);
  const othLeft  = other.reduce((a, x) => a + (x.total - x.done), 0);
  const tag  = _dateFilter === 'today' ? 'วันนี้' : 'ทั้งหมด';
  const open = localStorage.getItem('craft_sum_open') !== '0';
  const othOpen = localStorage.getItem('craft_sum_other') === '1';

  const body = !tot
    ? `<div class="sum-empty">ไม่มีรายการในช่วงนี้</div>`
    : `<div class="sum-stats">
        <div class="sum-stat"><b style="color:${left ? '#ea580c' : '#16a34a'};">${left}</b><span>เหลือต้องแต่ง</span></div>
        <div class="sum-stat"><b style="color:#16a34a;">${done}</b><span>แต่งเสร็จแล้ว</span></div>
        <div class="sum-stat"><b style="color:#1a2332;">${tot}</b><span>ทั้งหมด</span></div>
      </div>
      <div class="sum-prog">
        <div class="sum-prog-top"><span>ความคืบหน้ารวม</span><b style="color:${col};">${pct}%</b></div>
        <div class="sum-bar"><i style="width:${pct}%;background:${col};"></i></div>
      </div>
      <div class="sum-sec">
        <div class="sum-sec-head">
          <span class="t" style="color:#2563eb;">งานของฉัน</span>
          <span class="n">${mineLeft ? 'เหลือ ' + mineLeft + ' ใบ' : 'เสร็จหมดแล้ว'}</span>
        </div>
        ${sumRows(mine)}
      </div>
      ${other.length ? `
      <div class="sum-other-toggle" onclick="toggleSumOther()">
        <span class="t">ช่างคนอื่น · ${othLeft ? 'เหลือ ' + othLeft + ' ใบ' : 'เสร็จหมดแล้ว'}</span>
        <span class="r"><span id="sumOtherLbl">${othOpen ? 'ซ่อน' : 'ดู'}</span>
          <i id="sumOtherChev" class="fa-solid fa-chevron-${othOpen ? 'up' : 'down'}"></i></span>
      </div>
      <div class="sum-other-body" id="sumOtherBody" style="display:${othOpen ? 'block' : 'none'};">
        ${sumRows(other)}
      </div>` : ''}`;

  return `<div class="sum-card">
    <div class="sum-head" onclick="toggleSumCard()">
      <span class="sum-head-l"><i class="fa-solid fa-clipboard-list"></i>สรุปหีบทั้งร้าน
        <span class="sum-tag">${tag}</span></span>
      <i id="sumChev" class="fa-solid fa-chevron-${open ? 'up' : 'down'}"></i>
    </div>
    <div id="sumBody" style="display:${open ? 'block' : 'none'};">${body}</div>
  </div>`;
}

function toggleSumCard() {
  const b = document.getElementById('sumBody'); if (!b) return;
  const open = b.style.display === 'none';
  b.style.display = open ? 'block' : 'none';
  localStorage.setItem('craft_sum_open', open ? '1' : '0');
  const c = document.getElementById('sumChev');
  if (c) c.className = 'fa-solid fa-chevron-' + (open ? 'up' : 'down');
}
function toggleSumOther() {
  const b = document.getElementById('sumOtherBody'); if (!b) return;
  const open = b.style.display === 'none';
  b.style.display = open ? 'block' : 'none';
  localStorage.setItem('craft_sum_other', open ? '1' : '0');
  const c = document.getElementById('sumOtherChev');
  const l = document.getElementById('sumOtherLbl');
  if (c) c.className = 'fa-solid fa-chevron-' + (open ? 'up' : 'down');
  if (l) l.textContent = open ? 'ซ่อน' : 'ดู';
}

// ══════════════════════════════════════
//  BUILD GROUPED DATA
// ══════════════════════════════════════

/*
  ผล: array ของลูกค้า แต่ละคนมี items[]
  แต่ละ item รวม qty และ craftedQty จากทุกออเดอร์ของลูกค้านั้น
  sources[] เก็บ ref ไปยัง order จริงเพื่อใช้ตอน save Firestore
*/
function buildGroupedData() {
  const custMap   = {};
  const custOrder = [];

  // Apply date filter
  const today = todayLocal();
  const visibleOrders = _dateFilter === 'today'
    ? _orders.filter(o => orderDateLocal(o) === today)
    : _orders;

  for (const o of visibleOrders) {
    const myItems = (o.items || []).filter(i => craftsmanCanDo(i));
    if (!myItems.length) continue;

    const cust = o.customerName || '?';
    if (!custMap[cust]) { custMap[cust] = { customerName: cust, items: {} }; custOrder.push(cust); }

    const cs = o.craftStatus || {};
    const ds = o.deliveryStatus || {};
    for (const item of myItems) {
      const k         = itemKey(item);
      const craftedRaw   = getCraftedQty(readCraftEntry(cs, item), item.qty);
      const deliveredRaw = getDeliveredQty(ds[deliverKey(item)], item.qty, o.isDelivered);
      // หักของที่จัดส่งออกไปแล้ว (ส่งได้เฉพาะที่แต่งเสร็จ → หักทั้งสองฝั่ง)
      const remainQty   = item.qty - deliveredRaw;
      const craftedQty  = Math.max(0, craftedRaw - deliveredRaw);
      if (remainQty <= 0) continue;

      if (!custMap[cust].items[k]) {
        custMap[cust].items[k] = { key: k, label: buildLabel(item), totalQty: 0, craftedQty: 0, sources: [] };
      }
      custMap[cust].items[k].totalQty   += remainQty;
      custMap[cust].items[k].craftedQty += craftedQty;
      custMap[cust].items[k].sources.push({ orderId: o.id, orderQty: item.qty, craftedQty: craftedRaw, item });
    }
  }

  return custOrder.map(name => ({
    customerName: name,
    items: Object.values(custMap[name].items)
  }));
}

function renderCustomerCard(group) {
  const pendingItems = group.items.filter(it => it.craftedQty < it.totalQty);
  const doneItems    = group.items.filter(it => it.craftedQty >= it.totalQty);

  const pendingHtml = pendingItems.map(it => renderItemActive(group.customerName, it)).join('');
  const doneHtml    = doneItems.length
    ? `<div class="done-divider">✅ เสร็จแล้ว</div>` +
      doneItems.map(it => renderItemDone(group.customerName, it)).join('')
    : '';

  const totalRemaining = pendingItems.reduce((s, it) => s + (it.totalQty - it.craftedQty), 0);
  const countLabel = pendingItems.length
    ? `<span class="cust-count">ค้างแต่ง ${totalRemaining} ใบ</span>`
    : `<span class="cust-count" style="color:#16a34a;">✅ ครบหมดแล้ว</span>`;

  return `<div class="order-card">
    <div class="order-card-head">
      <div class="cust-name">${esc(group.customerName)}</div>
      ${countLabel}
    </div>
    <div class="order-card-body">
      ${pendingHtml}
      ${doneHtml}
    </div>
  </div>`;
}

// ── Active item row (remaining > 0) ──

  const ec = encC(custName), ek = encC(it.key);

  // Not started (craftedQty === 0)
  if (it.craftedQty === 0) {
    const isSingle = it.totalQty === 1;

      <div class="craft-item-info">
        <div class="craft-item-name">${esc(it.label)}</div>

          onclick="stepItem('${ec}','${ek}',-1)" title="ยกเลิก 1 ใบ">−</button>
        <span class="step-count">${it.craftedQty}/${it.totalQty} ใบ</span>
        <button class="btn-step btn-step-plus ${isNextLast ? 'last-unit' : ''}"
          onclick="stepItem('${ec}','${ek}',1)">
          ${isNextLast ? '✅ ครบ!' : '+1 เสร็จ'}
        </button>
      </div>
    </div>
  </div>`;
}

// ── Done item row (craftedQty >= totalQty) ──
function renderItemDone(custName, it) {
  const ec = encC(custName), ek = encC(it.key);
  return `<div class="craft-item-row craft-item-done">
    <div class="craft-item-info">
      <div class="craft-item-name">${esc(it.label)}</div>
      <div class="badge-crafted"><i class="fa-solid fa-circle-check"></i>ครบ ${it.totalQty} ใบ</div>
    </div>
    <div class="craft-item-status">
      <button class="btn-craft-undo" onclick="stepItem('${ec}','${ek}',-1)">
        <i class="fa-solid fa-rotate-left"></i>ยกเลิก 1
      </button>
    </div>
  </div>`;
}

// ══════════════════════════════════════
//  STEP LOGIC
// ══════════════════════════════════════

function stepItem(encodedCust, encodedKey, delta) {
  const custName = decodeURIComponent(encodedCust);
  const key      = decodeURIComponent(encodedKey);

  const group = _groups.find(g => g.customerName === custName);
  if (!group) return;
  const it = group.items.find(i => i.key === key);
  if (!it) return;

  if (delta === 1) {
    if (it.craftedQty >= it.totalQty) return; // already full
    const wouldComplete = (it.craftedQty + 1) >= it.totalQty;
    if (wouldComplete) {
      // Confirm popup for the last unit
      showConfirm({
        icon: it.totalQty === 1 ? '🎨' : '🎉',
        title: it.totalQty === 1 ? 'แต่งเสร็จแล้วใช่ไหม?' : 'แต่งครบทุกใบแล้วใช่ไหม?',
        desc: `ยืนยันว่าแต่ง "${it.label}" ครบ ${it.totalQty} ใบ`,
        itemLabel: `${it.label} × ${it.totalQty} ใบ`,
        yesLabel: it.totalQty === 1 ? '✅ ยืนยัน เสร็จแล้ว' : '🎉 ยืนยัน ครบแล้ว!',
        yesColor: '#16a34a',
        onYes: () => doStep(it, 1)
      });
    } else {
      // Intermediate step — no confirm, direct update
      doStep(it, 1);
    }
  } else {
    // delta === -1: undo, no confirm needed
    if (it.craftedQty <= 0) return;
    doStep(it, -1);
  }
}

async function doStep(groupItem, delta) {
  if (_stepping) return;
  _stepping = true;
  // Disable all step buttons while saving
  document.querySelectorAll('.btn-craft-done,.btn-step,.btn-craft-undo').forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
  try {
    let src;
    if (delta === 1) {
      // First source that still has remaining capacity
      src = groupItem.sources.find(s => s.craftedQty < s.orderQty);
    } else {
      // Last source that has craftedQty > 0 (reverse so we undo most recent first)
      src = [...groupItem.sources].reverse().find(s => s.craftedQty > 0);
    }
    if (!src) return;

    const newQty = src.craftedQty + delta;
    await saveSourceCraftedQty(src, newQty, delta);
    // onSnapshot will re-render automatically — no manual re-render needed
    toast(delta === 1 ? '✅ บันทึกแล้ว' : '↩️ ยกเลิก 1 ใบแล้ว');
  } catch (e) {
    console.error('doStep error:', e);
    toast('⚠️ บันทึกไม่สำเร็จ: ' + e.message);
    // Re-enable buttons on error (onSnapshot won't fire to re-render)
    document.querySelectorAll('.btn-craft-done,.btn-step,.btn-craft-undo').forEach(b => { b.disabled = false; b.style.opacity = ''; });
  } finally {
    _stepping = false;
  }
}

async function saveSourceCraftedQty(src, newCraftedQty, delta) {
  const k    = itemKey(src.item);
  const kOld = itemKeyLegacy(src.item);
  const ref  = db.collection('orders').doc(src.orderId);
  const DEL  = firebase.firestore.FieldValue.delete();
  const now  = Date.now();
  const qty  = Math.max(0, newCraftedQty);

  // log ทุกครั้งที่กด — เก็บเวลาจริงของแต่ละใบ (ค่าเดิม craftedAt เก็บได้ครั้งเดียว)
  // id สุ่มกันไม่ให้ arrayUnion มองว่าซ้ำเมื่อกดพร้อมกันในมิลลิวินาทีเดียว
  const logEntry = {
    id:     now.toString(36) + Math.random().toString(36).slice(2, 7),
    qty:    delta ?? 0,
    at:     now,
    by:     _craftsman.id,
    byName: _craftsman.name
  };

  // ใช้ dot-notation รายฟิลด์ + arrayUnion → ปลอดภัยเมื่อช่างหลายคนเขียนพร้อมกัน
  const patch = {
    [`craftStatus.${k}.craftedQty`]:    qty,
    [`craftStatus.${k}.isCrafted`]:     qty >= src.orderQty,
    [`craftStatus.${k}.craftedBy`]:     _craftsman.id,
    [`craftStatus.${k}.craftedByName`]: _craftsman.name,
    [`craftStatus.${k}.craftedAt`]:     now,
    [`craftStatus.${k}.log`]:           firebase.firestore.FieldValue.arrayUnion(logEntry)
  };
  // ลบคีย์เก่าทิ้ง (migrate ทีละรายการตอนใช้งานจริง) — ไม่ลบคีย์ใหม่แม้จำนวนเป็น 0 เพื่อรักษา log
  if (kOld !== k) patch[`craftStatus.${kOld}`] = DEL;
  await ref.update(patch);
}

// ══════════════════════════════════════
//  CONFIRM POPUP
// ══════════════════════════════════════

let _confirmCb = null;
function showConfirm({ icon, title, desc, itemLabel, yesLabel, yesColor, onYes }) {
  _confirmCb = onYes;
  const div = document.createElement('div');
  div.className = 'confirm-overlay'; div.id = 'craft-confirm';
  div.innerHTML = `<div class="confirm-box">
    <div class="conf-icon">${icon}</div>
    <h3>${esc(title)}</h3>
    <p>${esc(desc)}</p>
    <div class="item-preview">${esc(itemLabel)}</div>
    <div class="confirm-actions">
      <button style="background:${yesColor};color:#fff;" onclick="doConfirm()">
        ${esc(yesLabel)}
      </button>
      <button class="btn-conf-cancel" onclick="closeConfirm()">ยกเลิก</button>
    </div>
  </div>`;
  document.body.appendChild(div);
  // Allow closing by tapping outside
  div.addEventListener('click', e => { if (e.target === div) closeConfirm(); });
}
function doConfirm()  { closeConfirm(); if (_confirmCb) { _confirmCb(); _confirmCb = null; } }
function closeConfirm() { document.getElementById('craft-confirm')?.remove(); }

// ── Manual refresh (onSnapshot already keeps data fresh; this just re-renders) ──
function refreshData() {
  const btn = document.getElementById('refreshBtn');
  if (btn) { btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; }
  renderCraftOrders();
  setTimeout(() => { if (btn) btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>'; }, 400);
  toast('รีเฟรชแล้ว');
}

window.addEventListener('DOMContentLoaded', init);
</script>
